      summary: Send a bank payment
      description: Executes a TRANSFER (between your own bank accounts) or WITHDRAW (to a registered beneficiary).
        Requires an idempotency key; retries with the same key return the original operation without re-charging.
        Billed as the fixed `banking_operation` fee; refunded if the corridor rejects. The final state
        arrives via the banking_operation_status_changed webhook.
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - type
              - sourceRequisit
              - destinationRequisit
              - amount
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - TRANSFER
                  - WITHDRAW
                paymentType:
                  type: string
                  description: EMPTY for TRANSFER; rail code (e.g. SEPA_CT) for WITHDRAW.
                sourceRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                destinationRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                      description: Destination account (TRANSFER).
                    beneficiar:
                      type: string
                      description: Beneficiary account (WITHDRAW).
                amount:
                  type: object
                  properties:
                    currencyCode:
                      type: string
                    units:
                      type: string
                    nanos:
                      type: integer
                comment:
                  type: string
                idempotency_key:
                  type: string
            examples:
              withdraw:
                summary: WITHDRAW to a beneficiary (SEPA)
                value:
                  currency: USD
                  type: WITHDRAW
                  paymentType: SEPA_CT
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    beneficiar: BNK-CPACC-11
                  amount:
                    currencyCode: USD
                    units: '250'
                    nanos: 0
                  comment: Invoice 8841
                  idempotency_key: acme-payment-0071
              transfer:
                summary: TRANSFER between own accounts
                value:
                  currency: USD
                  type: TRANSFER
                  paymentType: EMPTY
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
