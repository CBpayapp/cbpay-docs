  /v1/payouts/bank-directory/lookup:
    get:
      tags:
      - Payouts
      operationId: lookupBankDirectory
      summary: Look up a bank by routing number or SWIFT/BIC
      description: 'Autocompletes the beneficiary bank from an embedded public bank
        directory — pass exactly one of `routing_number` (9 digits, US only) or
        `swift` (8 or 11 characters; an `XXX` suffix is normalized to the head office).
        Use it to autodetect the bank while the sender types the routing number or
        SWIFT/BIC in payout or counterparty forms: a 404 means "not in the directory"
        and the form should simply stay manual. Static data served with `Cache-Control:
        public, max-age=86400`; safe to cache for a day.'
      parameters:
      - name: routing_number
        in: query
        description: ABA routing number, 9 digits with a valid check digit (US banks
          only). Mutually exclusive with `swift`.
        schema:
          type: string
          pattern: '^[0-9]{9}$'
        example: '021000021'
      - name: swift
        in: query
        description: SWIFT/BIC code, 8 or 11 characters (an `XXX` suffix is normalized
          to the head office). Mutually exclusive with `routing_number`.
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$'
        example: CHASUS33
      - name: country
        in: query
        description: Optional ISO 3166-1 alpha-2 filter for routing lookups; only `US`
          is supported (any other value returns 400 `invalid_country`).
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: Bank found in the directory. `bank_phone` and `directory_vintage`
            are only present for routing lookups; `bank_state`/`bank_branch` only when
            the dataset has them.
          content:
            application/json:
              schema:
                type: object
              examples:
                routing:
                  summary: By ABA routing number
                  value:
                    routing_number: '021000021'
                    bank_name: JPMORGAN CHASE
                    bank_city: TAMPA
                    bank_state: FL
                    bank_postal_code: '33610'
                    bank_country: US
                    bank_phone: 813-432-3700
                    source: directory
                    directory_vintage: fed_ach_2019
                swift:
                  summary: By SWIFT/BIC
                  value:
                    swift: CHASUS33
                    bank_name: JPMORGAN CHASE BANK, N.A.
                    bank_city: NEW YORK, NY
                    bank_country: US
                    source: directory
        '400':
          description: Missing/conflicting parameters, invalid format, or a `country`
            other than `US`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_payload:
                  summary: Missing or conflicting parameters
                  value:
                    error: invalid_payload
                    message: provide exactly one of routing_number or swift
                invalid_country:
                  summary: Routing lookup with a non-US country
                  value:
                    error: invalid_country
                    message: routing number lookup is only available for US
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: The routing number or SWIFT/BIC is not in the directory — keep
            the form manual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bank_not_found
                message: no bank found for the given routing number
  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Create a payin (top-up charge)
      description: 'Creates a fiat top-up. With `method: "qr"` (default) an active QR charge is generated
        through the processor — in Bolivia the local interoperable QR, in Brazil a dynamic PIX QR whose
        `charge` carries the QR image and the "copia e cola" payload. With `method: "bank_transfer"` the
        deposit is announced and the response carries the reference the sender must include so the arriving
        transfer is matched and credited automatically — a short 12-character alphanumeric code that fits
        any bank concept field (some rails cap it at 20 characters with no special characters). With `method:
        "fintoc"` (Chile) the response carries a hosted `payment_url`: the payer opens it and transfers
        from any Chilean bank or wallet; the deposit is detected, validated and credited automatically.
        With `method: "card"` the response carries a hosted `payment_url` for a 3-D Secure
        card checkout branded with your organization — Bolivia (BOB) and international cards in
        USD (`country: "US"`, Visa, Mastercard, American Express, Discover and Diners issued
        anywhere); card data never touches your integration.
        With `method: "checkout"` the response carries a public `checkout_url` — a branded universal
        checkout link denominated in the virtual balance of your choice (`settlement_asset`: USDT, USDC,
        BTC or GOLD). The payer picks any country with a live payin corridor (quoted local amount), any
        of the 4 crypto options (exclusive deposit address with a scannable QR), or pays instantly from
        the CBPay app via the merchant QR/alias; every payment is auto-converted to the settlement asset
        unless paid in the same asset. The first method that completes the payment wins. Charging is
        free; the payin fee applies when the deposit is credited.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                  description: Corridor country. Required for every method except `checkout`,
                    where it is optional and only preselects the payer's country on the page.
                currency:
                  type: string
                  example: BOB
                  description: Corridor currency. Required for every method except `checkout`,
                    which rejects it with 400 — the charge is denominated in `settlement_asset`.
                amount:
                  type: string
                  description: Positive decimal string. Local currency amount for corridor methods;
                    for `checkout` it is denominated in the `settlement_asset` ("50" USDT,
                    "0.001" BTC, "2" grams of gold).
                description:
                  type: string
                channel:
                  type: string
                  description: Optional channel hint passed to the core.
                expires_in:
                  type: integer
                  description: Charge expiration in seconds. For `checkout` it accepts 600 to 604800
                    (10 minutes to 7 days; default 24 hours).
                method:
                  type: string
                  enum:
                  - qr
                  - bank_transfer
                  - fintoc
                  - card
                  - checkout
                  default: qr
                  description: Collection mode. `qr` creates an active QR charge through the processor;
                    `bank_transfer` announces an incoming deposit and returns the reference to include
                    in the transfer description; `fintoc` (Chile only) returns a hosted `payment_url`
                    where the payer transfers from any Chilean bank or wallet and the deposit is detected
                    automatically; `card` returns a hosted `payment_url` for a 3-D Secure card checkout
                    (Bolivia in BOB, or international cards in USD when `country` is `US`);
                    `checkout` returns a public `checkout_url` where the payer picks the
                    payment method (QR, card, bank transfer or crypto). Use /v1/payins/collect for pull
                    collections.
                idempotency_key:
                  type: string
                  description: >-
                    Optional idempotency key (`bank_transfer`, `fintoc`, `card` and `checkout`
                    methods; also accepted as the `Idempotency-Key` header). A retry with the same
                    key returns the original payin with HTTP 200 and `idempotency_hit: true` — the
                    same `payment_url`/`checkout_url` for hosted methods, or the SAME `reference`
                    for an announced bank transfer — instead of opening a second charge. On
                    announced transfers this decides whether the money can be credited: two live
                    announcements with the same amount and no payer identity are indistinguishable,
                    so the arriving deposit would stay `unassigned`. If you omit the key we still
                    collapse an identical retry (same account, currency, amount and payer document)
                    into the original announcement; send a distinct key when you really need two
                    separate charges for the same amount and payer.
                customer:
                  type: object
                  description: Optional billing prefill for the card checkout (`card` method) — `email`,
                    `first_name`, `last_name`, `address`, `city`, `country` (plain text, max 120 chars
                    per field). The payer can complete or correct them on the page.
                success_url:
                  type: string
                  description: Optional public https URL (`card` and `checkout` methods) the payer is
                    redirected to after an approved payment.
                failure_url:
                  type: string
                  description: Optional public https URL (`card` and `checkout` methods) the payer is
                    redirected to when the payment fails or expires.
                expires_at:
                  type: string
                  format: date-time
                  description: Optional RFC3339 expiry for the card payment session (`card` method, at
                    least 15 minutes ahead; default 24 hours).
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Checkout only — the virtual balance the charge is denominated in and
                    settles into. Every payment is auto-converted to this asset on credit (same-asset
                    payments skip conversion). Must be enabled for your organization
                    (`422 settlement_asset_disabled` otherwise).
                save_card:
                  type: boolean
                  default: false
                  description: Card method only — offer the payer a "save this card" checkbox on the
                    hosted page. The credential is stored ONLY if the payer ticks it (explicit consent)
                    and the 3-D Secure payment is approved; the payin_received/payin_credited flow then
                    carries a `stored_credential` block and the card appears in GET /v1/stored-cards.
                payer_reference:
                  type: string
                  maxLength: 120
                  description: Card method only — your own identifier for the payer (e.g. your customer
                    ID). Stored cards are scoped to this reference so you can list and charge the right
                    customer's cards. Plain text, max 120 chars.
                stored_card_id:
                  type: string
                  format: uuid
                  description: Card method only — pay with a previously saved card (see GET
                    /v1/stored-cards). The hosted page skips card entry and shows the saved card;
                    3-D Secure still runs. Mutually exclusive with `save_card`. Unknown or revoked
                    card responds 404. The billing details saved with the credential are applied automatically on the hosted page (masked summary with an edit link — the payer retypes nothing).
                payer_name:
                  type: string
                  maxLength: 140
                  description: >-
                    Announced bank transfer only — name of the person or company that will send
                    the transfer, when it is NOT the account holder. Optional.
                payer_document:
                  type: string
                  maxLength: 40
                  description: >-
                    Announced bank transfer only — tax or national ID of the sender (at least 5
                    characters, one of them a digit). Optional: when you omit it the account
                    holder's verified tax id is used, so a self-deposit is recognised even if the
                    payer forgets the reference. Send it when a third party pays.
                payer_account:
                  type: string
                  maxLength: 40
                  description: >-
                    Announced bank transfer only — the sender's bank account number (at least 5
                    characters). Optional; it is an extra matching signal when the rail reports
                    the originating account.
            examples:
              bo_qr:
                summary: Bolivia — QR charge (BOB)
                value:
                  country: BO
                  currency: BOB
                  method: qr
                  amount: '700.00'
                  description: App top-up
                  expires_in: 3600
              br_pix_qr:
                summary: Brazil — dynamic PIX QR (BRL)
                value:
                  country: BR
                  currency: BRL
                  method: qr
                  amount: '120.00'
                  description: Order 7719
                  expires_in: 1800
              cl_announced_transfer:
                summary: Chile — announced bank transfer (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '500000'
                  payer_document: '17438319-7'
                  idempotency_key: topup-9912
              py_announced_transfer:
                summary: Paraguay — announced bank transfer (PYG, integer amounts)
                value:
                  country: PY
                  currency: PYG
                  method: bank_transfer
                  amount: '596000'
              us_announced_transfer:
                summary: United States — announced bank transfer (USD, ACH / wire)
                value:
                  country: US
                  currency: USD
                  method: bank_transfer
                  amount: '1250.00'
                  payer_name: Acme Holdings LLC
                  idempotency_key: invoice-1042
              cl_fintoc:
                summary: Chile — hosted payment page, any bank (CLP)
                value:
                  country: CL
                  currency: CLP
                  method: fintoc
                  amount: '150000'
                  description: Top-up order 8841
                  idempotency_key: topup-8841
              bo_card:
                summary: Bolivia — 3-D Secure card checkout (BOB)
                value:
                  country: BO
                  currency: BOB
                  method: card
                  amount: '700.00'
                  description: App top-up
                  customer:
                    email: payer@example.com
                    first_name: Ana
                    last_name: Rojas
                  success_url: https://your-app.com/payment/ok
                  failure_url: https://your-app.com/payment/error
                  idempotency_key: topup-7719
              us_card:
                summary: International cards — 3-D Secure checkout (US/USD)
                value:
                  country: US
                  currency: USD
                  method: card
                  amount: '49.90'
                  description: Pro plan
                  customer:
                    email: payer@example.com
                    first_name: Ana
                    last_name: Rojas
                  success_url: https://your-app.com/payment/ok
                  failure_url: https://your-app.com/payment/error
                  save_card: true
                  payer_reference: customer-7719
                  idempotency_key: pro-plan-7719
              checkout_usdt:
                summary: Universal checkout link — 50 USDT, any country/method
                value:
                  method: checkout
                  amount: '50'
                  settlement_asset: USDT
                  description: Order 8841
                  country: CL
                  success_url: https://your-app.com/payment/ok
                  failure_url: https://your-app.com/payment/error
                  expires_in: 86400
                  idempotency_key: order-8841
              checkout_btc:
                summary: Universal checkout link — 0.001 BTC settlement
                value:
                  method: checkout
                  amount: '0.001'
                  settlement_asset: BTC
                  description: Invoice 2210
                  idempotency_key: invoice-2210
      responses:
        '201':
          description: Charge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
                  charge:
                    type: object
                    description: Charge details (QR data, references) from the core.
              examples:
                qr:
                  summary: 'QR charge (method: qr)'
                  value:
                    payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
                    status: pending
                    charge:
                      charge_id: c9d8e7f6-a5b4-c3d2-e1f0-a9b8c7d6e5f4
