  /v1/wallet-links/challenges:
    post:
      tags:
      - Wallet links
      operationId: createWalletLinkChallenge
      summary: Create a wallet link challenge
      description: 'Creates a nonce challenge to link an external wallet (custody=client) to the account. The wallet owner signs the structured envelope with the chain-native standard (EIP-191 / TIP-191) and the signature is submitted to `POST /v1/wallet-links/verify`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain, address]
              properties:
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                  description: External wallet address (EVM hex or TRON base58).
            example:
              chain: eth
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
      responses:
        '201':
          description: Challenge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: object
                    properties:
                      link_id:
                        type: string
                        format: uuid
                      chain:
                        type: string
                      address:
                        type: string
                      nonce:
                        type: string
                      envelope:
                        type: string
                        description: The exact structured message (CBPay Signature Proof) the wallet owner must sign.
                      expires_at:
                        type: string
                        format: date-time
              example:
                challenge:
                  link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                  nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
                  envelope: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_link\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nAccount: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z"
                  expires_at: '2026-08-21T14:13:11Z'
        '400':
          description: Invalid request (`unsupported_chain`, `invalid_address`, `invalid_json`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_address
                message: the address is not valid for the chain
        '500':
          description: Nonce generation failed (`nonce_failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: nonce_failed
                message: could not generate the challenge nonce
