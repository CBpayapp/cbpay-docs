  /v1/qscore/reports:
    get:
      tags: [Qscore]
      summary: List credit reports
      operationId: listQscoreReports
      description: 'Returns the credit reports of your account, newest first. The

        `from` and `to` date filters (organization timezone, both inclusive) are mandatory. Reports

        owned by other accounts are never visible (ownership isolation: a report id

        belonging to another account returns `404 not_found`).'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: 'Start date YYYY-MM-DD (organization timezone, inclusive). An invalid date

          returns 400 invalid_range.'
        example: '2026-08-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End date YYYY-MM-DD (organization timezone, inclusive).
        example: '2026-08-08'
      - name: subject_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by subject id (from GET /v1/qscore/subjects/{docId}).
        example: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, ready, failed]
        description: Filter by report status.
        example: ready
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (>= 1).
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
