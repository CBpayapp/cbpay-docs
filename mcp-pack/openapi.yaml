      - Banking
      operationId: createBankingThirdParty
      summary: Register a third-party banking user (companies only)
      description: 'Company accounts register end clients as separate banking users with accounts in their
        name. Requires the verification_id of an APPROVED KYC/KYB verification of the third party: the
        type comes from the verification kind (KYC = INDIVIDUAL, KYB = COMPANY), identity data auto-fills
        from the verified profile (explicit fields win) and the already-validated documents are re-delivered
        automatically to the banking provider (documents_synced). Charges the banking profile fee (refunded
        if the core rejects). Person accounts get 403 company_required.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verification_id
              properties:
                verification_id:
                  type: string
                  format: uuid
                  description: submission_id of an APPROVED third-party KYC/KYB verification.
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                  description: 'Optional: must match the verification kind.'
                name:
                  type: string
                  description: 'Optional: auto-fills from the verified profile.'
                email:
                  type: string
                  format: email
                  description: 'Optional: auto-fills from the verified profile.'
                country:
                  type: string
            example:
              verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
      responses:
        '201':
          description: Third-party banking user created.
          content:
            application/json:
              example:
                third_party_id: 7f2a1b3c-0000-1111-2222-333344445555
                customer_id: cus_abc123
                kind: third_party
                status: pending
                verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                documents_synced: 2
                registered_at: '2026-07-10T15:00:00Z'
                banking_fee: '1.000000'
                banking_fee_asset: USDT
        '202':
          description: Application held for review (the organization has application review enabled). The resource is
            created only when compliance approves the review; the issuance/profile fee is charged when the application
            is held and refunded automatically if it is rejected. Track the outcome with the
            `txn_review_status_changed` webhook or `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '403':
          description: company_required
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch
            / verification_invalid
    get:
      tags:
      - Banking
      operationId: listBankingThirdParties
      summary: List third-party banking users
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Third parties owned by the calling account.
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                third_parties:
                - id: 7f2a1b3c-0000-1111-2222-333344445555
                  customer_id: cus_abc123
                  kind: third_party
                  type: INDIVIDUAL
                  name: Carlos Mendes
                  created_at: '2026-07-10T15:00:00Z'
  /v1/banking/third-parties/{thirdPartyID}:
    get:
      tags:
      - Banking
      operationId: getBankingThirdParty
      summary: Get a third-party banking user (live KYC status)
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Third party with live verification status.
          content:
            application/json:
              example:
                third_party_id: 7f2a1b3c-0000-1111-2222-333344445555
                kind: third_party
                status: approved
        '404':
          description: not_found (does not exist or not owned by your account)
  /v1/banking/third-parties/{thirdPartyID}/documents:
    post:
      tags:
      - Banking
      operationId: uploadBankingThirdPartyDocument
      summary: Upload a KYC document for the third party (free)
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              type: PASSPORT
              file_base64: '...'
      responses:
        '201':
          description: Document uploaded.
          content:
            application/json:
              example:
                status: received
  /v1/banking/third-parties/{thirdPartyID}/submit:
    post:
      tags:
      - Banking
      operationId: submitBankingThirdParty
      summary: Submit the third party to verification (free)
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Submitted to verification.
          content:
            application/json:
              example:
                status: pending_review
  /v1/banking/third-parties/{thirdPartyID}/accounts:
    post:
      tags:
      - Banking
      operationId: createBankingThirdPartyAccount
      summary: Open a bank account for the third party
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              currency: USD
              name: Carlos account
      responses:
        '201':
          description: Bank account created for the third party.
          content:
            application/json:
              example:
                account_id: c4d10000-aaaa-bbbb-cccc-ddddeeeeffff
                status: active
                banking_fee: '1.000000'
                banking_fee_asset: USDT
        '202':
          description: Application held for review (the organization has application review enabled). The resource is
            created only when compliance approves the review; the issuance/profile fee is charged when the application
            is held and refunded automatically if it is rejected. Track the outcome with the
            `txn_review_status_changed` webhook or `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
    get:
      tags:
      - Banking
      operationId: listBankingThirdPartyAccounts
      summary: List the third party's bank accounts
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bank accounts of the third party.
          content:
            application/json:
              example:
                items:
                - id: c4d10000-aaaa-bbbb-cccc-ddddeeeeffff
                  currency: USD
  /v1/banking/third-parties/{thirdPartyID}/accounts/{bankAccountID}/balance:
    get:
      tags:
      - Banking
      operationId: getBankingThirdPartyAccountBalance
      summary: Third party's bank account balance
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      - name: bankAccountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Live balance. The recommended way to read the amount is
            the neutral top-level summary (`available`, `held`, `currency` —
            flat decimal strings, present when the rail supports the summary);
            the `balance` object keeps the full rail-native account detail.
          content:
            application/json:
              example:
                account_id: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                provider_id: BNK-ACC-4471
                available: '0.00'
                held: '0.00'
                currency: USD
                balance:
                  name: OPERATING USD
                  currency: USD
                  balance:
                    money:
                      units: '0'
                      nanos: 0
        '404':
          description: not_found
  /v1/auth/password/forgot:
    post:
      tags:
      - Authentication
      operationId: forgotPassword
      summary: Request a password reset code
      description: Sends a reset code to the member's email (default) or to their verified phone (`channel:"sms"`).
        Always returns 200 with the same body regardless of whether the account exists — this prevents
        account enumeration. Complete the reset with `POST /v1/auth/password/reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              properties:
                org:
                  type: string
                email:
                  type: string
                  format: email
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                  default: email
            example:
              org: cbpay
              email: taylor@example.com
      responses:
        '200':
          description: Generic acknowledgement (never reveals if the account exists).
          content:
            application/json:
              example:
                status: ok
                note: if an account matches, a verification code was sent; complete the reset with POST
                  /v1/auth/password/reset
  /v1/auth/password/reset:
    post:
      tags:
      - Authentication
      operationId: resetPassword
      summary: Reset the password with a code
      description: Validates the code sent by `forgot` and sets a new password. All existing sessions
        are revoked. A single generic error (`invalid_code`) covers unknown org/member/code so nothing
        about account existence leaks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - code
              - new_password
              properties:
                org:
                  type: string
                email:
                  type: string
                  format: email
                code:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                  default: email
            example:
              org: cbpay
              email: taylor@example.com
              code: '123456'
              new_password: my-new-strong-pass
      responses:
        '200':
          description: Password reset; all sessions revoked.
          content:
            application/json:
              example:
                status: password_reset
                note: all sessions were revoked; log in with the new password
        '401':
          description: Invalid or expired code, or no matching account (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is invalid or expired
                or no account matches: null
  /v1/auth/passkey/login/begin:
    post:
      tags:
      - Passkeys
      operationId: passkeyLoginBegin
      summary: Begin passwordless passkey login
      description: Starts a WebAuthn discoverable login ceremony. Pass the returned `options.publicKey`
        to `navigator.credentials.get()` and send the result to `finish`. The challenge is single-use
        and expires in 2 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              properties:
                org:
                  type: string
            example:
              org: cbpay
      responses:
        '200':
          description: WebAuthn assertion options + challenge id.
          content:
            application/json:
              example:
                challenge_id: 5f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                options:
                  publicKey:
                    challenge: base64url…
                    rpId: cbpayapp.com
                expires_at: '2026-07-11T00:02:00Z'
        '503':
          description: Passkeys not configured for the org (`passkeys_unavailable`).
  /v1/auth/passkey/login/finish:
    post:
      tags:
      - Passkeys
      operationId: passkeyLoginFinish
      summary: Finish passwordless passkey login
      description: Validates the authenticator assertion and issues a session. A passkey is already two
        factors (device + biometrics), so this login does not go through the login OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - challenge_id
              - credential
              properties:
                org:
                  type: string
                challenge_id:
                  type: string
                credential:
                  type: object
                  description: The PublicKeyCredential JSON from navigator.credentials.get().
            example:
              org: cbpay
              challenge_id: 5f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
              credential:
                id: AaBb…
                type: public-key
                response: {}
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              example:
                access_token: eyJ…
                expires_at: '2026-07-12T00:00:00Z'
                refresh_token: rt_6a1e6c22-….XXXX…
                refresh_expires_at: '2026-08-10T00:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: The passkey could not be verified (`invalid_credential`).
  /v1/me/password:
    post:
      tags:
      - Account
      operationId: changePassword
      summary: Change my password
      description: Changes the calling member's password. Requires the current password (members created
        via social login without a password set their first one here, leaving `current_password` empty)
        and, when the OTP policy requires it, an `X-OTP-Token` for the `password_change` action. All other
        sessions are revoked and a fresh session is returned.
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
        description: Single-use OTP token when the password_change action requires it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
            example:
              current_password: old-pass
              new_password: my-new-strong-pass
      responses:
        '200':
          description: Password changed; previous sessions revoked; new session returned.
          content:
            application/json:
              example:
                status: password_changed
                access_token: eyJ…
                expires_at: '2026-07-12T00:00:00Z'
                refresh_token: rt_6a1e6c22-….XXXX…
                refresh_expires_at: '2026-08-10T00:00:00Z'
                note: all previous sessions were revoked
        '403':
          description: Wrong current password (`invalid_password`) or OTP required (`otp_required`).
  /v1/me/email/change:
    post:
      tags:
      - Account
      operationId: changeEmail
      summary: Change my login email
      description: Starts a login-email change. A verification code is sent to the NEW email; confirm
        with `POST /v1/me/email/confirm`. When the OTP policy requires it, an `X-OTP-Token` for the `email_change`
        action is also required. Verifying the new email is mandatory — it prevents an attacker from pointing
        the login at a mailbox they do not control.
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              properties:
                new_email:
                  type: string
                  format: email
            example:
              new_email: taylor.new@example.com
      responses:
        '200':
          description: Code sent to the new email.
          content:
            application/json:
              example:
                status: code_sent
                email: t***@***.com
                expires_at: '2026-07-11T00:30:00Z'
                note: confirm the change with POST /v1/me/email/confirm using the code sent to the new
                  email
        '409':
          description: The new email is already in use (`email_in_use`).
  /v1/me/email/verify:
    post:
      tags:
      - Account
      operationId: verifyEmail
      summary: Verify my current email
      description: Sends a code to the member's CURRENT email to mark it verified (required to use the
        email OTP channel for money actions). Confirm with `POST /v1/me/email/confirm`.
      responses:
        '200':
          description: Code sent (or already verified).
          content:
            application/json:
              example:
                status: code_sent
                email: t***@***.com
                note: confirm with POST /v1/me/email/confirm using the code sent to your email
  /v1/me/email/confirm:
    post:
      tags:
      - Account
      operationId: confirmEmail
      summary: Confirm an email change or verification
      description: Confirms a pending email change (or verification) with the code received. On a change,
        the login email — and, for owners, the account contact email — are updated and the old email is
        notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: Email confirmed.
          content:
            application/json:
              example:
                status: email_confirmed
                email: taylor.new@example.com
        '409':
          description: No pending email change (`no_pending_email`).
  /v1/me/alias:
    put:
      tags:
      - Account
      operationId: setMyAlias
      summary: Set my permanent alias
      description: 'Sets the account''s public alias ONCE. The alias is permanent and cannot be changed.
        Format: 4-20 chars (a-z, 0-9, dot, underscore, hyphen), starting and ending alphanumeric; reserved
        words are rejected. Others can send you money by alias.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - alias
              properties:
                alias:
                  type: string
            example:
              alias: taylor.code
      responses:
        '200':
          description: Alias set (permanently).
          content:
            application/json:
              example:
                alias: taylor.code
                note: the alias is permanent and cannot be changed
        '409':
          description: Already set (`alias_already_set`) or taken (`alias_taken`).
  /v1/me/qr:
    get:
      tags:
      - Account
      operationId: getMyQR
      summary: My profile QR code
      description: Returns the account's immutable QR token, its payload URI (`cbpay:pay?to=<token>`)
        and a ready-to-render PNG. The QR only lets others SEND money to you; it never changes.
      responses:
        '200':
          description: QR token, payload and PNG.
          content:
            application/json:
              example:
                qr_token: 9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c
                payload: cbpay:pay?to=9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c
                png_base64: iVBORw0KGgo…
                alias: taylor.code
                note: the QR identifies your account to RECEIVE transfers; it never changes
  /v1/me/avatar:
    put:
      tags:
      - Account
      operationId: putMyAvatar
      summary: Upload my profile photo
      description: Uploads (or replaces) the account avatar. Body is the raw image bytes (JPEG, PNG or
        WebP), max 512 KB. The content type is detected from the file's magic bytes, never the header.
        When the image is published to the public CDN, `avatar_url` is an absolute URL that loads without
        authentication; otherwise it is the authenticated API path.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Avatar updated.
          content:
            application/json:
              example:
                status: avatar_updated
                content_type: image/png
                size_bytes: 20481
                avatar_url: https://cdn.cbpayapp.com/public/avatars/1fa63bd1-0000-4000-8000-000000000001/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '413':
          description: The avatar exceeds 512 KB (`image_too_large`).
        '415':
          description: Unsupported image type (`unsupported_image`).
    delete:
      tags:
      - Account
      operationId: deleteMyAvatar
      summary: Delete my profile photo
      responses:
        '200':
          description: Avatar deleted.
          content:
            application/json:
              example:
                status: avatar_deleted
  /v1/avatars/{accountID}:
    get:
      tags:
      - Account
      operationId: getAvatar
      summary: Get an account's avatar
      description: Serves the avatar image of an account in the same organization (used for the recipient
        preview in transfers and contacts). Avatars published to the public CDN answer with a `302` redirect
        to the CDN URL; legacy avatars are served directly.
      parameters:
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the public CDN URL of the avatar.
        '200':
          description: The image bytes (Content-Type is the stored image type).
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No avatar for that account (`not_found`).
  /v1/resolve:
    get:
      tags:
      - Account
      operationId: resolveRecipient
      summary: Resolve a recipient by alias or QR
      description: Returns a minimal preview (alias, display name, type, avatar) of an account in the
        same organization, to confirm before sending. Provide `alias` or `qr` (the raw token or the full
        `cbpay:pay?to=…` payload). Returns a uniform 404 and is rate-limited to prevent enumeration.
      parameters:
      - name: alias
        in: query
        required: false
        schema:
          type: string
      - name: qr
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Recipient preview.
          content:
            application/json:
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                display_name: Taylor Code
                type: person
                alias: taylor.code
                avatar_url: https://cdn.cbpayapp.com/public/avatars/1fa63bd1-0000-4000-8000-000000000001/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '404':
          description: No account matches (`not_found`).
        '429':
          description: Too many lookups (`too_many_attempts`).
  /v1/otp/preferences:
    get:
      tags:
      - Security (OTP)
      operationId: getOTPPreferences
      summary: My 2FA preferences
      description: Shows the effective 2FA policy for the account with, per action, whether it is locked
        by the organization (the org policy is the floor the account cannot go below).
      responses:
        '200':
          description: Effective preferences.
          content:
            application/json:
              example:
                enabled: true
                totp_enrolled: true
                actions:
                - action: login
                  required: true
                  channel: totp
                  source: account
                  locked_by_org: false
                - action: payout
                  required: true
                  channel: sms
                  source: org_default
                  locked_by_org: true
    put:
      tags:
      - Security (OTP)
      operationId: putOTPPreferences
      summary: Update my 2FA preferences
      description: 'Lets the account owner configure its own 2FA. You can always harden (enable actions,
        move to a stronger channel: totp > email > sms/whatsapp) but never go below the organization floor.
        Weakening (disabling an active action or lowering the channel) requires an `X-OTP-Token` for the
        `security_settings` action. Choosing `channel:totp` requires the authenticator app already enrolled.
        Enabling 2FA for the `login` action over a phone channel (`sms`/`whatsapp`) requires the account
        phone number to be verified first (complete any SMS/WhatsApp OTP challenge); otherwise the request
        is rejected with `409 phone_verification_required` — this prevents locking yourself out with a
        mistyped number.'
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - required
              properties:
                action:
                  type: string
                  enum:
                  - login
                  - payout
                  - crypto_withdrawal
                  - transfer
                  - banking_operation
                  - card_reveal
                  - api_key_create
                  - member_add
                  - phone_change
                  - password_change
                  - email_change
                  - security_settings
                required:
                  type: boolean
                channel:
                  type: string
                  enum:
                  - sms
                  - whatsapp
                  - email
                  - totp
                  default: sms
            example:
              action: payout
              required: true
              channel: totp
      responses:
        '200':
          description: Updated effective policy.
          content:
            application/json:
              example:
                enabled: true
                actions:
                - action: payout
                  required: true
                  channel: totp
                  source: account
        '403':
          description: Locked by org (`policy_locked_by_org` / `channel_locked_by_org`) or OTP required
            to weaken (`otp_required`).
        '409':
          description: Authenticator app not enrolled for `channel:totp` (`totp_enrollment_required`),
            or unverified phone when enabling login 2FA over a phone channel (`phone_verification_required`).
  /v1/me/totp:
    get:
      tags:
      - Passkeys
      operationId: getMyTOTP
      summary: My authenticator app status
      description: Whether an authenticator app (TOTP) is active and how many backup codes remain.
      responses:
        '200':
          description: TOTP status.
          content:
            application/json:
              example:
                enrolled: true
                recovery_codes_remaining: 8
    delete:
      tags:
      - Passkeys
      operationId: disableMyTOTP
      summary: Remove my authenticator app
      description: Disables TOTP. Requires a valid authenticator (or backup) code and respects the org
        floor — if the organization mandates the authenticator app it cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: TOTP disabled.
          content:
            application/json:
              example:
                enrolled: false
                status: disabled
        '403':
          description: Invalid code (`otp_invalid`) or required by org (`policy_locked_by_org`).
  /v1/me/totp/enroll:
    post:
      tags:
      - Passkeys
      operationId: enrollMyTOTP
      summary: Start authenticator app enrollment
      description: Generates a TOTP secret and returns the `otpauth://` URI plus a QR PNG to scan in Google
        Authenticator / Authy. Requires the current password (if the member has one). Confirm with `POST
        /v1/me/totp/confirm`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
            example:
              password: my-strong-pass
      responses:
        '200':
          description: Secret + otpauth URI + QR PNG.
          content:
            application/json:
              example:
                totp_secret: JBSWY3DPEHPK3PXP
                otpauth_uri: otpauth://totp/CBPay:taylor@example.com?secret=JBSWY3DPEHPK3PXP&issuer=CBPay
                qr_png_base64: iVBORw0KGgo…
                note: scan the QR (or type the secret) in your authenticator app, then confirm with POST
                  /v1/me/totp/confirm
        '409':
          description: An authenticator app is already active (`totp_already_enrolled`).
  /v1/me/totp/confirm:
    post:
      tags:
      - Passkeys
      operationId: confirmMyTOTP
      summary: Confirm and activate the authenticator app
      description: Activates TOTP with the first valid code and returns 10 one-time backup codes (shown
        only once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: TOTP active; backup codes returned once.
          content:
            application/json:
              example:
                enrolled: true
                recovery_codes:
                - ABCD-EFGH
                - JKLM-NPQR
                note: 'store these recovery codes now: they are shown only once and each works a single
                  time'
        '403':
          description: Invalid code (`otp_invalid`).
  /v1/me/totp/recovery-codes:
    post:
      tags:
      - Passkeys
      operationId: regenerateRecoveryCodes
      summary: Regenerate backup codes
      description: Issues a fresh set of backup codes and invalidates the previous ones. Requires a valid
        authenticator or backup code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: New backup codes (previous ones are void).
          content:
            application/json:
              example:
                recovery_codes:
                - WXYZ-2345
                - 6789-ABCD
                note: previous recovery codes are no longer valid
  /v1/me/passkeys:
    get:
      tags:
      - Passkeys
      operationId: listMyPasskeys
      summary: List my passkeys
      responses:
        '200':
          description: The account's registered passkeys.
          content:
            application/json:
              example:
                passkeys:
                - passkey_id: 3b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  name: MacBook de Taylor
                  created_at: '2026-07-11T00:00:00Z'
                  last_used_at: '2026-07-11T00:05:00Z'
  /v1/me/passkeys/register/begin:
    post:
      tags:
      - Passkeys
      operationId: passkeyRegisterBegin
      summary: Begin passkey registration
      description: Starts a WebAuthn registration ceremony. Requires the current password (if the member
        has one) — a new sign-in factor is never added from a stolen session. Pass `options.publicKey`
        to `navigator.credentials.create()`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
            example:
              password: my-strong-pass
      responses:
        '200':
          description: WebAuthn creation options + challenge id.
          content:
            application/json:
              example:
                challenge_id: 7b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                options:
                  publicKey:
                    challenge: base64url…
                    rp:
                      id: cbpayapp.com
                expires_at: '2026-07-11T00:02:00Z'
        '503':
          description: Passkeys not configured for the org (`passkeys_unavailable`).
  /v1/me/passkeys/register/finish:
    post:
      tags:
      - Passkeys
      operationId: passkeyRegisterFinish
      summary: Finish passkey registration
      description: Validates the attestation and stores the passkey under a friendly name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_id
              - credential
              properties:
                challenge_id:
                  type: string
                name:
                  type: string
                  description: Friendly device name, e.g. "MacBook de Taylor".
                credential:
                  type: object
                  description: The PublicKeyCredential JSON from navigator.credentials.create().
            example:
              challenge_id: 7b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              name: MacBook de Taylor
              credential:
                id: AaBb…
                type: public-key
                response: {}
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              example:
                passkey_id: 3b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                name: MacBook de Taylor
                created_at: '2026-07-11T00:00:00Z'
        '409':
          description: This device credential is already registered (`passkey_exists`).
  /v1/me/passkeys/{passkeyID}:
    delete:
      tags:
      - Passkeys
      operationId: deleteMyPasskey
      summary: Remove a passkey
      description: Removes a passkey. Requires the current password (if the member has one) and is blocked
        if it is the only sign-in method left.
      parameters:
      - name: passkeyID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
            example:
              password: my-strong-pass
      responses:
        '200':
          description: Passkey removed.
          content:
            application/json:
              example:
                passkey_id: 3b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                status: deleted
        '409':
          description: Cannot remove the only sign-in method (`last_login_method`).
  /v1/me/sessions:
    get:
      tags:
      - Account
      operationId: listMySessions
      summary: List my active sessions
      description: Lists the member's sessions (devices) with IP, user agent, login method and whether
        each is the current one.
      responses:
        '200':
          description: The member's sessions.
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                sessions:
                - session_id: 8b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  created_at: '2026-07-11T00:00:00Z'
                  expires_at: '2026-07-12T00:00:00Z'
                  login_method: password
                  current: true
                  active: true
                  ip: 200.1.2.3
                  user_agent: Mozilla/5.0
  /v1/me/sessions/{sessionID}:
    delete:
      tags:
      - Account
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: Signs out a specific device.
      parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              example:
                session_id: 8b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                status: revoked
  /v1/me/sessions/revoke-all:
    post:
      tags:
      - Account
      operationId: revokeAllMySessions
      summary: Revoke all my other sessions
      description: Signs out every session except the current one.
      responses:
        '200':
          description: Other sessions revoked.
          content:
            application/json:
              example:
                status: revoked
                sessions_revoked: 3
  /v1/me/security/events:
    get:
      tags:
      - Account
      operationId: listMySecurityEvents
      summary: My security activity
      description: Append-only history of security events for the account (logins, credential changes,
        factors added/removed). Requires `from`/`to` date filters.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Security events.
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                events:
                - event_id: a1b2c3d4-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  member_id: 1c2d3e4f-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  event: password_changed
                  created_at: '2026-07-11T00:00:00Z'
                  ip: 200.1.2.3
        '400':
          $ref: '#/components/responses/InvalidRange'
  /v1/events:
    get:
      tags:
      - Real-time events
      operationId: streamEvents
      summary: Real-time event stream (SSE)
      description: |-
        Opens a `text/event-stream` connection that delivers every event of the account in real time — the same events that travel by webhook, without exposing a public endpoint.

        Each event carries `id:` (monotonic cursor), `event:` (the event type) and `data:` (JSON with the same `event_id` as the webhook, so both channels cross-reference).

        Reconnect with the `Last-Event-ID` header (or `?last_event_id=`) and the server replays what you missed before resuming live delivery. Native `EventSource` cannot send an `Authorization` header: use `fetch` with `ReadableStream`.

        Scope follows the credential: an account credential receives its own events; an org-admin credential with `ops:read` receives the organization-wide channel and can narrow it with `?account_id=`.

        The connection sends `: ping` every 20s, revalidates the session every 60s (a revoked session closes the stream with the `unauthorized` control event) and closes after 30 minutes with a `reconnect` control event.
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: 'Reconnection cursor. Alternative to the `Last-Event-ID` header for `fetch` clients.'
        schema:
          type: string
        example: '4821'
      - name: last_event_id
        in: query
        required: false
        description: 'Reconnection cursor. Alternative to the `Last-Event-ID` header for `fetch` clients.'
        schema:
          type: string
      - name: types
        in: query
        required: false
        description: 'Comma-separated event types to filter. An unknown type returns `400 invalid_event_type`.'
        schema:
          type: string
        example: payin_credited,payout_status_changed
      - name: snapshot
        in: query
        required: false
        description: 'When `true`, the first event is `snapshot` with the absolute current state (balances and, for org-admins, operational health) before the live deltas.'
        schema:
          type: boolean
      - name: account_id
        in: query
        required: false
        description: 'Org-admin only: narrows the org-wide channel to a single account.'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Event stream opened. The body stays open and is written incrementally.'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : cbpay event stream

                retry: 3000

                id: 4822
                event: payin_credited
                data: {"event_id":"7c1f0b2a-5c3d-4e6f-9a1b-2c3d4e5f6a7b","type":"payin_credited","account_id":"c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10","created_at":"2026-07-25T18:04:11Z","cursor":"4822","data":{"payin_id":"9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d","usdt_credited":"99.700000"}}

                : ping
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 'Too many concurrent streams (`too_many_streams`) or too many stream openings from this IP (`rate_limited`, 600 per hour — the quota counts attempts, not live connections).'
          content:
            application/json:
              examples:
                too_many_streams:
                  summary: Concurrent stream limit reached
                  value:
                    error: too_many_streams
                    message: too many concurrent event streams for this account; close one before opening another
                rate_limited:
                  summary: Too many stream openings from this IP
                  value:
                    error: rate_limited
                    message: too many requests
  /v1/events/history:
    get:
      tags:
      - Real-time events
      operationId: listEventHistory
      summary: Event history
      description: 'The same log that feeds the stream, queryable. Requires `from`/`to` date filters. Retention is 90 days: the log is a notification buffer, the financial facts live in their own immutable resources (movements, payins, payouts).'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: event_type
        in: query
        required: false
        description: 'Filters by a single event type.'
        schema:
          type: string
      - name: account_id
        in: query
        required: false
        description: 'Org-admin only: narrows the org-wide channel to a single account.'
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: 'Events in the requested range.'
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                total: 2
                events:
                - event_id: 7c1f0b2a-5c3d-4e6f-9a1b-2c3d4e5f6a7b
                  type: payin_credited
                  account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                  created_at: '2026-07-25T18:04:11Z'
                  cursor: '4822'
                  data:
                    payin_id: 9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    usdt_credited: '99.700000'
                - event_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  type: balance_adjusted
                  account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                  created_at: '2026-07-25T18:02:00Z'
                  cursor: '4821'
                  data:
                    account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                    asset: USDT
                    amount: '10.000000'
                    direction: credit
                    reason: manual top-up
                    available: '109.700000'
                    held: '0.000000'
        '400':
          $ref: '#/components/responses/InvalidRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events/{eventID}:
    get:
      tags:
      - Real-time events
      operationId: getEvent
      summary: Event detail
      description: 'Detail of a single event by its public `event_id` (the same one that travels in the webhook). An event outside your scope returns `404`, never `403`.'
      parameters:
      - name: eventID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'The event.'
          content:
            application/json:
              example:
                event_id: 7c1f0b2a-5c3d-4e6f-9a1b-2c3d4e5f6a7b
                type: payin_credited
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                created_at: '2026-07-25T18:04:11Z'
                cursor: '4822'
                data:
                  payin_id: 9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                  usdt_credited: '99.700000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/txn-reviews:
    get:
      tags:
      - Account
      operationId: listMyTxnReviews
      summary: List my transaction reviews
      description: |-
        Money operations of the account held by the transactional firewall (payouts, crypto withdrawals, payins, banking transfers) with their review status. Filter by `status` and date range (`from`/`to`, organization timezone, both inclusive). When a review moves to `info_requested`, upload the requested documents with `POST /v1/me/txn-reviews/{reviewID}/files` — the operation stays held until the compliance team decides.
      parameters:
      - name: status
        in: query
        description: '`in_review`, `info_requested`, `released`, `rejected` or `all` (empty = open: `in_review` + `info_requested`).'
        schema:
          type: string
          enum:
          - in_review
          - info_requested
          - released
          - rejected
          - all
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: List my transaction reviews.
          content:
            application/json:
              example:
                reviews:
                - id: 7a3f2b1c-0000-4000-8000-000000000001
                  kind: payout
                  resource_id: 8b4c3d2e-1111-4111-8111-111111111111
                  status: info_requested
                  amount_label: '1500.00'
                  asset: USD
                  country: MX
                  method: spei
                  counterparty: Juan Pérez
                  info_request:
                    message: Please upload the invoice that justifies this payment
                    requested_at: '2026-08-06T15:20:00Z'
                  created_at: '2026-08-06T14:32:00Z'
                  updated_at: '2026-08-06T15:20:00Z'
                page: 1
                page_size: 50
                total: 1
        '400':
          description: Invalid filter.
          content:
            application/json:
              examples:
                invalid_status:
                  summary: Unknown status
                  value:
                    error: invalid_status
                    message: status must be one of in_review, info_requested, released, rejected, all
                invalid_range:
                  summary: Bad date range
                  value:
                    error: invalid_range
                    message: invalid date range
  /v1/me/txn-reviews/{reviewID}:
    get:
      tags:
      - Account
      operationId: getMyTxnReview
      summary: Get a review
      description: 'Detail of one review of the account, with the information request message (`info_request`) and the files already uploaded. The internal hold reason and compliance notes are never exposed (anti tipping-off). A rejected review also includes `decision_note` (the same text as the rejection email) and `decided_at`.'
      parameters:
      - name: reviewID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The review with its uploaded files.
          content:
            application/json:
              example:
                review:
                  id: 7a3f2b1c-0000-4000-8000-000000000001
                  kind: payout
                  resource_id: 8b4c3d2e-1111-4111-8111-111111111111
                  status: info_requested
                  amount_label: '1500.00'
                  asset: USD
                  country: MX
                  method: spei
                  counterparty: Juan Pérez
                  info_request:
                    message: Please upload the invoice that justifies this payment
                    requested_at: '2026-08-06T15:20:00Z'
                  files:
                  - id: f1e2d3c4-0000-4000-8000-0000000000aa
                    review_id: 7a3f2b1c-0000-4000-8000-000000000001
                    file_name: invoice-221.pdf
                    content_type: application/pdf
                    size_bytes: 482110
                    uploaded_by: account
                    created_at: '2026-08-06T15:40:00Z'
                  created_at: '2026-08-06T14:32:00Z'
                  updated_at: '2026-08-06T15:40:00Z'
        '404':
          description: The review does not belong to the account.
          content:
            application/json:
              example:
                error: not_found
                message: review not found
  /v1/me/txn-reviews/{reviewID}/files:
    post:
      tags:
      - Account
      operationId: uploadMyTxnReviewFile
      summary: Upload a file for an information request
      description: |-
        Uploads a supporting document for a review in `info_requested`. Send the raw binary body with its `Content-Type` (PDF, PNG, JPEG, WEBP, TXT, CSV, DOC(X) or XLS(X), up to 50 MB) and the filename in the `name` query param. Uploading a file moves the review back to `in_review` so the compliance team re-evaluates it.
      parameters:
      - name: reviewID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        description: Original filename (max 200 chars, no path separators).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File uploaded; the review moved back to `in_review`.
          content:
            application/json:
              example:
                file:
                  id: f1e2d3c4-0000-4000-8000-0000000000aa
                  review_id: 7a3f2b1c-0000-4000-8000-000000000001
                  file_name: invoice-221.pdf
                  content_type: application/pdf
                  size_bytes: 482110
                  uploaded_by: account
                  created_at: '2026-08-06T15:40:00Z'
                status: in_review
        '400':
          description: Validation error.
          content:
            application/json:
              examples:
                invalid_name:
                  summary: Missing filename
                  value:
                    error: invalid_name
                    message: name is required (query param, max 200 chars, no path separators)
                empty_file:
                  summary: Empty body
                  value:
                    error: empty_file
                    message: the file body is empty
        '404':
          description: The review does not belong to the account.
          content:
            application/json:
              example:
                error: not_found
                message: review not found
        '409':
          description: The review is not waiting for information.
          content:
            application/json:
              example:
                error: not_awaiting_info
