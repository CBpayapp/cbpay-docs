                  - fintoc
                  options:
                  - method: bank_transfer
                    currency: CLP
                  - method: fintoc
                    currency: CLP
                cards:
                - country: BO
                  currency: BOB
                  local_amount: '543.30'
                - country: BO
                  currency: USD
                  local_amount: '50.75'
                crypto:
                - method: crypto:tron:usdt
                  chain: tron
                  asset: USDT
                  due: '50.000000'
                - method: crypto:btc:btc
                  chain: btc
                  asset: BTC
                  due: '0.00046120'
                  quote_ttl_seconds: 900
                cbpay:
                  alias: tayl.code
                  dues:
                    USDT: '50.000000'
                    USDC: '50.100200'
                    BTC: '0.00046120'
                    GOLD: '0.462100'
                country_quote:
                  country: BO
                  currency: BOB
                  methods:
                  - qr
                  local_amount: '543.30'
                  options:
                  - method: qr
                    currency: BOB
                    local_amount: '543.30'
                  - method: qr
                    currency: USD
