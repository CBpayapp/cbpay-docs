  /v1/payouts/qr/scan:
    post:
      tags:
      - Payouts
      operationId: payoutQrScan
      summary: Scan a payout QR (Bolivia, Brazil)
      description: 'Step 1 of the QR payout — Bolivia (local interoperable QR) and Brazil (PIX QR, including
        the "copia e cola" code): reads a collection QR and returns the recipient''s data plus the `provider_reference`
        needed to confirm. **Free of charge** — nothing is debited until the confirm step. Defaults to
        Bolivia; for Brazil send `country: "BR"` and `currency: "BRL"`. Brazil supports **static** PIX
        QRs (key embedded); a dynamic QR (PSP URL payload) answers `400` — ask the beneficiary for their
        PIX key and use the `pix` method. An empty `amount` in the scan response means an open-amount QR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qr_payload
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                qr_payload:
                  type: string
                  description: Raw content of the scanned QR (in Brazil, also the PIX "copia e cola" code).
            example:
              qr_payload: <QR content>
              currency: BOB
      responses:
        '200':
          description: Recipient data for user confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                  provider_reference:
                    type: string
                  beneficiary_name:
                    type: string
                  destination_account:
                    type: string
                  amount:
                    type: string
                  currency:
                    type: string
                  glosa:
                    type: string
                  status:
                    type: string
              example:
                scan_id: 5c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                provider_reference: QR-REF-889923
                beneficiary_name: Juan Quispe
                destination_account: '****4521'
                amount: '700.00'
                currency: BOB
                glosa: ''
                status: scanned
        '400':
          description: qr_payload missing (invalid_request) or unreadable/unsupported QR (invalid_qr_payload
            — corrupt BR Code, bad checksum, or a dynamic PIX QR; the message explains the exact reason).
          content:
            application/json:
              schema: &id010
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_qr_payload
                message: 'dynamic pix qr codes are not supported yet: pay with method pix using the beneficiary
                  pix key'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Core unavailable (core_unavailable).
          content:
            application/json:
              schema: *id010
              example:
                error: core_unavailable
                message: could not scan the QR
  /v1/payouts/qr/confirm:
    post:
      tags:
      - Payouts
      operationId: payoutQrConfirm
      summary: Confirm a QR payout (Bolivia, Brazil)
      description: 'Step 2 of the QR payout (Bolivia and Brazil/PIX), charged exactly like a regular payout:
        the local amount converts at **your account''s rate** and `usdt_amount + fixed fee` is debited.
        The result is **synchronous** — the response carries the final state (`completed`, or `failed`
        with an automatic refund). Requires an idempotency key like every money-moving operation. In
        Bolivia the scanned reference is single-use (one QR = one payment); in Brazil a **static PIX QR
        is reusable by design** — pay it again with a different key, and a failed attempt never burns
        the QR. `amount` is always required; in Brazil, if the PIX QR carries a fixed amount it must
        match exactly — a mismatch answers `422` with the payout in `status: failed` and the refund
        already applied (open-amount QRs pay whatever you send).'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_reference
              - amount
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                provider_reference:
                  type: string
                  description: From the scan step.
                amount:
                  type: string
                  description: Local amount as a positive decimal string.
                description:
                  type: string
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Virtual balance to debit for this operation. Omit to use your account's
                    default settlement asset.
                idempotency_key:
                  type: string
            example:
              provider_reference: QR-REF-889923
              amount: '700.00'
              currency: BOB
              description: QR lunch payment
              idempotency_key: qr-2026-07-07-a
      responses:
        '202':
          description: Final result (synchronous).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                settlement_asset: USDT
                settlement_amount: '101.602460'
                settlement_rate: '1'
                beneficiary: &id011
                  qr_reference: QR-REF-889923
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                bank_reference: '00761123456'
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
        '200':
          description: Idempotency replay of an existing QR payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                settlement_asset: USDT
                settlement_amount: '101.602460'
                settlement_rate: '1'
                beneficiary: *id011
                description: QR lunch payment
                status: completed
                status_code: ''
                status_message: ''
                bank_reference: '00761123456'
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
                idempotency_hit: true
        '400':
          description: invalid_request / idempotency_key_required / invalid_amount
          content:
            application/json:
              schema: *id010
              example:
                error: invalid_request
                message: provider_reference (from the scan) is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: Account not active (account_blocked).
          content:
            application/json:
              schema: *id010
              example:
                error: account_blocked
                message: account is not active
        '422':
          description: Rejected by the processor; the debit was refunded (payout with status failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                settlement_asset: USDT
                settlement_amount: '101.602460'
                settlement_rate: '1'
                beneficiary: *id011
                description: QR lunch payment
                status: failed
                status_code: core_rejected
                status_message: QR already paid
                bank_reference: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
