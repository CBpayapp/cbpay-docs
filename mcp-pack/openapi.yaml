      operationId: verifySignatureProofPublic
      summary: Verify a signature proof (public)
      description: 'Public endpoint (no credentials) that verifies a wallet signature
        proof by its public capability code (the `proof_code`, which starts with `G`).
        Returns JSON by default; with `Accept: text/html` it renders a branded
        verification page. Anti-enumeration: an invalid or unknown code returns the
        same generic 404. Shares the per-IP rate limit of the public verification
        endpoints. The signature and message hash are exposed because they are the
        material of the public proof (no PII).'
