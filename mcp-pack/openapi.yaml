        volatile_daily_limit_usdt:
          type: string
          description: Rolling 24h volume cap (USDT equivalent) per account for volatile assets (BTC/GOLD).
      example:
        default_settlement_asset: USDT
        default_payin_asset: USDT
        enabled_assets:
        - USDT
        - USDC
        - BTC
        - GOLD
        volatile_op_limit_usdt: '10000.000000'
        volatile_daily_limit_usdt: '50000.000000'
    Payout:
      type: object
      properties:
        payout_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
        fx_rate:
          type: string
          description: Your account's rate at execution time (local units per 1 USDT).
        usdt_amount:
          type: string
        fee:
          type: string
        total_debit:
          type: string
        settlement_asset:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
          description: Virtual balance the operation was actually debited from.
        settlement_amount:
          type: string
          description: Exact amount debited from the settlement asset's balance (in that asset's units).
            Equals `total_debit` when the asset is USDT. If the payout fails this exact amount is refunded
            — never re-quoted.
        settlement_rate:
          type: string
          description: Effective USD price per unit of the settlement asset used to convert the USDT total
            ("1" for USDT/USDC).
        beneficiary:
          type: object
        description:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        bank_reference:
          type: string
          description: Bank/rail transaction reference (e.g. the bank's transfer id, which the beneficiary can use to cross-check the payment with their bank). On US ACH/wire/SWIFT it is the CBF reference returned immediately at create; on other corridors it stays empty until the rail reports it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
          description: Present (true) when the response is an idempotent replay.
    Payin:
      type: object
      properties:
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
        kind:
          type: string
          enum:
          - qr
          - collect
          - push
          - card
          - checkout
          - pos
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
          description: >-
            Amount in the local currency, as a plain decimal string (for example
            "5000000"). Never scientific notation.
        settlement_asset:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
          description: The virtual balance the payin settles into. Checkout and POS payins
            denominate the charge in this per-link asset (no `currency`/`local_amount` until a
            local payment method is used; the charge amount is `asset_amount` in this asset).
            Other credited payins carry it when the account configured a `default_payin_asset`
            other than USDT — the net credit is auto-converted into this asset.
        asset_amount:
          type: string
          description: Checkout and POS payins only — the charge amount denominated in
            `settlement_asset` (present in every status, including pending and expired).
        conversion_status:
          type: string
          enum:
          - pending_retry
          - done
          description: Auto-conversion state — for checkout/POS payins when the payment arrived
            in a different asset than `settlement_asset`, and for other payins when the account
            configured a `default_payin_asset` other than USDT. `pending_retry` is retried
            automatically. Omitted when no conversion applies.
        status:
          type: string
          enum:
          - pending
          - credited
          - unassigned
          - expired
          - failed
        reference:
          type: string
        idempotency_key:
          type: string
          description: >-
            Your idempotency key from the create request, echoed back.
            Absent when the payin was created without one (or by the
            platform itself — internal keys are never exposed).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settle_at:
          type: string
          format: date-time
          description: >-
            Card-paid collections with a configured settlement delay only —
            direct card payins and checkout/POS charges paid by card — when
            this payin's balance becomes available (`created_at` plus the
            `payin_card` fee config's `settlement_hours`). The payin itself is
            confirmed right away: the status is `credited` and the
            `payin_credited` webhook fires at payment time; what waits until
            `settle_at` is the BALANCE credit (and the auto-conversion, when
            configured). A payin whose delay has already elapsed when it is
            approved or assigned settles immediately. Absent when the balance
            settles on confirmation.
        settlement_pending:
          type: boolean
          description: >-
            Present (true) while a `credited` card-paid payin's balance is
            still scheduled for `settle_at` — covers direct card payins and
            checkout/POS charges paid by card. While set, the payin cannot be
            refunded (`422 settlement_pending`) — the funds are not in your
            balance yet. Absent once the balance lands.
        settled_at:
          type: string
          format: date-time
          description: >-
            When the balance of this credited payin actually landed in your
            ledger — right at confirmation for payins without a settlement
            delay, or when the scheduled settlement ran (or was released early
            by your org admin) for delayed card payins.
        fx_rate:
          type: string
          description: Your payin rate at credit time (present once the payment was received and converted).
        usdt_gross:
          type: string
        fee:
          type: string
        usdt_credited:
          type: string
          description: Amount credited to the balance. Also present WITHOUT `fx_rate` on
            checkout/POS charges settled in crypto or via a CBPay transfer (no FX quote applies).
        refund_status:
          type: string
          enum:
          - partial
          - full
          description: Present only once the payin has refunds or a chargeback. Derived from the accumulated amounts — the payin `status` is never rewritten.
        refunded_amount:
          type: string
          description: Accumulated USDT debited by refunds and chargebacks on this payin.
        refunded_local:
          type: string
          description: Accumulated amount refunded in the original local currency.
        failure:
          type: object
          description: 'Present only when the payin is `failed` on active collections: where the rejection originated (`provider` = the payer''s bank, `core` = pre-charge validation) plus the concrete code and message.'
          properties:
            source:
              type: string
            code:
              type: string
            message:
              type: string
        payer_source:
          type: string
          enum:
          - declared
          - account_identity
          - none
          - bank_event
          description: >-
            Announced transfers and unassigned deposits — where the payer identity came from.
            `declared` you sent it, `account_identity` the account holder's verified tax id was
            used as the default, `none` no identity was available (only the reference can match),
            `bank_event` (unassigned deposits) it was read from the arriving transfer.
        payer:
          type: object
          description: Payer identity attached to the payin, when known.
          properties:
            name:
              type: string
            document:
              type: string
            account:
              type: string
        deposit_instructions:
          $ref: '#/components/schemas/DepositInstructions'
          description: >-
            Frozen snapshot of the destination bank account announced to the payer
            (announced `bank_transfer` payins on corridors with configured
            instructions — today CL, PY and US). The text never changes after
            creation; the QR image is regenerated on read with your current
            branding. On the US/USD corridor this block is the domestic rail
            (ABA routing number).
        deposit_instructions_swift:
          $ref: '#/components/schemas/DepositInstructions'
          description: >-
            Frozen snapshot of the international SWIFT rail (BIC + correspondent
            bank), present only on the US/USD corridor when your organization
            has the swift variant configured. The payer picks either rail; both
            share the same `reference`.
        match_method:
          type: string
          enum:
          - charge_link
          - reference
          - payer_document
          - payer_account
          - payer_name
          - amount_single_candidate
          - dedicated_clabe
          - collect_settlement
          - manual_assign
          description: >-
            How the arriving transfer was matched to this payin (audit trail). `charge_link`
            means the deposit settled the charge created for this payin (QR, checkout link or
            card) and was linked one-to-one by that charge - the strongest signal, no
            heuristics involved. `manual_assign` means an org admin routed the deposit by hand.
        match_reason:
          type: string
          description: >-
            Why the deposit could NOT be matched automatically, on `unassigned` payins —
            `no_match`, `ambiguous_amount` (two or more announcements share the amount),
            `ambiguous_payer`, `claim_lost` (another event claimed the announcement first) or
            `assigned_to:<payin_id>`.
        candidate_count:
          type: integer
          description: >-
            Number of pending announcements that matched the amount and currency of an
            `unassigned` deposit (2 or more means the deposit was ambiguous).
    PayinRefund:
      type: object
      properties:
        refund_id:
          type: string
          format: uuid
