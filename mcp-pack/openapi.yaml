          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/aml/screenings/{screeningID}/report:
    get:
      tags:
      - AML screening
      operationId: getAmlScreeningReport
      summary: Download the AML screening report (PDF)
      description: Branded PDF report of the screening — executive decision page, risk indicators
        (sanctions, watchlists, PEP, adverse media...), consolidated matches, aliases, glossary and a
        final backing section with the international data sources consulted. Trilingual via `lang`
        (default English). Pure read — no fee, no idempotency key. An id that belongs to another account
        returns 404.
      parameters:
      - name: screeningID
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - en
          - es
          - zh
          default: en
        description: Language of the PDF report (default English).
      responses:
        '200':
          description: Branded PDF report of the screening.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              example: '%PDF-1.7 (binary report content)'
        '400':
          description: Unsupported language (`invalid_language`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_language
                message: 'lang must be one of: en, es, zh'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/aml/rescreen:
    post:
      tags:
      - AML screening
      operationId: rescreenAml
      summary: Re-run an AML screening
      description: Re-runs the account's screening. Requires a prior screening. Bills the `compliance_rescreen`
        fee if configured; refunded on upstream failure. Each rescreen is stored in the audit history
        (`GET /v1/aml/screenings`). `idempotency_key` is required — replaying with the same key returns
        the original rescreen with `idempotency_hit` true and never charges twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                idempotency_key:
                  type: string
                  description: Required (the rescreen charges a fee). Also accepted as the Idempotency-Key
                    header.
            example:
              idempotency_key: aml-rescreen-2026-07-12
      responses:
        '200':
          description: Rescreen result stored locally.
          content:
            application/json:
              example:
                screening_id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                kind: rescreen
                service: compliance_rescreen
                risk: low
                screening_fee: '1.000000'
                fee_asset: USDT
                idempotency_key: aml-rescreen-2026-07-12
                created_at: '2026-07-12T19:00:00Z'
                result:
                  customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                  status: completed
                  screening_result: no_hits
        '400':
          description: Missing idempotency_key (`idempotency_key_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_screening`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_screening
                message: account has no AML screening to rescreen
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/aml/monitoring:
    patch:
      tags:
      - AML screening
      operationId: setAmlMonitoring
      summary: Enable or disable AML monitoring
      description: Toggles continuous compliance monitoring for the account's verified identity. Enabling
        bills the `compliance_monitoring` fee if configured; disabling is free. Requires a prior screening.
        Each state change is stored in the audit history (`GET /v1/aml/screenings`, filter kind monitoring).
        When the state actually changes, `idempotency_key` is required — replaying with the same key returns
        the original event with `idempotency_hit` true. Toggling to the current state returns unchanged
        true without charging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                idempotency_key:
                  type: string
                  description: Required when the monitoring state changes (enable charges a fee). Also
                    accepted as the Idempotency-Key header.
            example:
              enabled: true
              idempotency_key: aml-monitor-enable-1
      responses:
        '200':
          description: Monitoring state stored locally.
          content:
            application/json:
              example:
                screening_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: monitoring
                service: compliance_monitoring
                monitor: true
                monitoring_enabled: true
                screening_fee: '1.000000'
                fee_asset: USDT
                idempotency_key: aml-monitor-enable-1
                created_at: '2026-07-12T20:00:00Z'
                compliance_service: compliance_monitoring
                compliance_fee: '1.000000'
        '400':
          description: Missing idempotency_key when the state changes (`idempotency_key_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
                compliance_fee: '0.500000'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: Account has no prior screening (`no_screening`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_screening
                message: account has no AML screening to monitor
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/aml/catalogs:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogs
      summary: Compliance form catalogs
      description: 'Returns every catalog (list of value/label pairs) the front should use to build consistent
        compliance and verification forms: genders, company status, address types, company legal forms
        (global list plus per-country cascade), income/wealth sources, industry standards with their per-country
        default, and the full ISO-3166 country and subdivision lists. Static data — safe to cache for
        hours. `value` is what you send to the API; `label` is what you display.'
      responses:
        '200':
          description: All catalogs plus a `meta` block describing the cascades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  genders:
                    type: array
                    description: Exact enum values required when screening persons.
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  company_status:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  address_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  company_types:
                    type: array
                    description: Flat fallback list of legal entity forms (official local language).
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  source_of_income:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  source_of_wealth:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  industries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  industry_code_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  company_types_by_country:
                    type: object
                    description: Legal entity forms per ISO country (GLEIF ELF); fall back to `company_types`
                      when the country is missing.
                  industries_by_code_type:
                    type: object
                    description: Industry codes per standard (`value` = code, `label` = description).
                  industry_code_type_by_country:
                    type: object
                    description: Industry standard fixed per country (default ISIC).
                  countries:
                    type: array
                    description: ISO-3166-1 countries.
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  country_subdivisions:
                    type: object
                    description: ISO-3166-2 subdivisions per country.
                  meta:
                    type: object
                    description: Counts plus a note describing how the cascades chain together.
              example:
                genders:
                - value: male
                  label: Male
                - value: female
                  label: Female
                company_status:
                - value: active
                  label: Active
                address_types:
                - value: residential
                  label: Residential
                company_types:
                - value: Sociedad Anónima
                  label: Sociedad Anónima
                source_of_income:
                - value: salary
                  label: Salary
                source_of_wealth:
                - value: business_ownership
                  label: Business ownership
                industries:
                - value: financial_services
                  label: Financial services
                industry_code_types:
                - value: ISIC
                  label: ISIC Rev.4
                company_types_by_country:
                  CL:
                  - value: Sociedad por Acciones
                    label: Sociedad por Acciones
                industries_by_code_type:
                  ISIC:
                  - value: '6419'
                    label: Other monetary intermediation
                industry_code_type_by_country:
                  CL: ISIC
                countries:
                - value: CL
                  label: Chile
                country_subdivisions:
                  CL:
                  - value: CL-RM
                    label: Región Metropolitana de Santiago
                meta:
                  country_count: 249
                  note: value = send to the API; label = display in the UI.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/aml/catalogs/cities:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogCities
      summary: Cities catalog for a country
      description: 'Returns the cities of one ISO 3166-1 alpha-2 country, grouped by subdivision:
        `states` keys are the same ISO 3166-2 codes as `country_subdivisions` in `GET
        /v1/aml/catalogs`, and `country_cities` lists the cities whose region could not be
        mapped to a subdivision (offer them too). Neither field is ever `null`. A country
        without coverage answers 200 with empty lists — fall back to a free-text city field.
        Static data served with `Cache-Control: public, max-age=86400`; safe to cache for a
        day. One call per country, then filter by state on the client.'
      parameters:
      - name: country
        in: query
        required: true
        description: ISO 3166-1 alpha-2 country code (e.g. `US`).
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: Cities of the country grouped by subdivision (empty lists when the country has no coverage).
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: ISO 3166-1 alpha-2 country code echoed back.
                  states:
                    type: object
                    description: Cities per ISO 3166-2 subdivision code (`<CC>-<code>`).
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  country_cities:
                    type: array
                    description: Cities whose region could not be mapped to a subdivision.
                    items:
                      type: string
                  meta:
                    type: object
                    description: Coverage counts (`state_count`, `city_count`).
              example:
                country: US
                states:
                  US-FL:
                  - Miami
                  - Orlando
                country_cities: []
                meta:
                  state_count: 51
                  city_count: 3200
        '400':
          description: Malformed country code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_country
                message: country is required (ISO 3166-1 alpha-2)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: Unknown country code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: country_not_found
                message: unknown country code
  /v1/aml/catalogs/postal-code:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogPostalCode
      summary: Look up city and state by postal code
      description: 'Resolves a postal code to its city and state from an embedded
        public dataset — today only US ZIP codes are covered. Use it to autofill the
        city/state fields while the user types the ZIP in address forms: a 404 means
        "unknown ZIP" (or a country without a dataset) and the fields should simply
        stay manual. Static data served with `Cache-Control: public, max-age=86400`;
        safe to cache for a day.'
      parameters:
      - name: country
        in: query
        required: true
        description: ISO 3166-1 alpha-2 country code. Only `US` has a dataset today.
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      - name: code
        in: query
        required: true
        description: Postal code to resolve (5-digit US ZIP).
        schema:
          type: string
          pattern: '^[0-9]{5}$'
        example: '33130'
      responses:
        '200':
          description: City and state for the postal code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: ISO 3166-1 alpha-2 country code echoed back.
                  postal_code:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    description: ISO 3166-2 subdivision code suffix (e.g. `FL`).
              example:
                country: US
                postal_code: '33130'
                city: Miami
                state: FL
        '400':
          description: Missing parameters or a malformed postal code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_payload
                message: code must be a 5-digit US ZIP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: Unknown postal code, or a country without a dataset — keep the
            address fields manual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: postal_code_not_found
                message: no place found for the given postal code
  /v1/me/verification/link:
    post:
      tags:
      - KYC / KYB
      operationId: createMyVerificationLink
      summary: Request my onboarding verification link
      description: 'Returns the account''s own identity-verification link (person accounts get a KYC link,
        company accounts a KYB link — derived from the account type). The hosted wizard covers the full
        flow: form, document uploads and video liveness. Free. If an open link already exists it is returned
        with 200; an already-approved account gets 409 already_verified. Until the account''s verification
        is approved, every outgoing-money action answers 403 verification_required (funding and reads
        stay available).'
