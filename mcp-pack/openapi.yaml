    post:
      tags:
      - KYC / KYB
      operationId: presignKycDocument
      summary: Presign a KYC document upload
      description: 'Step 1 of the document flow: returns a temporary upload URL. Then PUT the binary to
        upload_url with the same Content-Type (step 2) and confirm (step 3). Categories: identity, proofOfResidence.
        Types: application/pdf, image/png, image/jpeg; 15 MB max; the URL expires in 15 minutes.'
      parameters:
      - name: submissionID
        in: path
        required: true
