  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: 'Subscribes an HTTPS callback to the calling account''s events.


        Deliveries are signed: `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`
        with the timestamp in `X-Webhook-Timestamp`. Up to 5 attempts with incremental backoff.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payin_expired
                  - payin_refunded
                  - payin_settlement_scheduled
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_deposit_held
                  - crypto_deposit_alert
                  - crypto_withdrawal_status_changed
                  - banking_customer_status_changed
                  - banking_operation_status_changed
                  - banking_virtual_iban_inbound
                  - banking_virtual_iban_inbound
                  - banking_virtual_iban_inbound
                  - aml_screening_updated
                  - kyc_verification_status_changed
                  - kyb_verification_status_changed
                  - kyc_link_completed
                  - kyb_link_completed
                  - kyc_document_validated
                  - kyb_document_validated
                  - kyc_liveness_completed
                  - wallet_deposit_received
                  - wallet_send_status_changed
                  - wallet_key_exported
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: HTTPS only; localhost and private IPs are rejected.
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Webhooks
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: Lists the account's webhook subscriptions (the secret is never returned).
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                page: 1
                page_size: 50
                subscriptions:
                - id: 475b48fc-2858-4ad3-81e2-ec68742d8245
                  event_type: payout_status_changed
                  callback_url: https://api.example.com/webhooks/cbpay
                  status: active
                  created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/subscriptions/{subscriptionID}:
    patch:
      tags:
      - Webhooks
      operationId: updateWebhookSubscriptionStatus
      summary: Disable or reactivate a webhook subscription
      description: 'Toggles one of the account''s subscriptions between `active` and
        `disabled`. A `disabled` subscription stops receiving NEW events; deliveries
        already queued are still sent. Idempotent: repeating the current status is
        a no-op `200`. Subscriptions are never deleted — disabling is how you
        unsubscribe. Ownership is enforced: a subscription of another account answers
        `404` (it is indistinguishable from an inexistent one).

        '
      parameters:
      - name: subscriptionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - disabled
            examples:
              disable:
                summary: Disable the subscription
                value:
                  status: disabled
              reactivate:
                summary: Reactivate the subscription
                value:
                  status: active
      responses:
        '200':
          description: The subscription with its current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - disabled
                  created_at:
                    type: string
                    format: date-time
              examples:
                disabled:
                  summary: Subscription disabled
                  value:
                    id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                    event_type: payout_status_changed
                    callback_url: https://api.myapp.com/webhooks/cbpay
                    status: disabled
                    created_at: '2026-07-07T12:00:00Z'
        '400':
          description: '`invalid_status`: status must be `active` or `disabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidStatus:
                  summary: Status outside the catalog
                  value:
                    error: invalid_status
                    message: status must be active or disabled
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
