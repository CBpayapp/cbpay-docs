    patch:
      tags:
      - Cards
      operationId: updateCard
      summary: Update limits, spending asset or freeze/unfreeze
      description: Updates the card's spending limits (send "0" to remove a limit), changes the balance
        it spends from (`spending_asset`, future purchases only) and freezes or unfreezes it. Frozen cards
        decline every authorization instantly.
      parameters:
      - $ref: '#/components/parameters/cardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frozen:
                  type: boolean
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: New spending balance. Only affects future purchases; in-flight authorizations
                    keep (and refund to) the asset they debited.
                limits:
                  type: object
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
            examples:
              freeze:
                summary: Freeze the card
                value:
                  frozen: true
              set_spending_asset:
                summary: Spend from the USDC balance
                value:
                  spending_asset: USDC
              set_limits:
                summary: Update limits
                value:
                  limits:
                    per_transaction: '200.00'
                    daily: '0'
      responses:
        '200':
          description: Updated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
