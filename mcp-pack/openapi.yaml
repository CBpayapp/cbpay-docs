          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found
          content:
            application/json:
              example:
                error: not_found
                message: not found
  /v1/qscore/subjects/{docID}/monitoring:
    put:
      tags: [Qscore]
      summary: Subscribe to a subject (monitoring)
      operationId: putQscoreMonitoring
      description: 'Creates or updates the monitoring subscription of your account
        to a subject (person or company). Monitoring is free, but requires your
        organization to have already purchased a `ready` report for that subject —
        the subscription baseline is seeded from that purchased data. By design
        (anti-oracle), a non-existent subject and an existing subject without a
        purchased report receive the SAME `403 report_required` response: this
        endpoint never reveals whether a document exists in the bureau.

        The subscription is idempotent per (account, subject): re-creating returns
        the existing subscription with its baseline preserved. `only_material`
        (default false) limits the `new_records` trigger to materially negative
        records (open collections, protested instruments, bankruptcies, lawsuits).
        `monitor_since_score` (1..999) arms the `score_drop_below` trigger: an
        alert fires when the score crosses that threshold downwards.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: ISO country of the document (default CL). May also be sent
          in the request body as `country`.
        example: CL
      requestBody:
        required: false
        content:
          application/json:
            example:
              only_material: true
              monitor_since_score: 500
      responses:
        '200':
          description: Monitoring subscription (created or updated).
          content:
            application/json:
              example:
                monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                active: true
                only_material: true
                created_at: '2026-08-08T16:11:40Z'
                doc_id: 12.345.678-5
                country: CL
                subject_type: person
                monitor_since_score: 500
        '400':
          description: invalid_doc_id | invalid_payload
          content:
            application/json:
              example:
                error: invalid_payload
                message: monitor_since_score must be between 1 and 999
        '401':
          description: unauthorized
        '403':
          description: forbidden (service disabled or unverified account) | report_required
          content:
            application/json:
              example:
                error: report_required
                message: purchase a report for this subject before enabling monitoring
    get:
