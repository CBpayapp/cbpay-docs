  /v1/qscore/my-report:
    post:
      tags: [Qscore]
      summary: Generate your own credit report (self)
      operationId: createQscoreSelfReport
      description: 'Generates (or reuses) the Qscore credit report of the
        authenticated account holder — the ARCO / data-protection right of
        access to one''s own credit information. Unlike `POST
        /v1/qscore/reports`, this endpoint is FREE (no fee is charged) and the
        subject identity is derived from the verified account: the `tax_id`
        validated during KYC/KYB. The request does NOT accept a `doc_id` —
        requesting a third party''s report through this endpoint is impossible
        by design (anti-oracle).

        Frequency limit: one NEW self report every 30 days. If a `ready` self
        report already exists within that window, the endpoint returns `200`
        with the existing report and `idempotency_hit: true` (reused);
        otherwise it generates a new one and returns `201`. A double submit on
        the same day returns the already-created report (deterministic
        idempotency per account + subject + day). Self reports are excluded
        from the subject''s query count, so pulling your own report never
        penalizes your score. The report is computed synchronously: the
        response is the finished report (status `ready`) or a failed one
        (status `failed` with `error_code`/`error_message`).'
      requestBody:
        required: false
        content:
          application/json:
            examples:
              default:
                summary: Default language (es)
                value: {}
              lang:
                summary: Pick the report language
                value:
                  lang: en
      responses:
        '200':
          description: 'A ready self report already existed within the 30-day
            window; it is returned with `idempotency_hit: true` (no new report
            is generated).'
          content:
            application/json:
              example:
                report_id: 7d2c1a90-4e55-4b3a-9f0c-1a2b3c4d5e6f
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
