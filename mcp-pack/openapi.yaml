  /v1/crypto/withdrawals:
    post:
      tags:
      - Crypto
      operationId: createCryptoWithdrawal
      summary: Create an on-chain withdrawal
      description: 'Sends USDT, USDC or BTC on-chain from its own balance. Supported pairs: `tron`/`USDT`,
        `eth`/`USDT`, `eth`/`USDC`, `btc`/`BTC` (GOLD has no on-chain rail). `amount + withdrawal fee` is
        debited atomically and held; final state arrives via the `crypto_withdrawal_status_changed` webhook.
        `failed` refunds the full debit.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                  default: tron
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  default: USDT
                  description: Asset to send (USDC only over `eth`; on `btc` the asset defaults to
                    `BTC`).
                to_address:
                  type: string
                to_contact_id:
                  type: string
                  format: uuid
                  description: Use the contact's saved address for this chain instead of `to_address`
                    (an explicit `to_address` always wins).
                amount:
                  type: string
                  description: Positive decimal string, up to 6 decimal places (8 for BTC).
                idempotency_key:
                  type: string
                contact_name:
                  type: string
                  description: Name for the auto-saved contact holding this address.
                save_contact:
                  type: boolean
                  default: true
                  description: The address is saved as a contact automatically; send false to skip it.
                travel_address:
                  type: string
                  description: Travel Rule (FATF R.16) — the beneficiary institution's travel address
                    (`ta…` code) for withdrawals above the org threshold towards another institution.
                    The payment address is provided by the receiving institution, so `to_address` can
                    be omitted.
                wallet_type:
                  type: string
                  enum:
                  - self_hosted
                  description: Travel Rule — declare `self_hosted` when the destination is the account
                    holder's own wallet (requires `beneficiary_name`).
                beneficiary_name:
                  type: string
                  description: Travel Rule — name of the destination holder. Required above the threshold
                    (with `travel_address` or `wallet_type=self_hosted`).
            examples:
              usdt_tron:
                summary: USDT over TRON
                value:
                  chain: tron
                  to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                  amount: '100.000000'
                  idempotency_key: withdrawal-2026-07-07-a
              usdc_eth:
                summary: USDC over Ethereum
                value:
                  chain: eth
                  asset: USDC
                  to_address: '0x8f3Ba1c2De4567890aBcDeF1234567890aBcDeF1'
                  amount: '50.000000'
                  idempotency_key: withdrawal-usdc-2026-07-09-a
              btc_bitcoin:
                summary: BTC over Bitcoin
                value:
                  chain: btc
                  to_address: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4
                  amount: '0.00050000'
                  idempotency_key: withdrawal-btc-2026-07-15-a
              travel_rule_self_hosted:
                summary: Above the Travel Rule threshold to an own (self-hosted) wallet
                value:
                  chain: tron
                  to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                  amount: '1500.000000'
                  wallet_type: self_hosted
                  beneficiary_name: Maria Perez
                  idempotency_key: withdrawal-2026-07-12-a
              travel_rule_vasp:
                summary: Above the threshold to another institution (travel address)
                value:
                  chain: tron
                  amount: '1500.000000'
                  travel_address: ta2AQSjBotWQf38c8sxYYK2KfisPoMsTPiYkviErEcoSn1uK
                  beneficiary_name: Maria Perez
                  idempotency_key: withdrawal-2026-07-12-b
      responses:
        '202':
          description: Withdrawal accepted and broadcasting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawal'
              example: &id007
                withdrawal_id: 6c5d4e3f-2a1b-0c9d-8e7f-6a5b4c3d2e1f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: withdrawal-2026-07-07-a
                chain: tron
                asset: USDT
                to_address: TVJ6njG5Fyrq6XwYok3xPQx8kR7HQx6vXk
                amount: '100.000000'
                fee: '1.000000'
                total_debit: '101.000000'
                status: processing
                status_code: ''
                status_message: broadcasted
                tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:00Z'
        '200':
