      description: 'Lists the batch scoring jobs of your account (newest first),
        paginated. `page` starts at 1; `page_size` defaults to 50 (maximum 200).
        The `from` and `to` date filters (organization timezone, both inclusive) are mandatory.
        Batches owned by other accounts are never visible (ownership isolation:
        a batch id from another account returns 404).'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD, organization timezone, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD, organization timezone, inclusive).
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - completed_with_errors
          - failed
        description: Filter by batch status.
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Paged batch list.
          content:
            application/json:
              example:
                items:
                - batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                  account_id: 4a9c2e71-8b3d-4f2a-9c1e-5d7b2a8f3e41
                  status: completed_with_errors
                  purpose: credit_evaluation
                  country: CL
                  lang: es
                  total_items: 4
                  processed_items: 4
                  succeeded_items: 3
                  failed_items: 1
                  estimated_fee_usdt: '14.50'
                  idempotency_key: portfolio-2026-08-09-a
                  created_at: '2026-08-09T14:32:10Z'
                  started_at: '2026-08-09T14:34:02Z'
                  completed_at: '2026-08-09T14:41:37Z'
