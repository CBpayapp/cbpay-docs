      description: Company accounts can request a `banking_eur` virtual IBAN for an owned, verified third party. The third party owns the Banking EUR balance; the company is the manager of the relationship.
      parameters:
        - {name: thirdPartyID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            examples:
              request:
                value:
                  idempotency_key: third-party-viban-2026-001
      responses:
        '202':
          description: Third-party request queued for approval.
          content:
            application/json:
              examples:
                pending:
                  value:
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000002
                      owner_account_id: 8a0c9d3e-2b7d-4bad-9bdd-2b0d7b3dcb6e
                      manager_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      purpose: banking_eur
                      currency: EUR
                      iban: ''
                      status: pending_approval
        '400':
          description: invalid_json or idempotency_key_required.
        '403':
          description: company_required, verification_required or service_disabled.
        '404':
          description: not_found.
        '503':
          description: banking_recovery_pending.
    get:
      tags: [Banking]
      operationId: listThirdPartyVirtualIBANs
      summary: List a third party's Banking EUR virtual IBANs
      parameters:
        - {name: thirdPartyID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Paginated third-party virtual IBANs.
          content:
            application/json:
              examples:
                list:
                  value:
                    page: 1
                    page_size: 50
                    virtual_ibans:
                      - id: 2f8c1d4e-1111-4b22-8a33-000000000002
                        owner_account_id: 8a0c9d3e-2b7d-4bad-9bdd-2b0d7b3dcb6e
                        manager_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        purpose: banking_eur
                        currency: EUR
                        iban: DE890000000000000000
                        iban_country: DE
                        status: active
        '400':
          description: invalid_range.
        '404':
          description: not_found.

  /v1/banking/virtual-ibans/{virtualIBANID}/balance:
    get:
      tags: [Banking]
      operationId: getVirtualIBANBalance
      summary: Get a Banking EUR virtual IBAN balance
      description: Returns the reconciled platform ledger balance for a `banking_eur` virtual IBAN. A `funding_usdt` virtual IBAN does not hold BANK_EUR.
      parameters:
        - {name: virtualIBANID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Reconciled BANK_EUR balance.
          content:
            application/json:
              examples:
                balance:
                  value:
                    virtual_iban_id: 2f8c1d4e-1111-4b22-8a33-000000000001
                    currency: EUR
                    asset: BANK_EUR
                    available: '80.00'
                    held: '0.00'
                    purpose: banking_eur
                    source: platform_ledger_reconciled_to_banking_provider
        '404':
          description: not_found.
        '409':
          description: balance_not_available for funding_usdt.
        '503':
          description: Banking ledger unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session JWT (from register/login) or API key (`pk_...`).

        `X-API-Key: <token>` is accepted as an alternative header.

        '
  parameters:
    receiptLang:
      name: lang
      in: query
      schema:
        type: string
        enum:
        - en
        - es
        - zh
        default: en
      description: Language of the PDF receipt. Defaults to English.
    cardID:
      name: cardID
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternative to the `idempotency_key` body field.
      schema:
        type: string
  responses:
    ReceiptPDF:
      description: Branded PDF receipt with the signed verification QR.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          example: '%PDF-1.7 (binary receipt content)'
    BadRequest:
      description: Invalid request (see `error` code for the specific validation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: Account balance is not enough for this operation (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    InvalidRange:
      description: Invalid `from`/`to` date filter (`invalid_range`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_range
            message: invalid from date (YYYY-MM-DD)
    AccountRequired:
      description: This endpoint requires an account credential (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: Credential level not allowed for this endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: Missing or invalid credential (`unauthorized`).
      content:
        application/json:
          schema: *id016
          example:
            error: unauthorized
            message: invalid or missing credentials
