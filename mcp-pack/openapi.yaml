  /pay/{token}/methods/{method}:
    post:
      security: []
      tags:
      - Checkout
      operationId: checkoutMaterialize
      summary: Materialize a checkout payment option (public)
      description: >-
        Creates (lazily) the payment option the payer picked on a universal checkout
        link and returns its instructions — the payment URL for card/hosted methods, the QR for
        QR methods, the announce reference for bank transfers, or an exclusive crypto deposit
        address with the exact quoted amount plus a scannable QR (`qr_payload` +
        `qr_png_base64` — always the raw address for BTC/TRON/ETH, readable by
        external wallets and exchanges; BIP-21/EIP-681 URIs are rejected by apps
        like Binance). Fiat methods require `?country=XX`; the local amount is quoted and
        FROZEN at this moment. When the country offers the method in more than one currency
        (see `options[]` of the quote — e.g. QR in BOB and USD, or card corridors) it also
        requires `&currency=YYY`; each currency is an independent materialization. Bank
        transfers in Mexico issue a dedicated CLABE exclusive to the link (`destination`
        with `dedicated: true`): the payer transfers the exact amount with NO reference —
        the deposit routes to the link automatically. If the dedicated account cannot be
        issued, the payload degrades to the classic path (merchant account + mandatory
        `reference` in the transfer description). Re-POSTing the same
        country+currency+method returns the SAME materialization; picking a method never
        blocks the others while nobody has paid. No credentials; rate limited per IP.
        Pull collection (`collect: true`) is not offered by any corridor at this time.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Opaque checkout token embedded in the `checkout_url`.
      - name: method
        in: path
        required: true
        schema:
          type: string
        description: Method to materialize — a fiat method from the multi-country catalog (`qr`,
          `card`, `fintoc`, `bank_transfer`; requires `?country=XX`)
          or a crypto option (`crypto:tron:usdt`, `crypto:eth:usdt`, `crypto:eth:usdc`,
          `crypto:btc:btc`; no country).
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: ISO-3166 alpha-2 country of the fiat method being materialized. Required
          for fiat methods, ignored for crypto.
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: Charge currency of the materialization, picked from the `options[]` (or
          `cards[]`) catalog of the quote (e.g. `BOB` or `USD`). Required when the country
          offers the method in more than one currency; ignored when there is a single one
          (it is determined by the country).
      responses:
        '200':
          description: Instructions for the chosen payment method.
          content:
            application/json:
              examples:
                crypto:
                  summary: Crypto — exclusive deposit address with scannable QR
                  value:
                    method: crypto:btc:btc
                    payload:
                      chain: btc
                      asset: BTC
                      address: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                      due: '0.00046120'
                      received: '0.00000000'
                      qr_payload: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                      qr_png_base64: iVBORw0KGgo…
                      quote_expires_at: '2026-07-16T18:15:00Z'
                      note: send the exact amount to the address; the payment is confirmed on-chain
                        automatically
                bank_transfer:
                  summary: Bank transfer — announce reference (frozen local quote)
                  value:
                    method: bank_transfer
                    country: CL
                    currency: CLP
                    local_amount: '47180'
                    payload:
                      reference: CB68JZCT46QE
                      note: include the reference in the transfer description so the payment is
                        detected automatically
                bank_transfer_dedicated_account:
                  summary: Bank transfer with a dedicated CLABE exclusive to the link (MX)
                  value:
                    method: bank_transfer
                    country: MX
                    currency: MXN
                    local_amount: '941.00'
                    payload:
                      destination:
                        type: clabe
                        account: '710969000012345678'
                        beneficiary: Acme Store S.A.
                        dedicated: true
                      note: transfer the exact amount to this dedicated account; no reference
                        is needed — the payment is detected automatically
                card:
                  summary: Card — hosted payment page in the chosen currency
                  value:
                    method: card
                    country: BO
                    currency: USD
                    local_amount: '50.75'
                    payload:
                      charge_id: 8f6a2c1e-4b7d-4a1e-9c3f-2d5e6f7a8b9c
                      payment_url: https://api.qbank.cl/pay/cards/9f3XkT2m…
                      expires_at: '2026-07-17T18:15:00Z'
        '404':
          description: Invalid token or unknown payment link.
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: The link was already paid via another method.
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: The link expired without payment.
          content:
            application/json:
              example:
