openapi: 3.1.0
info:
  title: CBPay API
  version: "2.72"
  description: 'CBPay is a multi-currency payment platform: fiat payouts and collections

    across Latin America, internal transfers, on-chain funding and

    withdrawals, and KYC screening. Every account holds four independent

    virtual balances — USDT (the operating currency), USDC, BTC and GOLD

    (grams of fine gold) — convertible on demand with swaps.

    Payouts and service fees can be paid from any of the four balances

    (`PUT /v1/settlement` or per-payout `settlement_asset`), and payins

    can auto-convert to the asset of your choice (`default_payin_asset`).


    All amounts are decimal strings in each currency''s precision (6 decimals

    for USDT/USDC/GOLD, 8 for BTC). Errors always return

    `{"error": "<code>", "message": "<detail>"}`.

    '
servers:
- url: https://api.qbank.cl/platform
  description: Live (production, real money)
- url: https://cryptobank.qbank.cl/platform
  description: Test (sandbox, simulated money — pk_test_ keys)
security:
- bearerAuth: []
tags:
- name: Receipts
  description: Branded PDF receipt per operation, with a public signed-QR authenticity check, receipt_url
    on every response/webhook and automatic email delivery on final states.
- name: Authentication
  description: Register and log in account members. Sessions last 24 hours.
- name: Account
  description: Profile, members and API keys of the calling account.
- name: Balances
  description: Balances, movement history and FX rates.
- name: Payouts
  description: Fiat dispersals debited from the settlement balance of your choice (USDT by default).
- name: Payins
  description: Fiat top-ups (QR, transfers, dedicated accounts, pull collections, cards, checkout links)
    credited automatically — in USDT by default, or auto-converted to the settlement asset of your choice.
- name: Checkout
  description: >-
    Universal checkout links (`POST /v1/payins` with `method: "checkout"`) and the public
    payment-page endpoints — multi-country fiat, crypto with an ephemeral wallet per link and
    direct CBPay payment, settled in the asset of your choice.
- name: Stored cards
  description: >-
    Cards saved with the payer's explicit consent during a 3-D Secure payment (COF). List,
    revoke and charge them on demand (MIT) without asking for the card again.
- name: Subscriptions
  description: >-
    Recurring charges on a stored card managed by the platform scheduler — daily, weekly,
    monthly or yearly, with pause/resume/cancel and automatic dunning.
- name: Transfers
  description: Free internal transfers between CBPay accounts (person or company, any combination).
- name: Contacts
  description: Per-account address book of beneficiaries (CBPay, bank and crypto destinations) with
    phone matching and auto-save on every send.
- name: Swaps
  description: Instant conversion between the account's USDT, USDC, BTC and GOLD balances at the
    account's quoted rate.
- name: Crypto
  description: On-chain funding and withdrawals (TRON, Ethereum and Bitcoin).
- name: Segregated wallets
  description: On-chain wallets with their own balance (companies unlimited; persons 1 per network+asset
    pair) — create, import, send, export the private key and auto-forward. The balance lives on-chain,
    never in the ledger.
- name: Signature proofs
  description: Cryptographic message signing with wallets (EIP-191 ETH/EVM, TIP-191 TRON) — create,
    list, get and revoke signature proofs with public verification.
- name: Wallet links
  description: Link external wallets (custody=client) to your account by signing a nonce challenge —
    create challenges, verify signatures, list and revoke links.
- name: QR Crypto POS
  description: "Amount-bearing crypto QR charges for processors with physical POS terminals (company accounts): verified merchants, exclusive address + QR per charge, early payment detection, per-merchant reconciliation and refunds over the crypto withdrawal rail."
- name: KYC / KYB
  description: 'Identity verification: KYC for persons, KYB for companies — your own onboarding and
    third-party verifications for company accounts.'
- name: AML screening
  description: Standalone AML screening of persons and companies against sanctions, PEP and adverse
    media lists, with rescreening, continuous monitoring and a downloadable PDF report.
- name: Wallet screening
  description: AML risk assessment of blockchain addresses (sanctions, illicit-fund exposure) with a per-scan
    fee, plus free automatic protection on withdrawals and deposits.
- name: Qscore
  description: API-first credit bureau. Issues complete credit reports with a 1-999 score (bands A-E, or SC when
    there is no data), reads the latest score of a subject and manages ARCO disputes. Chile first, with a
    country-agnostic design. Every issued report carries a public verification code.
- name: Analytics
- name: Webhooks
  description: Subscriptions to receive signed event notifications.
- name: Status
  description: Service availability.
- name: Banking
  description: 'Real bank accounts: receive, hold and send money over international banking rails.'
- name: Cards
  description: Virtual and physical cards that spend Just-In-Time from the balance of your choice
    (USDT, USDC, BTC or GOLD), with per-card spending limits.
- name: Security (OTP)
  description: One-time verification codes over SMS/WhatsApp/email protecting sensitive actions, plus
    self-service 2FA preferences. Applies to user sessions only — API keys are exempt.
- name: Passkeys
  description: Passwordless sign-in with the device's biometrics (Face ID, Touch ID, Windows Hello, security
    keys) via WebAuthn, authenticator apps (TOTP) with backup codes, and session/device management.
- name: Social login
  description: Passwordless sign up and sign in with Google, Apple, Microsoft and Facebook via token exchange.
    The front end obtains the provider credential; the API verifies it and issues the CBPay session.
- name: Real-time events
  description: >-
    Server-Sent Events stream with everything that happens in the account (or across the organization for admins), replay with `Last-Event-ID`, optional initial snapshot and a 90-day queryable history.
paths:
  /v1/payouts/{payoutID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getPayoutReceipt
      summary: Download the payout receipt (PDF)
      description: Branded PDF receipt of the payout, with the beneficiary data, amounts, status badge
        and the signed verification QR. Non-final states carry a diagonal watermark. Only the payout's
        owner (or the org admin) can download it.
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payins/{payinID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getPayinReceipt
      summary: Download the payin receipt (PDF)
      description: Branded PDF receipt of the collection, with the reference, amounts, status badge and
        the signed verification QR. Non-final states carry a diagonal watermark.
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{transferID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getTransferReceipt
      summary: Download the transfer receipt (PDF)
      description: Branded PDF receipt of the internal transfer (both parties can download it; the counterparty
        is shown by display name).
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/withdrawals/{withdrawalID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCryptoWithdrawalReceipt
      summary: Download the crypto withdrawal receipt (PDF)
      description: Branded PDF receipt of the on-chain withdrawal, with the network, destination address,
        tx hash and the signed verification QR.
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/deposits/{depositID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCryptoDepositReceipt
      summary: Download the crypto deposit receipt (PDF)
      description: Branded PDF receipt of a credited on-chain deposit. The `depositID` is the `deposit_id`
        field returned by `GET /v1/crypto/transactions`.
      parameters:
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps/{swapID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getSwapReceipt
      summary: Download the swap receipt (PDF)
      description: Branded PDF receipt of the balance conversion, with both legs, the applied rate and
        the signed verification QR.
      parameters:
      - name: swapID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/{cardID}/transactions/{transactionID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getCardTransactionReceipt
      summary: Download the card purchase receipt (PDF)
      description: Branded PDF receipt of a card transaction, with the merchant, USD amount, debited balance
        and the signed verification QR.
      parameters:
      - name: cardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/operations/{operationID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getBankingOperationReceipt
      summary: Download the banking operation receipt (PDF)
      description: Branded PDF receipt of a banking operation (amount, currency, counterparty, status)
        with the signed verification QR. Available for operations created after the traceability mirror
        went live.
      parameters:
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/sends/{sendID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getWalletSendReceipt
      summary: Download the segregated wallet send receipt (PDF)
      description: Branded PDF receipt of an on-chain send from a segregated wallet, with the network,
        destination address, tx hash and the signed verification QR.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sendID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/deposits/{depositID}/receipt:
    get:
      tags:
      - Receipts
      operationId: getWalletDepositReceipt
      summary: Download the segregated wallet deposit receipt (PDF)
      description: Branded PDF receipt of an on-chain deposit received by a segregated wallet, with the
        network, origin address, tx hash and the signed verification QR.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/reports/{code}:
    get:
      security: []
      tags:
      - KYC / KYB
      operationId: verifyReport
      summary: Verify a report's authenticity (public)
      description: >-
        Public endpoint (no credentials) behind the QR printed on every verification report. The code is
        cryptographically signed - a tampered or made-up one answers 404 with valid=false. The response
        only exposes the kind (KYC/KYB), the CURRENT decision status and its date - never the subject's
        identity, documents or AML results. Browsers get a branded HTML page; API clients get JSON. Rate
        limited per IP.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Verification code printed on the report (also embedded in the QR URL).
      responses:
        '200':
          description: The report is authentic; current facts of the verification.
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: kyb
                status: ok
                decision: approved
                date: '2026-07-21'
                issued_by: CBPay
        '404':
          description: Invalid, tampered or unknown verification code.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: Too many verification attempts from this IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreReport
      summary: Verify a Qscore report's authenticity (public)
      description: 'Public endpoint (no credentials) behind the verification code printed on every Qscore
        credit report. The code is cryptographically signed: a tampered or made-up one answers 404 with
        `valid: false`. The response shows only non-sensitive facts: that the report exists, its score
        BAND (never the numeric score) and its issue date — never the subject''s identity nor credit
        detail. Browsers get a branded HTML page; API clients get JSON. Rate limited per IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Verification code printed on the report (the `verify_code` field of the report resource).
      responses:
        '200':
          description: The report is authentic; non-sensitive facts.
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: qscore
                status: ready
                decision: B
                date: '2026-08-08'
                issued_by: CBPay
        '404':
          description: Invalid, tampered or unknown verification code.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: Too many verification attempts from this IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSeal
      summary: Check a Qscore seal's current validity (public)
      description: 'Public endpoint (no credentials) behind the Qscore seal a company
        activates with `POST /v1/qscore/my-seal`. The code is cryptographically signed:
        a tampered or made-up one answers 404 with `valid: false`. Eligibility is
        evaluated LIVE on every call: the band (A or B) is shown only while the seal is
        active AND the subject still qualifies (band A/B with an evaluation no older
        than 90 days). A seal that no longer qualifies answers `seal_status:
        not_current` — anti-oracle: the band it fell to, the numeric score and the
        reason are never revealed. The numeric score NEVER appears on any public
        surface. Browsers get a branded HTML page (`Accept: text/html`); API clients
        get JSON. Rate limited per IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Public verification code of the seal (the `verify_code` field of the seal resource).
      responses:
        '200':
          description: The seal state, evaluated live.
          content:
            application/json:
              examples:
                active:
                  summary: Current seal (active and still eligible)
                  value:
                    valid: true
                    type: qscore_seal
                    seal_status: active
                    band: A
                    evaluated_at: '2026-08-07'
                    company_name: Comercial Andes SpA
                    doc_id: 76.543.210-3
                    country: CL
                revoked:
                  summary: Seal revoked by the holder (permanent for that code)
                  value:
                    valid: false
                    seal_status: revoked
                    revoked_at: '2026-08-09'
                not_current:
                  summary: Seal no longer eligible (band dropped or score stale) — reason never revealed
                  value:
                    valid: false
                    seal_status: not_current
        '404':
          description: Invalid, tampered or unknown verification code.
          content:
            application/json:
              example:
                valid: false
                seal_status: not_current
        '429':
          description: Too many verification attempts from this IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}/badge.svg:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSealBadge
      summary: Embeddable SVG badge with the live seal state (public)
      description: 'Public endpoint (no credentials) that renders the embeddable Qscore
        seal as an SVG image (180x64, dark background). While the seal is active and
        the subject still qualifies, the badge shows the current band letter (A or B)
        in green with the label "VERIFICADO"; otherwise the same URL renders a grey
        badge labeled "NO VIGENTE" — it never shows a stale band and never breaks the
        host page. `Cache-Control: public, max-age=300` (viewers may cache the image
        for up to 5 minutes). Answers 404 with an empty body only for invalid or
        tampered codes.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Public verification code of the seal (the `verify_code` field of the seal resource).
      responses:
        '200':
          description: The SVG badge with the live seal state.
          content:
            image/svg+xml:
              schema:
                type: string
              example: '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="64">...</svg>'
        '404':
          description: Invalid, tampered or unknown verification code (empty body).
  /verify/receipts/{code}:
    get:
      security: []
      tags:
      - Receipts
      operationId: verifyReceipt
      summary: Verify a receipt's authenticity (public)
      description: 'Public endpoint (no credentials) behind the QR printed on every receipt. The code
        is cryptographically signed: a tampered or made-up one answers 404 with `valid: false`. The response
        shows the operation''s REAL current status and amount — never the beneficiary''s personal data.
        Browsers get a branded HTML page; API clients get JSON. Rate limited per IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Verification code printed on the receipt (also embedded in the QR URL).
      responses:
        '200':
          description: The receipt is authentic; current facts of the operation.
          content:
            application/json:
              example:
                valid: true
                type: payout
                status: ok
                raw_status: completed
                amount: 800.00 VES
                detail: Venezuela — Pago Móvil
                date: 2026-07-11 15:29 UTC
                issued_by: CBPay
        '404':
          description: Invalid, tampered or unknown verification code.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any receipt issued by this platform
        '429':
          description: Too many verification attempts from this IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /v1/track-link:
    get:
      tags:
      - Receipts
      operationId: getTrackLink
      summary: Get the public tracking link of a transaction
      description: 'Returns the shareable public tracking link of any transaction in your
        read scope, without downloading the receipt PDF — the building block for a "Share
        link" button in your UI. The `code` is the same HMAC-signed, deterministic code
        printed as a QR on every receipt, so calling the endpoint twice for the same
        transaction always returns the same link, and anyone who receives the link can
        follow the operation on the public tracking page (`GET /v1/public/track/{code}`,
        Wise-style: timeline, receipt PDF download, three languages). Available to the
        account itself (API key or member session), to org admins and to platform admins —
        the same read scope as receipts. A transaction outside your scope (or an unknown
        `kind`) answers 404, never 403: existence is never leaked.'
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [payout, payin, payin_refund, transfer, crypto_withdrawal, crypto_deposit, swap, card_purchase, banking_operation, wallet_send, wallet_deposit]
        description: Transaction family.
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: Transaction identifier — the same id returned by the product endpoints
          and webhooks of the chosen `kind`.
      responses:
        '200':
          description: The public tracking link and its signed code.
          content:
            application/json:
              example:
                track_url: 'https://business.cbpayapp.com/t/P9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d8f4a2c1e5b7'
                code: P9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d8f4a2c1e5b7
        '400':
          description: Missing `kind` or `id`.
          content:
            application/json:
              example:
                error: invalid_payload
                message: kind and id are required
        '404':
          description: The transaction does not exist, the `kind` is unknown, or it is outside
            your scope (uniform answer — anti-enumeration).
          content:
            application/json:
              example:
                error: not_found
                message: transaction not found
  /v1/public/track/{code}:
    get:
      security: []
      tags:
      - Receipts
      operationId: trackReceipt
      summary: Track an operation by its public link (public)
      description: 'Public endpoint (no credentials) behind the shareable tracking link printed on
        every receipt and receipt email. The code is cryptographically signed: a tampered or made-up
        one answers a uniform 404. Review statuses are generalized to `processing` (anti tipping-off).
        The `timeline` uses a fixed step sequence per operation family and only carries REAL timestamps
        (created/updated) — never fabricated ones. `lang` switches the labels (`en` default via the
        hosted page, `es`, `zh`). Every response carries `X-Robots-Tag: noindex` and `Cache-Control:
        no-store`. Shares the verify endpoint''s per-IP rate limit.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Signed tracking code printed on the receipt (the same code as the verification URL).
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum: [en, es, zh]
        description: Language for labels, the subtitle and `whats_next`.
      responses:
        '200':
          description: Current public state of the operation.
          content:
            application/json:
              example:
                kind: payout
                id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                status: in_transit
                status_class: pending
                subtitle: Venezuela — Pago Móvil
                fields:
                - {label: 'TRANSACTION ID', value: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d, mono: true}
                - {label: 'DATE AND TIME', value: 'August 8, 2026 at 15:29 UTC'}
                - {label: 'BENEFICIARY', value: 'María Pérez'}
                - {label: 'BANK', value: 'Banco de Venezuela'}
                - {label: 'PHONE', value: 0414-1234567}
                - {label: 'MESSAGE', value: 'Invoice 1042'}
                amounts:
                - {label: 'AMOUNT RECEIVED', value: '1250000.00 VES'}
                - {label: 'EXCHANGE RATE', value: '950.00'}
                - {label: 'TOTAL DEBIT', value: '1315.79 USDT'}
                created_at: '2026-08-08T15:29:04Z'
                timeline:
                - {key: initiated, state: complete, at: '2026-08-08T15:29:04Z'}
                - {key: processing, state: complete, at: null}
                - {key: in_transit, state: in_progress, at: null}
                - {key: completed, state: upcoming, at: null}
                branding: {name: CBPay, logo_url: 'https://cdn.example.com/logo.png', website: 'https://www.cbpayapp.com', accent: '#FBC140'}
