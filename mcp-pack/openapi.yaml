    SignatureProof:
      type: object
      description: Cryptographic proof that a wallet signed a structured CBPay
        message (EIP-191 ETH/EVM, TIP-191 TRON). Publicly verifiable via verify_url.
        The envelope is the exact anti-phishing message the wallet signed (Domain /
        Purpose / Wallet / Nonce / Issued / Expires / Statement lines; the Account
        line only appears for `wallet_link` proofs). Proofs live 10 minutes
        (`expires_at`); a signed proof stays publicly verifiable after expiry.
      properties:
        proof_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
          description: Present for custodial (server-side) proofs; omitted for wallet-link proofs.
        account_id:
          type: string
          format: uuid
        chain:
          type: string
          enum:
          - eth
          - tron
        address:
          type: string
          description: On-chain address that produced the signature.
        purpose:
          type: string
          enum:
          - wallet_ownership
          - treasury_attestation
          - wallet_link
        statement:
          type: string
          description: Free-text statement (max 140 runes). Omitted when empty.
        envelope:
          type: string
          description: The exact structured message the wallet signed.
          example: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_ownership\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z\nStatement: \"I control this wallet\""
        nonce:
          type: string
          description: 32-char hex anti-replay nonce.
        proof_code:
          type: string
          description: Public verification capability code (53 chars, starts with G).
          example: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
        status:
          type: string
          enum:
          - issued
          - signed
          - expired
          - revoked
        signature:
          type: string
          description: Present once status is signed.
        message_hash:
          type: string
          description: Present once status is signed.
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: issued_at + 10 minutes.
        signed_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        verify_url:
          type: string
          example: https://api.qbank.cl/platform/v1/public/signature-proofs/Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
    WalletLink:
      type: object
      description: External wallet (custody=client) linked to the account by signing
        a nonce challenge. The challenge expires 10 minutes after issuance; once
        the wallet is linked, the link stays active until it is revoked.
      properties:
        link_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        chain:
          type: string
          enum:
          - eth
          - tron
        address:
          type: string
        status:
          type: string
          enum:
          - pending
          - linked
          - revoked
          - expired
        expires_at:
          type: string
          format: date-time
          description: Challenge expiry (10 minutes after creation).
        proof_id:
          type: string
          format: uuid
          description: Signature proof created on verification (present once linked).
        verified_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DepositInstrument:
      type: object
      properties:
        instrument_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        country:
