    post:
      tags:
      - KYC / KYB
      operationId: createKycLivenessLink
      summary: Create a liveness link
      description: Hosted page where your customer completes ONLY the video liveness check (camera gestures
        + server-side face match against the uploaded identity document). Free — the service was billed
        when the submission was created. If an open link exists the same one is returned; if the check
        already passed, 400 liveness_already_completed.
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: 1-30, default 7.
            example:
              expires_in_days: 7
      responses:
        '200':
          description: Liveness link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  expires_at:
                    type: integer
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: pending
                expires_at: 1751234567
        '400':
          description: liveness_already_completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: liveness_already_completed
                message: the liveness check already passed for this submission
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - KYC / KYB
      operationId: getKycLivenessLink
