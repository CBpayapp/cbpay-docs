                type: object
                properties:
                  proof_code:
                    type: string
                  status:
                    type: string
                    enum: [issued, signed, expired, revoked]
                  valid:
                    type: boolean
                  chain:
                    type: string
                  address:
                    type: string
                  purpose:
                    type: string
                  statement:
                    type: string
                  issued_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                  signed_at:
                    type: string
                    format: date-time
                  message_hash:
                    type: string
                  signature:
                    type: string
                  verified_live:
                    type: boolean
                  revoked_at:
                    type: string
                    format: date-time
              example:
                proof_code: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
                status: signed
                valid: true
                chain: eth
                address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                purpose: wallet_ownership
                statement: I control this wallet
                issued_at: '2026-08-21T14:03:11Z'
                expires_at: '2026-08-21T14:13:11Z'
                signed_at: '2026-08-21T14:03:11Z'
                message_hash: '3f8a1c4e9b2d6f70a5c8e1b4d7f2093a4c6e8f10b3d5f709e2a4c6d8f0b1c3d5'
                signature: '8ba1f109551bd432803012645ac136ddd64dba72a0c9e0b1f5b1a2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00112233445566771b'
                verified_live: true
        '404':
          description: Invalid, tampered or unknown proof code.
          content:
            application/json:
              example:
                error: not_found
                message: this verification link does not correspond to any signature proof issued by this platform
        '429':
          description: Too many attempts from this IP.
          content:
