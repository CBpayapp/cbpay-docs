  /v1/qscore/fraud/reports/{id}/pdf:
    get:
      tags: [Qscore]
      summary: Download the private fraud and identity PDF.
      operationId: getQscoreFraudReportPDF
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: >-
            Branded PDF attachment. The fraud PDF includes a functional bureau
