  /v1/banking/virtual-ibans:
    post:
      tags: [Banking]
      operationId: createVirtualIBAN
      summary: Request an EUR virtual IBAN
      description: Requests one durable virtual IBAN allocation for the authenticated account. `funding_usdt` is the default purpose; `banking_eur` requires the Banking product. The allocation enters manual approval and does not by itself create a provider balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: {type: string, enum: [funding_usdt, banking_eur], default: funding_usdt}
                idempotency_key: {type: string}
              additionalProperties: false
            examples:
              funding:
                value:
                  purpose: funding_usdt
                  idempotency_key: viban-funding-2026-001
      responses:
        '202':
          description: Durable request queued for manual approval.
          content:
            application/json:
              examples:
                pending:
                  value:
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000001
                      owner_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      manager_account_id: ''
                      purpose: funding_usdt
                      currency: EUR
                      iban: ''
                      iban_country: ''
                      status: pending_approval
                      client_order: platform:virtual-iban:org:account:funding_usdt:viban-funding-2026-001
                      order_reference: ''
                      created_at: '2026-09-10T12:00:00Z'
                      updated_at: '2026-09-10T12:00:00Z'
                    status: pending_approval
        '200':
          description: Idempotent replay of the same request.
          content:
            application/json:
              examples:
                replay:
                  value:
                    idempotency_hit: true
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000001
                      purpose: funding_usdt
                      currency: EUR
                      iban: DE890000000000000000
                      iban_country: DE
                      status: active
        '400':
          description: invalid_json, invalid_purpose or idempotency_key_required.
        '403':
          description: Account verification or product service gate failed.
        '409':
          description: virtual_iban_conflict.
        '503':
          description: banking_recovery_pending.
    get:
