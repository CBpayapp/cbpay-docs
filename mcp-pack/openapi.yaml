  /v1/rates:
    get:
      tags:
      - Balances
      operationId: getRates
      summary: Get my FX rates and fees
      description: Returns the exchange rates that apply to the calling account for each country — the
        same rates used when operations execute (`local_amount / rate = USDT`) — plus the account's **effective**
        fee configuration — org defaults already resolved against your account's overrides — so clients
        can compute the exact cost of an operation before creating it. `rate` is the payout (dispersal)
        side and `payin_rate` the payin (deposit) side. `asset_prices` carries the USD reference price
        of each virtual balance asset (BTC per unit, GOLD per gram; stablecoins are 1 by convention) for
        display/valuation. The `settlement` block shows, per enabled asset, the **effective settlement
        price** your account would get right now if it paid an operation from that balance (`settlement_rate`,
        spread included) and whether the asset is currently `available` — use it to estimate before sending
        `settlement_asset` in a payout.
      responses:
        '200':
          description: Rates, reference asset prices and fees.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          description: Rate applied to payouts (dispersals).
                          example: '950.123456'
                        payin_rate:
                          type: string
                          description: Rate applied to payins (fiat deposits/collections).
                          example: '955.10'
                  asset_prices:
                    type: object
                    description: USD reference price per virtual balance asset (display/valuation).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          description: Unit the price refers to (`btc`, `gram`, `usdt`, `usdc`).
                          example: gram
                        price:
                          type: string
                          example: '107.5341'
                        updated_at:
                          type: string
                          description: When this price was last updated.
                        settlement_grade:
                          type: boolean
                          description: True when the price is fresh enough to execute settlements (operations
                            paid from that balance).
                  settlement:
                    type: object
                    description: Effective settlement pricing for the calling account.
                    properties:
                      default_asset:
                        type: string
                        description: The balance operations debit from when no `settlement_asset` override
                          is sent.
                        example: USDT
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: BTC
                            available:
                              type: boolean
                              description: False when the asset cannot be used right now (disabled or
                                execution price unavailable).
                            settlement_rate:
                              type: string
                              description: Effective USD price per unit at which your balance would be
                                valued (spread included); empty when unavailable.
                              example: '109029.34'
                  updated_at:
                    type: string
                  fees:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeConfig'
              example:
                base: USD
                rates:
                  chile:
                    currency: CLP
                    rate: '950.25'
                    payin_rate: '955.10'
                  mexico:
                    currency: MXN
                    rate: '17.50'
                    payin_rate: '17.62'
                  peru:
                    currency: PEN
                    rate: '3.72'
                    payin_rate: '3.75'
                asset_prices:
                  USDT:
                    currency: USD
                    unit: usdt
                    price: '1'
                  USDC:
                    currency: USD
                    unit: usdc
                    price: '1'
                  BTC:
                    currency: USD
                    unit: btc
                    price: '109853.24'
                    updated_at: '2026-07-07T11:59:41Z'
                    settlement_grade: true
                  GOLD:
                    currency: USD
                    unit: gram
                    price: '107.5341'
                    updated_at: '2026-07-07T09:12:05Z'
                    settlement_grade: true
                settlement:
                  default_asset: USDT
                  assets:
                  - asset: USDT
                    available: true
                    settlement_rate: '1'
                  - asset: USDC
                    available: true
                    settlement_rate: '0.99900000'
                  - asset: BTC
                    available: true
                    settlement_rate: '109029.34070000'
                  - asset: GOLD
                    available: true
                    settlement_rate: '106.99642950'
                updated_at: '2026-07-07T12:00:00Z'
                fees:
                - id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                  org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
                  account_id: ''
                  service: payout
                  country: CL
                  asset: USDT
                  percent: '0'
                  fixed_amount: '0.30'
                  status: active
                  updated_at: '2026-07-07T12:00:00Z'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: FX rates temporarily unavailable (`rates_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: rates_unavailable
                message: could not fetch fx rates
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rates/history:
    get:
      tags:
      - Balances
      operationId: getRatesHistory
      summary: Get FX rate history
      description: 'Time series of the FX rates that apply to the calling account, for rate-evolution
        charts. Each point carries the same rates you would get operating at that time — `rate` (payout
        side) and `payin_rate` (deposit side) — and every country block includes `first`, `last` and the
        signed `change_pct` between them, ready for a "+3.4% / -3.0%" badge. `asset_prices` carries the
        USD reference series for BTC and GOLD. Buckets without data carry the previous value forward;
        days before history started are omitted (never invented).

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD, organization timezone, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD, organization timezone, inclusive).
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - day
          - hour
          default: day
        description: Bucket size. Max range is 366 days for `day` and 31 days for `hour`.
      - name: currency
        in: query
        schema:
          type: string
        description: Optional local currency filter (e.g. CLP).
      responses:
        '200':
          description: Rate series per country plus asset price series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  base:
                    type: string
                    example: USD
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  rates:
                    type: object
                    description: One series per country (same keys as `GET /v1/rates`).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              rate:
                                type: string
                                description: Payout-side rate at that bucket.
                                example: '950.123456'
                              payin_rate:
                                type: string
                                description: Payin-side rate at that bucket.
                                example: '978.912345'
                        first:
                          type: string
                          description: First payout-side rate of the range.
                        last:
                          type: string
                          description: Last payout-side rate of the range.
                        change_pct:
                          type: string
                          nullable: true
                          description: Signed percentage change first→last (color it green/red in the
                            front).
                  asset_prices:
                    type: object
                    description: USD reference price series for BTC and GOLD (display only).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          example: gram
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                              price:
                                type: string
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                  retrieved_at:
                    type: string
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                base: USD
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                rates:
                  chile:
                    currency: CLP
                    series:
                    - date: '2026-06-12'
                      rate: '939.068965'
                      payin_rate: '967.452325'
