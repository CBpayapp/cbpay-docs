    get:
      tags:
      - KYC / KYB
      operationId: getKycVerificationReport
      summary: Verification report of a KYC you ran (PDF/JSON)
      description: >-
        Full compliance report of a verification you ran on your customer (company accounts only):
        verified profile, lifecycle, documents + OCR, liveness (one entry per session - the onboarding
        gate check plus any later evidence recaptures, each with its own session_id and purpose; for a
        KYB, every related party can carry more than one session too) and the FULL AML screening
        section with match detail - you are the data controller of your third parties. If the
        submission turns out to be your own onboarding, the AML section is aggregated instead. Use
        format=pdf (default) or format=json, and lang=en|es|zh. Free - reading an already-billed
        verification. If the submission has no linked AML screening yet, one is triggered on demand
        (idempotent, no fee); when unavailable the report ships with the gap declared in the partial
        field.
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Submission id.
      - name: format
        in: query
        schema:
          type: string
          enum:
          - pdf
          - json
        description: Report format - pdf (default) or json.
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - en
          - es
          - zh
        description: Report language (en default, es, zh).
      responses:
