  /v1/payins/{payinID}/refunds:
    parameters:
    - name: payinID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Payins
      operationId: createPayinRefund
      summary: Refund a card payin
      description: >-
        Returns money to the cardholder and reverses the credit on your balance.
        Only card-acquired payins in status `credited` can be refunded
        (`refund_not_supported` on the other rails) — and only once their balance
        is actually available: a credited payin whose settlement is still pending
        (`settlement_pending: true`, balance lands at `settle_at`) is declined
        with `422 settlement_pending`. The gross amount is debited:
        the fee and the FX spread of the original payin are NOT refundable.
        `idempotency_key` is mandatory; a replay returns the same refund with
        `idempotency_hit` and never sends a second refund to the processor.
        Requires OTP when the caller is a session (API keys are exempt).
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
        description: One-time-use OTP token (see the OTP guide). Only for session callers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                amount:
                  type: string
                  description: Amount in the original local currency. Omit it for a full refund of the remaining refundable value.
                kind:
                  type: string
                  enum:
                  - refund
                  - void
                  description: '`refund` (default) returns a settled charge; `void` cancels one that has not settled yet.'
                reason:
                  type: string
                idempotency_key:
                  type: string
            example:
              amount: '150.00'
              kind: refund
              reason: customer request
              idempotency_key: refund-order-8842
      responses:
        '200':
          description: Replay of the same idempotency key — the SAME refund, with `idempotency_hit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: customer request
                idempotency_hit: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '201':
          description: Refund created and approved by the processor. The balance was debited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: customer request
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '202':
          description: >-
            Ambiguous dispatch: the processor may have refunded. The refund stays
            `pending` with your balance reserved and is resolved by reconciliation.
            We NEVER retry on our side — retry with the SAME `idempotency_key`
            and you will get this same refund back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: pending
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reconciliation_required: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:00Z'
        '400':
          description: '`idempotency_key_required` or `invalid_amount` / `invalid_payload`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: idempotency_key is required
        '402':
          description: '`insufficient_funds` — top up the balance and retry with the same `idempotency_key`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: the account balance is not enough to fund this refund; top up and retry with the same idempotency_key
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`idempotency_conflict` — another refund with this key is in flight.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_conflict
                message: another refund with this key is in flight
        '422':
          description: >-
            `payin_not_refundable`, `refund_not_supported`, `refund_exceeds_payin`,
            `settlement_pending` (the payin is confirmed but its balance is still
            scheduled for a future `settle_at` — wait for it or ask your org admin
            to release the settlement first), or a refund the processor declined
            (the body is the refund with `status: failed` and `failure_reason`;
            the debit was reversed in full).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refund_exceeds_payin
                message: the requested amount exceeds what is left to refund on this payin
        '401':
          $ref: '#/components/responses/Unauthorized'
