  /v1/stored-cards/{storedCardID}/charges:
    post:
      tags:
      - Stored cards
      operationId: chargeStoredCard
      summary: 'Charge a stored card (merchant-initiated)'
      description: 'Charges the saved card WITHOUT the payer present (MIT under the card-brand mandate, citing the original consented 3-D Secure seed). Use `recurring: true` for fixed-interval subscription charges; false (default) for unscheduled charges. Requires `idempotency_key` — a retry with the same key returns the original payin and never charges twice. The approved charge credits the balance automatically (`payin_credited` webhook); a declined charge responds 422 with the payin marked failed.'
      parameters:
      - name: storedCardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - idempotency_key
              properties:
                amount:
                  type: string
                currency:
                  type: string
                description:
                  type: string
                recurring:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
            example:
              amount: '45.00'
              description: Monthly subscription
              recurring: true
              idempotency_key: sub-2026-07-cust1042
      responses:
        '201':
          description: 'Charge accepted: approved charges credit automatically; check the payin status.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  reference:
                    type: string
                  transaction_id:
                    type: string
                  note:
                    type: string
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: pending
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                transaction_id: '7846012604816236704806'
                note: charge approved; the balance is credited automatically (payin_credited webhook)
        '200':
          description: 'Idempotent replay — the original payin.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  idempotency_hit:
                    type: boolean
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: credited
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                idempotency_hit: true
        '422':
          description: 'Card declined by the issuer, the stored card is revoked, or the charge was rejected before capture (e.g. the stored card has an incomplete billing address on file).'
          content:
            application/json:
              schema:
                type: object
              examples:
                declined:
                  value:
                    payin_id: cb781262-a53f-4ec8-a833-013edcf907d3
                    status: failed
                    reference: cb781262-a53f-4ec8-a833-013edcf907d3
                    failure_reason: DECLINED
                revoked:
                  value:
                    error: stored_card_revoked
                    message: the stored card is revoked
                core_rejected:
                  value:
                    error: core_rejected
                    message: 'bill_to is incomplete and the stored credential has no billing address on file: send bill_to (first_name, last_name, email, address1, locality, postal_code, country) or re-register the card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
