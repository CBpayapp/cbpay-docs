  /v1/kyb/submissions/{submissionID}/report:
    get:
      tags:
      - KYC / KYB
      operationId: getKybComplianceReport
      summary: Download the signed compliance report (PDF)
      description: Signed compliance report of a KYB verification — evidence for your own auditors. Free
        (the service was billed when the verification was created).
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Signed compliance report.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              example: '%PDF-1.7 (binary report content)'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/contacts:
    get:
      tags:
      - Contacts
      operationId: listContacts
      summary: List contacts
      description: Your account's private contact book, ordered by favorites and last use. Contacts are
        created automatically by every send (transfer, payout, crypto withdrawal), by manual CRUD or by
        importing the phone's address book.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: q
        in: query
        schema:
          type: string
        description: Search by name, alias, email or phone.
      - name: has_cbpay
        in: query
        schema:
          type: boolean
        description: Only contacts linked (or not) to a CBPay account.
      - name: favorite
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Paged contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
              example:
                page: 1
                page_size: 50
                contacts:
                - contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  display_name: Carlos Soto
                  alias: Carlitos
                  phone: '+56987654321'
                  email: carlos@mail.com
                  has_cbpay: true
                  cbpay_account_id: 389d34a3-6c61-4782-b822-95ac173068dc
                  source: import
                  favorite: true
                  created_at: '2026-07-07T12:00:00Z'
                  updated_at: '2026-07-10T15:00:00Z'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Contacts
      operationId: createContact
      summary: Create a contact
      description: Adds a contact manually. The phone is normalized to E.164 (local numbers use your account's
        country) and matched against accounts of your operator to fill `has_cbpay`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              properties:
                display_name:
                  type: string
                alias:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                favorite:
                  type: boolean
            example:
              display_name: Carlos Soto
              phone: '+56987654321'
              email: carlos@mail.com
              favorite: true
      responses:
        '201':
          description: Contact created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              example:
                contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                display_name: Carlos Soto
                phone: '+56987654321'
                email: carlos@mail.com
                has_cbpay: true
                cbpay_account_id: 389d34a3-6c61-4782-b822-95ac173068dc
                source: manual
                favorite: true
                created_at: '2026-07-10T15:00:00Z'
                updated_at: '2026-07-10T15:00:00Z'
        '400':
          description: invalid_payload / invalid_phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_phone
                message: phone could not be normalized to E.164 (send +<country><number>)
        '409':
          description: A contact with that phone/email already exists (duplicate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate
                message: duplicate
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/contacts/import:
    post:
      tags:
      - Contacts
      operationId: importContacts
      summary: Import the phone address book
      description: Uploads up to 1,000 contacts per request (paginate beyond that). Phones are normalized
        to E.164; existing contacts are never duplicated; `has_cbpay` tells you which contacts already
        have an active account of your same operator (match by phone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phones:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
            example:
              contacts:
              - name: Carlos Soto
                phones:
                - +56 9 8765 4321
              - name: Ana Perez
                phones:
                - '912345678'
      responses:
        '200':
          description: Per-contact result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  matched:
                    type: integer
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      type: object
              example:
                imported: 2
                matched: 1
                total: 2
                contacts:
                - name: Carlos Soto
                  phone: '+56987654321'
                  contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  has_cbpay: true
                - name: Ana Perez
                  phone: '+56912345678'
                  contact_id: 9c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                  has_cbpay: false
        '400':
          description: invalid_payload / batch_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: batch_too_large
                message: send up to 1000 contacts per request (paginate the upload)
        '401':
          $ref: '#/components/responses/Unauthorized'
