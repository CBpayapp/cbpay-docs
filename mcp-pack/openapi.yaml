  /v1/segregated-wallets/{walletID}/signatures:
    post:
      tags:
      - Signature proofs
      operationId: signSegregatedWalletMessage
      summary: Sign a message with a segregated wallet
      description: 'Creates a signature proof: the segregated wallet (custody=cbpay)
        signs a structured CBPay Signature Proof envelope (anti-phishing) with the
        chain-native standard — EIP-191 for ETH/EVM, TIP-191 for TRON. The proof is
        persisted and publicly verifiable at `verify_url` (no auth). OTP-gated: the
        request must carry a valid `X-OTP-Token` challenge (human session; API keys
        are not allowed). The envelope lives 10 minutes; a signed proof stays
        publicly verifiable after expiry. Emits the `wallet_signature_created`
        webhook and a security email to the account owner.'
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum: [wallet_ownership, treasury_attestation]
                  description: Purpose of the proof (default `wallet_ownership`). `wallet_link` is not accepted here — use `POST /v1/wallet-links/challenges` to link an external wallet.
                statement:
                  type: string
                  description: Optional statement the wallet attests to (max 140 runes).
            example:
              purpose: wallet_ownership
              statement: I control this wallet
      responses:
        '201':
          description: Signature proof created and signed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof:
                    $ref: '#/components/schemas/SignatureProof'
              example:
                proof:
                  proof_id: c41d2a88-7f3e-4b21-9c6d-2e8f1a5b7d90
                  account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
                  wallet_id: b7e39c14-2d56-4e78-8a01-3c5d7e9f1b24
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                  purpose: wallet_ownership
                  statement: I control this wallet
                  envelope: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_ownership\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z\nStatement: \"I control this wallet\""
                  nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
                  proof_code: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
                  status: signed
                  issued_at: '2026-08-21T14:03:11Z'
                  expires_at: '2026-08-21T14:13:11Z'
                  signed_at: '2026-08-21T14:03:11Z'
                  created_at: '2026-08-21T14:03:11Z'
