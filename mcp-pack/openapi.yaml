      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_key_exported:
    post:
      summary: Segregated wallet key exported
      description: 'Security alert: the private key of a segregated wallet was exported (shared custody).
        The payload never includes the key.'
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
