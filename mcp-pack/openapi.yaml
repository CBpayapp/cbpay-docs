  /v1/transfers:
    post:
      tags:
      - Transfers
      operationId: createTransfer
      summary: Create an internal transfer
      description: 'Moves balance between two CBPay accounts, atomically and always free of charge — any
        combination works: person to person, person to company, company to person or company to company.
        Works with the four virtual balances (`USDT` default, `USDC`, `BTC`, `GOLD`) and always between
        balances of the **same currency** (no conversion). The destination is resolved by `to_account_id`,
        `to_email`, `to_phone` (OTP-verified phones only) or `to_contact_id`. Every transfer saves the
        recipient as a contact automatically (opt out with `save_contact: false`). The recipient''s webhook
        subscribers receive `transfer_received`.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                to_account_id:
                  type: string
                  format: uuid
                to_email:
                  type: string
                  format: email
                to_phone:
                  type: string
                  description: E.164 phone of the destination account. Only accounts with an OTP-verified
                    phone resolve (404 recipient_not_found otherwise; 422 recipient_ambiguous if more
                    than one account shares the number).
                to_contact_id:
                  type: string
                  format: uuid
                  description: Send straight to a contact from your book (uses its linked CBPay account,
                    or its verified phone).
                to_qr_token:
                  type: string
                  description: Profile QR token of the destination account (scanned from its CBPay QR).
                    Also accepts the extended checkout QR payload
                    (`cbpay:pay?to=…&checkout=…`) — the embedded checkout token is honored
                    automatically.
                checkout_token:
                  type: string
                  description: Optional token of a universal checkout link to pay directly. The
                    destination is forced to the link's account and the amount must cover the due
                    quoted server-side in the chosen asset (`422 checkout_amount_mismatch` with the
                    updated due otherwise). On completion the link is settled and auto-converted to
                    its `settlement_asset`.
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Balance currency to move; the destination receives in this same currency.
                amount:
                  type: string
                  description: Positive decimal string, up to the currency's decimals (6 for USDT/USDC/GOLD,
                    8 for BTC).
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
                save_contact:
                  type: boolean
                  default: true
                  description: The destination is saved as a contact automatically; send false to skip
                    it.
            examples:
              by_phone:
                summary: By verified phone
                value:
                  to_phone: '+56987654321'
                  amount: '25.000000'
                  description: Lunch
                  idempotency_key: lunch-2026-07-10-a
              by_contact:
                summary: To a saved contact
                value:
                  to_contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  amount: '10.000000'
                  idempotency_key: t-991
              by_email:
                summary: Person → person, by email
                value:
                  to_email: carlos@example.com
                  amount: '25.000000'
                  description: Expense split
                  idempotency_key: split-2026-07-06-a
              by_account_id:
                summary: Person → company, by account_id
                value:
                  to_account_id: ae8cf540-22a9-414d-82cc-8ac04732be4f
                  amount: '120.500000'
                  description: Monthly service payment
                  idempotency_key: serv-2026-07-a
              payroll:
                summary: Company → person (payroll)
                value:
                  to_email: employee@example.com
                  amount: '850.000000'
                  description: July salary
                  idempotency_key: payroll-2026-07-emp01
              gold:
                summary: In another currency (GOLD, grams of gold)
                value:
                  to_email: carlos@example.com
                  asset: GOLD
                  amount: '2.500000'
                  description: Gold gift
                  idempotency_key: gold-2026-07-09-a
      responses:
        '201':
          description: Transfer completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: Expense split
                status: completed
                created_at: '2026-07-07T12:00:00Z'
        '200':
          description: Idempotency replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
