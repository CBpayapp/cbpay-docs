      operationId: getAccountStatement
      summary: Account statement (JSON, PDF or Excel)
      description: 'Consolidates every movement of the period — payouts, payins, crypto deposits and withdrawals,
        internal transfers and service charges — into one auditable statement with an exact reconciliation:
        opening_balance + total_in − total_out = closing_balance, verified against the ledger (`balanced`).
        The summary and movements cover the USDT operating balance; every other virtual balance (USDC,
        BTC, GOLD) with activity reconciles independently inside `assets`. Request `format=pdf` or `format=xlsx`
        to download the CBPay-branded file (Content-Disposition: attachment).'
      parameters:
      - name: from
