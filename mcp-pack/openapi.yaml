      - Checkout
      operationId: checkoutQuote
      summary: Quote a checkout link before choosing (public)
      description: >-
        Indicative quotes for a universal checkout link BEFORE materializing — the
        catalog of countries with live fiat methods (card excluded — see `cards`), the card
        options listed separately per country+currency in `cards[]` with the quoted due amount
        (a corridor may accept several charge currencies, e.g. BOB and USD), the due amount per
        crypto option (conversion cost included when the pay asset differs from the settlement
        asset), and the CBPay direct payment dues per enabled balance. Each country lists its
        corridors in `options[]` — one row per method+currency (a country may offer the same
