            example:
              expires_in_days: 14
      responses:
        '201':
          description: Onboarding link created (200 when an open link is reused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationLink'
              example:
                link_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                kind: kyc
                url: https://verify.example.com/on/usd/individual/new?invite=abc123
