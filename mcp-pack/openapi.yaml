      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Latest link plus the current liveness state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  liveness:
                    type: object
                    properties:
                      status:
                        type: string
                      outcome:
                        type: string
                      passed:
                        type: boolean
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: completed
                liveness:
                  status: completed
                  outcome: PASS
                  passed: true
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
