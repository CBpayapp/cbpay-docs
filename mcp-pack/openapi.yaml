        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDocumentPresignRequest'
            example:
              category: identity
              filename: cedula.jpg
              content_type: image/jpeg
              file_size: 482133
      responses:
        '200':
          description: Temporary upload URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                  key:
                    type: string
                  expires_in:
                    type: integer
              example:
                upload_url: https://storage.example.com/presigned/abc
                key: public-api/2026/07/10/cedula.jpg
                expires_in: 900
        '400':
          description: invalid_category / invalid_payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_category
                message: category must be one of identity, proofOfResidence
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
