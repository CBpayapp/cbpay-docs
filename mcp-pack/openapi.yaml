      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_external_movement:
    post:
      summary: External movement on a segregated wallet
      description: The activity sync detected an on-chain movement of a segregated wallet that did not
        go through the platform (expected under client custody, e.g. after importing or exporting the
        key). The wallet's activity record stays complete either way.
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              direction: out
              tx_id: 9a3c1e5f7b2d4a6c8e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
              amount_raw: '25000000'
              custody: client
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_key_compromise_suspected:
    post:
      summary: Suspected key compromise (critical alarm)
      description: 'CRITICAL: funds left a platform-custody segregated wallet without going through the
        platform. By design this is impossible unless the private key leaked. Treat the key as compromised,
        move remaining funds to a new wallet and contact support immediately.'
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              direction: out
              tx_id: 9a3c1e5f7b2d4a6c8e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
              amount_raw: '25000000'
              custody: cbpay
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  corridor_status_changed:
    post:
      summary: Corridor availability changed
      description: >-
        A payment corridor changed availability (`operational` / `degraded` / `down`) —
        fired on outages AND recoveries. Broadcast event: it is not tied to one of your
        operations, so it carries no `account_id`. Consume it idempotently (dedupe by
        delivery id). See the service status guide.
      requestBody:
        content:
          application/json:
            example:
              flow: payout
              country: VE
              currency: VES
              method: bank_transfer
              status: down
              previous_status: operational
              since: '2026-07-24T22:10:00Z'
              reason: consecutive infrastructure failures
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  balance_adjusted:
    post:
      summary: Applied balance adjustment
      description: 'An administrative adjustment credited or debited the balance. Emitted only when the entry was actually applied: an adjustment awaiting a second approver, or the replay of an already-used idempotency key, does not emit.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              type: balance_adjusted
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:02:00Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                asset: USDT
                amount: '10.000000'
                direction: credit
                reason: manual top-up
                available: '109.700000'
                held: '0.000000'
      responses:
        '200':
          description: 'Received.'
  account_status_changed:
    post:
      summary: Account status changed
      description: 'The administrative status of the account changed (`active`, `blocked`, `closed`). Resending the same status does not emit.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
              type: account_status_changed
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:06:30Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                status: blocked
                previous_status: active
      responses:
        '200':
          description: 'Received.'
  member_security_event:
    post:
      summary: Account security event
      description: 'A security fact of the account (sign-in, password change, factor added or removed, session revoked). Same fields as `GET /v1/me/security/events`.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 3c4d5e6f-7a8b-4c9d-8e0f-2a3b4c5d6e7f
              type: member_security_event
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:09:05Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                event_type: password_changed
                member_id: 1c2d3e4f-3b7d-4bad-9bdd-2b0d7b3dcb6d
                ip: 200.1.2.3
                user_agent: Mozilla/5.0
      responses:
        '200':
          description: 'Received.'
  risk_fraud_score_ready:
    post:
      summary: Fraud and identity report ready
      description: 'A Qscore fraud and identity report finished generating for the account. The event is account-scoped, signed like every other webhook and never includes the PDF or detailed fraud signals. Respond 2xx to acknowledge the delivery.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                kind:
                  type: string
                  enum: [qscore_fraud]
                subject_id:
                  type: string
                doc_id:
                  type: string
                  description: Masked subject document.
                country:
                  type: string
                score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E]
                status:
                  type: string
                  enum: [ready]
            example:
              report_id: 9f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f
              kind: qscore_fraud
              subject_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              doc_id: '76••••••-0'
              country: CL
              score: 280
              band: B
              status: ready
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_report_ready:
    post:
      summary: Qscore credit report ready
      description: 'A Qscore credit report purchased with `POST /v1/qscore/reports`
        finished generating successfully. The payload carries the report identity,
        the resulting score/band and the public `verify_code` (shareable with the
        subject as proof of authenticity at `GET /verify/qscore/{code}`). If the
        generation fails the report shows `status: failed` and no event is emitted.
        The event is also emitted when the purchased report was already available
        for the subject (idempotent reuse).

        The same event fires for a SELF report generated by the account holder
        with `POST /v1/qscore/my-report`; in that case the payload adds
        `purpose: "self_access"` (absent for purchased reports).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                subject_id:
                  type: string
                doc_id:
                  type: string
                country:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  description: 'Present only for self reports: `self_access`.'
                  enum: [self_access]
                score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E, SC]
                verify_code:
                  type: string
            example:
              report_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              subject_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              doc_id: '12983319'
              country: CL
              subject_type: person
              score: 742
              band: B
              verify_code: Q3fa85f6457174562b3fc2c963f66afa6a1b2c3d4e5f
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_score_changed:
    post:
      summary: Qscore score changed
      description: 'A newly generated Qscore report produced a score different from
        the subject''s previous known score (e.g. on a monitoring re-pull or a new
        purchase). Emitted only when the score actually changes; the payload
        carries the old and new score/band pair so you can decide whether to act.
        Subscribe to this event to monitor a subject over time without polling.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id:
                  type: string
                report_id:
                  type: string
                old_score:
                  type: integer
                new_score:
                  type: integer
                old_band:
                  type: string
                new_band:
                  type: string
            example:
              subject_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              report_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              old_score: 742
              new_score: 688
              old_band: B
              new_band: B
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_monitoring_alert:
    post:
      summary: Qscore monitoring alert
      description: 'A subject the account monitors via `PUT /v1/qscore/subjects/{docID}/monitoring`
        changed since the last check. `triggers` lists what fired the alert:
        `score_drop_below` (the score crossed the subscription''s `monitor_since_score`
        threshold downward: previous >= threshold, new < threshold), `new_records`
        (the bureau registered new events; with `only_material: true` only materially
        negative events — open delinquency, protest, bankruptcy, lawsuit — count) or
        `records_removed` (the bureau now shows fewer events than the baseline, i.e.
        a record was closed or deleted). Active subscriptions are re-checked every
        ~5 minutes; the first pass after subscribing only seeds the baseline and never
        alerts on the history the purchased report already showed. `score` and
        `previous_score` are omitted while the subject has no classifiable score, and
        `new_records` is omitted when no new event fired.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                monitoring_id:
                  type: string
                subject_id:
                  type: string
                doc_id:
                  type: string
                country:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                triggers:
                  type: array
                  items:
                    type: string
                    enum: [score_drop_below, new_records, records_removed]
                score:
                  type: integer
                previous_score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E, SC]
                record_count:
                  type: integer
                new_records:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      record_type:
                        type: string
                      reported_at:
                        type: string
                      amount:
                        type: string
                      currency:
                        type: string
                      status:
                        type: string
                detected_at:
                  type: string
            example:
              monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
              subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
              doc_id: 12.345.678-5
              country: CL
              subject_type: person
              triggers: [score_drop_below, new_records]
              score: 487
              previous_score: 512
              band: D
              record_count: 3
              new_records:
              - source: res_chile
                record_type: debt_collection
                reported_at: '2026-08-05T00:00:00Z'
                amount: '450000'
                currency: CLP
                status: open
              detected_at: '2026-08-08T18:41:12Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_batch_completed:
    post:
      summary: Qscore batch scoring completed
      description: 'A batch scoring job created with `POST /v1/qscore/batches`
        finished processing all of its items. This is the single completion
        signal of the batch: the individual reports do **not** emit their own
        `risk_report_ready` webhook (and no per-item email is sent). `status`
        is `completed` when every item succeeded, `completed_with_errors` when
        at least one item failed terminally (its fee was refunded) and `failed`
        when the batch itself could not be processed. The counters always add
        up: `succeeded_items + failed_items = total_items`. Read the per-item
        results with `GET /v1/qscore/batches/{id}/items` or download them
        with `GET /v1/qscore/batches/{id}/results.csv`.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_id:
                  type: string
                status:
                  type: string
                  enum: [completed, completed_with_errors, failed]
                total_items:
                  type: integer
                succeeded_items:
                  type: integer
                failed_items:
                  type: integer
                country:
                  type: string
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
            example:
              batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
              status: completed_with_errors
              total_items: 4
              succeeded_items: 3
              failed_items: 1
              country: CL
              purpose: credit_evaluation
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_consent_granted:
    post:
      summary: Qscore consent granted by the holder
      description: 'A consent link created with `POST /v1/qscore/consents` was
        granted: the holder opened the public page, connected their bank through
        open finance and authorized the request (their verified document matched
        the subject document). The consent now unlocks the positive banking data
        of the subject in new Qscore reports. `previous_status` is `pending` in
        practice; it is carried so a replay is easy to reconcile.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_id:
                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [granted]
                previous_status:
                  type: string
                holder_name:
                  type: string
                openfinance_link_id:
                  type: string
                granted_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: granted
              previous_status: pending
              holder_name: Maria Jose Contreras Soto
              openfinance_link_id: lnk_9b2c4d6e8f
              granted_at: '2026-08-10T09:21:44Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  risk_consent_revoked:
    post:
      summary: Qscore consent revoked
      description: 'A consent link was revoked, either by the holder declining the
        request on the public page or by your account calling `POST
        /v1/qscore/consents/{id}/revoke`. A revoked consent no longer feeds
        positive banking data into new Qscore reports.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_id:
                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [revoked]
                previous_status:
                  type: string
                revoked_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: revoked
              previous_status: pending
              revoked_at: '2026-08-10T10:02:11Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_signature_created:
    post:
      summary: Wallet signature proof created
      description: 'A signature proof was created with a segregated wallet (`POST
        /v1/segregated-wallets/{walletID}/signatures`). The wallet signed a message
        with the chain-native standard (EIP-191 for ETH/EVM, TIP-191 for TRON) inside
        the anti-phishing CBPay Signature Proof envelope. The proof can be verified
        publicly at `verify_url` (no auth).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proof_id:
                  type: string
                account_id:
                  type: string
                wallet_id:
                  type: string
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                purpose:
                  type: string
                proof_code:
                  type: string
                  description: Public capability code of the proof (starts with `G`).
                verify_url:
                  type: string
                  description: Public verification URL (no auth required).
            example:
              proof_id: c41d2a88-7f3e-4b21-9c6d-2e8f1a5b7d90
              account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
              wallet_id: b7e39c14-2d56-4e78-8a01-3c5d7e9f1b24
              chain: eth
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
              purpose: wallet_ownership
              proof_code: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
              verify_url: https://api.qbank.cl/platform/v1/public/signature-proofs/Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_linked:
    post:
      summary: External wallet linked
      description: 'An external wallet (`custody=client`) was linked to the account
        by solving a nonce challenge (`POST /v1/wallet-links/challenges` + `POST
        /v1/wallet-links/verify`). The wallet stays under the client''s custody;
        the link only proves ownership of the address.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link_id:
                  type: string
                account_id:
                  type: string
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                proof_id:
                  type: string
                  description: Signature proof that backs the link.
            example:
              link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
              account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
