  /pay/{token}/collect:
    post:
      security: []
      tags:
      - Checkout
      operationId: checkoutCollect
      summary: Execute a pull collection with the payer's data (public)
      deprecated: true
      description: >-
        Runs the pull charge of a materialized collect option with the data the payer
        typed on the checkout page — bank,
        document, phone or account, and the OTP (generated in the payer's banking app,
        or requested via `POST /pay/{token}/collect/otp`, sending
        back its `otp_reference`). The amount is ALWAYS the one frozen at materialization —
        the payer never sends it. If the rail confirms synchronously the link is settled in
        the same call (`paid: true`); a rejection does NOT kill the link — the payer can fix
        the data or pick another method. Retrying with the same data never charges twice.
        Strictly rate limited per IP. **No pull collection corridor is currently
        available** (Venezuela `c2p` / `debito_inmediato` was retired): the quote lists
        no `collect: true` option and calls answer that the corridor is not supported.
