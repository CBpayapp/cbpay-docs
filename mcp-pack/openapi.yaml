            domestic ACH and wires). Absent on corridors that do not use it.
        swift:
          type: string
          description: >-
            SWIFT/BIC of the destination bank (US/USD corridor —
            international wires). Absent on corridors that do not use it.
        bank_address:
          type: string
          description: >-
            Registered address of the destination bank. Present when the
            corridor's bank requires it on the transfer form (US/USD).
        intermediary_bank_name:
          type: string
          description: >-
            Correspondent (intermediary) bank name — only when the corridor's
            account receives international wires through one.
        intermediary_bank_swift:
          type: string
          description: SWIFT/BIC of the correspondent bank, when present.
        holder_address:
          type: string
          description: >-
            Postal address of the account holder. US bank wire forms ask for
            it; the per-rail QR carries a "Holder address" line when set.
        notes:
          type: string
          description: >-
            Free operational note for the sending bank (e.g. which country to
            select as the final beneficiary bank's). Shown to the payer as-is;
            the per-rail QR carries a "Note" line when set.
        created_at:
          type: string
          format: date-time
        qr_payload:
          type: string
          description: |
            Multi-line plain text with the bank details (and, when the
            corridor requires it, the amount and reference). Meant to be
            read by a human, not scanned by a banking app.
        qr_png_base64:
          type: string
          description: |
            Base64 PNG rendering `qr_payload` as a QR code, with your
            organization's branding symbol centered on top.
webhooks:
  payin_credited:
    post:
      summary: Payin credited
      description: 'A fiat collection was received and credited to the account in USDT. For universal
        checkout links (`kind: checkout`) the payload also carries `settled_via` (e.g. `qr`,
        `crypto:tron:usdt`, `cbpay`), `settlement_asset` and `asset_amount`; crypto payments add
        `crypto_amount` and CBPay app payments add `transfer_id`, `asset` and `amount`. When the
        account configured a `default_payin_asset` other than USDT the payload also carries
        `settlement_asset` and `conversion_status` for the automatic post-credit conversion.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id017
                  type: string
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                fx_rate: *id017
                usdt_credited: *id017
                fee: *id017
                settlement_asset: *id017
                conversion_status: *id017
                idempotency_key: *id017
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
              settlement_asset: USDC
              conversion_status: done
              idempotency_key: order-10042
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  subscription_status_changed:
    post:
      summary: 'A subscription changed status (active, paused, past_due after dunning, or canceled).'
      requestBody:
        content:
          application/json:
            example:
              event_type: subscription_status_changed
              subscription_id: 7a1c9e2d-3b4f-5061-8273-9a4b5c6d7e8f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              status: past_due
              period: 3
              reason: dunning_exhausted
      responses:
        '200':
          description: ACK
  card_stored:
    post:
      summary: 'A payer saved a card on the hosted checkout (explicit consent on a 3-D Secure approved seed payment).'
      requestBody:
        content:
          application/json:
            example:
              event_type: card_stored
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              payer_reference: customer-1042
              brand: visa
              last4: '2701'
              country: BO
              currency: BOB
              seed_payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
      responses:
        '200':
          description: ACK
