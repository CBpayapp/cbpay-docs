  /v1/segregated-wallets/{walletID}/sends:
    post:
      tags:
      - Segregated wallets
      operationId: createSegregatedWalletSend
      summary: Send crypto from the wallet
      description: 'Sends crypto **from the wallet itself** (real source address, signed by the custodian).
        `idempotency_key` is required. Gas is on the client: if the wallet lacks native gas the send is
        rejected with `422 insufficient_gas` before any charge. May bill the `wallet_send` fee (from the
        account ledger settlement balance, never the wallet''s on-chain funds; refunded if the core rejects).
        Requires a verified account and OTP. On an ambiguous failure the send stays `pending` — retry
        with the same key, never re-sent.'
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
      - name: X-OTP-Token
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to_address
              - idempotency_key
              properties:
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - eth
                to_address:
                  type: string
                amount:
                  type: string
                  description: Decimal amount in the asset unit (use this or amount_raw).
                amount_raw:
                  type: string
                  description: Amount in minimal on-chain units.
                idempotency_key:
                  type: string
            examples:
              by_amount:
                summary: By decimal amount
                value:
                  asset: usdt
                  to_address: TXYZdestination00000000000000000000
                  amount: '25.50'
                  idempotency_key: send-2026-07-11-a
              by_raw:
                summary: By minimal units
                value:
                  asset: usdt
                  to_address: TXYZdestination00000000000000000000
                  amount_raw: '25500000'
                  idempotency_key: send-2026-07-11-b
      responses:
        '202':
          description: Send broadcast (asynchronous; final state via webhook).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWalletSend'
              example:
                send_id: 9c8b7a6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
                chain: tron
                asset: USDT
                to_address: TXYZdestination00000000000000000000
                amount_raw: '25500000'
                fee: '0.000000'
                fee_asset: USDT
                status: processing
                tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
                idempotency_key: send-2026-07-11-a
                created_at: '2026-07-11T12:05:00Z'
        '200':
          description: Idempotent replay of a previous send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWalletSend'
              example:
                send_id: 9c8b7a6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                status: processing
                idempotency_key: send-2026-07-11-a
                idempotency_hit: true
        '422':
          description: Not enough gas in the wallet, or the core rejected the send.
          content:
            application/json:
              schema: *id009
              example:
                error: insufficient_gas
                message: the wallet does not hold enough TRX to pay the network fee (minimum 5.000000
                  TRX); fund the wallet address with TRX and retry
    get:
      tags:
      - Segregated wallets
      operationId: listSegregatedWalletSends
