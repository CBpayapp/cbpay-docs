    post:
      tags:
      - KYC / KYB
      operationId: createKycSubmission
      summary: Create a KYC submission with API data
      description: 'Company accounts only: verifies one of YOUR end customers sending the data directly
        (no wizard). Countries in ISO alpha-3, dates YYYY-MM-DD, id_type passport | id_card | drivers_license.
        Documents are optional at creation (upload them via the presign flow); no liveness is required
        at creation — the submission carries liveness_pending: true, close it with a liveness link. Re-sending
        with the same external_customer_id while the submission is open updates it without charging again.
        Bills the fixed `kyc_verification` fee; `idempotency_key` required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - external_customer_id
              - idempotency_key
              properties:
                external_customer_id:
                  type: string
                  description: Your reference for the verified customer.
                idempotency_key:
                  type: string
                person:
                  type: object
                  description: Person fields (first_name, last_name, email, phone, nationality, date_of_birth,
                    tax_id, id_type, id_number, address, primary_purpose, most_recent_occupation, source_of_funds).
                metadata:
                  type: object
            example:
              external_customer_id: cust_789
              idempotency_key: kyc-sub-cust-789-1
              person:
                first_name: Ana
                last_name: Perez
                email: ana@example.com
                phone: '+56912345678'
                nationality: CHL
                date_of_birth: '1990-04-12'
                tax_id: 12.345.678-5
                id_type: id_card
                id_number: '12345678'
                address:
                  line1: Av. Siempre Viva 123
                  city: Santiago
                  state: RM
                  postal_code: '8320000'
                  country: CHL
                primary_purpose: personal_or_living_expenses
                most_recent_occupation: Engineer
                source_of_funds: salary
      responses:
        '201':
          description: Submission created (enters the compliance review queue).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSubmission'
              example:
                submission_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: kyc
                external_customer_id: cust_789
                status: pending_review
                liveness_pending: true
                verification_fee: '1.500000'
                idempotency_key: kyc-sub-cust-789-1
                created_at: '2026-07-10T12:05:00Z'
                updated_at: '2026-07-10T12:05:00Z'
        '400':
