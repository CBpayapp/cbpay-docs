      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 'End date (YYYY-MM-DD, organization timezone, inclusive). Max range: 400 days.'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - pdf
          - xlsx
