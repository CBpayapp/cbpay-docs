            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_cancelled
                message: a cancelled card cannot be updated
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/cards/{cardID}/activate:
    post:
      tags:
      - Cards
      operationId: activateCard
      summary: Activate a physical card
      description: Confirms the holder received the physical card. Only cards in `pending_activation`.
      parameters:
      - $ref: '#/components/parameters/cardID'
      responses:
        '200':
          description: Activated card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 4d3c2b1a-9e8f-7a6b-5c4d-3e2f1a0b9c8d
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: true
                cardholder_kind: account
                status: active
                limits: {}
                created_at: '2026-07-01T12:00:00Z'
                updated_at: '2026-07-08T13:00:00Z'
        '409':
          description: card_not_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_not_pending
                message: only cards pending activation can be activated
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/cards/{cardID}/cancel:
    post:
      tags:
      - Cards
      operationId: cancelCard
      summary: Cancel a card
      description: Cancels the card permanently (irreversible). Bills the `card_cancellation` fee when
        configured (0 = free); refunded if the cancellation fails upstream.
      parameters:
      - $ref: '#/components/parameters/cardID'
      responses:
        '200':
          description: Cancelled card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                status: cancelled
                limits: {}
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-09T10:00:00Z'
                cancellation_fee: '1.000000'
        '402':
          description: Balance cannot cover the cancellation fee (insufficient_funds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: account balance is not enough for this operation
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/cards/{cardID}/reveal:
    post:
      tags:
      - Cards
      operationId: revealCard
      summary: Reveal PAN and CVV
      description: Returns the card's sensitive data (PAN, CVV, expiration) as a one-time pass-through
        for display to the holder. Only the owning account can call it (never the org admin). **Never
        store or log this response** — the platform does not persist it either (PCI).
      parameters:
      - $ref: '#/components/parameters/cardID'
      responses:
        '200':
          description: Sensitive card data (display once).
          content:
            application/json:
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                pan: '5339880000001234'
                cvv: '123'
                exp_date: '202907'
                note: 'sensitive data: display once, never store'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/cards/{cardID}/transactions:
    get:
      tags:
      - Cards
      operationId: listCardTransactions
      summary: List card transactions
      description: 'Purchases and their lifecycle: `authorized` (real-time hold), `settled` (confirmed
        at clearing), `reversed` (annulled, funds returned to the same balance) and `declined` (with the
        reason: insufficient_funds, card_limit_exceeded, card_frozen...). `spend_asset` / `spend_amount`
        show which balance the purchase debited and how much in that asset; `amount_usd` / `amount_usdt`
        remain the USD reference value. When the operator configures a per-purchase fee
        (`card_purchase_virtual` / `card_purchase_physical`), `fee_asset` / `fee_amount` expose the fee
        (estimated while `authorized`, definitive once `settled`) and `fee_refunded_amount` appears once
        reversals or downward adjustments prorate a refund; without fee configuration the `fee_*` fields
        are omitted.'
      parameters:
      - $ref: '#/components/parameters/cardID'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - authorized
          - settled
          - reversed
          - declined
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Paged card transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
              example:
                page: 1
                page_size: 50
                transactions:
                - transaction_id: 5e4d3c2b-1a09-8f7e-6d5c-4b3a2c1d0e9f
                  card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                  kind: purchase
                  merchant: AMZN Mktp
                  mcc: '5999'
                  amount_usd: '16.17'
                  amount_usdt: '16.170000'
                  spend_asset: USDC
                  spend_amount: '16.170000'
                  fee_asset: USDC
                  fee_amount: '0.214255'
                  status: settled
                  auth_number: '040031'
                  created_at: '2026-07-08T15:00:00Z'
                  updated_at: '2026-07-09T02:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/otp/settings:
    get:
      tags:
      - Security (OTP)
      operationId: getOTPSettings
      summary: My OTP policy
      description: Effective OTP policy for the calling account — whether the feature is enabled, which
        actions require a code and over which channel, plus the (masked) phone and its verification state.
      responses:
        '200':
          description: Effective policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  phone:
                    type: string
                    description: Masked phone ("" when unset).
                  phone_verified:
                    type: boolean
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        required:
                          type: boolean
                        channel:
                          type: string
                          enum:
                          - sms
                          - whatsapp
              example:
                enabled: true
                phone: '********5678'
                phone_verified: true
                actions:
                - action: login
                  required: true
                  channel: sms
                - action: payout
                  required: true
                  channel: whatsapp
                - action: crypto_withdrawal
                  required: true
                  channel: sms
                - action: transfer
                  required: false
                  channel: sms
                - action: banking_operation
                  required: false
                  channel: sms
                - action: card_reveal
                  required: true
                  channel: sms
                - action: api_key_create
                  required: true
                  channel: sms
                - action: member_add
                  required: false
                  channel: sms
                - action: phone_change
                  required: true
                  channel: sms
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/otp/challenges:
    post:
      tags:
      - Security (OTP)
      operationId: createOTPChallenge
      summary: Request an OTP code
      description: Sends a one-time code to the account's phone over the channel configured for the action.
        Requires a user session (JWT) — API keys receive `403 session_required`. Hourly send limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - login
                  - payout
                  - crypto_withdrawal
                  - transfer
                  - banking_operation
                  - card_reveal
                  - api_key_create
                  - member_add
                  - phone_change
            example:
              action: payout
      responses:
        '201':
          description: Challenge created; the code is on its way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: &id015
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                action: payout
                channel: whatsapp
                phone: '********5678'
                status: pending
                created_at: '2026-07-08T21:00:00Z'
                expires_at: '2026-07-08T21:10:00Z'
        '403':
          description: API key credential (`session_required`) or recently linked, unverified phone with no alternative
            factor (`phone_binding_cooldown`). With the phone in cooldown, the challenge automatically falls back to
            the authenticator app (if enrolled) or the verified login email; the effective channel comes back in the
            challenge response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: session_required
                message: OTP verification requires a user session (JWT), not an API key
        '409':
          description: The account has no phone number (`phone_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: phone_required
                message: the account has no phone number; set it with PATCH /v1/me before requesting OTP
                  codes
        '429':
          description: Send quota reached (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: too_many_attempts
                message: too many verification attempts; wait before retrying
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Security (OTP)
      operationId: listOTPChallenges
      summary: List my OTP challenges
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD, organization timezone, inclusive).
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD, organization timezone, inclusive).
      responses:
        '200':
          description: Challenge history (audit).
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                challenges:
                - challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                  account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  action: payout
                  channel: whatsapp
                  phone: '********5678'
                  status: consumed
                  created_at: '2026-07-08T21:00:00Z'
                  expires_at: '2026-07-08T21:10:00Z'
                  verified_at: '2026-07-08T21:01:12Z'
                  consumed_at: '2026-07-08T21:01:40Z'
        '400':
          $ref: '#/components/responses/InvalidRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/otp/challenges/{challengeID}:
    get:
      tags:
      - Security (OTP)
      operationId: getOTPChallenge
      summary: Get an OTP challenge
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: *id015
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - Security (OTP)
      operationId: verifyOTPChallenge
      summary: Verify the code
      description: Validates the code received over SMS/WhatsApp and returns the single-use `otp_token`
        that authorizes the protected action (send it in the `X-OTP-Token` header). 5 attempts per challenge.
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: Code approved; single-use token issued.
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: The code is incorrect (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: The challenge expired or was already used (`challenge_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services:
    get:
      tags:
      - Account
      operationId: getServices
      summary: Enabled services
      description: Effective map of which products this account can use right now (payouts, payins, transfers,
        crypto, banking, kyc, cards). When a service is disabled, its action endpoints answer 403 service_disabled;
        reads and money already in flight are never affected. Use it to decide what to show in your UI.
      responses:
        '200':
          description: Effective services map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  services:
                    type: object
                    additionalProperties:
                      type: boolean
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                services:
                  payouts: true
                  payins: true
                  transfers: true
                  crypto: true
                  banking: true
                  kyc: true
                  cards: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/settlement:
    get:
      tags:
      - Account
      operationId: getSettlement
      summary: Get my settlement settings
      description: Returns which virtual balance your operations (payouts and service fees) debit from
        by default, the balance your payins settle into by default (`default_payin_asset`), which assets
        your organization allows, and the per-operation limit (USDT equivalent) applied to volatile
        assets (BTC/GOLD).
      responses:
        '200':
          description: Current settlement settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: USDT
                default_payin_asset: USDT
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    put:
      tags:
      - Account
      operationId: updateSettlement
      summary: Set my default balances (payouts and payins)
      description: Changes your default balances. `default_settlement_asset` is the balance your payouts
        and service fees debit from when a request does not send an explicit `settlement_asset`.
        `default_payin_asset` is the balance your payins settle into — credits still enter in USDT and
        the net amount is auto-converted through the swap engine at the real price, with no extra
        swap spread (the payin already paid its fee and rate; checkout and POS payins keep their
        per-link asset). Any of USDT, USDC, BTC or GOLD (if enabled for your
        organization). Send one or both fields. The change applies to new operations only; nothing in
        flight is re-quoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Balance payouts and service fees debit from by default. Optional.
                default_payin_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Balance payins settle into by default. Credits enter in USDT and the
                    net amount is auto-converted via the swap engine at the real price (no extra
                    swap spread). Optional.
            example:
              default_settlement_asset: BTC
              default_payin_asset: USDC
      responses:
        '200':
          description: Updated settlement settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: BTC
                default_payin_asset: USDC
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '400':
          description: Invalid or disabled asset (`invalid_settlement_asset`, `settlement_asset_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_asset_disabled
                message: settlement asset is disabled for this organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
