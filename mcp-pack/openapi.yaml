  /v1/qscore/consents/{id}:
    get:
      tags: [Qscore]
      summary: Get a consent link
      operationId: getRiskConsent
      description: 'Returns the consent detail. Ownership is strict: a consent id
        from another account returns 404. A `pending` consent whose TTL already
        elapsed is lazily marked `expired` on read.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Consent detail.
          content:
            application/json:
              example:
                consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                channel: link
                status: granted
                purpose: credit_evaluation
                consent_url: https://business.cbpayapp.com/consent/cns_4f9a2b7c1d8e4a0f9b3c6d5e8a7f1c2d
                email: maria@example.com
                holder_name: Maria Jose Contreras Soto
                created_at: '2026-08-09T15:00:00Z'
                updated_at: '2026-08-10T09:21:44Z'
                expires_at: '2026-08-16T15:00:00Z'
                granted_at: '2026-08-10T09:21:44Z'
        '401':
          description: unauthorized
        '403':
          description: forbidden (risk service disabled or unverified account)
        '404':
          description: not_found
  /v1/qscore/consents/{id}/revoke:
    post:
      tags: [Qscore]
      summary: Revoke a consent link
      operationId: revokeRiskConsent
      description: 'Revokes the consent (status `revoked`) and emits the
        `risk_consent_revoked` webhook. A consent the holder already decided
        (`granted`, or already `revoked`/`expired`) cannot transition again and
        returns `409 already_decided`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Consent revoked.
          content:
            application/json:
              example:
                consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                channel: link
                status: revoked
                purpose: credit_evaluation
                consent_url: https://business.cbpayapp.com/consent/cns_4f9a2b7c1d8e4a0f9b3c6d5e8a7f1c2d
                email: maria@example.com
                created_at: '2026-08-09T15:00:00Z'
                updated_at: '2026-08-10T10:02:11Z'
                expires_at: '2026-08-16T15:00:00Z'
                revoked_at: '2026-08-10T10:02:11Z'
        '401':
          description: unauthorized
        '403':
          description: forbidden (risk service disabled or unverified account)
        '404':
          description: not_found
        '409':
          description: already_decided
  /consent/{token}:
    get:
      security: []
      tags:
      - Consent
      operationId: getPublicConsent
      summary: Read a consent request (public, holder)
      description: 'Public view of the consent request behind a `consent_url`. The
        URL token IS the capability (128 random bits, unique per consent): no login
        is required, and an unknown token answers a generic 404 (anti-enumeration).
        The response is minimal on purpose: `doc_id` is masked to its last 4
        characters, and the email, holder identity and internal ids are never
        exposed. Rate limited per IP.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Opaque consent token embedded in the `consent_url`.
      responses:
        '200':
          description: Consent request summary for the holder.
          content:
            application/json:
              example:
                status: pending
                purpose: credit_evaluation
                country: CL
                subject_type: person
                doc_id: '********678-5'
                org:
                  name: ACME SpA
                  website: https://acme.example.com
                  logo_url: https://cdn.example.com/acme/logo.png
                expires_at: '2026-08-16T15:00:00Z'
        '404':
          description: Unknown token.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '429':
          description: Too many requests from this IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
  /consent/{token}/begin:
    post:
      security: []
      tags:
      - Consent
      operationId: beginPublicConsent
      summary: Start the bank connection (public, holder)
      description: 'Opens the bank-connection session for the holder: returns the
        `widget_token` and `public_key` the open-finance widget needs to render the
        institution picker. Only a `pending` consent can begin; any other status
        returns `409 already_decided`. Rate limited per IP.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bank-connection session ready.
          content:
            application/json:
              example:
                widget_token: wtoken_2c7f9a1b4e5d40aa
                public_key: pk_prod_9a8f7e6d5c
                expires_at: '2026-08-09T15:30:00Z'
        '404':
          description: Unknown token.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '409':
          description: The consent was already decided.
          content:
            application/json:
              example:
                error: already_decided
                message: this consent link is no longer pending
        '429':
          description: Too many requests from this IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
  /consent/{token}/complete:
    post:
      security: []
      tags:
      - Consent
      operationId: completePublicConsent
      summary: Grant the consent after connecting the bank (public, holder)
      description: 'Completes the flow after the holder connected their bank in the
        widget: the platform exchanges the `exchange_token`, requires the banking
        link to be `active` (`409 link_inactive`) and requires the holder document
        verified by the bank to match the subject document exactly (`409
        holder_mismatch` — an account owned by a different document can never grant
        the consent). On success the consent becomes `granted`, the legal evidence
        (IP and user agent) is sealed, the positive-data derivation is triggered
        and the `risk_consent_granted` webhook is emitted.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              exchange_token: etok_7f3a9c1e2b4d46aa
      responses:
        '200':
          description: Consent granted.
          content:
            application/json:
              example:
                status: granted
                granted_at: '2026-08-10T09:21:44Z'
                holder_name: Maria Jose Contreras Soto
        '404':
          description: Unknown token.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '409':
          description: 'already_decided | link_inactive | holder_mismatch'
          content:
            application/json:
              example:
                error: holder_mismatch
                message: the connected account belongs to a different document
        '429':
          description: Too many requests from this IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
        '502':
          description: The banking aggregator could not complete the exchange.
          content:
            application/json:
              example:
                error: provider_error
                message: the banking connection could not be completed
  /consent/{token}/decline:
    post:
      security: []
      tags:
      - Consent
      operationId: declinePublicConsent
      summary: Decline the consent request (public, holder)
      description: 'The holder rejects the request: the consent becomes `revoked`,
        the legal evidence is sealed and the `risk_consent_revoked` webhook is
        emitted. An already decided consent returns `409 already_decided`.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Consent declined.
          content:
            application/json:
              example:
                status: revoked
        '404':
          description: Unknown token.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '409':
          description: The consent was already decided.
          content:
            application/json:
              example:
                error: already_decided
                message: this consent link is no longer pending
        '429':
          description: Too many requests from this IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
  /v1/qscore/fraud/reports:
    post:
      tags: [Qscore]
      summary: Create and read a fraud and identity report.
      operationId: createQscoreFraudReport
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Use this header when the body field is omitted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, doc_id, purpose]
              properties:
                country: {type: string, example: CL}
                doc_id: {type: string, example: '76.123.456-0'}
                subject_type: {type: string, enum: [person, company]}
                purpose:
                  type: string
                  enum: [fraud_prevention, identity_verification, onboarding, other]
                lang: {type: string, enum: [en, es, zh], default: en}
                idempotency_key: {type: string}
            examples:
              company:
                value: {country: CL, doc_id: '76.123.456-0', subject_type: company, purpose: identity_verification, lang: en, idempotency_key: fraud-check-2026-09-06-001}
      responses:
        '200':
          description: Report ready or an idempotent replay.
          content:
            application/json:
              examples:
                ready:
                  value: {"report_id":"9f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f","kind":"qscore_fraud","subject_id":"3fa85f64-5717-4562-b3fc-2c963f66afa6","country":"CL","doc_id":"76123456-0","subject_type":"company","purpose":"identity_verification","status":"ready","model_version":"qscore-fraud-v1","lang":"en","score":280,"band":"B","reason_codes":[{"code":"NEW_SUBJECT","direction":"negative","weight":"high"}],"verify_code":"F9f1c2d3e4a5b6c7d8e9f00112233445566778899aabbccddeeff0011223344","verify_url":"https://business.cbpayapp.com/verify/qscore-fraud/F9f1c2d3e4a5b6c7d8e9f00112233445566778899aabbccddeeff0011223344","pdf_url":"/v1/qscore/fraud/reports/9f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f/pdf","created_at":"2026-09-06T15:04:12Z"}
        '400':
          description: Invalid document, purpose, subject type or missing idempotency key.
          content:
            application/json:
              examples:
                invalid:
                  value: {"error":"invalid_purpose","message":"purpose must be one of fraud_prevention, identity_verification, onboarding or other"}
        '403':
          description: The account is not verified or the risk service is disabled.
          content:
            application/json:
              examples:
                forbidden:
                  value: {"error":"service_disabled","message":"the fraud and identity service is not enabled for your account"}
        '502':
          description: Generation failed after the charge path; the fee is refunded.
          content:
            application/json:
              examples:
                failed:
                  value: {"error":"generation_failed","message":"the fraud report could not be generated"}
    get:
      tags: [Qscore]
      summary: List fraud and identity reports in the caller's read scope.
      operationId: listQscoreFraudReports
      security:
        - bearerAuth: []
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, ready, failed]}}
        - {name: page, in: query, required: false, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Paginated reports.
          content:
            application/json:
              examples:
                items:
                  value: {"items":[{"report_id":"9f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f","kind":"qscore_fraud","country":"CL","doc_id":"76123456-0","subject_type":"company","purpose":"identity_verification","status":"ready","score":280,"band":"B","created_at":"2026-09-06T15:04:12Z"}],"meta":{"page":1,"page_size":50,"total":1}}
        '400':
          description: Invalid date range.
          content:
            application/json:
              examples:
                invalid_range:
                  value: {"error":"invalid_range","message":"from and to must be valid dates"}
  /v1/qscore/fraud/reports/{id}:
