          - banking_transfer_wire
          - banking_transfer_sepa
        country:
          type: string
        currency:
          type: string
          description: >-
            Optional ISO-4217 currency dimension. Only supported by payin_card — the same account can carry a different % per processed currency (e.g. BOB vs USD). Empty applies to any currency.
        asset:
          type: string
          example: USDT
        percent:
          type: string
          example: '1.5'
        fixed_amount:
          type: string
          example: '0.30'
        settlement_hours:
          type: integer
          description: >-
            Card payins (`payin_card`) only — configurable settlement delay in hours.
            `0` (default) settles the balance as soon as the card charge confirms; a
            positive value confirms the payin as `credited` right away (webhook and
            checkout closure included) but holds the BALANCE scheduled at `settle_at`
            until the delay elapses, then settles it automatically. The delay covers
            every card-paid collection: direct card payins and checkout/POS charges
            paid by card (a checkout paid over QR/crypto/fintoc still credits
            immediately). Rejected with
            `invalid_settlement_hours` on any other service or when negative.
          example: 24
        status:
          type: string
          example: active
        updated_at:
          type: string
          format: date-time
    SettlementSettings:
      type: object
      properties:
        default_settlement_asset:
          type: string
          enum:
          - USDT
          - USDC
