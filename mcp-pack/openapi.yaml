                asset_amount: '50'
                countries:
                - country: BO
                  currency: BOB
                  methods:
                  - qr
                  options:
                  - method: qr
                    currency: BOB
                  - method: qr
                    currency: USD
                - country: CL
                  currency: CLP
                  methods:
