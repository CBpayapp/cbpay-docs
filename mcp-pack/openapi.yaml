          description: invalid_range
        '401':
          description: unauthorized
        '403':
          description: forbidden (service disabled or unverified account)
    post:
      tags: [Qscore]
      summary: Create a batch scoring job
      operationId: createQscoreBatch
      description: 'Creates an asynchronous batch scoring job (portfolio scoring):
        the subjects are validated upfront, the batch is queued, and a background
        worker issues one full Qscore report per valid item. Send `subjects` (JSON
        array, 1 to 5000 entries) **or** `subjects_csv` (a CSV string with header
        `doc_id[,subject_type]`) — exactly one of the two. Rows with an invalid
        document id (`invalid_doc_id`) or a document duplicated inside the batch
        (`duplicate_in_batch`, reported with its normalized form) are rejected at
        creation and reported in `rejected_items`; the batch only processes the
        valid ones. An omitted or unrecognized `subject_type` is never an error:
        for `CL` it is inferred from the RUT series (first digit 5–9 → `company`,
        anything else → `person`). If every row
        is rejected, the request fails with `no_valid_items` and nothing is
        created. Idempotency is mandatory: retrying with the same
        `idempotency_key` returns the original batch with `idempotency_hit: true`
        and never duplicates the batch or the charges. Each item is billed the
        standalone report fee (`risk_report_person` / `risk_report_company`) when
        processed, and a terminally failed item is automatically refunded.
        `estimated_fee_usdt` is the upfront estimate for the valid items. When
        the batch finishes you receive one `risk_batch_completed` webhook and one
        email — the individual reports do not emit their own webhook or email.'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              json_subjects:
                summary: JSON subjects (two rows rejected upfront)
                value:
                  country: CL
                  purpose: credit_evaluation
                  lang: es
                  subjects:
                  - doc_id: 12.345.678-5
                  - doc_id: 15.678.234-3
                  - doc_id: 11.222.333-9
                  - doc_id: 76.543.210-3
                    subject_type: company
                  - doc_id: 12.345.678-9
                  - doc_id: 12345678-5
                  idempotency_key: portfolio-2026-08-09-a
              csv_subjects:
                summary: CSV payload
                value:
                  country: CL
                  purpose: supplier_onboarding
                  subjects_csv: "doc_id,subject_type\n12.345.678-5,person\n76.543.210-3,company\n96.543.210-8,company"
                  idempotency_key: portfolio-2026-08-09-b
      responses:
        '202':
          description: 'Batch accepted for asynchronous processing. `rejected_items`
            lists the rows rejected upfront (only present when at least one row
            was rejected).'
          content:
            application/json:
              example:
                batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                status: pending
                purpose: credit_evaluation
                country: CL
                lang: es
                total_items: 4
                processed_items: 0
                succeeded_items: 0
                failed_items: 0
                estimated_fee_usdt: '14.50'
                created_at: '2026-08-09T14:32:10Z'
                rejected_count: 2
                rejected_items:
                - line: 5
                  doc_id: 12.345.678-9
                  error_code: invalid_doc_id
                  error: doc_id is not valid for CL
                - line: 6
                  doc_id: 12345678-5
                  error_code: duplicate_in_batch
                  error: doc_id appears more than once in the batch
        '200':
          description: 'Idempotent replay — the original batch, with `idempotency_hit: true`.'
          content:
            application/json:
              example:
                batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                status: processing
                purpose: credit_evaluation
                country: CL
                lang: es
                total_items: 4
                processed_items: 2
                succeeded_items: 2
                failed_items: 0
                estimated_fee_usdt: '14.50'
                created_at: '2026-08-09T14:32:10Z'
                idempotency_hit: true
        '400':
          description: 'invalid_payload | purpose_required | invalid_purpose |
            idempotency_key_required | no_valid_items | too_many_items'
        '401':
          description: unauthorized
        '403':
          description: forbidden (service disabled or unverified account)
