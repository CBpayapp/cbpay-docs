  /v1/payins/collect:
    post:
      tags:
      - Payins
      operationId: payinCollect
      summary: Active collection (pull)
      deprecated: true
      description: 'Charges the payer directly in corridors that support pull collections.
        **No pull collection corridor is currently available** (Venezuela `c2p` /
        `debito_inmediato` was retired): calls answer that the corridor is not supported.
        Synchronous: if the charge is approved the deposit converts at your
        current `payin_rate` and is credited in the same call, net of the payin fee. If the payer declines,
        `paid` is false, the payin is marked failed and nothing is charged.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              - idempotency_key
              properties:
                country:
                  type: string
                currency:
                  type: string
                method:
                  type: string
                  description: Collection method of the pull corridor (none currently
                    available).
                amount:
                  type: string
                  description: Local amount as a positive decimal string.
                description:
                  type: string
                our_reference:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
                payer_name:
                  type: string
                payer_account_type:
                  type: string
                otp:
                  type: string
                otp_reference:
                  type: string
                idempotency_key:
                  type: string
                  description: Required — a collect executes a real charge; retries with the same key
                    never re-charge.
            example:
              method: c2p
              amount: '1200.00'
              description: Order 5512
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              otp: '12345678'
              idempotency_key: collect-2026-07-07-a
      responses:
        '200':
          description: 'Collection result. `paid: true` means the deposit was credited.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  kind:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  method:
                    type: string
                  local_amount:
                    type: string
                  status:
                    type: string
                  fx_rate:
                    type: string
                  usdt_gross:
                    type: string
                  fee:
                    type: string
                  usdt_credited:
                    type: string
                  paid:
                    type: boolean
                  provider_reference:
                    type: string
                  status_code:
                    type: string
                  status_message:
                    type: string
                  failure:
                    type: object
                    description: 'Present only when the payin is `failed` on active collections: where the rejection originated (`provider` = the payer''s bank, `core` = pre-charge validation) plus the concrete code and message.'
                    properties:
                      source:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
              example:
                payin_id: 7b3c9e2f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: collect
                country: VE
                currency: VES
                method: c2p
                local_amount: '1200.00'
                status: credited
                reference: REF-102030
                fx_rate: '36.50'
                usdt_gross: '32.876712'
                fee: '0.300000'
                usdt_credited: '32.576712'
                paid: true
                provider_reference: PRV-889911
                status_code: '00'
                status_message: approved
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:02Z'
        '400':
          description: invalid_request / invalid_amount
          content:
            application/json:
              schema: &id012
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: method is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account not active (account_blocked).
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: Core unavailable (core_unavailable).
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not execute the collection
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
  /v1/payins/collect/otp:
    post:
      tags:
      - Payins
      operationId: payinCollectOtp
      summary: Request a collection OTP
      deprecated: true
      description: Requests the one-time password some pull methods need before the charge.
        Free of charge. **No pull collection corridor is currently available**
