  /v1/cards:
    post:
      tags:
      - Cards
      operationId: createCard
      summary: Create a card
      description: 'Issues a card (virtual or physical) that spends Just-In-Time from the account''s central
        balance in the card''s spending asset (`spending_asset`: USDT/USDC 1:1 with the USD, or BTC/GOLD
        converted at the price of the moment of each event; USDT by default) — no prefunding: every purchase
        is authorized in real time against the available balance and the card''s own limits. Person accounts
        can hold **1 virtual + 1 physical** card; company accounts can create **unlimited** cards, for
        the company itself or for designated persons (e.g. employees, passing their identity documents).
        Issuance bills the `card_creation_virtual` / `card_creation_physical` fee when configured (0 =
        free); the charge is refunded automatically if issuance fails. Physical cards are born `pending_activation`
        until the holder confirms reception.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                physical:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
                  description: Required (also accepted as the Idempotency-Key header). A retry with the
                    same key returns the original card and never double-charges the issuance fee.
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Balance the card spends from. USDT/USDC are at par with the USD (exact
                    1:1, no conversion fee). BTC/GOLD convert at the effective price of the moment of
                    each event, with a reserve cushion at authorization (fail-closed pricing, per-operation
                    and 24h volatile limits shared with payouts).
                limits:
                  type: object
                  description: Optional spending limits in USD (enforced at authorization time; 0 or omitted
                    = no limit).
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
                cardholder:
                  type: object
                  description: 'Cardholder data. On the account''s FIRST issuance the holder is created
                    at the issuer: identity data and documents AUTO-FILL from the account''s approved
                    identity verification (explicit fields win); you only add the issuer-specific fields
                    (occupation catalog code, salary_usd). Omit it on subsequent cards: the verified holder
                    is reused. Company accounts can also set kind "person" plus the verification_id of
                    THAT person''s APPROVED KYC to issue for a designated person (their identity and documents
                    come from the verification).'
                  properties:
                    verification_id:
                      type: string
                      format: uuid
                      description: 'REQUIRED for designated persons (kind "person" on company accounts):
                        submission_id of the person''s APPROVED third-party KYC verification.'
            examples:
              person_first_card:
                summary: Person — FIRST card (identity auto-fills from the verification)
                value:
                  physical: false
                  idempotency_key: card-v-1
                  cardholder:
                    occupation: '52201'
                    salary_usd: 1800
              subsequent_card:
                summary: Subsequent card — holder already verified (no data needed)
                value:
                  physical: true
                  idempotency_key: card-f-ops-1
                  spending_asset: USDC
                  limits:
                    per_transaction: '500.00'
                    monthly: '5000.00'
              company_for_employee:
                summary: Company — card for a designated person (approved KYC required)
                value:
                  physical: false
                  idempotency_key: card-emp-77
                  limits:
                    monthly: '1500.00'
                  cardholder:
                    kind: person
                    verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                    occupation: '52201'
                    salary_usd: 1800
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                cardholder_name: Client X SpA
                status: active
                spending_asset: USDT
                limits:
                  monthly: '5000.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T12:00:00Z'
                creation_fee: '3.000000'
        '202':
          description: Application held for review (the organization has application review enabled). The resource is
            created only when compliance approves the review; the issuance/profile fee is charged when the application
            is held and refunded automatically if it is rejected. Track the outcome with the
            `txn_review_status_changed` webhook or `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: card_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '400':
          description: idempotency_key_required / invalid_amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          description: Balance cannot cover the issuance fee (insufficient_funds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: account balance is not enough for this operation
        '409':
          description: card_limit_reached (person accounts) / cardholder_kyc_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_limit_reached
                message: person accounts can hold at most 1 virtual card (cancel the existing one first)
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch
            (designated persons need an approved third-party KYC verification_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: verification_required
                message: 'an approved identity verification of the third party is required: pass verification_id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
