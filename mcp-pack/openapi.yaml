  payin_expired:
    post:
      summary: Payin expired
      description: 'An active collection (QR or hosted checkout) reached a final state without receiving
        the payment: the payin moves from `pending` to `expired` (or `failed`). No funds move; create
        a new payin to retry the charge.


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id:
                  type: string
                account_id:
                  type: string
                status:
                  type: string
                  enum:
                  - expired
                  - failed
                country:
                  type: string
                currency:
                  type: string
                local_amount:
                  type: string
                reference:
                  type: string
                idempotency_key:
                  type: string
            example:
              payin_id: 567d0d1a-49bc-437e-92e3-77e921112e49
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              status: expired
              country: BO
              currency: BOB
              local_amount: '60.99'
              reference: CBK7Q2M4XZ9P
              idempotency_key: order-10042
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payin_refunded:
    post:
      summary: Payin refunded
      description: 'A refund of a card payin reached a final state, or the issuer imposed a chargeback.
        `status: completed` means the money went back to the cardholder and the debit is settled on
        your balance; `status: failed` means the processor declined it and the debit was reversed in
        full. A `kind: chargeback` is booked automatically and can leave `balance_after` negative
        (a debt netted against future credits).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinRefund'
            example:
              event_type: payin_refunded
              refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
              payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              kind: refund
              status: completed
              currency: USD
              local_amount: '150.00'
              usdt_debited: '150.000000'
              balance_after: '850.000000'
              requested_by: account
              idempotency_key: refund-order-8842
              receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
              created_at: '2026-07-25T13:10:00Z'
              updated_at: '2026-07-25T13:10:03Z'
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payin_settlement_scheduled:
    post:
      summary: Payin settlement scheduled
      description: 'A card-paid payin — a direct card payin or a checkout/POS charge
        paid by card — was paid and its balance was scheduled for a future `settle_at`
        because your organization configured a settlement delay (`settlement_hours`) on the
        `payin_card` service. Emitted exactly once when the payment is confirmed (idempotent —
        a retry of the same confirmation does not re-emit it). `status` is `credited` from the
        start: the payin is confirmed and `payin_credited` fires right away — what waits until
        `settle_at` is only the BALANCE. `usdt_net` is the amount that lands when due (gross −
        fee); amount fields may come back empty (`""`) on historical rows without gross/fee.
        When `settle_at` is reached, the settlement worker releases the balance (the payin then
        carries `settled_at` instead of `settlement_pending`).


        Every delivery includes `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx; up
        to 5 attempts with incremental backoff.'
      requestBody:
        content:
          application/json:
            example:
              event_type: payin_settlement_scheduled
              payin_id: 8b3e1c2d-4f5a-6b7c-8d9e-0f1a2b3c4d5e
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: US
              currency: USD
              local_amount: '498.75'
              fx_rate: '1.010202'
              usdt_gross: '493.811881'
              fee: '27.159654'
              usdt_net: '466.652227'
              status: credited
              settle_at: '2026-08-12T14:08:33Z'
              idempotency_key: order-10042
              receipt_url: https://api.qbank.cl/platform/v1/payins/8b3e1c2d-4f5a-6b7c-8d9e-0f1a2b3c4d5e/receipt
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  payout_status_changed:
