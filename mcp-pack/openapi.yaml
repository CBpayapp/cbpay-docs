        and `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Respond 2xx.'
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
              amount_raw: '125000000'
              from_address: TDonor00000000000000000000000000000
      responses:
        '200':
          description: Return any 2xx to acknowledge the delivery.
  wallet_send_status_changed:
    post:
      summary: Segregated wallet send status changed
      description: A send from a segregated wallet reached a new state (processing, completed or failed).
      requestBody:
        content:
          application/json:
            example:
              send_id: 9c8b7a6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
