  /v1/qscore/my-seal:
    post:
      tags:
      - Qscore
      operationId: activateMyQscoreSeal
      summary: Activate my verifiable public Qscore seal
      description: 'Activates the public Qscore seal for the authenticated company
        account. Eligibility (checked live): band A or B with an evaluation no older
        than 90 days — `seal_not_eligible` otherwise; the product is company-only
        (`seal_companies_only` for person accounts). Requires no request body and is
        idempotent by design: activating when the seal is already active answers 200
        with the current seal and `idempotency_hit: true` — no duplicate is ever
        created. An activation notice email is sent to the account holder (org branding).'
      responses:
        '201':
          description: Seal activated.
          content:
            application/json:
              example:
                seal:
                  id: becb6a82-3f52-4d7a-9c2f-8a1d4e5f6a70
                  status: active
                  verify_code: SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                  verify_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                  badge_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2/badge.svg
                  created_at: '2026-08-09T15:04:22Z'
                subject_id: c9558a4b-374f-4599-b638-c93ec5489e84
                eligibility:
                  eligible: true
                  band: A
                  score: 845
                  evaluated_at: '2026-08-07'
        '200':
          description: The seal was already active (safe replay).
          content:
            application/json:
              example:
                seal:
                  id: becb6a82-3f52-4d7a-9c2f-8a1d4e5f6a70
                  status: active
                  verify_code: SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                  verify_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                  badge_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2/badge.svg
                  created_at: '2026-08-09T15:04:22Z'
                subject_id: c9558a4b-374f-4599-b638-c93ec5489e84
                eligibility:
                  eligible: true
                  band: A
                  score: 845
                  evaluated_at: '2026-08-07'
                idempotency_hit: true
        '400':
          description: The account's tax_id is missing or invalid.
          content:
            application/json:
              examples:
                invalid_tax_id:
                  summary: Invalid tax ID
                  value:
                    error: invalid_tax_id
                    message: the tax_id on your account is not a valid document for its
                      country
        '403':
          description: The account identity is not verified.
          content:
            application/json:
              example:
                error: kyc_required
                message: identity verification (KYC/KYB) is required to activate your public seal
        '409':
          description: Business rule conflict.
          content:
            application/json:
              examples:
                seal_companies_only:
                  summary: Person account
                  value:
                    error: seal_companies_only
                    message: the public seal is only available for company accounts
                seal_not_eligible:
                  summary: Band below B or stale evaluation
                  value:
                    error: seal_not_eligible
                    message: your Qscore does not currently qualify for a public seal
                no_tax_id:
                  summary: Account has no tax_id
                  value:
                    error: no_tax_id
                    message: complete your account's tax_id to activate your public seal
                identity_mismatch:
                  summary: tax_id does not match the verified identity
                  value:
                    error: identity_mismatch
                    message: the tax_id on your account does not match your verified identity
    get:
      tags:
      - Qscore
      operationId: getMyQscoreSeal
      summary: Get my Qscore seal status
      description: 'Returns the seal of the authenticated account (`null` if there is
        none) plus its live eligibility. An active seal includes `verify_code`,
        `verify_url` and `badge_url`; a revoked seal keeps only `revoked_at` (its URLs
        stop working permanently). Person accounts always get `seal: null` with
        `eligibility.reason: "companies_only"`.'
      responses:
        '200':
          description: Current seal and live eligibility.
          content:
            application/json:
              examples:
                active:
                  summary: Company with an active seal
                  value:
                    subject_id: c9558a4b-374f-4599-b638-c93ec5489e84
                    seal:
                      id: becb6a82-3f52-4d7a-9c2f-8a1d4e5f6a70
                      status: active
                      verify_code: SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                      verify_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2
                      badge_url: https://api.qbank.cl/platform/verify/qscore/seal/SA710B276F30387B2A96BF2BBF7632D138e23224b7d36b7b064a35f958b6b230a2/badge.svg
                      created_at: '2026-08-09T15:04:22Z'
                    eligibility:
                      eligible: true
                      band: A
                      score: 845
                      evaluated_at: '2026-08-07'
                no_seal:
                  summary: Company that never activated (or after revocation)
                  value:
                    subject_id: c9558a4b-374f-4599-b638-c93ec5489e84
                    seal: null
                    eligibility:
                      eligible: false
                      reason: score_stale
                      band: B
                      score: 702
                      evaluated_at: '2026-04-29'
                person:
                  summary: Person account (companies only)
                  value:
                    subject_id: e2518c9a-5f5e-4f6d-b6f8-991dd296b6cd
                    seal: null
                    eligibility:
                      eligible: false
                      reason: companies_only
        '400':
          description: The account's tax_id is missing or invalid.
          content:
            application/json:
              example:
                error: invalid_tax_id
                message: the tax_id on your account is not a valid document for its country
        '403':
          description: The account identity is not verified.
          content:
            application/json:
              example:
                error: kyc_required
                message: identity verification (KYC/KYB) is required to use your Qscore seal
        '409':
          description: Business rule conflict.
          content:
            application/json:
              examples:
                no_tax_id:
                  summary: Account has no tax_id
                  value:
                    error: no_tax_id
                    message: complete your account's tax_id to use your Qscore seal
                identity_mismatch:
                  summary: tax_id does not match the verified identity
                  value:
                    error: identity_mismatch
                    message: the tax_id on your account does not match your verified identity
    delete:
      tags:
      - Qscore
      operationId: revokeMyQscoreSeal
      summary: Revoke my Qscore seal
      description: 'Revokes the active seal of the authenticated account. Immediate and
        PERMANENT for that seal: its public URL and badge switch to "not current"
        (the URL keeps answering — it never breaks a page that embedded it). It cannot
        be undone, but the account can activate a NEW seal (with a different code) at
        any time, as long as it is still eligible. A revocation notice email is sent
        to the account holder (org branding).'
      responses:
        '200':
          description: Seal revoked.
          content:
            application/json:
              example:
                seal:
                  id: becb6a82-3f52-4d7a-9c2f-8a1d4e5f6a70
                  status: revoked
                  revoked_at: '2026-08-09T18:41:07Z'
        '400':
          description: The account's tax_id is missing or invalid.
          content:
            application/json:
              example:
                error: invalid_tax_id
                message: the tax_id on your account is not a valid document for its country
        '403':
          description: The account identity is not verified.
          content:
            application/json:
              example:
                error: kyc_required
                message: identity verification (KYC/KYB) is required to use your Qscore seal
        '404':
          description: There is no active seal to revoke.
          content:
            application/json:
              example:
                error: no_active_seal
                message: you have no active seal
        '409':
          description: Business rule conflict.
          content:
            application/json:
              examples:
                no_tax_id:
                  summary: Account has no tax_id
                  value:
                    error: no_tax_id
                    message: complete your account's tax_id to use your Qscore seal
                identity_mismatch:
                  summary: tax_id does not match the verified identity
                  value:
                    error: identity_mismatch
                    message: the tax_id on your account does not match your verified identity
  /v1/qscore/subjects/{docID}:
    get:
      tags: [Qscore]
      summary: Look up a subject
      operationId: getQscoreSubject
      description: 'Returns the subject record for a document id (no new report is

        issued and nothing is billed). Subjects are created automatically the

        first time a report is requested for that document. The `docId` path

        parameter is the document id as issued (e.g. a Chilean RUT like

        `12.345.678-5`); it is validated and normalized per country. If the

        subject already has scores, the latest one is summarized in `last_score`

        / `last_band` / `last_score_at` (`last_score` is absent for the SC band).

        A subject that does not exist returns `404 not_found`.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        description: Document id as issued in the country (e.g. `12.345.678-5` for Chile).
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: ISO country of the document (default CL).
        example: CL
      responses:
        '200':
          description: Subject record with its latest score summary.
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                country: CL
                doc_id: 12.345.678-5
                subject_type: person
                display_name: Example Name
                last_score: 742
                last_band: B
                last_score_at: '2026-08-08T15:04:24Z'
        '400':
          description: invalid_doc_id
          content:
            application/json:
              example:
                error: invalid_doc_id
                message: doc_id is not valid for the given country
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found (subject does not exist)
          content:
            application/json:
              example:
                error: not_found
                message: subject not found
  /v1/qscore/subjects/{docID}/score:
    get:
      tags: [Qscore]
      summary: Current score of a subject
      operationId: getQscoreSubjectScore
      description: 'Returns only the latest score of a subject — the cheap lookup

        for recurring checks without issuing (or paying for) a new report.

        Returns `404 no_score` if no report has been computed yet for that

        subject. For the SC band (no data), `score` is absent.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: ISO country of the document (default CL).
        example: CL
      responses:
        '200':
          description: Latest score of the subject.
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                doc_id: 12.345.678-5
                country: CL
                score: 742
                band: B
                model_version: v1
                computed_at: '2026-08-08T15:04:24Z'
        '400':
          description: invalid_doc_id
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found (subject does not exist) | no_score
          content:
            application/json:
              example:
                error: no_score
                message: no score has been computed for this subject yet
  /v1/qscore/subjects/{docID}/disputes:
    get:
      tags: [Qscore]
      summary: List subject disputes (ARCO)
      operationId: listQscoreSubjectDisputes
      description: 'Lists the ARCO disputes opened for a subject (data subject

        rights: rectification and cancellation of credit data). Filterable by

        `status` (`open`, `under_review`, `resolved_corrected`,

        `resolved_rejected`). The dispute lifecycle is operated from the org

        admin panel or by your organization via `PATCH

        /v1/org/qscore/disputes/{id}`; each change is notified to the requester

        by email. A resolved dispute never deletes the disputed record: the

        correction is a new record that supersedes it.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: ISO country of the document (default CL).
        example: CL
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [open, under_review, resolved_corrected, resolved_rejected]
        description: Filter by dispute status.
        example: open
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        example: 50
      responses:
        '200':
          description: Disputes page.
          content:
            application/json:
              example:
                items:
                - dispute_id: 6a1c4e92-3b7d-4f51-9e82-1c7f3a5d8b64
                  subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                  report_id: 3f5c9f2d-7d21-4b8c-9a2d-2d5f6a1b8c01
                  record_source: res_chile
                  record_ref: BOL-2026-04512
                  reason: The reported default was paid in full on 2026-07-30.
                  status: open
                  created_by: 5f9d2c10-3e8b-4a1d-9c7a-1d2f3a4b5c6d
                  created_at: '2026-08-08T16:11:40Z'
                meta:
                  page: 1
                  page_size: 50
                  total: 1
        '400':
          description: invalid_doc_id
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found (subject does not exist)
    post:
      tags: [Qscore]
      summary: Open a dispute (ARCO)
      operationId: createQscoreDispute
      description: 'Opens an ARCO dispute on a specific record of a subject (e.g. a

        debt that does not belong to them or was already paid), in compliance

        with data subject rectification rights. The subject must already exist

        (it is created by the first report). `record_source` identifies the data

        source family of the disputed record and `record_ref` the record inside

        that source (both appear in the report as `source` / `ref` of each

        tradeline or adverse event). The dispute starts in `open` status and its

        lifecycle is managed by your organization.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: ISO country of the document (default CL).
        example: CL
      requestBody:
        required: true
        content:
          application/json:
            example:
              record_source: res_chile
              record_ref: BOL-2026-04512
              reason: The reported default was paid in full on 2026-07-30.
              report_id: 3f5c9f2d-7d21-4b8c-9a2d-2d5f6a1b8c01
      responses:
        '201':
          description: Dispute created in `open` status.
          content:
            application/json:
              example:
                dispute_id: 6a1c4e92-3b7d-4f51-9e82-1c7f3a5d8b64
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                report_id: 3f5c9f2d-7d21-4b8c-9a2d-2d5f6a1b8c01
                record_source: res_chile
                record_ref: BOL-2026-04512
                reason: The reported default was paid in full on 2026-07-30.
                status: open
                created_by: 5f9d2c10-3e8b-4a1d-9c7a-1d2f3a4b5c6d
                created_at: '2026-08-08T16:11:40Z'
        '400':
          description: invalid_payload | invalid_doc_id
          content:
            application/json:
              example:
                error: invalid_payload
                message: record_source and reason are required
        '401':
          description: unauthorized
        '403':
          description: forbidden (service disabled or unverified account)
        '404':
          description: not_found (subject does not exist)
  /v1/qscore/disputes/{id}:
    get:
      tags: [Qscore]
      summary: Get a dispute
      operationId: getQscoreDispute
      description: 'Returns the detail and current status of an ARCO dispute owned

