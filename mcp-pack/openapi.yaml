  /v1/banking/customer:
    post:
      tags:
      - Banking
      operationId: createBankingCustomer
      summary: Create my banking profile
      description: >-
        >-
        Opens the account's banking profile (once per account). Omitted `type`/`name`/`email`
        autofill from the CBPay account. Billed as the fixed `banking_customer` fee from your settlement
        asset (USDT by default); refunded if the corridor rejects.
        The platform derives a deterministic core idempotency claim for this account/profile. Repeating the same request returns the original customer with `idempotency_hit: true` and never creates a second profile or charges a second profile fee. A payload change for the same account returns `409 idempotency_conflict`. If the upstream outcome is ambiguous, the response is `503 banking_recovery_pending`; do not retry with a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: Banking profile created (status draft).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
                banking_fee: '5.000000'
                banking_fee_asset: USDT
        '202':
          description: Application held for review (the organization has application review enabled). The resource is
            created only when compliance approves the review; the issuance/profile fee is charged when the application
            is held and refunded automatically if it is rejected. Track the outcome with the
            `txn_review_status_changed` webhook or `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: The account already has a profile, or the deterministic creation claim conflicts with a different payload.
          content:
            application/json:
              examples:
                customer_exists:
                  summary: Banking profile already exists
                  value:
                    error: banking_customer_exists
                    message: this account already has a banking customer
                idempotency_conflict:
                  summary: Same account creation with a different payload
                  value:
                    error: idempotency_conflict
                    message: idempotency key was used with a different payload
        '503':
          description: The platform could not reconcile an ambiguous banking customer creation.
          content:
            application/json:
              example:
                error: banking_recovery_pending
                message: customer creation outcome is ambiguous; operations must reconcile the claim before retrying
        '502':
          description: Banking corridor error; any fee was refunded (banking_request_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
    get:
      tags:
      - Banking
      operationId: getBankingCustomer
      summary: Get my banking profile
      description: Returns the account's banking profile with its live verification status.
      responses:
        '200':
          description: Banking profile with normalized status (draft, submitted, under_review, approved,
            rejected).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: approved
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No banking profile yet (no_banking_customer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_banking_customer
                message: create your banking customer first (POST /v1/banking/customer)
