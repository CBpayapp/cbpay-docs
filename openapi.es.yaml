      operationId: listRiskConsents
      description: 'Lista los links de consentimiento de tu cuenta (mas recientes
        primero), paginado. Los filtros de fecha `from` y `to` (zona horaria de la organización, ambos
        inclusivos) son obligatorios; `page` parte en 1 y `page_size` por defecto
