  /v1/payouts/bank-directory/lookup:
    get:
      tags:
      - Payouts
      operationId: lookupBankDirectory
      summary: Busca un banco por routing number o SWIFT/BIC
      description: 'Autocompleta el banco beneficiario desde un directorio bancario
        público embebido — pasa exactamente uno de `routing_number` (9 dígitos, solo
        US) o `swift` (8 u 11 caracteres; un sufijo `XXX` se normaliza a la casa
        matriz). Úsalo para autodetectar el banco mientras el pagador escribe el
        routing o SWIFT/BIC en formularios de payout o contraparte: un 404 significa
        "no está en el directorio" y el formulario simplemente sigue manual. Datos
        estáticos servidos con `Cache-Control: public, max-age=86400`; se pueden
        cachear por un día.'
      parameters:
      - name: routing_number
        in: query
        description: ABA routing number, 9 dígitos con dígito verificador válido
          (solo bancos US). Mutuamente excluyente con `swift`.
        schema:
          type: string
          pattern: '^[0-9]{9}$'
        example: '021000021'
      - name: swift
        in: query
        description: Código SWIFT/BIC, 8 u 11 caracteres (un sufijo `XXX` se normaliza
          a la casa matriz). Mutuamente excluyente con `routing_number`.
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$'
        example: CHASUS33
      - name: country
        in: query
        description: Filtro opcional ISO 3166-1 alpha-2 para lookups por routing; solo
          se soporta `US` (otro valor devuelve 400 `invalid_country`).
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: Banco encontrado en el directorio. `bank_phone` y
            `directory_vintage` solo aparecen en lookups por routing;
            `bank_state`/`bank_branch` solo cuando el dataset los tiene.
          content:
            application/json:
              schema:
                type: object
              examples:
                routing:
                  summary: Por ABA routing number
                  value:
                    routing_number: '021000021'
                    bank_name: JPMORGAN CHASE
                    bank_city: TAMPA
                    bank_state: FL
                    bank_postal_code: '33610'
                    bank_country: US
                    bank_phone: 813-432-3700
                    source: directory
                    directory_vintage: fed_ach_2019
                swift:
                  summary: Por SWIFT/BIC
                  value:
                    swift: CHASUS33
                    bank_name: JPMORGAN CHASE BANK, N.A.
                    bank_city: NEW YORK, NY
                    bank_country: US
                    source: directory
        '400':
          description: Parámetros faltantes/en conflicto, formato inválido, o un
            `country` distinto de `US`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_payload:
                  summary: Parámetros faltantes o en conflicto
                  value:
                    error: invalid_payload
                    message: provide exactly one of routing_number or swift
                invalid_country:
                  summary: Lookup por routing con un país no-US
                  value:
                    error: invalid_country
                    message: routing number lookup is only available for US
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: El routing number o SWIFT/BIC no está en el directorio — el
            formulario sigue manual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bank_not_found
                message: no bank found for the given routing number
  /v1/payins:
    post:
      tags:
      - Payins
      operationId: createPayin
      summary: Crear un payin (cobro de recarga)
      description: 'Crea una recarga fiat. Con `method: "qr"` (por defecto) se genera un cobro QR activo
        a través del procesador — en Bolivia el QR interoperable local, en Brasil un QR PIX dinámico cuyo
        `charge` trae la imagen del QR y el payload "copia e cola".         Con `method: "bank_transfer"`
        el depósito queda anunciado y la respuesta trae la referencia que el remitente debe incluir para
        que la transferencia entrante se concilie y acredite automáticamente — un código corto de 12 caracteres
        alfanuméricos que cabe en cualquier concepto bancario (algunos rieles lo limitan a 20 caracteres
        sin caracteres especiales). Con `method: "fintoc"` (Chile) la respuesta trae una `payment_url`
        hosted: el pagador la abre y transfiere desde cualquier banco o billetera chilena; el depósito
        se detecta, valida y acredita automáticamente. Con `method: "card"` la respuesta trae
        una `payment_url` hosted de un checkout de tarjeta con 3-D Secure y la marca de tu organización —
        Bolivia (BOB) y tarjetas internacionales en USD (`country: "US"`; Visa, Mastercard,
        American Express, Discover y Diners emitidas en cualquier país); los datos de la tarjeta
        jamás tocan tu integración. Con `method: "checkout"` la respuesta trae
        una `checkout_url` pública — un link de cobro universal denominado en el saldo virtual que
        elijas (`settlement_asset`: USDT, USDC, BTC o GOLD). El pagador elige cualquier país con
        corredor de payin vivo (monto local cotizado), cualquiera de las 4 opciones crypto (dirección
        de depósito exclusiva con QR escaneable) o paga al instante desde la app CBPay vía el
        QR/alias del comercio; cada pago se convierte automático al asset de settlement salvo que se
        pague en el mismo asset. El primer método que completa el pago gana. Cobrar es gratis; la
        comisión de payin aplica cuando el depósito se acredita.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                  description: País del corredor. Obligatorio para todos los métodos salvo
                    `checkout`, donde es opcional y solo preselecciona el país del pagador en la
                    página.
                currency:
                  type: string
                  example: BOB
                  description: Moneda del corredor. Obligatoria para todos los métodos salvo
                    `checkout`, que la rechaza con 400 — el cobro se denomina en
                    `settlement_asset`.
                amount:
                  type: string
                  description: String decimal positivo. Monto en moneda local para métodos de
                    corredor; para `checkout` se denomina en el `settlement_asset` ("50" USDT,
                    "0.001" BTC, "2" gramos de oro).
                description:
                  type: string
                channel:
                  type: string
                  description: Indicación opcional de canal que se pasa al core.
                expires_in:
                  type: integer
                  description: Expiración del cobro en segundos. Para `checkout` acepta de 600 a 604800
                    (10 minutos a 7 días; default 24 horas).
                method:
                  type: string
                  enum:
                  - qr
                  - bank_transfer
                  - fintoc
                  - card
                  - checkout
                  default: qr
                  description: Modo de cobro. `qr` crea un cobro QR activo a través del procesador; `bank_transfer`
                    anuncia un depósito entrante y devuelve la referencia a incluir en la descripción
                    de la transferencia; `fintoc` (solo Chile) devuelve una `payment_url` hosted donde
                    el pagador transfiere desde cualquier banco o billetera chilena y el depósito se detecta
                    automáticamente; `card` devuelve una `payment_url` hosted de un checkout de tarjeta con
                    3-D Secure (Bolivia en BOB, o tarjetas internacionales en USD cuando `country`
                    es `US`); `checkout` devuelve una `checkout_url` pública donde el pagador
                    elige el método de pago (QR, tarjeta, transferencia bancaria o crypto). Usa
                    /v1/payins/collect para cobros pull.
                idempotency_key:
                  type: string
                  description: >-
                    Clave de idempotencia opcional (métodos `bank_transfer`, `fintoc`, `card` y
                    `checkout`; también se acepta como header `Idempotency-Key`). Un retry con la
                    misma clave devuelve el payin original con HTTP 200 e `idempotency_hit: true` —
                    la misma `payment_url`/`checkout_url` en los métodos hosted, o la MISMA
                    `reference` en una transferencia anunciada — en vez de abrir un segundo cobro.
                    En las transferencias anunciadas esto define si la plata se puede acreditar: dos
                    anuncios vivos con el mismo monto y sin identidad del pagador son
                    indistinguibles, así que el depósito que llegue quedaría `unassigned`. Si omites
                    la clave igual colapsamos un retry idéntico (misma cuenta, moneda, monto y
                    documento del pagador) en el anuncio original; manda una clave distinta cuando
                    de verdad necesites dos cobros separados del mismo monto y pagador.
                customer:
                  type: object
                  description: Prefill opcional de facturación para el checkout de tarjeta (método `card`) —
                    `email`, `first_name`, `last_name`, `address`, `city`, `country` (texto plano, máx 120
                    caracteres por campo). El pagador puede completarlos o corregirlos en la página.
                success_url:
                  type: string
                  description: URL https pública opcional (métodos `card` y `checkout`) a la que se redirige
                    al pagador tras un pago aprobado.
                failure_url:
                  type: string
                  description: URL https pública opcional (métodos `card` y `checkout`) a la que se redirige
                    al pagador cuando el pago falla o expira.
                expires_at:
                  type: string
                  format: date-time
                  description: Expiración RFC3339 opcional de la sesión de pago con tarjeta (método `card`,
                    mínimo 15 minutos hacia adelante; default 24 horas).
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Solo checkout — el saldo virtual en que se denomina y liquida el
                    cobro. Todo pago se convierte automático a este asset al acreditar (pagos en el
                    mismo asset no convierten). Debe estar habilitado para tu organización
                    (`422 settlement_asset_disabled` si no).
                save_card:
                  type: boolean
                  default: false
                  description: Solo método card — ofrece al pagador el checkbox "guardar esta tarjeta"
                    en la página hosted. La credencial se guarda SOLO si el pagador lo marca
                    (consentimiento explícito) y el pago 3-D Secure se aprueba; el flujo
                    payin_received/payin_credited lleva entonces un bloque `stored_credential` y la
                    tarjeta aparece en GET /v1/stored-cards.
                payer_reference:
                  type: string
                  maxLength: 120
                  description: Solo método card — tu identificador propio del pagador (ej. tu ID de
                    cliente). Las tarjetas guardadas quedan acotadas a esta referencia para listar y
                    cobrar las tarjetas del cliente correcto. Texto plano, máx 120 caracteres.
                stored_card_id:
                  type: string
                  format: uuid
                  description: Solo método card — paga con una tarjeta guardada previamente (ver GET
                    /v1/stored-cards). La página hosted salta la captura de tarjeta y muestra la
                    guardada; el 3-D Secure corre igual. Mutuamente excluyente con `save_card`.
                    Tarjeta desconocida o revocada responde 404. Los datos de facturación guardados con la credencial se aplican automáticamente en la página hosted (resumen enmascarado con enlace para editar — el pagador no re-tipea nada).
                payer_name:
                  type: string
                  maxLength: 140
                  description: >-
                    Solo transferencia anunciada — nombre de la persona o empresa que hará la
                    transferencia, cuando NO es el titular de la cuenta. Opcional.
                payer_document:
                  type: string
                  maxLength: 40
                  description: >-
                    Solo transferencia anunciada — documento tributario o de identidad del pagador
                    (al menos 5 caracteres, uno de ellos un dígito). Opcional: si lo omites se usa
                    el documento verificado del titular, así un depósito propio se reconoce aunque
                    el pagador olvide la referencia. Envíalo cuando paga un tercero.
                payer_account:
                  type: string
                  maxLength: 40
                  description: >-
                    Solo transferencia anunciada — número de cuenta bancaria del pagador (al menos
                    5 caracteres). Opcional; es una señal extra de conciliación cuando el corredor
                    informa la cuenta de origen.
