  /v1/banking/virtual-ibans:
    post:
      tags: [Banca]
      operationId: createVirtualIBAN
      summary: Solicitar un IBAN virtual EUR
      description: Requests one durable virtual IBAN allocation for the authenticated account. `funding_usdt` is the default purpose; `banking_eur` requires the Banca product. The allocation enters manual approval and does not by itself create a provider balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: {type: string, enum: [funding_usdt, banking_eur], default: funding_usdt}
                idempotency_key: {type: string}
              additionalProperties: false
            examples:
              funding:
                value:
                  purpose: funding_usdt
                  idempotency_key: viban-funding-2026-001
      responses:
        '202':
          description: Solicitud durable en cola de aprobación manual.
          content:
            application/json:
              examples:
                pending:
                  value:
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000001
                      owner_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      manager_account_id: ''
                      purpose: funding_usdt
                      currency: EUR
                      iban: ''
                      iban_country: ''
                      status: pending_approval
                      client_order: platform:virtual-iban:org:account:funding_usdt:viban-funding-2026-001
                      order_reference: ''
                      created_at: '2026-09-10T12:00:00Z'
                      updated_at: '2026-09-10T12:00:00Z'
                    status: pending_approval
        '200':
          description: Idempotent replay of the same request.
          content:
            application/json:
              examples:
                replay:
                  value:
                    idempotency_hit: true
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000001
                      purpose: funding_usdt
                      currency: EUR
                      iban: DE890000000000000000
                      iban_country: DE
                      status: active
        '400':
          description: invalid_json, invalid_purpose or idempotency_key_required.
        '403':
          description: Account verification or product service gate failed.
        '409':
          description: virtual_iban_conflict.
        '503':
          description: banking_recovery_pending.
    get:
      tags: [Banca]
      operationId: listVirtualIBANs
      summary: Listar solicitudes de vIBAN de la cuenta
      description: Lists requests with pagination and the organization date window. `purpose` and `status` are optional filters.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: purpose, in: query, schema: {type: string, enum: [funding_usdt, banking_eur]}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Solicitudes de vIBAN paginadas.
          content:
            application/json:
              examples:
                list:
                  value:
                    page: 1
                    page_size: 50
                    virtual_ibans:
                      - id: 2f8c1d4e-1111-4b22-8a33-000000000001
                        owner_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        manager_account_id: ''
                        purpose: funding_usdt
                        currency: EUR
                        iban: DE890000000000000000
                        iban_country: DE
                        status: active
                        client_order: platform:virtual-iban:org:account:funding_usdt:viban-funding-2026-001
                        order_reference: provider-order-001
                        created_at: '2026-09-10T12:00:00Z'
                        updated_at: '2026-09-10T12:01:00Z'
        '400':
          description: invalid_range.
        '403':
          description: Account or service permission denied.
        '503':
          description: Banca is unavailable.

  /v1/banking/virtual-ibans/{virtualIBANID}:
    get:
      tags: [Banking]
      operationId: getVirtualIBAN
      summary: Get one virtual IBAN request
      parameters:
        - {name: virtualIBANID, in: path, required: true, schema: {type: string, format: uuid}}
