  /v1/payins/deposit-accounts:
    post:
      tags:
      - Payins
      operationId: createDepositAccount
      summary: Crear una cuenta de depósito dedicada
      description: Aprovisiona un destino de depósito fijo ligado a tu cuenta en los corredores que lo
        soportan (ej. una CLABE mexicana o una CVU argentina). Cada transferencia que llega a él se acredita
        automáticamente, neta de la comisión de payin. La creación es gratuita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
