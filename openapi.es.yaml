  /v1/crypto/wallets:
    post:
      tags:
      - Crypto
      operationId: createCryptoWallet
      summary: Reponer una wallet de depósito faltante
      description: 'Toda cuenta — persona y empresa — tiene exactamente **una wallet de depósito por par
        soportado** (`tron`/`usdt`, `eth`/`usdt`, `eth`/`usdc`, `btc`/`btc`), aprovisionadas automáticamente y gratis
        al registrarse. Las wallets de depósito solo **reciben** crypto que se abona al saldo virtual
        de la cuenta: no envían, y no se exportan ni importan (para eso están las wallets segregadas).
        Este endpoint existe solo para reponer un par faltante (caso excepcional): con el par ya aprovisionado
        responde `422 wallet_limit_reached` para todo tipo de cuenta.


        Una reposición manual cobra la comisión `wallet_creation` cuando CBPay la tiene configurada (fija
        por wallet; 0 = gratis, el valor por defecto); las wallets de nacimiento son siempre gratis. El
        cargo se reembolsa automáticamente si la creación falla.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - btc
                  default: usdt
                  description: Activo de la wallet (usdc solo por `eth`; en `btc` el activo por defecto
                    es `btc`).
                label:
                  type: string
                  description: Etiqueta descriptiva opcional.
            examples:
              tron_usdt:
                summary: Reponer el par TRON USDT
                value:
                  chain: tron
              usdc_wallet:
                summary: Reponer el par USDC (solo Ethereum)
                value:
                  chain: eth
                  asset: usdc
              btc_wallet:
                summary: Reponer el par Bitcoin
                value:
                  chain: btc
      responses:
        '201':
          description: Wallet creada.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
                wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                chain: tron
                asset: USDT
                address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                label: Main treasury
                type: deposit
                receive_only: true
                created_at: '2026-07-07T12:00:00Z'
                creation_fee: '1.000000'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_chain
                message: unsupported chain "doge" (tron, eth, btc)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: La cuenta ya tiene su wallet de depósito de ese par (aplica a todo tipo de cuenta).
          content:
            application/json:
              schema: *id008
              example:
                error: wallet_limit_reached
                message: accounts hold one deposit wallet per network/asset pair (created automatically
                  with the account); use segregated wallets for additional wallets
    get:
      tags:
      - Crypto
      operationId: listCryptoWallets
      summary: Listar mis wallets
      description: Devuelve todas las wallets de la cuenta que llama, la más antigua primero.
      responses:
