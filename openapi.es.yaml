    patch:
      tags:
      - Cards
      operationId: updateCard
      summary: Actualizar límites, asset de gasto o congelar/descongelar
      description: Actualiza los límites de gasto (envía "0" para quitar un límite), cambia el saldo desde
        el que gasta (`spending_asset`, solo compras futuras) y congela o descongela la tarjeta. Una tarjeta
        congelada rechaza toda autorización al instante.
      parameters:
      - $ref: '#/components/parameters/cardID'
