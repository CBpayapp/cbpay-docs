      - name: from
        in: query
        required: true
        schema:
          type: string
        description: 'Fecha de inicio YYYY-MM-DD (zona horaria de la organización, inclusiva). Una fecha inválida

          devuelve 400 invalid_range.'
        example: '2026-08-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: Fecha de término YYYY-MM-DD (zona horaria de la organización, inclusiva).
        example: '2026-08-08'
      - name: subject_id
        in: query
        required: false
        schema:
