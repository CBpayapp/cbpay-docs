  /v1/qscore/my-report:
    post:
      tags: [Qscore]
      summary: Genera tu propio informe crediticio (self)
      operationId: createQscoreSelfReport
      description: 'Genera (o reutiliza) el informe crediticio Qscore del titular de
        la cuenta autenticada — el derecho de acceso ARCO / de protección de datos
        a la propia información crediticia. A diferencia de `POST
        /v1/qscore/reports`, este endpoint es GRATUITO (no cobra comisión) y la
        identidad del sujeto se deriva de la cuenta verificada: el `tax_id`
        validado durante el KYC/KYB. El request NO acepta `doc_id` — pedir el
        informe de un tercero por este endpoint es imposible por diseño
        (anti-oráculo).

        Límite de frecuencia: un informe NUEVO cada 30 días. Si ya existe un
        informe self `ready` dentro de esa ventana, el endpoint responde `200`
        con el informe existente e `idempotency_hit: true` (reutilizado); si no,
        genera uno nuevo y responde `201`. Un doble envío el mismo día devuelve
        el informe ya creado (idempotencia determinista por cuenta + sujeto +
        día). Los informes self quedan excluidos del conteo de consultas del
        sujeto, así que revisar tu propio informe jamás penaliza tu score. El
        informe se computa de forma síncrona: la respuesta es el informe
        terminado (status `ready`) o uno fallido (status `failed` con
        `error_code`/`error_message`).'
      requestBody:
        required: false
        content:
          application/json:
            examples:
              default:
                summary: Idioma por defecto (es)
                value: {}
              lang:
                summary: Elegir el idioma del informe
                value:
                  lang: en
      responses:
        '200':
          description: 'Ya existía un informe self `ready` dentro de la ventana
            de 30 días; se devuelve con `idempotency_hit: true` (no se genera
            uno nuevo).'
          content:
            application/json:
              example:
                report_id: 7d2c1a90-4e55-4b3a-9f0c-1a2b3c4d5e6f
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                status: ready
                purpose: self_access
                lang: es
                score: 742
                band: B
                model_version: qscore-v2
                reason_codes:
                - code: CREDIT_HISTORY_DEPTH
                  direction: positive
                  weight: medium
                verify_code: Q7d2c1a904e554b3a9f0c1a2b3c4d5e6fa1b2c3d4e5f60718293a
                created_at: '2026-08-02T11:20:10Z'
                completed_at: '2026-08-02T11:20:12Z'
                idempotency_hit: true
        '201':
          description: 'Informe self creado y computado. Cuando el status es
            `ready`, el objeto `report` completo normalizado va embebido; cuando
            es `failed`, `error_code`/`error_message` explican por qué.'
          content:
            application/json:
              examples:
