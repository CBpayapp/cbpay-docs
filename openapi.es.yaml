          - completed
          - failed
        status_code:
          type: string
        status_message:
          type: string
        bank_reference:
          type: string
          description: Referencia de la transaccion en el banco/rail (ej. el id de transferencia del banco, con el que el beneficiario cruza el pago con su banco). En US ACH/wire/SWIFT es la referencia CBF que vuelve al crear; en el resto de corredores queda vacia hasta que el rail la reporta.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        idempotency_hit:
          type: boolean
          description: Presente (true) cuando la respuesta es una repetición idempotente.
    Payin:
      type: object
      properties:
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
        kind:
          type: string
          enum:
          - qr
          - collect
          - push
          - card
          - checkout
          - pos
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        local_amount:
          type: string
          description: >-
            Monto en la moneda local, como texto decimal plano (por ejemplo
            "5000000"). Nunca en notación científica.
        settlement_asset:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
          description: El saldo virtual en que se liquida el payin. Los payins de checkout y POS
            denominan el cobro en el asset de su link (sin `currency`/`local_amount` hasta que se
            usa un método de pago local; el monto del cobro es `asset_amount` en este asset). Los
            demás payins acreditados lo traen cuando la cuenta configuró un `default_payin_asset`
            distinto de USDT — el neto acreditado se auto-convierte a este asset.
        asset_amount:
          type: string
          description: Solo payins de checkout y POS — el monto del cobro denominado en
            `settlement_asset` (presente en todo estado, incluidos pendiente y vencido).
        conversion_status:
          type: string
          enum:
          - pending_retry
          - done
          description: Estado de la auto-conversión — en payins de checkout/POS cuando el pago
            llegó en un asset distinto de `settlement_asset`, y en los demás payins cuando la
            cuenta configuró un `default_payin_asset` distinto de USDT. `pending_retry` se
            reintenta automáticamente. Se omite cuando no aplica conversión.
        status:
          type: string
          enum:
          - pending
          - credited
          - unassigned
          - expired
          - failed
        reference:
          type: string
        idempotency_key:
          type: string
          description: >-
            Tu idempotency key del request de creación, devuelta tal cual.
            Ausente cuando el payin se creó sin una (o lo creó la propia
            plataforma — las keys internas jamás se exponen).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settle_at:
          type: string
          format: date-time
          description: >-
            Solo cobros pagados con tarjeta que tienen una demora de settlement
            configurada — payins directos con tarjeta y cobros checkout/POS pagados
            con tarjeta — cuándo queda disponible el SALDO de este payin (`created_at`
            más las `settlement_hours` de la comisión `payin_card`). El payin queda
            confirmado de inmediato: el estado es `credited` y el webhook
            `payin_credited` se emite al momento del pago; lo que espera al `settle_at`
            es solo el crédito del saldo (y la auto-conversión, cuando está
            configurada). Un payin cuya demora ya venció al aprobarse o asignarse se
            liquida de inmediato. Ausente cuando el saldo se liquida al confirmarse.
        settlement_pending:
          type: boolean
          description: >-
            Presente (true) mientras el saldo de un payin `credited` pagado con
            tarjeta sigue programado para su `settle_at` — cubre payins directos con
            tarjeta y cobros checkout/POS pagados con tarjeta. Mientras esté
            presente, el payin no se puede devolver (`422 settlement_pending`) — la
            plata aún no está en tu saldo. Ausente una vez que el saldo cae en el
            ledger.
        settled_at:
          type: string
          format: date-time
          description: >-
            Cuándo cayó realmente en tu ledger el saldo de este payin acreditado —
            al confirmarse para payins sin demora de settlement, o cuando corrió el
            settlement programado (o un org-admin lo liberó antes) para payins con
            tarjeta diferidos.
        fx_rate:
          type: string
          description: Tu tasa de payin al momento del abono (presente una vez que el pago fue recibido
            y convertido).
        usdt_gross:
          type: string
        fee:
          type: string
        usdt_credited:
          type: string
          description: Monto abonado al saldo. También presente SIN `fx_rate` en cobros
            checkout/POS liquidados en crypto o vía transferencia CBPay (no aplica cotización FX).
        refund_status:
          type: string
          enum:
          - partial
          - full
          description: Presente solo cuando el payin tiene devoluciones o un contracargo. Se deriva de los montos acumulados — el `status` del payin nunca se reescribe.
        refunded_amount:
          type: string
          description: USDT acumulado debitado por devoluciones y contracargos de este payin.
        refunded_local:
          type: string
          description: Monto acumulado devuelto en la moneda local original.
        failure:
          type: object
          description: 'Presente solo cuando el payin queda `failed` en cobros activos: dónde se originó el rechazo (`provider` = el banco del pagador, `core` = la validación previa al cobro) más el código y mensaje concretos.'
          properties:
            source:
              type: string
            code:
              type: string
            message:
              type: string
        payer_source:
          type: string
          enum:
          - declared
          - account_identity
          - none
          - bank_event
          description: >-
            Transferencias anunciadas y depósitos sin asignar — de dónde salió la identidad del
            pagador. `declared` la enviaste tú, `account_identity` se usó por defecto el documento
            verificado del titular, `none` no había identidad disponible (solo la referencia puede
            conciliar), `bank_event` (depósitos sin asignar) se leyó de la transferencia que llegó.
        payer:
          type: object
          description: Identidad del pagador asociada al payin, cuando se conoce.
          properties:
            name:
              type: string
            document:
              type: string
            account:
              type: string
        deposit_instructions:
          $ref: '#/components/schemas/DepositInstructions'
          description: >-
            Snapshot congelado de la cuenta bancaria de destino anunciada al pagador
            (payins `bank_transfer` anunciados en corredores con instrucciones
            configuradas — hoy CL, PY y US). El texto nunca cambia tras la creación;
            la imagen QR se regenera al leer con tu branding vigente. En el corredor
            US/USD este bloque es el riel doméstico (routing number ABA).
        deposit_instructions_swift:
          $ref: '#/components/schemas/DepositInstructions'
          description: >-
            Snapshot congelado del riel internacional SWIFT (BIC + banco
            corresponsal), presente solo en el corredor US/USD cuando tu
            organización tiene configurada la variante swift. El pagador elige
            cualquiera de los dos rieles; ambos comparten la misma `reference`.
        match_method:
          type: string
          enum:
          - charge_link
          - reference
          - payer_document
          - payer_account
          - payer_name
          - amount_single_candidate
          - dedicated_clabe
          - collect_settlement
          - manual_assign
          description: >-
            Cómo se concilió la transferencia con este payin (traza de auditoría). `charge_link`
            significa que el abono pagó el cobro creado para este payin (QR, link de checkout o
            tarjeta) y se vinculó uno a uno por ese cobro — la señal más fuerte, sin
            heurísticas. `manual_assign` significa que un admin de la org lo ruteó a mano.
        match_reason:
          type: string
          description: >-
            Por qué el depósito NO se pudo conciliar automáticamente, en payins `unassigned` —
            `no_match`, `ambiguous_amount` (dos o más anuncios comparten el monto),
            `ambiguous_payer`, `claim_lost` (otro evento tomó el anuncio primero) o
            `assigned_to:<payin_id>`.
        candidate_count:
          type: integer
          description: >-
            Cantidad de anuncios pendientes que coincidían con el monto y la moneda de un depósito
            `unassigned` (2 o más significa que el depósito era ambiguo).
    PayinRefund:
      type: object
      properties:
        refund_id:
          type: string
          format: uuid
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - refund
          - void
          - chargeback
          description: '`chargeback` lo impone el emisor de la tarjeta — se asienta automático y puede dejar el saldo negativo.'
        status:
          type: string
          enum:
          - pending
          - completed
          - failed
        currency:
          type: string
          description: Moneda del payin original.
        local_amount:
          type: string
        usdt_debited:
          type: string
          description: Monto debitado del saldo USDT. La comisión y el spread FX del payin original NO se devuelven.
        requested_by:
          type: string
          enum:
          - account
          - admin
          - issuer
        reason:
          type: string
        failure_reason:
          type: string
          description: Presente cuando `status` es `failed` — el débito se revirtió completo.
        idempotency_key:
          type: string
        idempotency_hit:
          type: boolean
        reconciliation_required:
          type: boolean
          description: Presente mientras la devolución está `pending` — el resultado lo resuelve la conciliación y jamás se re-despacha.
        balance_after:
          type: string
          description: Presente en el webhook `payin_refunded` — el saldo USDT después del movimiento (puede ser negativo en un contracargo).
        receipt_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Transfer:
      type: object
