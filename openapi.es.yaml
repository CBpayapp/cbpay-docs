    SignatureProof:
      type: object
      description: Prueba criptográfica de que una wallet firmó un mensaje estructurado
        CBPay (EIP-191 ETH/EVM, TIP-191 TRON). Verificable públicamente vía verify_url.
        El envelope es el mensaje anti-phishing exacto que firmó la wallet (líneas Domain /
        Purpose / Wallet / Nonce / Issued / Expires / Statement; la línea Account
        solo aparece para proofs `wallet_link`). Los proofs viven 10 minutos
        (`expires_at`); un proof firmado sigue siendo verificable públicamente tras expirar.
      properties:
        proof_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
          description: Presente para proofs custodiales (server-side); omitido para proofs wallet-link.
        account_id:
          type: string
          format: uuid
        chain:
          type: string
          enum:
          - eth
          - tron
        address:
          type: string
          description: Dirección on-chain que produjo la firma.
        purpose:
          type: string
          enum:
          - wallet_ownership
          - treasury_attestation
          - wallet_link
        statement:
          type: string
          description: Declaración de texto libre (máx 140 runas). Omitida cuando está vacía.
        envelope:
          type: string
          description: El mensaje estructurado exacto que firmó la wallet.
          example: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_ownership\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z\nStatement: \"I control this wallet\""
        nonce:
          type: string
          description: Nonce anti-replay de 32 caracteres hex.
        proof_code:
          type: string
          description: Código de capacidad de verificación pública (53 caracteres, empieza con G).
          example: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
        status:
          type: string
          enum:
          - issued
          - signed
          - expired
          - revoked
        signature:
          type: string
          description: Presente una vez que status es signed.
        message_hash:
          type: string
          description: Presente una vez que status es signed.
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: issued_at + 10 minutos.
        signed_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        verify_url:
          type: string
          example: https://api.qbank.cl/platform/v1/public/signature-proofs/Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
    WalletLink:
      type: object
      description: Wallet externa (custody=client) vinculada a la cuenta firmando un
        desafío nonce. El desafío expira 10 minutos después de emitirse; una vez
        vinculada, el vínculo permanece activo hasta ser revocado.
      properties:
        link_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        chain:
          type: string
          enum:
          - eth
          - tron
        address:
          type: string
        status:
          type: string
          enum:
          - pending
          - linked
          - revoked
          - expired
        expires_at:
          type: string
          format: date-time
          description: Expiración del desafío (10 minutos tras su creación).
        proof_id:
          type: string
          format: uuid
          description: Prueba de firma creada al verificar (presente una vez vinculada).
        verified_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DepositInstrument:
      type: object
      properties:
        instrument_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        instrument:
          type: string
          description: El destino de depósito a compartir con los pagadores (ej. la CLABE).
        details:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
    DepositInstructions:
      type: object
      description: |
        El texto de cuenta bancaria que tu organización publica para un
        corredor `bank_transfer`. Administrado por el equipo admin,
        append-only (una revisión nueva jamás sobrescribe el texto que un
        payin ya congeló).
      properties:
        id:
          type: string
          format: uuid
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        purpose:
          type: string
          enum:
          - payin
          - otc
        revision:
          type: integer
        active:
          type: boolean
        reference_required:
          type: boolean
        bank_name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        holder_name:
          type: string
        holder_tax_id:
          type: string
        holder_email:
          type: string
        routing_number:
          type: string
          description: >-
            Número de ruta ABA del banco destino (corredor US/USD — ACH y
            wires domésticos). Ausente en corredores que no lo usan.
        swift:
          type: string
          description: >-
            SWIFT/BIC del banco destino (corredor US/USD — wires
            internacionales). Ausente en corredores que no lo usan.
        bank_address:
          type: string
          description: >-
            Dirección registrada del banco destino. Presente cuando el banco
            del corredor la exige en el formulario de transferencia (US/USD).
        intermediary_bank_name:
          type: string
          description: >-
            Banco corresponsal (intermediario) — solo cuando la cuenta del
            corredor recibe wires internacionales a través de uno.
        intermediary_bank_swift:
          type: string
          description: SWIFT/BIC del banco corresponsal, cuando aplica.
        holder_address:
          type: string
          description: >-
            Dirección postal del titular de la cuenta. Los formularios de wire
            de los bancos de EE. UU. la exigen; el QR de cada riel incluye una
            línea "Holder address" cuando tiene valor.
        notes:
          type: string
          description: >-
            Nota operativa libre para el banco emisor (ej. qué país seleccionar
            como banco beneficiario final). Se muestra al pagador tal cual; el
            QR de cada riel incluye una línea "Note" cuando tiene valor.
        created_at:
          type: string
          format: date-time
        qr_payload:
          type: string
          description: |
            Texto plano multilínea con los datos bancarios (y, cuando el
            corredor lo exige, el monto y la referencia). Pensado para que
            lo lea una persona, no para que lo escanee una app bancaria.
        qr_png_base64:
          type: string
          description: |
            PNG en base64 que renderiza `qr_payload` como código QR, con el
            símbolo de marca de tu organización centrado.
webhooks:
  payin_credited:
    post:
      summary: Payin acreditado
      description: 'Se recibió un cobro fiat y se acreditó a la cuenta en USDT. Para links de cobro
        universal (`kind: checkout`) el payload trae además `settled_via` (ej. `qr`,
        `crypto:tron:usdt`, `cbpay`), `settlement_asset` y `asset_amount`; los pagos crypto agregan
        `crypto_amount` y los pagos desde la app CBPay agregan `transfer_id`, `asset` y `amount`. Cuando
        la cuenta configuró un `default_payin_asset` distinto de USDT, el payload trae además
        `settlement_asset` y `conversion_status` de la conversión automática post-crédito.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id: &id017
                  type: string
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                fx_rate: *id017
                usdt_credited: *id017
                fee: *id017
                settlement_asset: *id017
                conversion_status: *id017
                idempotency_key: *id017
            example:
              payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: BO
              currency: BOB
              local_amount: '700.00'
              fx_rate: '6.91'
              usdt_credited: '100.302460'
              fee: '1.000000'
              settlement_asset: USDC
              conversion_status: done
              idempotency_key: order-10042
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  subscription_status_changed:
    post:
      summary: 'Una suscripción cambió de estado (active, paused, past_due tras el dunning, o canceled).'
      requestBody:
        content:
          application/json:
            example:
              event_type: subscription_status_changed
              subscription_id: 7a1c9e2d-3b4f-5061-8273-9a4b5c6d7e8f
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              status: past_due
              period: 3
              reason: dunning_exhausted
      responses:
        '200':
          description: ACK
  card_stored:
    post:
      summary: 'Un pagador guardó una tarjeta en el checkout hosted (consentimiento explícito sobre una semilla 3-D Secure aprobada).'
      requestBody:
        content:
          application/json:
            example:
              event_type: card_stored
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              payer_reference: customer-1042
              brand: visa
              last4: '2701'
              country: BO
              currency: BOB
              seed_payin_id: 4f8a1b2c-3d4e-5f60-7a8b-9c0d1e2f3a4b
      responses:
        '200':
          description: ACK
  stored_card_revoked:
    post:
      summary: 'Una tarjeta guardada fue revocada (por ti vía DELETE /v1/stored-cards/{id}).'
      requestBody:
        content:
          application/json:
            example:
              event_type: stored_card_revoked
              stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              payer_reference: customer-1042
              brand: visa
              last4: '2701'
      responses:
        '200':
          description: ACK
  payin_expired:
    post:
      summary: Payin expirado
      description: 'Un cobro activo (QR o checkout hosteado) llegó a estado final sin recibir el pago:
        el payin pasa de `pending` a `expired` (o `failed`). No se mueve dinero; crea un payin nuevo para
        reintentar el cobro.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payin_id:
                  type: string
                account_id:
                  type: string
                status:
                  type: string
                  enum:
                  - expired
                  - failed
                country:
                  type: string
                currency:
                  type: string
                local_amount:
                  type: string
                reference:
                  type: string
                idempotency_key:
                  type: string
            example:
              payin_id: 567d0d1a-49bc-437e-92e3-77e921112e49
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              status: expired
              country: BO
              currency: BOB
              local_amount: '60.99'
              reference: CBK7Q2M4XZ9P
              idempotency_key: order-10042
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  payin_refunded:
    post:
      summary: Cobro devuelto
      description: 'Una devolución de un cobro con tarjeta alcanzó su estado final, o el emisor impuso un
        contracargo. `status: completed` significa que la plata volvió al tarjetahabiente y el débito
        quedó liquidado en tu saldo; `status: failed` significa que el procesador la rechazó y el débito
        se revirtió completo. Un `kind: chargeback` se asienta automático y puede dejar `balance_after`
        negativo (deuda que se netea contra abonos futuros).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secreto, timestamp + "." + cuerpo))`. Responde 2xx;
        hasta 5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinRefund'
            example:
              event_type: payin_refunded
              refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
              payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              kind: refund
              status: completed
              currency: USD
              local_amount: '150.00'
              usdt_debited: '150.000000'
              balance_after: '850.000000'
              requested_by: account
              idempotency_key: refund-order-8842
              receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
              created_at: '2026-07-25T13:10:00Z'
              updated_at: '2026-07-25T13:10:03Z'
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  payin_settlement_scheduled:
    post:
      summary: Acreditación de cobro programada
      description: 'Un cobro pagado con tarjeta — un payin directo con tarjeta o un
        cobro checkout/POS pagado con tarjeta — quedó pagado y su SALDO se programó para un
        `settle_at` futuro porque tu organización configuró una demora de settlement
        (`settlement_hours`) en el servicio `payin_card`. Se emite exactamente una vez al
        confirmarse el pago (idempotente — un retry de la misma confirmación no lo re-emite).
        El `status` es `credited` desde el inicio: el payin queda confirmado y `payin_credited`
        se emite al momento del pago — lo que espera al `settle_at` es solo el SALDO.
        `usdt_net` es el monto que se acreditará al vencimiento (bruto − comisión); los montos
        pueden venir vacíos (`""`) en filas históricas sin bruto/comisión. Al llegar el
        `settle_at`, el worker de settlement libera el saldo (el payin pasa a llevar
        `settled_at` en vez de `settlement_pending`).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secreto, timestamp + "." + cuerpo))`. Responde 2xx;
        hasta 5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            example:
              event_type: payin_settlement_scheduled
              payin_id: 8b3e1c2d-4f5a-6b7c-8d9e-0f1a2b3c4d5e
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              country: US
              currency: USD
              local_amount: '498.75'
              fx_rate: '1.010202'
              usdt_gross: '493.811881'
              fee: '27.159654'
              usdt_net: '466.652227'
              status: credited
              settle_at: '2026-08-12T14:08:33Z'
              idempotency_key: order-10042
              receipt_url: https://api.qbank.cl/platform/v1/payins/8b3e1c2d-4f5a-6b7c-8d9e-0f1a2b3c4d5e/receipt
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  payout_status_changed:
    post:
      summary: Estado de payout cambiado
      description: 'Un payout alcanzó un nuevo estado (processing, completed o failed).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout_id: *id017
                account_id: *id017
                country: *id017
                currency: *id017
                local_amount: *id017
                usdt_amount: *id017
                total_debit: *id017
                status: *id017
                status_code: *id017
