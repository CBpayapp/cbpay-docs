  /v1/qscore/subjects/{docID}/disputes:
    get:
      tags: [Qscore]
      summary: Listar disputas del sujeto (ARCO)
      operationId: listQscoreSubjectDisputes
      description: 'Lista las disputas ARCO abiertas para un sujeto (derechos del

        titular de los datos: rectificación y cancelación de datos crediticios).

        Filtrable por `status` (`open`, `under_review`, `resolved_corrected`,

        `resolved_rejected`). El ciclo de vida de la disputa se opera desde el panel

        org admin o por tu organización vía `PATCH /v1/org/qscore/disputes/{id}`;

        cada cambio se notifica al solicitante por email. Una disputa resuelta jamás

        borra el registro disputado: la corrección es un registro nuevo que lo

        reemplaza.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (CL por defecto).
        example: CL
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [open, under_review, resolved_corrected, resolved_rejected]
        description: Filtra por estado de la disputa.
        example: open
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        example: 50
      responses:
        '200':
          description: Página de disputas.
          content:
            application/json:
              example:
                items:
