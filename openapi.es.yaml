                frozen:
                  type: boolean
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Nuevo saldo de gasto. Solo afecta compras futuras; las autorizaciones en
                    vuelo conservan (y devuelven a) el asset con el que debitaron.
                limits:
                  type: object
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
            examples:
              freeze:
                summary: Congelar la tarjeta
                value:
                  frozen: true
              set_spending_asset:
                summary: Gastar desde el saldo USDC
                value:
                  spending_asset: USDC
              set_limits:
                summary: Actualizar límites
                value:
                  limits:
                    per_transaction: '200.00'
                    daily: '0'
