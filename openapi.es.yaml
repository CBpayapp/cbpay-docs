              country: MX
              currency: MXN
              local_amount: '1500.00'
              usdt_amount: '85.714286'
              total_debit: '86.014286'
              status: completed
              status_code: ''
              bank_reference: '00761123456'
              idempotency_key: payroll-2026-07-001
      responses:
        '200':
