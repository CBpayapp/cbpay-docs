  /v1/swaps/quote:
    get:
      tags:
      - Swaps
      operationId: quoteSwap
      summary: Cotizar un swap
      description: 'Cotización indicativa gratis para convertir entre tus saldos USDT, USDC, BTC y GOLD
        (cualquier par, origen distinto del destino). La tasa que ves es la tasa de ejecución de tu cuenta
        — cotizado = recibido, sin comisiones aparte. Indicativa: la ejecución usa el precio del momento
        del POST (los pares entre stablecoins son estables).'
      parameters:
      - name: from_asset
        in: query
        required: true
        schema:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
      - name: to_asset
        in: query
        required: true
        schema:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
      - name: amount
        in: query
        required: true
        schema:
          type: string
        description: Monto en la moneda de origen (hasta sus decimales).
      responses:
        '200':
          description: Cotización indicativa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_asset:
                    type: string
                  to_asset:
                    type: string
                  from_amount:
                    type: string
                  to_amount:
                    type: string
                  rate:
                    type: string
                    description: Unidades de destino por unidad de origen (tasa de ejecución marcada).
                  indicative:
                    type: boolean
              example:
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
