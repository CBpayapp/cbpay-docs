  /v1/otp/challenges:
    post:
      tags:
      - Seguridad (OTP)
      operationId: createOTPChallenge
      summary: Pedir un código OTP
      description: Envía un código de un solo uso al teléfono de la cuenta por el canal configurado para
        la acción. Requiere sesión de usuario (JWT) — las API keys reciben `403 session_required`. Aplican
        límites de envío por hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - login
                  - payout
                  - crypto_withdrawal
                  - transfer
                  - banking_operation
                  - card_reveal
                  - api_key_create
                  - member_add
                  - phone_change
            example:
              action: payout
      responses:
        '201':
          description: Desafío creado; el código va en camino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: &id015
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                action: payout
                channel: whatsapp
                phone: '********5678'
                status: pending
                created_at: '2026-07-08T21:00:00Z'
                expires_at: '2026-07-08T21:10:00Z'
        '403':
          description: Credencial API key (`session_required`) o teléfono recién enlazado sin verificación y sin factor
            alternativo (`phone_binding_cooldown`). Con el teléfono en cooldown, el desafío cae automáticamente a la app
            autenticadora (si está enrolada) o al email de login verificado; el canal efectivo llega en la respuesta del
            desafío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: session_required
                message: OTP verification requires a user session (JWT), not an API key
        '409':
          description: La cuenta no tiene teléfono (`phone_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: phone_required
                message: the account has no phone number; set it with PATCH /v1/me before requesting OTP
                  codes
        '429':
          description: Cuota de envíos alcanzada (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: too_many_attempts
                message: too many verification attempts; wait before retrying
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Seguridad (OTP)
      operationId: listOTPChallenges
