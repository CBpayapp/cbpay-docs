      operationId: listQscoreReports
      description: 'Devuelve los informes crediticios de tu cuenta, del más reciente al más antiguo. Los

        filtros de fecha `from` y `to` (zona horaria de la organización, ambos inclusivos) son obligatorios. Los informes

        de otras cuentas nunca son visibles (aislamiento por cuenta: un id de informe

        perteneciente a otra cuenta devuelve `404 not_found`).'
