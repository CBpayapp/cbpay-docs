  /v1/qscore/fraud/reports/{id}/pdf:
    get:
      tags: [Qscore]
      summary: Descarga el PDF privado de fraude e identidad.
      operationId: getQscoreFraudReportPDF
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: >-
            Adjunto PDF brandeado. El PDF de fraude incluye una tabla de fuentes
            funcionales del buró con cantidades de registros y frescura (`live`
            o `unavailable`). Cuando no hay evidencia del buró, declara la
            señal `THIN_FILE`; un `bureau_unavailable` explícito todavía puede
            producir un informe listo usando señales internas de la plataforma.
            Las fallas de transporte, autenticación, storage, contrato inválido
            o `sources_failed` no vacío fallan cerrado mediante el recovery/
            reembolso existente.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: The report is not ready or has no PDF.
          content:
            application/json:
              examples:
                not_found:
                  value: {"error":"not_found","message":"report pdf not found"}
  /v1/qscore/index:
