                    message: the tax_id on your account does not match your verified
                      identity
    delete:
      tags: [Qscore]
      operationId: revokeMyQscoreSeal
      summary: Revocar mi sello Qscore
      description: 'Revoca el sello activo de la cuenta autenticada. Inmediato y
        PERMANENTE para ese sello: su URL pública y su badge pasan a "no vigente"
        (la URL sigue respondiendo — nunca rompe una página que lo haya embebido).
        No se puede deshacer, pero la cuenta puede activar un sello NUEVO (con un
        código distinto) en cualquier momento, mientras siga siendo elegible. Se
        envía un email de aviso de revocación al titular (branding de la org).'
      responses:
        '200':
          description: Sello revocado.
          content:
            application/json:
              example:
                seal:
                  id: becb6a82-3f52-4d7a-9c2f-8a1d4e5f6a70
                  status: revoked
                  revoked_at: '2026-08-09T18:41:07Z'
        '400':
          description: El tax_id de la cuenta falta o es inválido.
          content:
            application/json:
              example:
                error: invalid_tax_id
                message: the tax_id on your account is not a valid document for its
                  country
        '403':
          description: kyc_required (la cuenta no tiene un KYC/KYB aprobado) | forbidden
            (servicio deshabilitado)
          content:
            application/json:
              example:
                error: kyc_required
                message: identity verification (KYC/KYB) is required to use your Qscore
                  seal
        '404':
          description: No hay sello activo que revocar.
          content:
            application/json:
              example:
                error: no_active_seal
                message: you have no active seal
        '409':
          description: Conflicto de regla de negocio.
          content:
            application/json:
              examples:
                no_tax_id:
                  summary: La cuenta no tiene tax_id
                  value:
                    error: no_tax_id
                    message: complete your account's tax_id to use your Qscore seal
                identity_mismatch:
                  summary: El tax_id no calza con la identidad verificada
                  value:
                    error: identity_mismatch
                    message: the tax_id on your account does not match your verified
                      identity
  /v1/qscore/subjects/{docID}:
    get:
      tags: [Qscore]
      summary: Consultar un sujeto
      operationId: getQscoreSubject
      description: 'Devuelve el registro del sujeto para un documento de identidad (no

        emite un informe nuevo ni cobra nada). Los sujetos se crean automáticamente

        la primera vez que se pide un informe para ese documento. El parámetro de

        ruta `docId` es el documento tal como fue emitido (p. ej. un RUT chileno como

        `12.345.678-5`); se valida y normaliza por país. Si el sujeto ya tiene

        scores, el último se resume en `last_score` / `last_band` / `last_score_at`

        (`last_score` está ausente para la banda SC). Un sujeto inexistente devuelve

        `404 not_found`.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        description: Documento de identidad tal como fue emitido en el país (p. ej. `12.345.678-5` para Chile).
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (CL por defecto).
        example: CL
      responses:
        '200':
          description: Registro del sujeto con el resumen de su último score.
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                country: CL
                doc_id: 12.345.678-5
                subject_type: person
                display_name: Example Name
                last_score: 742
                last_band: B
                last_score_at: '2026-08-08T15:04:24Z'
        '400':
          description: invalid_doc_id
          content:
            application/json:
              example:
                error: invalid_doc_id
                message: doc_id is not valid for the given country
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found (el sujeto no existe)
          content:
            application/json:
              example:
                error: not_found
                message: subject not found
  /v1/qscore/subjects/{docID}/score:
    get:
      tags: [Qscore]
      summary: Score vigente de un sujeto
      operationId: getQscoreSubjectScore
      description: 'Devuelve solo el último score de un sujeto — la consulta barata

        para chequeos recurrentes sin emitir (ni pagar) un informe nuevo. Devuelve

        `404 no_score` si aún no se ha calculado ningún informe para ese sujeto.

        Para la banda SC (sin datos), `score` está ausente.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (CL por defecto).
        example: CL
      responses:
        '200':
          description: Último score del sujeto.
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                doc_id: 12.345.678-5
                country: CL
                score: 742
                band: B
                model_version: v1
                computed_at: '2026-08-08T15:04:24Z'
        '400':
          description: invalid_doc_id
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found (el sujeto no existe) | no_score
          content:
            application/json:
              example:
                error: no_score
