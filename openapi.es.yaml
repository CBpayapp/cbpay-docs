  /v1/cards:
    post:
      tags:
      - Cards
      operationId: createCard
      summary: Crear una tarjeta
      description: 'Emite una tarjeta (virtual o física) que gasta Just-In-Time del saldo central de la
        cuenta en el asset de gasto de la tarjeta (`spending_asset`: USDT/USDC 1:1 con el USD, o BTC/GOLD
        convertidos al precio del momento de cada evento; USDT por defecto) — sin prefondeo: cada compra
        se autoriza en tiempo real contra el saldo disponible y los límites propios de la tarjeta. Las
        cuentas persona pueden tener **1 virtual + 1 física**; las cuentas empresa crean tarjetas **ilimitadas**,
        para la empresa o para personas designadas (ej. empleados, pasando sus documentos de identidad).
        La emisión cobra el fee `card_creation_virtual` / `card_creation_physical` cuando está configurado
        (0 = gratis); el cargo se reembolsa automáticamente si la emisión falla. Las tarjetas físicas
        nacen `pending_activation` hasta que el titular confirma la recepción.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                physical:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
                  description: Obligatoria (también como header Idempotency-Key). Un retry con la misma
                    clave devuelve la tarjeta original y nunca cobra dos veces el fee de emisión.
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Saldo desde el que gasta la tarjeta. USDT/USDC van a la par del USD (1:1
                    exacto, sin comisión de conversión). BTC/GOLD se convierten al precio efectivo del
                    momento de cada evento, con colchón de reserva en la autorización (pricing fail-closed
                    y límites de assets volátiles compartidos con payouts).
                limits:
                  type: object
                  description: Límites de gasto opcionales en USD (se aplican al autorizar; 0 u omitido
                    = sin límite).
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
                cardholder:
                  type: object
                  description: 'Datos del titular. En la PRIMERA emisión de la cuenta el titular se crea
                    en el emisor: la identidad y los documentos se COMPLETAN SOLOS desde la verificación
                    de identidad aprobada de la cuenta (los campos explícitos ganan); solo agregas los
                    campos propios del emisor (código de ocupación del catálogo, salary_usd). Omítelo
                    en las tarjetas siguientes: se reutiliza el titular ya verificado. Las cuentas empresa
                    también pueden usar kind "person" más el verification_id del KYC APROBADO de ESA persona
                    para emitir a una persona designada (su identidad y documentos salen de la verificación).'
                  properties:
                    verification_id:
                      type: string
                      format: uuid
                      description: 'OBLIGATORIO para personas designadas (kind "person" en cuentas empresa):
                        submission_id del KYC de terceros APROBADO de la persona.'
            examples:
              person_first_card:
                summary: Persona — PRIMERA tarjeta (la identidad se completa desde la verificación)
                value:
                  physical: false
                  idempotency_key: card-v-1
                  cardholder:
                    occupation: '52201'
                    salary_usd: 1800
              subsequent_card:
                summary: Tarjeta siguiente — titular ya verificado (sin datos)
                value:
                  physical: true
                  idempotency_key: card-f-ops-1
                  spending_asset: USDC
                  limits:
                    per_transaction: '500.00'
                    monthly: '5000.00'
              company_for_employee:
                summary: Empresa — tarjeta para una persona designada (exige KYC aprobado)
                value:
                  physical: false
                  idempotency_key: card-emp-77
                  limits:
                    monthly: '1500.00'
                  cardholder:
                    kind: person
                    verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                    occupation: '52201'
                    salary_usd: 1800
      responses:
        '201':
          description: Tarjeta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                cardholder_name: Client X SpA
                status: active
                spending_asset: USDT
                limits:
                  monthly: '5000.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T12:00:00Z'
                creation_fee: '3.000000'
        '202':
          description: Solicitud retenida para revisión (la organización tiene la revisión de solicitudes activada).
            El recurso se crea solo cuando compliance aprueba la revisión; la comisión de emisión/apertura se cobra al
            retener y se reembolsa automáticamente si se rechaza. Sigue el resultado con el webhook
            `txn_review_status_changed` o `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: card_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '400':
          description: idempotency_key_required / invalid_amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          description: El saldo no alcanza para el fee de emisión (insufficient_funds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: account balance is not enough for this operation
        '409':
          description: card_limit_reached (cuentas persona) / cardholder_kyc_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_limit_reached
                message: person accounts can hold at most 1 virtual card (cancel the existing one first)
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch
            (las personas designadas necesitan el verification_id de un KYC de terceros aprobado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: verification_required
                message: 'an approved identity verification of the third party is required: pass verification_id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    get:
      tags:
      - Cards
      operationId: listCards
