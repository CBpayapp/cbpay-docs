  /v1/segregated-wallets/{walletID}/sends:
    post:
      tags:
      - Wallets segregadas
      operationId: createSegregatedWalletSend
      summary: Enviar crypto desde la wallet
      description: 'Envía crypto **desde la wallet misma** (dirección de origen real, firmado por el custodio).
        `idempotency_key` es obligatoria. El gas corre por el cliente: si la wallet no tiene gas nativo,
        el envío se rechaza con `422 insufficient_gas` antes de cualquier cobro. Puede cobrar el fee `wallet_send`
        (del saldo de settlement de la cuenta en el ledger, nunca los fondos on-chain de la wallet; reembolsado
        si el core rechaza). Exige cuenta verificada y OTP. Ante una falla ambigua el envío queda `pending`
        — reintenta con la misma clave, jamás se re-envía.'
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
      - name: X-OTP-Token
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to_address
              - idempotency_key
              properties:
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - eth
                to_address:
                  type: string
                amount:
                  type: string
                  description: Monto decimal en la unidad del asset (usa este o amount_raw).
                amount_raw:
                  type: string
                  description: Monto en unidades mínimas on-chain.
                idempotency_key:
                  type: string
            examples:
              by_amount:
                summary: Por monto decimal
                value:
                  asset: usdt
                  to_address: TXYZdestination00000000000000000000
                  amount: '25.50'
                  idempotency_key: send-2026-07-11-a
              by_raw:
                summary: Por unidades mínimas
                value:
                  asset: usdt
                  to_address: TXYZdestination00000000000000000000
                  amount_raw: '25500000'
                  idempotency_key: send-2026-07-11-b
      responses:
        '202':
          description: Envío transmitido (asíncrono; estado final por webhook).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWalletSend'
              example:
                send_id: 9c8b7a6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
                chain: tron
                asset: USDT
                to_address: TXYZdestination00000000000000000000
                amount_raw: '25500000'
                fee: '0.000000'
                fee_asset: USDT
                status: processing
                tx_id: b1946ac92492d2347c6235b4d2611184e0f0f8c9d3a1e2b3c4d5e6f708192a3b
                idempotency_key: send-2026-07-11-a
                created_at: '2026-07-11T12:05:00Z'
        '200':
          description: Replay idempotente de un envío previo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWalletSend'
              example:
                send_id: 9c8b7a6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                status: processing
                idempotency_key: send-2026-07-11-a
                idempotency_hit: true
        '422':
          description: Falta gas en la wallet, o el core rechazó el envío.
