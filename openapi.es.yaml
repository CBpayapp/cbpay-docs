  /v1/segregated-wallets:
    post:
      tags:
      - Wallets segregadas
      operationId: createSegregatedWallet
      summary: Crear una wallet segregada
      description: 'Crea una wallet on-chain nueva de la cuenta que llama. Su saldo vive on-chain (nunca
        en el ledger) y queda exenta del barrido de tesorería. Pares soportados: `tron`/`usdt`, `eth`/`usdt`,
        `eth`/`usdc`, `btc`/`btc`. Las cuentas empresa pueden crear wallets ilimitadas; las cuentas persona tienen
        **1 por combinación red+activo** (la segunda responde `422 wallet_limit_reached`). Un `Idempotency-Key`
        opcional (o `idempotency_key` en el body) hace el reintento seguro: una repetición devuelve la
        misma wallet sin crear otra. Puede cobrar el fee `wallet_creation` (reembolsado si la creación
        falla).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - btc
                  default: usdt
                label:
                  type: string
                idempotency_key:
                  type: string
            examples:
              tron_usdt:
                summary: TRON USDT
                value:
                  chain: tron
                  asset: usdt
                  label: Acme Client
                  idempotency_key: wallet-client-001
              eth_usdc:
                summary: Ethereum USDC
                value:
                  chain: eth
                  asset: usdc
                  label: Project X
                  idempotency_key: wallet-project-x
              btc_btc:
                summary: Bitcoin BTC
                value:
                  chain: btc
                  asset: btc
                  label: BTC custody
                  idempotency_key: wallet-btc-001
      responses:
        '201':
          description: Wallet creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegregatedWallet'
              example:
                wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
                chain: tron
                asset: USDT
                address: TRmSZRaMAqLEevAdGwo3R43bRBXamWR5bd
                label: Acme Client
                type: segregated
                origin: created
                custody: cbpay
                exported: false
                created_at: '2026-07-11T12:00:00Z'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id009
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_asset
                message: 'unsupported chain/asset pair (supported: tron/usdt, eth/usdt, eth/usdc, btc/btc)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El servicio está deshabilitado para la cuenta.
          content:
            application/json:
              schema: *id009
              example:
                error: service_disabled
                message: this service is not enabled for the account
        '409':
          description: Ya hay una wallet con esta idempotency key en aprovisionamiento.
          content:
            application/json:
              schema: *id009
              example:
                error: idempotency_conflict
                message: a wallet with this idempotency key is still being provisioned; retry with the
                  same key
