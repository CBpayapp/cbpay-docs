        opción pull debe materializarse primero; el monto SIEMPRE es el congelado ahí.
        Rate limit estricto por IP (cada llamada es un SMS/push real al pagador).
        **Actualmente no hay ningún corredor de cobro pull disponible** (se retiró
        Venezuela `c2p` / `debito_inmediato`): las llamadas responden que el corredor
        no está soportado.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token opaco del checkout embebido en el `checkout_url`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              country: VE
              currency: VES
              method: debito_inmediato
              payer_document: V12345678
              payer_bank: '0102'
              payer_account: '01020123456789012345'
      responses:
        '200':
          description: OTP enviado al pagador.
          content:
            application/json:
              example:
                otp_reference: '783412'
                status: sent
        '404':
          description: Token inválido o link de cobro desconocido.
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: El link ya fue pagado por otro método.
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: El link expiró sin pago.
          content:
            application/json:
              example:
                error: checkout_expired
                message: this payment link expired
        '422':
          description: La opción pull no está materializada, o el rail rechazó la solicitud de OTP.
          content:
            application/json:
              examples:
                not_materialized:
                  summary: Opción pull aún no preparada
                  value:
                    error: method_unavailable
                    message: prepare this payment option first (POST /methods/{method})
                rail_rejected:
                  summary: El rail rechazó la solicitud de OTP
                  value:
                    error: collect_otp_failed
                    message: the destination account does not accept immediate debit
        '429':
          description: Demasiadas peticiones desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many requests; wait a moment and retry
  /pay/{token}/collect:
    post:
      security: []
      tags:
      - Checkout
      operationId: checkoutCollect
      summary: Ejecutar un cobro pull con los datos del pagador (público)
      deprecated: true
      description: >-
        Ejecuta el cargo pull de una opción collect materializada con los datos que
        el pagador escribió en la página del
        checkout — banco, documento, teléfono o cuenta, y el OTP (generado en la app
        bancaria del pagador, o solicitado vía `POST /pay/{token}/collect/otp`
        devolviendo su `otp_reference`). El monto SIEMPRE es el
        congelado en la materialización — el pagador nunca lo envía. Si el rail
        confirma síncrono, el link se liquida en la misma llamada (`paid: true`); un
        rechazo NO mata el link — el pagador puede corregir los datos o elegir otro
        método. Reintentar con los mismos datos jamás cobra dos veces. Rate limit
        estricto por IP. **Actualmente no hay ningún corredor de cobro pull
        disponible** (se retiró Venezuela `c2p` / `debito_inmediato`): la cotización
        no lista ninguna opción `collect: true` y las llamadas responden que el
        corredor no está soportado.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token opaco del checkout embebido en el `checkout_url`.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              pull_collection:
                summary: Forma histórica — actualmente no hay ningún corredor pull disponible
                value:
                  country: VE
                  currency: VES
                  method: c2p
                  payer_document: V12345678
                  payer_phone: '04141234567'
                  payer_bank: '0102'
                  otp: '123456'
      responses:
        '200':
          description: Resultado del intento de cobro.
          content:
            application/json:
              examples:
                paid:
                  summary: El rail confirmó síncrono — link liquidado
                  value:
                    paid: true
                    status: paid
                    status_message: approved
                rejected_soft:
                  summary: El rail reportó un rechazo recuperable en el body
                  value:
                    paid: false
                    status: failed
                    status_code: '05'
                    status_message: the document does not match the C2P registration
        '404':
          description: Token inválido o link de cobro desconocido.
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: El link ya fue pagado por otro método.
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: El link expiró sin pago.
          content:
            application/json:
              example:
                error: checkout_expired
                message: this payment link expired
        '422':
          description: La opción pull no está materializada, o el rail rechazó el cargo
            (el link queda pendiente para que el pagador reintente).
          content:
            application/json:
              examples:
                not_materialized:
                  summary: Opción pull aún no preparada
                  value:
                    error: method_unavailable
                    message: prepare this payment option first (POST /methods/{method})
                rail_rejected:
                  summary: El rail rechazó el cargo
                  value:
                    error: collect_rejected
                    message: invalid or expired OTP
        '429':
          description: Demasiadas peticiones desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many requests; wait a moment and retry
  /v1/branding:
    get:
      tags:
      - Cuenta
      operationId: getBranding
      summary: Obtener el branding de la plataforma
      description: Branding efectivo de la plataforma donde operas (nombre, colores, logos en base64)
        para que un front white-label se auto-tematice desde la API en vez de hardcodear assets. `logo_url`/`symbol_url`
        son URLs públicas de CDN de los mismos logos — prefiérelas por sobre los payloads base64. Solo
        lectura, sin PII. `timezone` es la zona horaria IANA de la organización (default `America/New_York`) — cada filtro de fecha `from`/`to` y cada bucket diario de la plataforma se interpreta en esa zona.
      responses:
        '200':
          description: Branding efectivo.
          content:
            application/json:
              example:
                brand_name: CBPay
                website: www.cbpayapp.com
                footer_address: 'Miami: 25 SW 9th STREET, Suite 406, Miami, FL 33130'
                support_email: ''
                colors:
                  primary: '#FBC140'
                  header: '#2E2E2E'
                  accent: '#A16207'
                logo_png_base64: iVBORw0KGgoAAAANSUhEUg...
                symbol_png_base64: iVBORw0KGgoAAAANSUhEUg...
                logo_url: https://cdn.cbpayapp.com/public/branding/default/logo.png
                symbol_url: https://cdn.cbpayapp.com/public/branding/default/symbol.png
                timezone: America/New_York
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/register:
    post:
      tags:
      - Autenticación
      security: []
      operationId: register
      summary: Registrar una cuenta
      description: 'Crea una cuenta de persona o empresa con su miembro de acceso owner y

        devuelve un token de sesión. Un solo endpoint para ambos tipos: `type` es un dato.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - type
              - email
              - password
              - display_name
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                type:
                  type: string
                  enum:
                  - person
                  - company
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
                  description: Código de país ISO 3166-1 alpha-2.
                locale:
                  type: string
                  enum:
                  - en
                  - es
                  - zh
                  description: Locale preferido al registrarse. Si se omite, sigue Accept-Language, luego el default de la org, luego ingles.
                profile:
                  type: object
                  description: Datos de perfil de formato libre.
            example:
              org: cbpay
              type: person
              email: ana@example.com
              password: a-secure-password
              display_name: Ana Perez
              country: CL
              locale: en
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/Account'
                  access_token:
                    type: string
                    description: JWT de sesión, válido por 24 horas.
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Refresh token rotatorio de un solo uso para `POST /v1/auth/refresh`.
                  refresh_expires_at:
                    type: string
                    format: date-time
              example:
                account: &id001
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
                  type: person
                  status: active
                  kyc_status: approved
                  email: ana@example.com
                  display_name: Ana Perez
                  tax_id: 12345678-9
                  phone: '+56912345678'
                  country: CL
                  locale: en
                  profile: &id002 {}
                  created_at: '2026-07-07T12:00:00Z'
                  updated_at: '2026-07-07T12:00:00Z'
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-08T12:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-06T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Servicio suspendido (`org_suspended`); contacta al equipo de CBPay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: org_suspended
                message: organization is not active
        '409':
          description: Ya existe una cuenta con ese email (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate
                message: resource already exists
  /v1/auth/environment-handoff:
    post:
      tags:
      - Autenticación
      operationId: createEnvironmentHandoff
      summary: Obtener un token de handoff a modo test
      description: 'Emite un token de un solo uso (TTL 60 segundos) que traslada la sesión ACTUAL del
        member al ambiente de test — es lo que alimenta el switch test/live de un click del dashboard,
        sin segundo login ni nuevo desafío OTP. Solo el ambiente live emite handoffs, y solo las sesiones
        de member (JWT) pueden pedir uno: las API keys jamás cambian de ambiente (cada ambiente administra
        sus propias keys).'
      responses:
        '201':
          description: Token de handoff emitido. Cánjéalo de inmediato en el `POST /v1/auth/handoff` del
            ambiente de test.
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoff_token:
                    type: string
                    description: Token firmado de un solo uso (expira en 60 segundos).
                  expires_at:
                    type: string
                    format: date-time
                  exchange_url:
                    type: string
                    description: URL del ambiente de test donde se canjea el token.
              example:
                handoff_token: eyJqdGkiOiI2ZjFjMDJhYS0uLi4ifQ.9zXk1v…
                expires_at: '2026-07-13T12:01:00Z'
                exchange_url: https://cryptobank.qbank.cl/platform/v1/auth/handoff
        '403':
          description: El caller no es una sesión de member (`session_required`) — las API keys no cambian
            de ambiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: session_required
                message: environment handoff requires a member session
  /v1/auth/handoff:
    post:
      tags:
      - Autenticación
      security: []
      operationId: exchangeEnvironmentHandoff
      summary: Canjear un token de handoff por una sesión de test
      description: Solo en el ambiente de test (live siempre responde 404). Canjea el token de un solo
        uso emitido por `POST /v1/auth/environment-handoff` en live por una sesión propia del ambiente
        de test. Si la cuenta aún no existe en test, su espejo se provisiona automáticamente — el modo
        test siempre existe para todo usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: El `handoff_token` emitido por el ambiente live.
            example:
              token: eyJqdGkiOiI2ZjFjMDJhYS0uLi4ifQ.9zXk1v…
      responses:
        '200':
          description: Sesión de test emitida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account:
                    type: object
                    description: La cuenta espejo en el ambiente de test.
                  livemode:
                    type: boolean
                    description: Siempre false en el ambiente de test.
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-14T12:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-12T12:00:00Z'
                account:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  type: person
                  display_name: Ana Test
                livemode: false
        '401':
          description: El token es inválido, expiró o ya fue usado (`invalid_handoff`, `handoff_replayed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_handoff
                message: handoff token is invalid or expired
  /v1/auth/login:
    post:
      tags:
      - Autenticación
      security: []
      operationId: login
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - password
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              org: cbpay
              email: ana@example.com
              password: a-secure-password
      responses:
        '200':
          description: Sesión emitida — o, cuando la política de la cuenta exige OTP en el login, una
            respuesta intermedia con `otp_required` true y un `pending_token` para canjear en `POST /v1/auth/login/otp`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Refresh token rotatorio de un solo uso (`rt_…`) para renovar la sesión
                      en `POST /v1/auth/refresh` sin re-login.
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum:
                    - owner
                    - operator
                    - viewer
                  otp_required:
                    type: boolean
                    description: Presente (true) cuando el login necesita un segundo paso.
                  pending_token:
                    type: string
                    description: Token intermedio para `POST /v1/auth/login/otp`. No autentica requests
                      de la API.
                  challenge_id:
                    type: string
                    format: uuid
                  channel:
                    type: string
                    enum:
                    - sms
                    - whatsapp
                    - email
                    - totp
                    description: Canal efectivo del desafío de login. Con el teléfono en cooldown de enlace
                      el desafío cae automáticamente a un factor más fuerte (app autenticadora, luego email
                      de login) — el código jamás viaja a un número recién enlazado sin verificar.
                  phone:
                    type: string
                    description: Teléfono enmascarado al que viajó el código.
              examples:
                session:
                  summary: Sesión emitida (sin política OTP)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    expires_at: '2026-07-08T12:00:00Z'
                    refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    refresh_expires_at: '2026-08-06T12:00:00Z'
                    account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    role: owner
                otpRequired:
                  summary: Login en dos pasos (política OTP activa)
                  value:
                    otp_required: true
                    pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                    channel: sms
                    phone: '********5678'
                    expires_at: '2026-07-08T21:10:00Z'
                    note: verify the code with POST /v1/auth/login/otp to receive the session token
        '403':
          description: La política de login resuelve a SMS/WhatsApp pero el teléfono se enlazó hace menos
            de 24 horas sin verificar y la cuenta no tiene factor alternativo (`phone_binding_cooldown`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: phone_binding_cooldown
                message: the phone number was linked recently without verification; SMS/WhatsApp login
                  codes unlock 24 hours after the change and no alternative factor (authenticator app or
                  login email) is available
        '401':
          description: Email o contraseña incorrectos (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: email or password is incorrect
  /v1/auth/login/otp:
    post:
      tags:
      - Autenticación
      security: []
      operationId: loginOTP
      summary: Completar el login en dos pasos
      description: Canjea el `pending_token` de `POST /v1/auth/login` más el código OTP recibido por SMS/WhatsApp
        por el token de sesión real. El token intermedio expira a los 10 minutos y jamás puede llamar
        a la API por sí solo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pending_token
              - code
              properties:
                pending_token:
                  type: string
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              pending_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
              code: '482913'
      responses:
        '200':
          description: Sesión emitida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: El código no coincide (`invalid_code`) o el token intermedio expiró (`invalid_pending_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: El desafío expiró o ya se usó (`challenge_not_pending`); vuelve a iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; log in again
  /v1/auth/refresh:
    post:
      tags:
      - Autenticación
      security: []
      operationId: refreshSession
      summary: Renovar la sesión
      description: 'Canjea un refresh token de un solo uso (`rt_…`, emitido con cada login) por un par
        nuevo de access token + refresh token sin volver a pedir credenciales. Rotación estricta: al canjear
        se revoca el access token anterior de ese dispositivo, y presentar un refresh token ya canjeado
        revoca la cadena completa del dispositivo (respuesta ante robo) y registra un evento de seguridad
        `refresh_token_reuse`. Los refresh tokens duran 30 días por rotación con un tope absoluto de 90
        días desde el login original; cerrar sesión, revocar sesiones o cambiar la contraseña también
        los invalida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: El token `rt_…` del último login o refresh.
            example:
              refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      responses:
        '200':
          description: Par nuevo emitido; el par anterior queda inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_token:
                    type: string
                    description: Reemplaza al token canjeado (un solo uso).
                  refresh_expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                    format: uuid
                  role:
                    type: string
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                expires_at: '2026-07-15T12:00:00Z'
                refresh_token: rt_9f2b1c30-51ab-4dd0-93e2-7a6b5c4d3e2f.YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY
                refresh_expires_at: '2026-08-13T12:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: El refresh token es inválido, expiró, ya se usó o fue revocado (`invalid_refresh_token`).
            Manda al usuario a la pantalla de login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_refresh_token
                message: the refresh token is invalid or expired; log in again
        '429':
          description: Demasiados intentos de refresh desde esta dirección (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: too_many_attempts
                message: too many refresh attempts from this address; retry later
  /v1/auth/oauth:
    post:
      tags:
      - Login social
      security: []
      operationId: oauthLogin
      summary: Iniciar sesión o registrarse con un proveedor social
      description: Token exchange. El front obtiene la credencial del proveedor (Google/Apple/Microsoft
        `id_token`, Facebook `access_token`) y la envía aquí. La API la verifica contra el proveedor y
        devuelve la sesión CBPay — creando la cuenta en el primer uso. Respeta la política de OTP en login
        de la cuenta (puede devolver `otp_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - provider
              - credential
              properties:
                org:
                  type: string
                  description: Slug de la organización CBPay (`cbpay`).
                provider:
                  type: string
                  enum:
                  - google
                  - apple
                  - microsoft
                  - facebook
                credential:
                  type: string
                  description: Credencial del proveedor obtenida por el SDK del front.
                type:
                  type: string
                  enum:
                  - person
                  - company
                  description: Tipo de cuenta al crear una nueva (default person; se ignora si ya existe).
            example:
              org: cbpay
              provider: google
              credential: eyJhbGciOiJSUzI1Ni…
              type: person
      responses:
        '200':
          description: Usuario existente inició sesión (o `otp_required` si la cuenta exige OTP en login).
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJIUzI1Ni…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '201':
          description: Cuenta nueva creada y sesión iniciada.
          content:
            application/json:
              example:
                account:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  type: person
                  email: ana@gmail.com
                  display_name: Ana
                access_token: eyJhbGciOiJIUzI1Ni…
                expires_at: '2026-07-09T21:00:00Z'
                refresh_token: rt_6a1e6c22-93a1-4f0e-a7d1-1f2e3c4b5a69.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                refresh_expires_at: '2026-08-07T21:00:00Z'
                created: true
        '401':
          description: La credencial es inválida, expiró o es de otra app (`invalid_credential`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credential
                message: the login credential is invalid or expired
        '400':
          description: Org desconocida, proveedor inválido o no habilitado para la org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: provider_not_configured
                message: this login provider is not enabled for this organization
        '409':
          description: Ya existe una cuenta con ese email (`email_conflict`); inicia sesión y vincula
            desde tu sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email_conflict
                message: an account with this email already exists; sign in with your current method and
                  link this provider from your session
  /v1/auth/oauth/providers:
    get:
      tags:
      - Login social
      security: []
      operationId: oauthProviders
      summary: Listar proveedores sociales habilitados
      description: Público. Devuelve los proveedores sociales habilitados de la org y su `client_id`,
        para que el front pinte los botones correctos.
      parameters:
      - name: org
        in: query
        required: true
        schema:
          type: string
        description: Slug de la organización CBPay.
      responses:
        '200':
          description: Proveedores habilitados.
          content:
            application/json:
              example:
                providers:
                - provider: google
                  client_id: 1234567890-abc.apps.googleusercontent.com
                - provider: apple
                  client_id: com.yourcompany.cbpay.web
  /v1/me/identities:
    get:
      tags:
      - Login social
      operationId: listIdentities
      summary: Listar mis proveedores vinculados
      responses:
        '200':
          description: Identidades vinculadas del member que llama.
          content:
            application/json:
              example:
                identities:
                - account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  provider: google
                  email: ana@gmail.com
                  display_name: Ana
                  created_at: '2026-07-08T21:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    post:
      tags:
      - Login social
      operationId: linkIdentity
      summary: Vincular un proveedor a mi cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - credential
              properties:
                provider:
                  type: string
                  enum:
                  - google
                  - apple
                  - microsoft
                  - facebook
                credential:
                  type: string
            example:
              provider: apple
              credential: eyJhbGciOiJSUzI1Ni…
      responses:
        '201':
          description: Proveedor vinculado.
          content:
            application/json:
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                provider: apple
                email: ana@privaterelay.appleid.com
                created_at: '2026-07-08T21:05:00Z'
        '409':
          description: Esa identidad ya está vinculada a otra cuenta (`identity_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: identity_taken
                message: this provider identity is already linked to another account
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/identities/{provider}:
    delete:
      tags:
      - Login social
      operationId: unlinkIdentity
      summary: Desvincular un proveedor
      description: Bloqueado con `409 last_login_method` si es el único método de acceso (sin contraseña
        y sin otro proveedor vinculado).
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - apple
          - microsoft
          - facebook
      responses:
        '200':
          description: Proveedor desvinculado.
          content:
            application/json:
              example:
                provider: apple
                unlinked: true
        '409':
          description: No se puede desvincular el único método de acceso (`last_login_method`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: last_login_method
                message: cannot unlink the only sign-in method; set a password or link another provider
                  first
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me:
    get:
      tags:
      - Cuenta
      operationId: getMe
      summary: Obtener mi cuenta
      responses:
        '200':
          description: La cuenta que llama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example: *id001
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Cuenta
      operationId: updateMe
      summary: Actualizar mi perfil
      description: Con la verificación de identidad aprobada, `display_name`,
        `tax_id` y `country` se rellenan desde la identidad verificada y quedan
        bloqueados (`409 identity_locked`); `phone` sigue editable con su
        propio flujo de verificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                tax_id:
                  type: string
                phone:
                  type: string
                country:
                  type: string
                locale:
                  type: string
                  description: Locale preferido (`en`, `es` o `zh`). Un string vacio guarda `en`. Valores invalidos devuelven 400 `invalid_locale`.
            example:
              phone: '+56987654321'
              locale: en
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
                type: person
                status: active
                kyc_status: approved
                email: ana@example.com
                display_name: Ana Perez
                tax_id: 12345678-9
                phone: '+56987654321'
                country: CL
                locale: en
                profile: *id002
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:00Z'
        '400':
          description: Locale invalido (`invalid_locale`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_locale
                message: locale must be en, es or zh
        '409':
          description: Los campos de identidad quedan bloqueados tras aprobar la verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: identity_locked
                message: display_name, tax_id and country come from your approved identity verification and cannot be changed here; contact support to update your verified identity
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/members:
