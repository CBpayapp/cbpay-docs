  txn_review_status_changed:
    post:
      summary: Cambio de estado de una revisión transaccional
      description: 'Una operación de la cuenta cambió su estado de revisión (`in_review`
        cuando el firewall transaccional la retiene, `info_requested`, `released`, `rejected`).

        El payload es deliberadamente neutro: solo estado y resumen de la operación — jamás
        incluye motivos internos de revisión ni notas de cumplimiento. Un estado `rejected`
        también puede provenir del barrido por plazo de revisión de la organización
        (rechazo automático); el email y el detalle de la revisión llevan el aviso
        estándar de plazo.

        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: *id017
                review_id: *id017
                kind: *id017
                resource_id: *id017
                status: *id017
                previous_status: *id017
                amount: *id017
                asset: *id017
            example:
              account_id: ae8cf540-1234-5678-9abc-def012345678
              review_id: 7a3f2b1c-0000-4000-8000-000000000001
              kind: payout
              resource_id: 8b4c3d2e-1111-4111-8111-111111111111
              status: released
              previous_status: in_review
              amount: '1500.00'
              asset: USD
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  crypto_deposit_credited:
