  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - Seguridad (OTP)
      operationId: verifyOTPChallenge
      summary: Verificar el código
      description: Valida el código recibido por SMS/WhatsApp y devuelve el `otp_token` de un solo uso
        que autoriza la acción protegida (se envía en el header `X-OTP-Token`). 5 intentos por desafío.
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: Código aprobado; token de un solo uso emitido.
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: El código no coincide (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: El desafío expiró o ya se usó (`challenge_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
