              amount_raw: '25000000'
              custody: client
      responses:
        '200':
          description: Responde cualquier 2xx para confirmar la entrega.
  wallet_key_compromise_suspected:
    post:
      summary: Sospecha de llave comprometida (alarma crítica)
      description: 'CRÍTICO: salió plata de una wallet segregada con custodia de la plataforma sin pasar
        por la plataforma. Por diseño es imposible salvo que la llave privada se haya filtrado. Trata
        la llave como comprometida, mueve los fondos restantes a una wallet nueva y contacta soporte de
        inmediato.'
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
              direction: out
              tx_id: 9a3c1e5f7b2d4a6c8e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
              amount_raw: '25000000'
              custody: cbpay
      responses:
        '200':
          description: Responde cualquier 2xx para confirmar la entrega.
  corridor_status_changed:
    post:
      summary: Cambió la disponibilidad de un corredor
      description: >-
        Un corredor de pago cambió de disponibilidad (`operational` / `degraded` / `down`) —
        se dispara en caídas Y en recuperaciones. Evento broadcast: no está ligado a una
        operación tuya, así que no trae `account_id`. Consúmelo de forma idempotente
        (dedupe por delivery id). Ver la guía de estado del servicio.
      requestBody:
        content:
          application/json:
            example:
              flow: payout
              country: VE
              currency: VES
              method: bank_transfer
              status: down
              previous_status: operational
              since: '2026-07-24T22:10:00Z'
              reason: consecutive infrastructure failures
      responses:
        '200':
          description: Responde cualquier 2xx para confirmar la entrega.
  balance_adjusted:
    post:
      summary: Ajuste de saldo aplicado
      description: 'Un ajuste administrativo acreditó o debitó el saldo. Se emite solo cuando el asiento entró de verdad: un ajuste a la espera de un segundo aprobador, o el replay de una clave de idempotencia ya usada, no emite.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              type: balance_adjusted
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:02:00Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                asset: USDT
                amount: '10.000000'
                direction: credit
                reason: manual top-up
                available: '109.700000'
                held: '0.000000'
      responses:
        '200':
          description: 'Recibido.'
  account_status_changed:
    post:
      summary: Estado de la cuenta cambiado
      description: 'El estado administrativo de la cuenta cambió (`active`, `blocked`, `closed`). Reenviar el mismo estado no emite.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
              type: account_status_changed
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:06:30Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                status: blocked
                previous_status: active
      responses:
        '200':
          description: 'Recibido.'
  member_security_event:
    post:
      summary: Evento de seguridad de la cuenta
      description: 'Un hecho de seguridad de la cuenta (inicio de sesión, cambio de contraseña, factor agregado o quitado, sesión revocada). Mismos campos que `GET /v1/me/security/events`.'
      requestBody:
        content:
          application/json:
            example:
              event_id: 3c4d5e6f-7a8b-4c9d-8e0f-2a3b4c5d6e7f
              type: member_security_event
              account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
              created_at: '2026-07-25T18:09:05Z'
              data:
                account_id: c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10
                event_type: password_changed
                member_id: 1c2d3e4f-3b7d-4bad-9bdd-2b0d7b3dcb6d
                ip: 200.1.2.3
                user_agent: Mozilla/5.0
      responses:
        '200':
          description: 'Recibido.'
  risk_fraud_score_ready:
    post:
      summary: Informe de fraude e identidad listo
      description: 'Un informe de fraude e identidad Qscore terminó de generarse para la cuenta. El evento está acotado a la cuenta, va firmado como los demás webhooks y nunca incluye el PDF ni las señales detalladas. Responde 2xx para confirmar.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                kind:
                  type: string
                  enum: [qscore_fraud]
                subject_id:
                  type: string
                doc_id:
                  type: string
                  description: Documento del sujeto enmascarado.
                country:
                  type: string
                score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E]
                status:
                  type: string
                  enum: [ready]
            example:
              report_id: 9f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f
              kind: qscore_fraud
              subject_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              doc_id: '76••••••-0'
              country: CL
              score: 280
              band: B
              status: ready
      responses:
        '200':
          description: Responde cualquier 2xx para confirmar la entrega.
  risk_report_ready:
    post:
      summary: Informe crediticio Qscore listo
      description: 'Un informe crediticio Qscore comprado con `POST /v1/qscore/reports`
        terminó de generarse con éxito. El payload lleva la identidad del informe,
        el score/banda resultante y el `verify_code` público (compartible con el
        sujeto como prueba de autenticidad en `GET /verify/qscore/{code}`). Si la
        generación falla, el informe queda `status: failed` y no se emite evento.
        El evento también se emite cuando el informe comprado ya estaba disponible
        para el sujeto (reuso idempotente).

        El mismo evento se dispara para un informe SELF generado por el titular
        con `POST /v1/qscore/my-report`; en ese caso el payload agrega
        `purpose: "self_access"` (ausente en los informes comprados).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                subject_id:
                  type: string
                doc_id:
                  type: string
                country:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  description: 'Presente solo en informes self: `self_access`.'
                  enum: [self_access]
                score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E, SC]
                verify_code:
                  type: string
            example:
              report_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              subject_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              doc_id: '12983319'
              country: CL
              subject_type: person
              score: 742
              band: B
              verify_code: Q3fa85f6457174562b3fc2c963f66afa6a1b2c3d4e5f
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  risk_score_changed:
    post:
      summary: Cambió el score Qscore
      description: 'Un informe Qscore recién generado produjo un score distinto al
        último conocido del sujeto (p. ej. en una re-consulta de monitoreo o una
        compra nueva). Se emite solo cuando el score efectivamente cambia; el payload
        lleva el par score/banda anterior y nuevo para que decidas si actuar.
        Suscríbete a este evento para monitorear un sujeto en el tiempo sin polling.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id:
                  type: string
                report_id:
                  type: string
                old_score:
                  type: integer
                new_score:
                  type: integer
                old_band:
                  type: string
                new_band:
                  type: string
            example:
              subject_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              report_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              old_score: 742
              new_score: 688
              old_band: B
              new_band: B
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  risk_monitoring_alert:
    post:
      summary: Alerta de monitoreo Qscore
      description: 'Un sujeto que la cuenta monitorea vía `PUT /v1/qscore/subjects/{docID}/monitoring`
        cambió desde la última revisión. `triggers` lista qué disparó la alerta:
        `score_drop_below` (el score cruzó hacia abajo el umbral `monitor_since_score`
        de la suscripción: anterior >= umbral, nuevo < umbral), `new_records` (el
        buró registró eventos nuevos; con `only_material: true` solo cuentan los
        eventos materialmente negativos — mora abierta, protesto, quiebra, demanda) o
        `records_removed` (el buró ahora muestra menos eventos que el baseline, es
        decir, un registro se cerró o se eliminó). Las suscripciones activas se
        re-evalúan cada ~5 minutos; la primera pasada tras suscribirse solo siembra
        el baseline y jamás alerta con el historial que ya mostraba el informe
        comprado. `score` y `previous_score` se omiten mientras el sujeto no tenga
        score clasificable, y `new_records` se omite cuando ningún evento nuevo
        disparó la alerta.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                monitoring_id:
                  type: string
                subject_id:
                  type: string
                doc_id:
                  type: string
                country:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                triggers:
                  type: array
                  items:
                    type: string
                    enum: [score_drop_below, new_records, records_removed]
                score:
                  type: integer
                previous_score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E, SC]
                record_count:
                  type: integer
                new_records:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      record_type:
                        type: string
                      reported_at:
                        type: string
                      amount:
                        type: string
                      currency:
                        type: string
                      status:
                        type: string
                detected_at:
                  type: string
            example:
              monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
              subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
              doc_id: 12.345.678-5
              country: CL
              subject_type: person
              triggers: [score_drop_below, new_records]
              score: 487
              previous_score: 512
              band: D
              record_count: 3
              new_records:
              - source: res_chile
                record_type: debt_collection
                reported_at: '2026-08-05T00:00:00Z'
                amount: '450000'
                currency: CLP
                status: open
              detected_at: '2026-08-08T18:41:12Z'
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  risk_batch_completed:
    post:
      summary: Lote de scoring Qscore completado
      description: 'Un lote de scoring creado con `POST /v1/qscore/batches`
        terminó de procesar todos sus ítems. Esta es la única señal de
        finalización del lote: los informes individuales **no** emiten su propio
        webhook `risk_report_ready` (y tampoco se envía un email por ítem).
        `status` es `completed` cuando todos los ítems tuvieron éxito,
        `completed_with_errors` cuando al menos un ítem falló de forma terminal
        (su fee fue reembolsado) y `failed` cuando el lote mismo no pudo
        procesarse. Los contadores siempre cuadran: `succeeded_items +
        failed_items = total_items`. Lee los resultados por ítem con `GET
        /v1/qscore/batches/{id}/items` o descárgalos con `GET
        /v1/qscore/batches/{id}/results.csv`.


        Toda entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`,
        `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp` y `X-Webhook-Signature =
        hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta 5
        intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_id:
                  type: string
                status:
                  type: string
                  enum: [completed, completed_with_errors, failed]
                total_items:
                  type: integer
                succeeded_items:
                  type: integer
                failed_items:
                  type: integer
                country:
                  type: string
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
            example:
              batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
              status: completed_with_errors
              total_items: 4
              succeeded_items: 3
              failed_items: 1
              country: CL
              purpose: credit_evaluation
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  risk_consent_granted:
    post:
      summary: Consent Qscore otorgado por el titular
      description: 'Un link de consentimiento creado con `POST /v1/qscore/consents`
        fue otorgado: el titular abrio la pagina publica, conecto su banco via
        open finance y autorizo la solicitud (su documento verificado calzo con el
        documento del sujeto). El consent ahora desbloquea la data bancaria
        positiva del sujeto en los informes Qscore nuevos. `previous_status` es
        `pending` en la practica; viaja para que un replay sea facil de
        reconciliar.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_id:
                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [granted]
                previous_status:
                  type: string
                holder_name:
                  type: string
                openfinance_link_id:
                  type: string
                granted_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: granted
              previous_status: pending
              holder_name: Maria Jose Contreras Soto
              openfinance_link_id: lnk_9b2c4d6e8f
              granted_at: '2026-08-10T09:21:44Z'
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  risk_consent_revoked:
    post:
      summary: Consent Qscore revocado
      description: 'Un link de consentimiento fue revocado, ya sea porque el
        titular rechazo la solicitud en la pagina publica o porque tu cuenta llamo
        `POST /v1/qscore/consents/{id}/revoke`. Un consent revocado deja de
        alimentar data bancaria positiva a los informes Qscore nuevos.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
