openapi: 3.1.0
info:
  title: CBPay API
  version: "2.72"
  description: 'CBPay es una plataforma de pagos multimoneda: payouts y cobros fiat

    en toda América Latina, transferencias internas, fondeo y retiros

    on-chain, y screening KYC. Cada cuenta mantiene cuatro saldos virtuales

    independientes — USDT (la moneda operativa), USDC, BTC y GOLD (gramos de

    oro fino) — convertibles a demanda con swaps.

    Los payouts y las comisiones de servicios pueden pagarse desde cualquiera

    de los cuatro saldos (`PUT /v1/settlement` u override por payout con

    `settlement_asset`), y los payins pueden auto-convertirse al asset que

    elijas (`default_payin_asset`).


    Todos los montos son strings decimales en la precisión de cada moneda (6

    decimales para USDT/USDC/GOLD, 8 para BTC). Los errores siempre devuelven

    `{"error": "<code>", "message": "<detail>"}`.

    '
servers:
- url: https://api.qbank.cl/platform
  description: Live (producción, dinero real)
- url: https://cryptobank.qbank.cl/platform
  description: Test (sandbox, dinero simulado — keys pk_test_)
security:
- bearerAuth: []
tags:
- name: Comprobantes
  description: Comprobante PDF brandeado por operacion, con verificacion publica de autenticidad (QR firmado),
    receipt_url en cada respuesta/webhook y envio automatico por email en estados finales.
- name: Autenticación
  description: Registra e inicia sesión de los miembros de la cuenta. Las sesiones duran 24 horas.
- name: Cuenta
  description: Perfil, miembros y llaves de API de la cuenta que llama.
- name: Saldos
  description: Saldos, historial de movimientos y tasas de cambio.
- name: Payouts
  description: Dispersiones fiat que se debitan del saldo de settlement que elijas (USDT por defecto).
- name: Payins
  description: Recargas fiat (QR, transferencias, cuentas dedicadas, cobros pull, tarjetas, links de
    checkout) que se acreditan automáticamente — en USDT por defecto, o convertidas al settlement asset
    que elijas.
- name: Checkout
  description: >-
    Links de checkout universal (`POST /v1/payins` con `method: "checkout"`) y los endpoints
    públicos de la página de pago — fiat multi-país, crypto con wallet efímera por link y pago
    directo CBPay, liquidado en el asset que elijas.
- name: Tarjetas guardadas
  description: >-
    Tarjetas guardadas con el consentimiento explícito del pagador durante un pago 3-D Secure
    (COF). Listarlas, revocarlas y cobrarlas bajo demanda (MIT) sin pedir la tarjeta de nuevo.
- name: Suscripciones
  description: >-
    Cobros recurrentes sobre una tarjeta guardada gestionados por el scheduler de la plataforma
    — diarios, semanales, mensuales o anuales, con pausa/reanudación/cancelación y dunning
    automático.
- name: Transferencias
  description: Transferencias internas gratuitas entre cuentas CBPay (persona o empresa, cualquier combinación).
- name: Contacts
  description: Libreta de beneficiarios por cuenta (destinos CBPay, bancarios y crypto) con match por
    teléfono y auto-guardado en cada envío.
- name: Swaps
  description: Conversión instantánea entre los saldos USDT, USDC, BTC y GOLD de la cuenta a la tasa
    cotizada de la cuenta.
- name: Crypto
  description: Fondeo y retiros on-chain (TRON, Ethereum y Bitcoin).
- name: Wallets segregadas
  description: Wallets on-chain con saldo propio (empresas ilimitadas; personas 1 por combinación red+activo)
    — crear, importar, enviar, exportar la llave privada y auto-forward. El saldo vive on-chain, nunca
    en el ledger.
- name: Pruebas de firma
  description: Firma criptográfica de mensajes con wallets (EIP-191 ETH/EVM, TIP-191 TRON) — crear,
    listar, consultar y revocar pruebas de firma con verificación pública.
- name: Vínculos de wallets
  description: Vincula wallets externas (custody=client) a tu cuenta firmando un desafío nonce —
    crear desafíos, verificar firmas, listar y revocar vínculos.
- name: QR Crypto POS
  description: "Cobros QR crypto con monto para procesadores con POS físicos (cuentas empresa): merchants verificados, dirección exclusiva + QR por cobro, detección temprana del pago, conciliación por merchant y devoluciones por el riel de retiro crypto."
- name: KYC / KYB
  description: 'Verificación de identidad: KYC para personas, KYB para empresas — tu propio onboarding
    y verificaciones de terceros para cuentas empresa.'
- name: Screening de wallets
  description: Evaluación de riesgo AML de direcciones blockchain (sanciones, exposición a fondos ilícitos)
    con comisión por scan, más protección automática gratuita en retiros y depósitos.
- name: AML screening
  description: Screening AML standalone de personas y empresas contra listas de sanciones, PEP y medios
    adversos, con re-screening, monitoreo continuo e informe PDF descargable.
- name: Qscore
  description: Buró de crédito API-first. Emite informes crediticios completos con score 1-999 (bandas A-E, o SC cuando
    no hay datos), consulta el último score de un sujeto y gestiona disputas ARCO. Chile primero, con diseño
    agnóstico al país. Cada informe emitido lleva un código de verificación pública.
- name: Analytics
- name: Webhooks
  description: Suscripciones para recibir notificaciones de eventos firmadas.
- name: Estado
  description: Disponibilidad del servicio.
- name: Banking
  description: 'Cuentas bancarias reales: recibe, mantén y envía dinero por rieles bancarios internacionales.'
- name: Cards
  description: Tarjetas virtuales y físicas que gastan Just-In-Time del saldo que elijas (USDT, USDC,
    BTC o GOLD), con límites de gasto por tarjeta.
- name: Seguridad (OTP)
  description: Códigos de verificación de un solo uso por SMS/WhatsApp/email que protegen acciones sensibles,
    más las preferencias de 2FA self-service. Aplican solo a sesiones de usuario — las API keys quedan
    exentas.
- name: Passkeys
  description: Inicio de sesión sin contraseña con la biometría del dispositivo (Face ID, Touch ID, Windows
    Hello, llaves de seguridad) vía WebAuthn, apps autenticadoras (TOTP) con códigos de respaldo, y gestión
    de sesiones/dispositivos.
- name: Login social
  description: Registro e inicio de sesión sin contraseña con Google, Apple, Microsoft y Facebook vía
    token exchange. El front obtiene la credencial del proveedor; la API la verifica y emite la sesión
    CBPay.
- name: Eventos en tiempo real
  description: >-
    Stream Server-Sent Events con todo lo que pasa en la cuenta (o en toda la organización para administradores), replay con `Last-Event-ID`, snapshot inicial opcional e historial consultable de 90 días.
paths:
  /v1/payouts/{payoutID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getPayoutReceipt
      summary: Descargar el comprobante del payout (PDF)
      description: Comprobante PDF brandeado del payout, con los datos del beneficiario, montos, badge
        de estado y el QR de verificación firmado. Los estados no finales llevan marca de agua diagonal.
        Solo el dueño del payout (o el admin de la org) puede descargarlo.
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payins/{payinID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getPayinReceipt
      summary: Descargar el comprobante del payin (PDF)
      description: Comprobante PDF brandeado del cobro, con la referencia, montos, badge de estado y el
        QR de verificación firmado. Los estados no finales llevan marca de agua diagonal.
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{transferID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getTransferReceipt
      summary: Descargar el comprobante de la transferencia (PDF)
      description: Comprobante PDF brandeado de la transferencia interna (las dos partes pueden descargarlo;
        la contraparte se muestra por display name).
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/withdrawals/{withdrawalID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCryptoWithdrawalReceipt
      summary: Descargar el comprobante del retiro crypto (PDF)
      description: Comprobante PDF brandeado del retiro on-chain, con la red, dirección de destino, tx
        hash y el QR de verificación firmado.
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/deposits/{depositID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCryptoDepositReceipt
      summary: Descargar el comprobante del depósito crypto (PDF)
      description: Comprobante PDF brandeado de un depósito on-chain acreditado. El `depositID` es el
        campo `deposit_id` que devuelve `GET /v1/crypto/transactions`.
      parameters:
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps/{swapID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getSwapReceipt
      summary: Descargar el comprobante del swap (PDF)
      description: Comprobante PDF brandeado de la conversión de saldos, con las dos puntas, la tasa aplicada
        y el QR de verificación firmado.
      parameters:
      - name: swapID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/{cardID}/transactions/{transactionID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getCardTransactionReceipt
      summary: Descargar el comprobante de la compra con tarjeta (PDF)
      description: Comprobante PDF brandeado de una transacción de tarjeta, con el comercio, monto USD,
        saldo debitado y el QR de verificación firmado.
      parameters:
      - name: cardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/operations/{operationID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getBankingOperationReceipt
      summary: Descargar el comprobante de la operación bancaria (PDF)
      description: Comprobante PDF brandeado de una operación bancaria (monto, moneda, contraparte, estado)
        con el QR de verificación firmado. Disponible para operaciones creadas desde que el espejo de
        trazabilidad quedó activo.
      parameters:
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/sends/{sendID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getWalletSendReceipt
      summary: Descargar el comprobante del envío desde wallet segregada (PDF)
      description: Comprobante PDF brandeado de un envío on-chain desde una wallet segregada, con la red,
        dirección destino, hash de la transacción y el QR de verificación firmado.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sendID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/deposits/{depositID}/receipt:
    get:
      tags:
      - Comprobantes
      operationId: getWalletDepositReceipt
      summary: Descargar el comprobante del depósito en wallet segregada (PDF)
      description: Comprobante PDF brandeado de un depósito on-chain recibido en una wallet segregada,
        con la red, dirección de origen, hash de la transacción y el QR de verificación firmado.
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/reports/{code}:
    get:
      security: []
      tags:
      - KYC / KYB
      operationId: verifyReport
      summary: Verificar la autenticidad de un informe (público)
      description: >-
        Endpoint público (sin credenciales) detrás del QR impreso en cada informe de verificación. El
        código va firmado criptográficamente - uno adulterado o inventado responde 404 con valid=false.
        La respuesta solo expone el tipo (KYC/KYB), el estado VIGENTE de la decisión y su fecha - jamás
        la identidad del sujeto, sus documentos ni resultados AML. Los navegadores reciben una página
        HTML brandeada; los clientes API reciben JSON. Rate limit por IP.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código de verificación impreso en el informe (también embebido en la URL del QR).
      responses:
        '200':
          description: El informe es auténtico; hechos vigentes de la verificación.
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: kyb
                status: ok
                decision: approved
                date: '2026-07-21'
                issued_by: CBPay
        '404':
          description: Código de verificación inválido, adulterado o desconocido.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: Demasiados intentos de verificación desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreReport
      summary: Verificar la autenticidad de un informe Qscore (público)
      description: 'Endpoint público (sin credenciales) detrás del código de verificación impreso en cada informe
        crediticio Qscore. El código va firmado criptográficamente: uno adulterado o inventado responde 404 con
        `valid: false`. La respuesta solo expone hechos no sensibles: que el informe existe, su BANDA de score
        (nunca el score numérico) y su fecha de emisión — jamás la identidad del sujeto ni el detalle crediticio.
        Los navegadores reciben una página HTML brandeada; los clientes API reciben JSON. Rate limit por IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código de verificación impreso en el informe (el campo `verify_code` del recurso informe).
      responses:
        '200':
          description: El informe es auténtico; hechos no sensibles.
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: qscore
                status: ready
                decision: B
                date: '2026-08-08'
                issued_by: CBPay
        '404':
          description: Código de verificación inválido, adulterado o desconocido.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: Demasiados intentos de verificación desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSeal
      summary: Consultar la vigencia actual de un sello Qscore (público)
      description: 'Endpoint público (sin credenciales) detrás del sello Qscore que una
        empresa activa con `POST /v1/qscore/my-seal`. El código va firmado criptográficamente:
        uno adulterado o inventado responde 404 con `valid: false`. La elegibilidad se evalúa
        EN VIVO en cada llamada: la banda (A o B) solo se muestra mientras el sello está activo
        Y el sujeto sigue calificando (banda A/B con una evaluación de no más de 90 días). Un
        sello que dejó de calificar responde `seal_status: not_current` — anti-oráculo: la banda
        a la que cayó, el score numérico y la razón jamás se revelan. El score numérico NUNCA
        aparece en ninguna superficie pública. Los navegadores reciben una página HTML
        brandeada (`Accept: text/html`); los clientes API reciben JSON. Rate limit por IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código público de verificación del sello (el campo `verify_code` del recurso sello).
      responses:
        '200':
          description: El estado del sello, evaluado en vivo.
          content:
            application/json:
              examples:
                active:
                  summary: Sello vigente (activo y todavía elegible)
                  value:
                    valid: true
                    type: qscore_seal
                    seal_status: active
                    band: A
                    evaluated_at: '2026-08-07'
                    company_name: Comercial Andes SpA
                    doc_id: 76.543.210-3
                    country: CL
                revoked:
                  summary: Sello revocado por el titular (permanente para ese código)
                  value:
                    valid: false
                    seal_status: revoked
                    revoked_at: '2026-08-09'
                not_current:
                  summary: Sello ya no elegible (banda cayó o score envejeció) — la razón nunca se revela
                  value:
                    valid: false
                    seal_status: not_current
        '404':
          description: Código de verificación inválido, adulterado o desconocido.
          content:
            application/json:
              example:
                valid: false
                seal_status: not_current
        '429':
          description: Demasiados intentos de verificación desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}/badge.svg:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSealBadge
      summary: Badge SVG embebible con el estado vivo del sello (público)
      description: 'Endpoint público (sin credenciales) que renderiza el sello Qscore
        embebible como imagen SVG (180x64, fondo oscuro). Mientras el sello está activo
        y el sujeto sigue calificando, el badge muestra la letra de la banda actual (A o B)
        en verde con la etiqueta "VERIFICADO"; si no, la MISMA URL renderiza un badge gris
        con la etiqueta "NO VIGENTE" — nunca muestra una banda desactualizada y nunca rompe
        la página que lo hospeda. `Cache-Control: public, max-age=300` (los visitantes pueden
        cachear la imagen hasta 5 minutos). Responde 404 con cuerpo vacío solo para códigos
        inválidos o adulterados.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código público de verificación del sello (el campo `verify_code` del recurso sello).
      responses:
        '200':
          description: El badge SVG con el estado vivo del sello.
          content:
            image/svg+xml:
              schema:
                type: string
              example: '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="64">...</svg>'
        '404':
          description: Código de verificación inválido, adulterado o desconocido (cuerpo vacío).
  /verify/receipts/{code}:
    get:
      security: []
      tags:
      - Comprobantes
      operationId: verifyReceipt
      summary: Verificar la autenticidad de un comprobante (público)
      description: 'Endpoint PÚBLICO (sin credenciales) detrás del QR impreso en cada comprobante. El
        código viene firmado criptográficamente: uno adulterado o inventado responde 404 con `valid: false`.
        La respuesta muestra el estado y monto REALES y vigentes de la operación — jamás datos personales
        del beneficiario. Los navegadores reciben una página HTML brandeada; los clientes API reciben
        JSON. Rate-limited por IP.'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Código de verificación impreso en el comprobante (también embebido en la URL del
          QR).
      responses:
        '200':
          description: El comprobante es auténtico; datos vigentes de la operación.
          content:
            application/json:
              example:
                valid: true
                type: payout
                status: ok
                raw_status: completed
                amount: 800.00 VES
                detail: Venezuela — Pago Móvil
                date: 2026-07-11 15:29 UTC
                issued_by: CBPay
        '404':
          description: Código de verificación inválido, adulterado o desconocido.
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any receipt issued by this platform
        '429':
          description: Demasiados intentos de verificación desde esta IP.
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /v1/track-link:
    get:
      tags:
      - Comprobantes
      operationId: getTrackLink
      summary: Obtener el link público de seguimiento de una transacción
      description: 'Devuelve el link público compartible de cualquier transacción
        de tu alcance de lectura, sin descargar el PDF del comprobante — la pieza
        base de un botón "Compartir link" en tu UI. El `code` es el mismo código
        determinista firmado con HMAC que se imprime como QR en cada comprobante,
        así que llamar el endpoint dos veces para la misma transacción devuelve
        siempre el mismo link, y quien reciba el link puede seguir la operación en
        la página pública de seguimiento (`GET /v1/public/track/{code}`, estilo
        Wise: timeline, descarga del PDF, tres idiomas). Disponible para la propia
        cuenta (API key o sesión de miembro), para admins de la organización y para
        admins de plataforma — el mismo alcance de lectura que los comprobantes.
