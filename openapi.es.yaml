  /v1/transfers:
    post:
      tags:
      - Transferencias
      operationId: createTransfer
      summary: Crear una transferencia interna
      description: 'Mueve saldo entre dos cuentas CBPay, de forma atómica y siempre gratuita — funciona
        cualquier combinación: persona a persona, persona a empresa, empresa a persona o empresa a empresa.
        Funciona con los cuatro saldos virtuales (`USDT` default, `USDC`, `BTC`, `GOLD`) y siempre entre
        saldos de la **misma moneda** (sin conversión). El destino se resuelve por `to_account_id`, `to_email`,
        `to_phone` (solo teléfonos verificados por OTP) o `to_contact_id`. Cada transferencia guarda al
        destinatario como contacto automáticamente (desactívalo con `save_contact: false`). Los suscriptores
        de webhooks del receptor reciben `transfer_received`.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                to_account_id:
                  type: string
                  format: uuid
                to_email:
                  type: string
                  format: email
                to_phone:
                  type: string
                  description: Teléfono E.164 de la cuenta destino. Solo resuelven cuentas con el teléfono
                    verificado por OTP (si no, 404 recipient_not_found; 422 recipient_ambiguous si más
                    de una cuenta comparte el número).
                to_contact_id:
                  type: string
                  format: uuid
                  description: Envía directo a un contacto de tu libreta (usa su cuenta CBPay enlazada,
                    o su teléfono verificado).
                to_qr_token:
                  type: string
                  description: Token del QR de perfil de la cuenta destino (escaneado desde su QR
                    CBPay). También acepta el payload extendido del QR de checkout
                    (`cbpay:pay?to=…&checkout=…`) — el checkout token embebido se honra
                    automáticamente.
                checkout_token:
                  type: string
                  description: Token opcional de un link de cobro universal para pagarlo directo. El
                    destino se fuerza a la cuenta del link y el monto debe cubrir el due cotizado
                    server-side en el asset elegido (`422 checkout_amount_mismatch` con el due
                    actualizado si no). Al completar, el link se liquida y auto-convierte a su
                    `settlement_asset`.
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: Moneda del saldo a mover; el destino recibe en esta misma moneda.
                amount:
                  type: string
                  description: String decimal positivo, hasta los decimales de la moneda (6 para USDT/USDC/GOLD,
                    8 para BTC).
                  example: '10.500000'
                description:
                  type: string
                idempotency_key:
                  type: string
                save_contact:
                  type: boolean
                  default: true
                  description: El destino se guarda como contacto automáticamente; envía false para no
                    guardarlo.
            examples:
              by_phone:
                summary: Por teléfono verificado
                value:
                  to_phone: '+56987654321'
                  amount: '25.000000'
                  description: Almuerzo
                  idempotency_key: lunch-2026-07-10-a
              by_contact:
                summary: A un contacto guardado
                value:
                  to_contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  amount: '10.000000'
                  idempotency_key: t-991
              by_email:
                summary: Persona → persona, por email
                value:
                  to_email: carlos@example.com
                  amount: '25.000000'
                  description: Expense split
                  idempotency_key: split-2026-07-06-a
              by_account_id:
                summary: Persona → empresa, por account_id
                value:
                  to_account_id: ae8cf540-22a9-414d-82cc-8ac04732be4f
                  amount: '120.500000'
                  description: Monthly service payment
                  idempotency_key: serv-2026-07-a
              payroll:
                summary: Empresa → persona (nómina)
                value:
                  to_email: employee@example.com
                  amount: '850.000000'
                  description: July salary
                  idempotency_key: payroll-2026-07-emp01
              gold:
                summary: En otra moneda (GOLD, gramos de oro)
                value:
                  to_email: carlos@example.com
                  asset: GOLD
                  amount: '2.500000'
                  description: Gold gift
                  idempotency_key: gold-2026-07-09-a
      responses:
        '201':
          description: Transferencia completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: Expense split
                status: completed
                created_at: '2026-07-07T12:00:00Z'
        '200':
          description: Respuesta idempotente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 2a7b9c1d-4e5f-6a70-8b9c-0d1e2f3a4b5c
                from_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                to_account_id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                asset: USDT
                amount: '25.000000'
                description: Expense split
                status: completed
                created_at: '2026-07-07T12:00:00Z'
                idempotency_hit: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '404':
          description: Destino no encontrado (`recipient_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recipient_not_found
                message: no account matches that email
        '422':
          description: El destino no puede recibir transferencias (`recipient_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recipient_unavailable
                message: destination account cannot receive transfers
        '401':
          $ref: '#/components/responses/Unauthorized'
