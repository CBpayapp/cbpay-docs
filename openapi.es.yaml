  /v1/segregated-wallets/{walletID}/signatures:
    post:
      tags:
      - Pruebas de firma
      operationId: signSegregatedWalletMessage
      summary: Firmar un mensaje con una wallet segregada
      description: "Crea una prueba de firma: la wallet segregada (`custody=cbpay`) firma\n
        un sobre estructurado **CBPay Signature Proof** (anti-phishing) con el estándar\n
        nativo de la red — EIP-191 para ETH/EVM, TIP-191 para TRON. La prueba queda\n
        persistida y es verificable públicamente en `verify_url` (sin auth).\n\n
        **Requiere OTP** (código de un solo uso) cuando la acción `sign_message` está\n
        protegida en la política de la cuenta. La wallet debe estar `custody=cbpay`:\n
        una wallet exportada (`custody=client`) ya no puede firmar (`custody_transferred`).\n\n
        El sobre vive 10 minutos; una prueba firmada sigue siendo verificable después\n
        de expirar. Emite el webhook `wallet_signature_created` y un email de seguridad\n
        al titular de la cuenta.\n\n
        Errores específicos: `invalid_purpose`, `invalid_statement`,\n
        `custody_transferred`, `proof_not_signable`, `sign_rejected`,\n
        `nonce_failed`, `core_unavailable`."
      parameters:
      - name: walletID
        in: path
        required: true
        description: ID de la wallet segregada.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [wallet_ownership, treasury_attestation]
                  description: Propósito de la prueba (default `wallet_ownership`). `wallet_link` no se acepta aquí — usa `POST /v1/wallet-links/challenges` para vincular una wallet externa.
                statement:
                  type: string
                  description: Declaración opcional que la wallet atestigua (máx. 140 runas).
            example:
              purpose: wallet_ownership
              statement: I control this wallet
      responses:
        '201':
          description: Prueba de firma creada y firmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proof:
                    $ref: '#/components/schemas/SignatureProof'
              example:
                proof:
                  proof_id: c41d2a88-7f3e-4b21-9c6d-2e8f1a5b7d90
                  account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
                  wallet_id: b7e39c14-2d56-4e78-8a01-3c5d7e9f1b24
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
