      summary: Descargar mi informe de verificación (PDF/JSON)
      description: >-
        Informe de compliance de tu propia verificación de onboarding, generado por la plataforma:
        identidad verificada, ciclo de vida, documentos + OCR, liveness (una entrada por sesión - el
        check de onboarding más cualquier recaptura de evidencia posterior, cada una con su propio
        session_id y purpose) y una sección AML AGREGADA (estado de sanciones / PEP / medios adversos,
        jamás el detalle de coincidencias). Usa format=pdf (default) o format=json, y lang=en|es|zh.
        Gratis - la verificación ya se cobró al crearse. El PDF imprime un código público de
        verificación + QR consultable por cualquiera en /verify/reports/{code}.
