  /v1/kyc/submissions/{submissionID}/liveness_link:
    post:
      tags:
      - KYC / KYB
      operationId: createKycLivenessLink
      summary: Crear un liveness link
      description: Página hosteada donde tu cliente completa SOLO la prueba de vida en video (gestos frente
        a la cámara + face match server-side contra el documento de identidad subido). Gratis — el servicio
        se cobró al crear la submission. Si hay un link vigente se devuelve el mismo; si la prueba ya
        fue superada, 400 liveness_already_completed.
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: 1-30, default 7.
            example:
              expires_in_days: 7
      responses:
        '200':
          description: Liveness link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  expires_at:
                    type: integer
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: pending
                expires_at: 1751234567
        '400':
          description: liveness_already_completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: liveness_already_completed
                message: the liveness check already passed for this submission
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - KYC / KYB
      operationId: getKycLivenessLink
      summary: Consultar el liveness link y su estado
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Último link más el estado actual del check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  liveness:
                    type: object
                    properties:
                      status:
                        type: string
                      outcome:
                        type: string
                      passed:
                        type: boolean
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: completed
                liveness:
                  status: completed
                  outcome: PASS
                  passed: true
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/kyc/submissions/{submissionID}/verification-report:
    get:
      tags:
      - KYC / KYB
      operationId: getKycVerificationReport
      summary: Informe de verificación de un KYC tuyo (PDF/JSON)
      description: >-
        Informe de compliance COMPLETO de una verificación que corriste sobre tu cliente (solo cuentas
        empresa): perfil verificado, ciclo de vida, documentos + OCR, liveness (una entrada por sesión -
        el check de onboarding más cualquier recaptura de evidencia posterior, cada una con su propio
        session_id y purpose; en un KYB, cada parte relacionada puede tener más de una sesión también) y
        la sección AML COMPLETA con detalle de coincidencias - eres el responsable de los datos de tus
        terceros. Si la submission resulta ser tu propio onboarding, la sección AML baja a la versión
        agregada. Usa format=pdf (default) o format=json, y lang=en|es|zh. Gratis - es lectura de una
        verificación ya cobrada. Si la submission aún no tiene screening AML enlazado, se dispara uno
        on-demand (idempotente, sin fee); si no está disponible, el informe sale igual con el hueco
        declarado en el campo partial.
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Id de la submission.
      - name: format
        in: query
        schema:
          type: string
          enum:
          - pdf
          - json
        description: Formato del informe - pdf (default) o json.
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - en
          - es
          - zh
