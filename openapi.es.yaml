  /v1/stored-cards/{storedCardID}/charges:
    post:
      tags:
      - Tarjetas guardadas
      operationId: chargeStoredCard
      summary: 'Cobrar una tarjeta guardada (iniciado por el comercio)'
      description: 'Cobra la tarjeta guardada SIN el pagador presente (MIT bajo el mandato de las marcas, citando la semilla 3-D Secure consentida original). Usa `recurring: true` para cobros de suscripción a intervalos fijos; false (default) para cobros no programados. Requiere `idempotency_key` — un retry con la misma clave devuelve el payin original y jamás cobra dos veces. El cobro aprobado acredita el saldo automático (webhook `payin_credited`); un cobro declinado responde 422 con el payin marcado failed.'
      parameters:
      - name: storedCardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - idempotency_key
              properties:
                amount:
                  type: string
                currency:
                  type: string
                description:
                  type: string
                recurring:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
            example:
              amount: '45.00'
              description: Monthly subscription
              recurring: true
              idempotency_key: sub-2026-07-cust1042
      responses:
        '201':
          description: 'Cobro aceptado: los aprobados acreditan automático; consulta el estado del payin.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  reference:
                    type: string
                  transaction_id:
                    type: string
                  note:
                    type: string
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: pending
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                transaction_id: '7846012604816236704806'
                note: charge approved; the balance is credited automatically (payin_credited webhook)
        '200':
          description: 'Replay idempotente — el payin original.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  idempotency_hit:
                    type: boolean
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: credited
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                idempotency_hit: true
        '422':
          description: 'Tarjeta declinada por el emisor, tarjeta guardada revocada, o el cobro fue rechazado antes de capturar (p. ej. la tarjeta guardada tiene una dirección de facturación incompleta en archivo).'
          content:
            application/json:
              schema:
                type: object
              examples:
                declined:
                  value:
                    payin_id: cb781262-a53f-4ec8-a833-013edcf907d3
                    status: failed
                    reference: cb781262-a53f-4ec8-a833-013edcf907d3
                    failure_reason: DECLINED
                revoked:
                  value:
                    error: stored_card_revoked
                    message: the stored card is revoked
                core_rejected:
                  value:
                    error: core_rejected
                    message: 'bill_to is incomplete and the stored credential has no billing address on file: send bill_to (first_name, last_name, email, address1, locality, postal_code, country) or re-register the card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/subscriptions:
