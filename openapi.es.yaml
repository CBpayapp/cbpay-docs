  /v1/rates:
    get:
      tags:
      - Saldos
      operationId: getRates
      summary: Obtener mis tasas de cambio y comisiones
      description: Devuelve las tasas de cambio que aplican a la cuenta que llama para cada país — las
        mismas tasas usadas cuando las operaciones se ejecutan (`local_amount / rate = USDT`) — más la
        configuración de comisiones **efectiva** de la cuenta — los defaults de la organización ya resueltos
        contra los overrides de tu cuenta — para calcular el costo exacto de una operación antes de crearla.
        `rate` es la punta de payouts (dispersiones) y `payin_rate` la de payins (depósitos). `asset_prices`
        trae el precio USD de referencia de cada saldo virtual (BTC por unidad, GOLD por gramo; los stablecoins
        valen 1 por convención) para valorizar. El bloque `settlement` muestra, por asset habilitado,
        el **precio efectivo de settlement** que tu cuenta obtendría ahora mismo si pagara una operación
        desde ese saldo (`settlement_rate`, spread incluido) y si el asset está `available` — úsalo para
        estimar antes de enviar `settlement_asset` en un payout.
      responses:
        '200':
          description: Tasas, precios de referencia por activo y comisiones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          description: Tasa aplicada a los payouts (dispersiones).
                          example: '950.123456'
                        payin_rate:
                          type: string
                          description: Tasa aplicada a los payins (depósitos/cobros fiat).
                          example: '955.10'
                  asset_prices:
                    type: object
                    description: Precio USD de referencia por activo del saldo virtual (display/valorización).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          description: Unidad a la que refiere el precio (`btc`, `gram`, `usdt`, `usdc`).
                          example: gram
                        price:
                          type: string
                          example: '107.5341'
                        updated_at:
                          type: string
                          description: Cuándo se actualizó este precio por última vez.
                        settlement_grade:
                          type: boolean
                          description: True cuando el precio está lo bastante fresco para ejecutar settlements
                            (operaciones pagadas desde ese saldo).
                  settlement:
                    type: object
                    description: Pricing de settlement efectivo para la cuenta que llama.
                    properties:
                      default_asset:
                        type: string
                        description: El saldo desde el que se debitan las operaciones cuando no se envía
                          un override `settlement_asset`.
                        example: USDT
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: BTC
                            available:
                              type: boolean
                              description: False cuando el asset no puede usarse en este momento (deshabilitado
                                o sin precio de ejecución).
                            settlement_rate:
                              type: string
                              description: Precio USD efectivo por unidad al que se valoraría tu saldo
                                (spread incluido); vacío cuando no está disponible.
                              example: '109029.34'
                  updated_at:
                    type: string
                  fees:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeConfig'
              example:
                base: USD
                rates:
                  chile:
                    currency: CLP
                    rate: '950.25'
                    payin_rate: '955.10'
                  mexico:
                    currency: MXN
                    rate: '17.50'
                    payin_rate: '17.62'
                  peru:
                    currency: PEN
                    rate: '3.72'
                    payin_rate: '3.75'
                asset_prices:
                  USDT:
                    currency: USD
                    unit: usdt
                    price: '1'
                  USDC:
                    currency: USD
                    unit: usdc
                    price: '1'
                  BTC:
                    currency: USD
                    unit: btc
                    price: '109853.24'
                    updated_at: '2026-07-07T11:59:41Z'
                    settlement_grade: true
                  GOLD:
                    currency: USD
                    unit: gram
                    price: '107.5341'
                    updated_at: '2026-07-07T09:12:05Z'
                    settlement_grade: true
                settlement:
                  default_asset: USDT
                  assets:
                  - asset: USDT
                    available: true
                    settlement_rate: '1'
                  - asset: USDC
                    available: true
                    settlement_rate: '0.99900000'
                  - asset: BTC
                    available: true
                    settlement_rate: '109029.34070000'
                  - asset: GOLD
                    available: true
                    settlement_rate: '106.99642950'
                updated_at: '2026-07-07T12:00:00Z'
                fees:
                - id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                  org_id: 1c9e7a2b-5f6d-4e3a-8c1b-2a9d8e7f6a5b
