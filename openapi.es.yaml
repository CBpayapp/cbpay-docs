  /v1/balances:
    get:
      tags:
      - Saldos
      operationId: getBalances
      summary: Obtener saldos
      description: Los cuatro saldos virtuales independientes de la cuenta que llama (USDT — la moneda
        operativa —, USDC, BTC y GOLD en gramos de oro fino). Todos los activos soportados vienen siempre,
        con ceros si la cuenta no ha usado esa moneda. Si la cuenta usa Banking, sus saldos espejo BANK_USD/BANK_EUR
        también se listan con el marcador `custody` en `banking` (el saldo autoritativo vive en el banco;
        estos saldos no son gastables dentro de la plataforma).
      responses:
        '200':
          description: Saldos de la cuenta que llama (uno por activo soportado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                balances:
                - asset: USDT
                  available: '125.430000'
                  held: '10.000000'
                  updated_at: '2026-07-07T12:00:00Z'
                - asset: USDC
                  available: '50.000000'
                  held: '0.000000'
                  updated_at: '2026-07-08T09:00:00Z'
                - asset: BTC
                  available: '0.00060000'
                  held: '0.00000000'
                - asset: GOLD
                  available: '12.500000'
                  held: '0.000000'
                - asset: BANK_USD
                  available: '7500.00'
                  held: '0.00'
                  custody: banking
                  updated_at: '2026-07-08T09:00:00Z'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/balances/history:
    get:
      tags:
      - Saldos
      operationId: getBalancesHistory
      summary: Obtener historial de saldos
      description: 'Evolución diaria de los saldos de la cuenta para gráficos de dashboard: una serie
        por asset (el saldo disponible de cierre de cada día, arrastrado en días sin movimientos) más
        una serie agregada en USD que valoriza BTC/GOLD al precio de referencia histórico de cada día.
        Incluye las entradas/salidas totales del período y el snapshot actual (available + held), para
        que el front arme una tarjeta de saldo estilo dashboard con su variación porcentual. La serie
        refleja el saldo **disponible** (los holds no tienen historia); `current` trae el `held` de hoy
        por asset. Los días valorizados con el precio spot de hoy (antes de que exista precio histórico)
        se declaran en `spot_priced_dates` — los valores jamás se inventan.


        El mapa `assets` incluye también los espejos de las cuentas banking (`BANK_USD`, `BANK_EUR`) como
        serie propia en su propia moneda (2 decimales). **No** forman parte del agregado `total_usd`,
        que cubre solo los saldos operativos (USDT, USDC, BTC, GOLD).

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha inicial (YYYY-MM-DD, zona horaria de la organización, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha final (YYYY-MM-DD, zona horaria de la organización, inclusive). Rango máximo 366 días.
      responses:
        '200':
          description: Serie diaria de saldo por asset más el agregado USD.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  timezone:
                    type: string
                    example: America/New_York
                  assets:
                    type: object
                    description: 'Una serie de saldo de cierre diario por asset. Incluye los saldos operativos
                      (USDT, USDC, BTC, GOLD) y los espejos de las cuentas banking (BANK_USD, BANK_EUR)
                      en su propia moneda; las series banking quedan fuera de `total_usd`.

                      '
                    additionalProperties:
                      type: object
                      properties:
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              balance:
                                type: string
                                example: '125.430000'
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                          description: Variación porcentual con signo primero→último (null cuando la serie
                            parte en cero).
                  total_usd:
                    type: object
                    description: Valor agregado en USD de todos los saldos por día.
                    properties:
                      series:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            balance_usd:
                              type: string
                      first:
                        type: string
                      last:
                        type: string
                      change_pct:
                        type: string
                        nullable: true
                      spot_priced_dates:
                        type: array
                        items:
                          type: string
                        description: Días valorizados con el precio spot de hoy porque no existía precio
                          histórico.
                      unpriced_assets:
                        type: array
                        items:
                          type: string
                        description: Assets excluidos del agregado USD por falta de precio.
                  period:
                    type: object
                    description: Entradas/salidas totales del período en USD.
                    properties:
                      in_usd:
                        type: string
                      out_usd:
                        type: string
                      net_usd:
                        type: string
                  current:
                    type: object
                    description: Snapshot actual (available + held, valorizado a spot).
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                            available:
                              type: string
                            held:
                              type: string
                            usd_estimate:
                              type: string
                              nullable: true
                      net_worth_usd_estimate:
                        type: string
                        nullable: true
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from: '2026-06-12'
                to: '2026-07-11'
                granularity: day
                timezone: America/New_York
                assets:
                  USDT:
                    series:
                    - date: '2026-06-12'
                      balance: '100.000000'
                    - date: '2026-06-13'
                      balance: '100.000000'
                    - date: '2026-07-11'
                      balance: '125.430000'
                    first: '100.000000'
                    last: '125.430000'
                    change_pct: '25.43'
                  BTC:
                    series:
                    - date: '2026-06-12'
                      balance: '0.00060000'
                    - date: '2026-07-11'
                      balance: '0.00060000'
                    first: '0.00060000'
                    last: '0.00060000'
                    change_pct: '0.00'
                  BANK_USD:
                    series:
                    - date: '2026-06-12'
                      balance: '1500.00'
                    - date: '2026-07-11'
                      balance: '1725.50'
                    first: '1500.00'
                    last: '1725.50'
                    change_pct: '15.03'
                total_usd:
                  series:
                  - date: '2026-06-12'
                    balance_usd: '163.73'
                  - date: '2026-07-11'
                    balance_usd: '191.34'
                  first: '163.73'
                  last: '191.34'
                  change_pct: '16.86'
                  spot_priced_dates: []
                  unpriced_assets: []
                period:
                  in_usd: '280.20'
                  out_usd: '254.77'
                  net_usd: '25.43'
                current:
                  items:
                  - asset: USDT
                    available: '125.430000'
                    held: '10.000000'
                    usd_estimate: '135.43'
                  - asset: USDC
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  - asset: BTC
                    available: '0.00060000'
                    held: '0.00000000'
                    usd_estimate: '65.91'
                  - asset: GOLD
                    available: '0.000000'
                    held: '0.000000'
                    usd_estimate: '0.00'
                  net_worth_usd_estimate: '201.34'
        '400':
          description: Rango de fechas faltante o inválido (`invalid_range`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_range
                message: from and to are required (YYYY-MM-DD)
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/movements:
    get:
      tags:
      - Saldos
      operationId: listMovements
      summary: Listar movimientos
      description: Historial inmutable del ledger de la cuenta que llama.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: asset
        in: query
        description: Filtra por moneda del saldo.
        schema:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
          example: USDT
      - name: type
        in: query
        description: Filtra por tipo de asiento del ledger.
        schema:
          type: string
          enum:
          - payout_debit
          - payout_refund
          - payin_credit
          - adjustment
          - transfer_in
          - transfer_out
          - funding
          - withdrawal_debit
          - withdrawal_refund
          - compliance_fee
          - compliance_refund
          - wallet_creation_fee
          - wallet_creation_refund
          - card_debit
          - card_refund
          - card_fee
          - card_fee_refund
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Filtra desde esta fecha (YYYY-MM-DD, zona horaria de la organización, inclusive).
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Filtra hasta esta fecha (YYYY-MM-DD, zona horaria de la organización, inclusive).
      - name: format
        in: query
        description: 'Exporta las mismas filas como archivo: `csv` o `xlsx` (descarga contable, hasta
          10.000 filas; mismos filtros y rango). Omite para la vista JSON.'
        schema:
          type: string
          enum:
          - csv
          - xlsx
      responses:
        '200':
          description: Movimientos paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementsResponse'
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                page: 1
                page_size: 50
                movements:
                - id: 0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0
                  asset: USDT
                  amount: '-86.014286'
                  type: payout_debit
