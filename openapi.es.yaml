  /pay/{token}/methods/{method}:
    post:
      security: []
      tags:
      - Checkout
      operationId: checkoutMaterialize
      summary: Materializar una opción de pago del checkout (público)
      description: >-
        Crea (lazy) la opción de pago que el pagador eligió en un link de cobro universal
        y devuelve sus instrucciones — la URL de pago para tarjeta/métodos hosted, el QR para
        métodos QR, la referencia de anuncio para transferencias bancarias, o una dirección de
        depósito crypto exclusiva con el monto exacto cotizado más un QR escaneable
        (`qr_payload` + `qr_png_base64` — siempre la dirección cruda para BTC/TRON/ETH,
        legible por wallets y exchanges; las URIs BIP-21/EIP-681 las rechazan apps
        como Binance). Los métodos fiat exigen `?country=XX`; el monto
        local se cotiza y CONGELA en ese momento. Cuando el país ofrece el método en más de una
        moneda (ver `options[]` del quote — ej. QR en BOB y USD, o los corredores de tarjeta)
        exige además `&currency=YYY`; cada moneda es una materialización independiente. Las
        transferencias bancarias en México emiten una CLABE dedicada exclusiva del link
        (`destination` con `dedicated: true`): el pagador transfiere el monto exacto SIN
        referencia — el abono se rutea al link automáticamente. Si la cuenta dedicada no puede
        emitirse, el payload degrada al camino clásico (cuenta del comercio + `reference`
        obligatoria en la glosa). Re-POST del
        mismo país+moneda+método devuelve la MISMA materialización; elegir un método nunca
        bloquea los demás mientras nadie pague. Sin credenciales; rate limit por IP.
        El cobro pull (`collect: true`) no lo ofrece ningún corredor actualmente.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token opaco del checkout embebido en la `checkout_url`.
      - name: method
        in: path
        required: true
        schema:
          type: string
        description: Método a materializar — un método fiat del catálogo multi-país (`qr`,
          `card`, `fintoc`, `bank_transfer`; exige `?country=XX`)
          o una opción crypto (`crypto:tron:usdt`, `crypto:eth:usdt`, `crypto:eth:usdc`,
          `crypto:btc:btc`; sin país).
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: País ISO-3166 alpha-2 del método fiat a materializar. Obligatorio para
          métodos fiat, ignorado para crypto.
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: Moneda del cargo de la materialización, elegida del catálogo `options[]`
          (o `cards[]`) del quote (ej. `BOB` o `USD`). Obligatoria cuando el país ofrece el
          método en más de una moneda; ignorada cuando hay una sola (la determina el país).
      responses:
        '200':
          description: Instrucciones del método de pago elegido.
          content:
            application/json:
