        '400':
          description: period debe usar YYYY-Q1, YYYY-Q2, YYYY-Q3 o YYYY-Q4
          content:
            application/json:
              examples:
                invalid_period:
                  value: {"error":"invalid_period","message":"period must use YYYY-Q1, YYYY-Q2, YYYY-Q3 or YYYY-Q4"}
