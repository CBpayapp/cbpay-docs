            Es igual a `total_debit` cuando el asset es USDT. Si el payout falla se reembolsa este monto
            exacto — nunca se re-cotiza.
        settlement_rate:
          type: string
          description: Precio USD efectivo por unidad del asset de settlement usado para convertir el
            total en USDT ("1" para USDT/USDC).
        beneficiary:
          type: object
