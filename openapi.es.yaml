                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [revoked]
                previous_status:
                  type: string
                revoked_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: revoked
              previous_status: pending
              revoked_at: '2026-08-10T10:02:11Z'
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  wallet_signature_created:
    post:
      summary: Prueba de firma de wallet creada
      description: 'Se creo una prueba de firma con una wallet segregada (`POST
        /v1/segregated-wallets/{walletID}/signatures`). La wallet firmo un mensaje
        con el estandar nativo de la red (EIP-191 para ETH/EVM, TIP-191 para TRON)
        dentro del sobre anti-phishing CBPay Signature Proof. La prueba se verifica
        publicamente en `verify_url` (sin auth).


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proof_id:
                  type: string
                account_id:
                  type: string
                wallet_id:
                  type: string
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                purpose:
                  type: string
                proof_code:
                  type: string
                  description: Codigo publico de la prueba (empieza con `G`).
                verify_url:
                  type: string
                  description: URL publica de verificacion (sin auth).
            example:
              proof_id: c41d2a88-7f3e-4b21-9c6d-2e8f1a5b7d90
              account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
              wallet_id: b7e39c14-2d56-4e78-8a01-3c5d7e9f1b24
              chain: eth
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
              purpose: wallet_ownership
              proof_code: Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
              verify_url: https://api.qbank.cl/platform/v1/public/signature-proofs/Gc41d2a887f3e4b219c6d2e8f1a5b7d90a1b2c3d4e5f60718293a
      responses:
        '200':
          description: Devuelve cualquier 2xx para confirmar la entrega.
  wallet_linked:
    post:
      summary: Wallet externa vinculada
      description: 'Se vinculo una wallet externa (`custody=client`) a la cuenta
        resolviendo un desafio nonce (`POST /v1/wallet-links/challenges` + `POST
        /v1/wallet-links/verify`). La wallet sigue bajo custodia del cliente; el
        vinculo solo prueba la titularidad de la direccion.


        Cada entrega incluye `X-Webhook-Event`, `X-Webhook-Event-ID`, `X-Webhook-Delivery-ID`, `X-Webhook-Timestamp`
        y `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`. Responde 2xx; hasta
        5 intentos con backoff incremental.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link_id:
                  type: string
                account_id:
                  type: string
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                proof_id:
                  type: string
                  description: Prueba de firma que respalda el vinculo.
            example:
              link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
              account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
