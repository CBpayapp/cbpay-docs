  /v1/banking/third-parties:
    post:
      tags:
      - Banking
      operationId: createBankingThirdParty
      summary: Da de alta un usuario banking de tercero (solo empresas)
      description: 'Las cuentas empresa dan de alta a sus clientes finales como usuarios banking separados,
        con cuentas a su nombre. Exige el verification_id de una verificación KYC/KYB APROBADA del tercero:
        el tipo sale del kind de la verificación (KYC = INDIVIDUAL, KYB = COMPANY), la identidad se completa
        sola desde el perfil verificado (los campos explícitos ganan) y los documentos ya validados se
        re-entregan automáticamente al proveedor bancario (documents_synced). Cobra el fee de perfil bancario
        (se reembolsa si el core rechaza). Las cuentas persona reciben 403 company_required.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verification_id
              properties:
                verification_id:
                  type: string
                  format: uuid
                  description: submission_id de una verificación KYC/KYB de terceros APROBADA.
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                  description: 'Opcional: debe calzar con el kind de la verificación.'
                name:
                  type: string
                  description: 'Opcional: se completa desde el perfil verificado.'
                email:
                  type: string
                  format: email
                  description: 'Opcional: se completa desde el perfil verificado.'
                country:
                  type: string
            example:
              verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
      responses:
        '201':
          description: Third-party banking user created.
          content:
            application/json:
              example:
                third_party_id: 7f2a1b3c-0000-1111-2222-333344445555
                customer_id: cus_abc123
                kind: third_party
                status: pending
                verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                documents_synced: 2
                registered_at: '2026-07-10T15:00:00Z'
                banking_fee: '1.000000'
                banking_fee_asset: USDT
        '202':
          description: Solicitud retenida para revisión (la organización tiene la revisión de solicitudes activada).
            El recurso se crea solo cuando compliance aprueba la revisión; la comisión de emisión/apertura se cobra al
            retener y se reembolsa automáticamente si se rechaza. Sigue el resultado con el webhook
            `txn_review_status_changed` o `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '403':
          description: company_required
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch
            / verification_invalid
    get:
      tags:
      - Banking
      operationId: listBankingThirdParties
      summary: Lista los usuarios banking de terceros
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Third parties owned by the calling account.
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                third_parties:
                - id: 7f2a1b3c-0000-1111-2222-333344445555
                  customer_id: cus_abc123
                  kind: third_party
                  type: INDIVIDUAL
                  name: Carlos Mendes
                  created_at: '2026-07-10T15:00:00Z'
  /v1/banking/third-parties/{thirdPartyID}:
    get:
      tags:
      - Banking
      operationId: getBankingThirdParty
      summary: Consulta un usuario banking de tercero (estado KYC en vivo)
      parameters:
      - name: thirdPartyID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Third party with live verification status.
          content:
            application/json:
              example:
                third_party_id: 7f2a1b3c-0000-1111-2222-333344445555
                kind: third_party
                status: approved
        '404':
          description: not_found (does not exist or not owned by your account)
  /v1/banking/third-parties/{thirdPartyID}/documents:
    post:
      tags:
