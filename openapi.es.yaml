        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio risk deshabilitado o cuenta no verificada)
    post:
      tags: [Qscore]
      summary: Crear un link de consentimiento
      operationId: createRiskConsent
      description: 'Crea un link de autorizacion para el sujeto (flujo de
        consentimiento estilo Destacame): recibes una `consent_url` compartible y,
        si pasas `email`, la plataforma envia el link brandeado al titular por
        correo. El titular abre la pagina publica, conecta su banco via open
        finance y autoriza; un consent otorgado desbloquea la data bancaria
        positiva del sujeto en sus informes Qscore. `country` y `doc_id`
        identifican al titular (el documento se valida con su digito verificador);
        `subject_type` se infiere del documento si se omite. `purpose` es
        obligatorio por la ley de proteccion de datos y `self_access` no esta
        permitido aqui (el informe self del titular vive en `POST
        /v1/qscore/my-report`). `expires_in_days` por defecto es 7 (maximo 30). La
        idempotencia es obligatoria: reintentar con la misma `idempotency_key`
        devuelve el consent original con `idempotency_hit: true` y jamas duplica
        el link ni re-envia el correo.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              country: CL
              doc_id: 12.345.678-5
              purpose: credit_evaluation
              email: maria@example.com
              expires_in_days: 7
              idempotency_key: consent-2026-08-09-001
      responses:
