  /v1/crypto/withdrawals:
    post:
      tags:
      - Crypto
      operationId: createCryptoWithdrawal
      summary: Crear un retiro on-chain
      description: 'Envía USDT, USDC o BTC on-chain desde su propio saldo. Pares soportados: `tron`/`USDT`,
        `eth`/`USDT`, `eth`/`USDC`, `btc`/`BTC` (GOLD no tiene riel on-chain). `amount + comisión de retiro`
        se debita atómicamente y queda retenido; el estado final llega vía el webhook `crypto_withdrawal_status_changed`.
        `failed` reembolsa el débito completo.'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                  default: tron
                asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  default: USDT
                  description: Activo a enviar (USDC solo por `eth`; en `btc` el activo por defecto
                    es `BTC`).
                to_address:
                  type: string
                to_contact_id:
                  type: string
                  format: uuid
                  description: Usa la dirección guardada del contacto para esta chain en vez de `to_address`
                    (un `to_address` explícito siempre gana).
                amount:
                  type: string
                  description: String decimal positivo, hasta 6 decimales (8 para BTC).
                idempotency_key:
                  type: string
                contact_name:
                  type: string
                  description: Nombre del contacto que se auto-guarda con esta dirección.
                save_contact:
                  type: boolean
                  default: true
                  description: La dirección se guarda como contacto automáticamente; envía false para
                    no guardarla.
                travel_address:
                  type: string
                  description: Travel Rule (FATF R.16) — la travel address de la institución beneficiaria
                    (código `ta…`) para retiros sobre el umbral de la org hacia otra institución. La dirección
                    de pago la entrega la institución receptora, por lo que `to_address` puede omitirse.
                wallet_type:
                  type: string
                  enum:
                  - self_hosted
                  description: Travel Rule — declara `self_hosted` cuando el destino es una wallet del
                    propio titular (exige `beneficiary_name`).
                beneficiary_name:
                  type: string
                  description: Travel Rule — nombre del titular del destino. Obligatorio sobre el umbral
                    (con `travel_address` o `wallet_type=self_hosted`).
