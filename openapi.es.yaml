                    purpose: funding_usdt
                    currency: EUR
                    iban: DE890000000000000000
                    iban_country: DE
                    status: active
                    client_order: platform:virtual-iban:org:account:funding_usdt:key-001
                    order_reference: provider-order-001
        '404':
          description: not_found.
        '503':
          description: Banking recovery or provider unavailable.
  /v1/banking/third-parties/{thirdPartyID}/virtual-ibans:
    post:
      tags: [Banking]
      operationId: createThirdPartyVirtualIBAN
      summary: Request a Banking EUR virtual IBAN for a third party
      description: Company accounts can request a `banking_eur` virtual IBAN for an owned, verified third party. The third party owns the Banking EUR balance; the company is the manager of the relationship.
      parameters:
        - {name: thirdPartyID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            examples:
              request:
                value:
                  idempotency_key: third-party-viban-2026-001
      responses:
        '202':
          description: Third-party request queued for approval.
          content:
            application/json:
              examples:
                pending:
                  value:
                    virtual_iban:
                      id: 2f8c1d4e-1111-4b22-8a33-000000000002
                      owner_account_id: 8a0c9d3e-2b7d-4bad-9bdd-2b0d7b3dcb6e
                      manager_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      purpose: banking_eur
                      currency: EUR
                      iban: ''
                      status: pending_approval
        '400':
          description: invalid_json or idempotency_key_required.
        '403':
          description: company_required, verification_required or service_disabled.
        '404':
          description: not_found.
        '503':
          description: banking_recovery_pending.
    get:
      tags: [Banking]
      operationId: listThirdPartyVirtualIBANs
      summary: List a third party's Banking EUR virtual IBANs
      parameters:
        - {name: thirdPartyID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Paginated third-party virtual IBANs.
          content:
            application/json:
              examples:
                list:
                  value:
                    page: 1
                    page_size: 50
                    virtual_ibans:
                      - id: 2f8c1d4e-1111-4b22-8a33-000000000002
                        owner_account_id: 8a0c9d3e-2b7d-4bad-9bdd-2b0d7b3dcb6e
                        manager_account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        purpose: banking_eur
                        currency: EUR
                        iban: DE890000000000000000
                        iban_country: DE
                        status: active
        '400':
          description: invalid_range.
        '404':
          description: not_found.

  /v1/banking/virtual-ibans/{virtualIBANID}/balance:
    get:
      tags: [Banking]
      operationId: getVirtualIBANBalance
      summary: Get a Banking EUR virtual IBAN balance
      description: Returns the reconciled platform ledger balance for a `banking_eur` virtual IBAN. A `funding_usdt` virtual IBAN does not hold BANK_EUR.
      parameters:
        - {name: virtualIBANID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Reconciled BANK_EUR balance.
          content:
            application/json:
              examples:
                balance:
                  value:
                    virtual_iban_id: 2f8c1d4e-1111-4b22-8a33-000000000001
                    currency: EUR
                    asset: BANK_EUR
                    available: '80.00'
                    held: '0.00'
                    purpose: banking_eur
                    source: platform_ledger_reconciled_to_banking_provider
        '404':
          description: not_found.
        '409':
          description: balance_not_available for funding_usdt.
        '503':
          description: Banking ledger unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'JWT de sesión (de register/login) o llave de API (`pk_...`).

        `X-API-Key: <token>` se acepta como header alternativo.

        '
  parameters:
    receiptLang:
      name: lang
      in: query
      schema:
        type: string
        enum:
        - en
        - es
        - zh
        default: en
      description: Idioma del comprobante PDF. Por defecto ingles.
    cardID:
      name: cardID
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternativa al campo `idempotency_key` del body.
      schema:
        type: string
  responses:
    ReceiptPDF:
      description: Comprobante PDF brandeado con el QR de verificacion firmado.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          example: '%PDF-1.7 (binary receipt content)'
    BadRequest:
      description: Solicitud inválida (ver el código `error` para la validación específica).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: El saldo de la cuenta no alcanza para esta operación (`insufficient_funds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    InvalidRange:
      description: Filtro de fechas `from`/`to` inválido (`invalid_range`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_range
            message: invalid from date (YYYY-MM-DD)
    AccountRequired:
      description: Este endpoint requiere una credencial de cuenta (`account_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: Nivel de credencial no permitido para este endpoint (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: Recurso no encontrado (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: Credencial faltante o inválida (`unauthorized`).
      content:
        application/json:
          schema: *id016
          example:
            error: unauthorized
            message: invalid or missing credentials
  schemas:
    PosMerchant:
      type: object
      properties:
        merchant_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        name:
          type: string
        verification_id:
          type: string
          format: uuid
        external_ref:
          type: string
        fee_percent:
          type: string
        fee_fixed:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PosCharge:
      type: object
      properties:
        charge_id:
          type: string
          format: uuid
        payin_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - paid
          - expired
        amount:
          type: string
        settlement_asset:
          type: string
        crypto:
          type: string
        chain:
          type: string
        asset:
          type: string
        address:
          type: string
        due:
          type: string
        received:
          type: string
        refunded_total:
          type: string
