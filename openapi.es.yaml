  /consent/{token}:
    get:
      security: []
      tags:
      - Consentimiento
      operationId: getPublicConsent
      summary: Leer una solicitud de consentimiento (publico, titular)
      description: 'Vista publica de la solicitud de consentimiento detras de una
        `consent_url`. El token de la URL ES la capacidad (128 bits aleatorios,
        unico por consent): no se requiere login, y un token desconocido responde
        un 404 generico (anti-enumeracion). La respuesta es minima a proposito:
        `doc_id` va enmascarado a sus ultimos 4 caracteres, y el email, la
        identidad del titular y los ids internos jamas se exponen. Con rate limit
        por IP.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token opaco del consent embebido en la `consent_url`.
      responses:
        '200':
          description: Resumen de la solicitud para el titular.
          content:
            application/json:
              example:
                status: pending
                purpose: credit_evaluation
                country: CL
                subject_type: person
                doc_id: '********678-5'
                org:
                  name: ACME SpA
                  website: https://acme.example.com
                  logo_url: https://cdn.example.com/acme/logo.png
                expires_at: '2026-08-16T15:00:00Z'
        '404':
          description: Token desconocido.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '429':
          description: Demasiadas solicitudes desde esta IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
  /consent/{token}/begin:
    post:
      security: []
      tags:
      - Consentimiento
      operationId: beginPublicConsent
      summary: Iniciar la conexion bancaria (publico, titular)
      description: 'Abre la sesion de conexion bancaria del titular: devuelve el
        `widget_token` y la `public_key` que el widget de open finance necesita
        para renderizar el selector de instituciones. Solo un consent `pending`
        puede iniciar; cualquier otro estado devuelve `409 already_decided`. Con
        rate limit por IP.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sesion de conexion bancaria lista.
          content:
            application/json:
              example:
                widget_token: wtoken_2c7f9a1b4e5d40aa
                public_key: pk_prod_9a8f7e6d5c
                expires_at: '2026-08-09T15:30:00Z'
        '404':
          description: Token desconocido.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '409':
          description: El consent ya fue decidido.
          content:
            application/json:
              example:
                error: already_decided
                message: this consent link is no longer pending
        '429':
          description: Demasiadas solicitudes desde esta IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
  /consent/{token}/complete:
    post:
      security: []
      tags:
      - Consentimiento
      operationId: completePublicConsent
      summary: Otorgar el consentimiento tras conectar el banco (publico, titular)
      description: 'Completa el flujo despues de que el titular conecto su banco en
        el widget: la plataforma intercambia el `exchange_token`, exige que el
        vinculo bancario este `active` (`409 link_inactive`) y que el documento
        del titular verificado por el banco calce exactamente con el documento del
        sujeto (`409 holder_mismatch` — una cuenta de OTRO documento jamas otorga
        el consentimiento). Al completar, el consent queda `granted`, se sella la
        evidencia legal (IP y user agent), se gatilla la derivacion de data
        positiva y se emite el webhook `risk_consent_granted`.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              exchange_token: etok_7f3a9c1e2b4d46aa
      responses:
        '200':
          description: Consent otorgado.
          content:
            application/json:
              example:
                status: granted
                granted_at: '2026-08-10T09:21:44Z'
                holder_name: Maria Jose Contreras Soto
        '404':
          description: Token desconocido.
          content:
            application/json:
              example:
                error: not_found
                message: consent not found
        '409':
          description: 'already_decided | link_inactive | holder_mismatch'
          content:
            application/json:
              example:
                error: holder_mismatch
                message: the connected account belongs to a different document
        '429':
          description: Demasiadas solicitudes desde esta IP.
          content:
            application/json:
              example:
                error: rate_limited
                message: too many requests
        '502':
          description: El agregador bancario no pudo completar el intercambio.
          content:
            application/json:
              example:
                error: provider_error
                message: the banking connection could not be completed
  /consent/{token}/decline:
    post:
      security: []
