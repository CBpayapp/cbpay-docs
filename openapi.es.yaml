  /v1/rates/history:
    get:
      tags:
      - Saldos
      operationId: getRatesHistory
      summary: Obtener historial de tasas de cambio
      description: 'Serie temporal de las tasas de cambio que aplican a la cuenta que llama, para gráficos
        de evolución. Cada punto trae las mismas tasas que obtendrías operando en ese momento — `rate`
        (punta de payouts) y `payin_rate` (punta de depósitos) — y cada país incluye `first`, `last` y
        el `change_pct` con signo entre ambos, listo para el badge "+3.4% / -3.0%". `asset_prices` trae
        la serie de referencia USD de BTC y GOLD. Los buckets sin datos arrastran el valor anterior; los
        días previos al inicio del historial se omiten (jamás se inventan).

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha inicial (YYYY-MM-DD, zona horaria de la organización, inclusive).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha final (YYYY-MM-DD, zona horaria de la organización, inclusive).
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - day
          - hour
          default: day
        description: Tamaño del bucket. Rango máximo 366 días para `day` y 31 días para `hour`.
      - name: currency
        in: query
        schema:
          type: string
        description: Filtro opcional por moneda local (ej. CLP).
      responses:
        '200':
          description: Serie de tasas por país más series de precios de assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  base:
                    type: string
                    example: USD
                  from:
                    type: string
                  to:
                    type: string
                  granularity:
                    type: string
                    example: day
                  rates:
                    type: object
                    description: Una serie por país (mismas llaves que `GET /v1/rates`).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2026-07-10'
                              rate:
                                type: string
                                description: Tasa punta payout en ese bucket.
                                example: '950.123456'
                              payin_rate:
                                type: string
                                description: Tasa punta payin en ese bucket.
                                example: '978.912345'
                        first:
                          type: string
                          description: Primera tasa (punta payout) del rango.
                        last:
                          type: string
                          description: Última tasa (punta payout) del rango.
                        change_pct:
                          type: string
                          nullable: true
                          description: Variación porcentual con signo primero→último (píntala verde/roja
                            en el front).
                  asset_prices:
                    type: object
                    description: Series de precio USD de referencia de BTC y GOLD (solo display).
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          example: gram
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                              price:
                                type: string
                        first:
                          type: string
                        last:
                          type: string
                        change_pct:
                          type: string
                          nullable: true
                  retrieved_at:
                    type: string
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                base: USD
                from: '2026-06-12'
                to: '2026-07-11'
