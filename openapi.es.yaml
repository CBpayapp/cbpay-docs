  /v1/qscore/subjects/{docID}/monitoring:
    put:
      tags: [Qscore]
      summary: Suscribirse a un sujeto (monitoreo)
      operationId: putQscoreMonitoring
      description: 'Crea o actualiza la suscripción de monitoreo de tu cuenta a
        un sujeto (persona o empresa). El monitoreo es gratuito, pero exige que
        tu organización ya haya comprado un informe `ready` de ese sujeto — la
        línea base de la suscripción se siembra desde esa data comprada. Por
        diseño (anti-oráculo), un sujeto inexistente y un sujeto existente sin
        informe comprado reciben LA MISMA respuesta `403 report_required`: este
        endpoint jamás revela si un documento existe en el buró.

        La suscripción es idempotente por (cuenta, sujeto): re-crearla devuelve
        la suscripción existente con su línea base preservada. `only_material`
        (default false) limita el trigger `new_records` a registros materialmente
        negativos (cobranzas abiertas, instrumentos protestados, quiebras,
        juicios). `monitor_since_score` (1..999) arma el trigger
        `score_drop_below`: una alerta se dispara cuando el score cruza ese umbral
        a la baja.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (default CL). También puede enviarse
          en el body del request como `country`.
        example: CL
      requestBody:
        required: false
        content:
          application/json:
            example:
              only_material: true
              monitor_since_score: 500
      responses:
        '200':
          description: Suscripción de monitoreo (creada o actualizada).
          content:
            application/json:
              example:
                monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                active: true
                only_material: true
                created_at: '2026-08-08T16:11:40Z'
                doc_id: 12.345.678-5
                country: CL
                subject_type: person
                monitor_since_score: 500
        '400':
          description: invalid_doc_id | invalid_payload
          content:
            application/json:
              example:
                error: invalid_payload
                message: monitor_since_score must be between 1 and 999
        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio deshabilitado o cuenta sin verificar) | report_required
          content:
            application/json:
              example:
                error: report_required
                message: purchase a report for this subject before enabling monitoring
    get:
      tags: [Qscore]
      summary: Obtener una suscripción de monitoreo
      operationId: getQscoreMonitoring
      description: 'Devuelve la suscripción de monitoreo vigente de tu cuenta
        para un sujeto, incluidos el último score observado, el conteo de
        registros y los timestamps del último chequeo (`last_checked_at`) y de
        la última alerta (`last_event_at`). Devuelve `404 not_found` si no hay
        suscripción.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (default CL).
        example: CL
      responses:
        '200':
          description: Suscripción de monitoreo.
          content:
            application/json:
              example:
                monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                active: true
                only_material: true
                created_at: '2026-08-08T16:11:40Z'
                last_event_at: '2026-08-08T18:02:11Z'
                last_checked_at: '2026-08-08T18:05:00Z'
                doc_id: 12.345.678-5
                country: CL
                subject_type: person
                monitor_since_score: 500
                last_score: 487
                last_record_count: 2
        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio deshabilitado o cuenta sin verificar)
        '404':
          description: not_found
          content:
            application/json:
              example:
                error: not_found
                message: resource not found
    delete:
      tags: [Qscore]
      summary: Desuscribir un sujeto
      operationId: deleteQscoreMonitoring
      description: 'Desactiva la suscripción de monitoreo de tu cuenta para un
        sujeto (`active: false`). No se envían más webhooks
        `risk_monitoring_alert`; puedes suscribirte de nuevo con `PUT`. Devuelve
        `404 not_found` si no hay suscripción.'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: País ISO del documento (default CL).
        example: CL
      responses:
        '200':
          description: Suscripción desactivada.
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                doc_id: 12.345.678-5
                active: false
        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio deshabilitado o cuenta sin verificar)
        '404':
          description: not_found
          content:
            application/json:
              example:
                error: not_found
                message: resource not found
