      summary: Habilitar o deshabilitar el monitoreo AML
      description: Activa o desactiva el monitoreo continuo de compliance de la identidad verificada de
        la cuenta. Habilitar cobra la comisión `compliance_monitoring` si está configurada; deshabilitar
        es gratis. Requiere un screening previo. Cada cambio de estado queda guardado en el historial
        (`GET /v1/aml/screenings`, filtro kind monitoring). Cuando el estado cambia de verdad, `idempotency_key`
        es obligatoria — repetir con la misma clave devuelve el evento original con `idempotency_hit`
        true. Si ya está en el estado pedido, devuelve unchanged true sin cobrar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                idempotency_key:
                  type: string
                  description: Obligatoria cuando cambia el estado (habilitar cobra comisión). Also accepted
                    as the Idempotency-Key header.
            example:
              enabled: true
              idempotency_key: aml-monitor-enable-1
      responses:
        '200':
          description: Estado del monitoreo guardado localmente.
          content:
            application/json:
              example:
                screening_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: monitoring
