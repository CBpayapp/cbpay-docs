  /v1/payins/deposit-instructions:
    get:
      tags:
      - Payins
      operationId: getDepositInstructions
      summary: Previsualizar las instrucciones de depósito de un corredor
      description: |
        Devuelve el texto de cuenta bancaria que tu organización publica para
        un corredor `bank_transfer` — el mismo contenido que se embebe
        automáticamente en la respuesta de un payin anunciado. Útil para
        renderizar una pantalla "¿dónde envío la plata?" antes de que el
        pagador cree el payin, o para mostrar las instrucciones vigentes en
        una página estática.

        Solo los corredores con una instrucción activa configurada por el
        admin devuelven contenido; el resto responde `404 not_found` (nada
        que previsualizar — el corredor no lo requiere o nadie lo configuró
        aún).
      parameters:
      - name: country
        in: query
        required: true
        schema:
          type: string
        example: CL
      - name: currency
        in: query
        required: true
        schema:
          type: string
        example: CLP
      - name: method
        in: query
        schema:
          type: string
          default: bank_transfer
      responses:
        '200':
          description: Instrucciones de depósito activas del corredor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_instructions:
                    $ref: '#/components/schemas/DepositInstructions'
                  deposit_instructions_swift:
                    $ref: '#/components/schemas/DepositInstructions'
                    description: >-
                      Variante internacional SWIFT del corredor (solo US/USD,
                      cuando está configurada). Mismo shape, con su propio
                      `qr_payload` y `qr_png_base64`.
              examples:
                cl_bank_transfer:
                  summary: Chile (CLP)
                  value:
                    deposit_instructions:
                      id: 9f0c1a2b-3d4e-4f5a-8b9c-1a2b3c4d5e6f
                      country: CL
                      currency: CLP
                      method: bank_transfer
                      purpose: payin
                      revision: 3
                      active: true
                      reference_required: true
                      bank_name: Banco de Ejemplo
                      account_number: '0001112223'
                      account_type: checking
                      holder_name: Ejemplo Org SpA
                      created_at: '2026-07-15T14:02:00Z'
                      qr_payload: |
                        Bank: Banco de Ejemplo
                        Account type: checking
                        Account number: 0001112223
                        Holder: Ejemplo Org SpA
                      qr_png_base64: iVBORw0KGgoAAAANSU...
                us_bank_transfer:
                  summary: 'Estados Unidos (USD — doble riel: ABA doméstico + SWIFT internacional)'
                  value:
                    deposit_instructions:
                      id: 7b1e4d5a-2c3b-4a59-8877-6f5e4d3c2b1a
                      country: US
                      currency: USD
                      method: bank_transfer
                      purpose: payin
                      revision: 1
                      active: true
                      reference_required: true
