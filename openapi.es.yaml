  /v1/aml/catalogs/cities:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogCities
      summary: Catálogo de ciudades de un país
      description: 'Devuelve las ciudades de un país ISO 3166-1 alpha-2, agrupadas por subdivisión:
        las claves de `states` son los mismos códigos ISO 3166-2 de `country_subdivisions` en
        `GET /v1/aml/catalogs`, y `country_cities` lista las ciudades cuya región no pudo
        mapearse a una subdivisión (ofrécelas también). Ningún campo es jamás `null`. Un país
        sin cobertura responde 200 con listas vacías — cae a un campo de ciudad de texto libre.
        Data estática servida con `Cache-Control: public, max-age=86400`; se puede cachear por
        un día. Una llamada por país y luego filtras por estado en el cliente.'
      parameters:
      - name: country
        in: query
        required: true
        description: Código de país ISO 3166-1 alpha-2 (ej. `US`).
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: Ciudades del país agrupadas por subdivisión (listas vacías cuando el país no tiene cobertura).
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: Código de país ISO 3166-1 alpha-2 devuelto tal cual.
                  states:
                    type: object
                    description: Ciudades por código de subdivisión ISO 3166-2 (`<CC>-<code>`).
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  country_cities:
                    type: array
                    description: Ciudades cuya región no pudo mapearse a una subdivisión.
                    items:
                      type: string
                  meta:
                    type: object
                    description: Conteos de cobertura (`state_count`, `city_count`).
              example:
                country: US
                states:
                  US-FL:
                  - Miami
                  - Orlando
                country_cities: []
                meta:
                  state_count: 51
                  city_count: 3200
        '400':
          description: Código de país mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_country
                message: country is required (ISO 3166-1 alpha-2)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: Código de país desconocido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: country_not_found
                message: unknown country code
  /v1/aml/catalogs/postal-code:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogPostalCode
      summary: Busca ciudad y estado por código postal
      description: 'Resuelve un código postal a su ciudad y estado desde un dataset
        público embebido — hoy solo hay cobertura de ZIP codes de US. Úsalo para
        autocompletar los campos ciudad/estado mientras el usuario escribe el ZIP en
        formularios con dirección: un 404 significa "ZIP desconocido" (o un país sin
        dataset) y los campos simplemente siguen manuales. Datos estáticos servidos
        con `Cache-Control: public, max-age=86400`; se pueden cachear por un día.'
      parameters:
      - name: country
        in: query
        required: true
        description: Código de país ISO 3166-1 alpha-2. Hoy solo `US` tiene dataset.
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      - name: code
        in: query
        required: true
        description: Código postal a resolver (ZIP de US de 5 dígitos).
        schema:
          type: string
          pattern: '^[0-9]{5}$'
        example: '33130'
      responses:
        '200':
          description: Ciudad y estado del código postal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: Código de país ISO 3166-1 alpha-2 devuelto tal cual.
                  postal_code:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    description: Sufijo de subdivisión ISO 3166-2 (ej. `FL`).
              example:
                country: US
                postal_code: '33130'
                city: Miami
                state: FL
        '400':
          description: Parámetros faltantes o código postal malformado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_payload
                message: code must be a 5-digit US ZIP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: Código postal desconocido, o un país sin dataset — los campos
            de dirección siguen manuales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: postal_code_not_found
                message: no place found for the given postal code
  /v1/me/verification/link:
    post:
      tags:
      - KYC / KYB
      operationId: createMyVerificationLink
      summary: Pedir mi link de verificación (onboarding)
      description: 'Devuelve el link de verificación de identidad PROPIO de la cuenta (persona ⇒ link
        KYC, empresa ⇒ link KYB — derivado del tipo de cuenta). El wizard hosteado cubre el flujo completo:
        formulario, documentos y prueba de vida en video. Gratis. Si ya hay un link vigente se devuelve
        el mismo con 200; una cuenta ya aprobada recibe 409 already_verified. Hasta aprobar la verificación,
        toda acción de dinero saliente responde 403 verification_required (el fondeo y las lecturas siguen
        disponibles).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: Vencimiento opcional del link (1-30 días). Omitido, no vence.
            example:
              expires_in_days: 14
      responses:
        '201':
          description: Link de onboarding creado (200 cuando se reutiliza uno vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationLink'
              example:
                link_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                kind: kyc
                url: https://verify.example.com/on/usd/individual/new?invite=abc123
                status: pending
                label: Ana Perez
                created_at: '2026-07-10T12:00:00Z'
                updated_at: '2026-07-10T12:00:00Z'
        '409':
          description: La cuenta ya completó su verificación (already_verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: already_verified
                message: this account already completed its identity verification
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/verification/report:
