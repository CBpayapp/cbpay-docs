  /v1/kyc/submissions:
    post:
      tags:
      - KYC / KYB
      operationId: createKycSubmission
      summary: Crear una submission KYC con datos por API
      description: 'Solo cuentas empresa: verifica a uno de TUS clientes finales enviando los datos directo
        (sin wizard). Países en ISO alpha-3, fechas YYYY-MM-DD, id_type passport | id_card | drivers_license.
        Los documentos son opcionales al crear (súbelos con el flujo presign); no se exige prueba de vida
        al crear — la submission queda con liveness_pending: true y se cierra con un liveness link. Re-enviar
        con el mismo external_customer_id mientras la submission siga abierta la actualiza sin cobrar
        de nuevo. Cobra el fee fijo `kyc_verification`; `idempotency_key` obligatoria.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - external_customer_id
              - idempotency_key
              properties:
                external_customer_id:
                  type: string
                  description: Tu referencia del cliente verificado.
                idempotency_key:
                  type: string
                person:
                  type: object
                  description: Campos de la persona (first_name, last_name, email, phone, nationality,
                    date_of_birth, tax_id, id_type, id_number, address, primary_purpose, most_recent_occupation,
                    source_of_funds).
                metadata:
                  type: object
            example:
              external_customer_id: cust_789
              idempotency_key: kyc-sub-cust-789-1
              person:
                first_name: Ana
                last_name: Perez
                email: ana@example.com
                phone: '+56912345678'
                nationality: CHL
                date_of_birth: '1990-04-12'
                tax_id: 12.345.678-5
                id_type: id_card
                id_number: '12345678'
                address:
                  line1: Av. Siempre Viva 123
                  city: Santiago
                  state: RM
                  postal_code: '8320000'
                  country: CHL
                primary_purpose: personal_or_living_expenses
                most_recent_occupation: Engineer
                source_of_funds: salary
      responses:
        '201':
          description: Submission creada (entra a la cola de revisión de compliance).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSubmission'
              example:
                submission_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: kyc
                external_customer_id: cust_789
                status: pending_review
                liveness_pending: true
                verification_fee: '1.500000'
                idempotency_key: kyc-sub-cust-789-1
                created_at: '2026-07-10T12:05:00Z'
                updated_at: '2026-07-10T12:05:00Z'
        '400':
          description: idempotency_key_required / invalid_payload / missing_person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_payload
                message: external_customer_id is required (your reference for the customer being verified)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: verification_required / company_account_required / service_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: company_account_required
                message: third-party KYC/KYB verification is available to company accounts only
        '401':
          $ref: '#/components/responses/Unauthorized'
