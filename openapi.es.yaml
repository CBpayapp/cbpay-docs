            ORIGINAL, con la misma `reference`. Tambien se devuelve cuando un POST sin clave
            de idempotencia calza con un anuncio vivo indistinguible (misma cuenta, moneda,
            monto y pagador).
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  reference:
                    type: string
                  payer_source:
                    type: string
                  idempotency_hit:
                    type: boolean
              example:
