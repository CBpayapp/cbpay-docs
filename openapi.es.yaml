  /v1/payins/{payinID}/refunds:
    parameters:
    - name: payinID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Payins
      operationId: createPayinRefund
      summary: Devolver un cobro con tarjeta
      description: >-
        Devuelve la plata al tarjetahabiente y reversa el abono en tu saldo. Solo
        se devuelven cobros con tarjeta en estado `credited` (`refund_not_supported`
        en los demás rieles) — y solo cuando su saldo ya está disponible: un payin
        `credited` cuyo settlement sigue pendiente (`settlement_pending: true`, el
        saldo cae al llegar `settle_at`) se rechaza con `422 settlement_pending`.
        Se debita el bruto: la comisión y el spread FX del
        cobro original NO son reembolsables. La `idempotency_key` es obligatoria;
        un reintento devuelve la MISMA devolución con `idempotency_hit` y jamás
        manda una segunda devolución al procesador. Exige OTP cuando el llamante
        es una sesión (las API keys están exentas).
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
        description: Token OTP de un solo uso (ver la guía de OTP). Solo para llamantes con sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                amount:
                  type: string
                  description: Monto en la moneda local original. Omítelo para devolver todo lo que queda por devolver.
                kind:
                  type: string
                  enum:
                  - refund
                  - void
                  description: '`refund` (default) devuelve un cargo ya liquidado; `void` anula uno que aún no liquida.'
                reason:
                  type: string
                idempotency_key:
                  type: string
            example:
              amount: '150.00'
              kind: refund
              reason: solicitud del cliente
              idempotency_key: refund-order-8842
      responses:
        '200':
          description: Reintento con la misma clave de idempotencia — la MISMA devolución, con `idempotency_hit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: solicitud del cliente
                idempotency_hit: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '201':
          description: Devolución creada y aprobada por el procesador. El saldo quedó debitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: solicitud del cliente
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '202':
          description: >-
            Despacho ambiguo: el procesador pudo haber devuelto. La devolución
            queda `pending` con tu saldo reservado y se resuelve por conciliación.
            NUNCA reintentamos por nuestra cuenta — reintenta con la MISMA
            `idempotency_key` y recibirás esta misma devolución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: pending
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reconciliation_required: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:00Z'
        '400':
          description: '`idempotency_key_required` o `invalid_amount` / `invalid_payload`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: idempotency_key is required
        '402':
          description: '`insufficient_funds` — fondea el saldo y reintenta con la misma `idempotency_key`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: the account balance is not enough to fund this refund; top up and retry with the same idempotency_key
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`idempotency_conflict` — otra devolución con esta clave está en vuelo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_conflict
                message: another refund with this key is in flight
        '422':
          description: >-
            `payin_not_refundable`, `refund_not_supported`, `refund_exceeds_payin`,
            `settlement_pending` (el payin está confirmado pero su saldo sigue
            programado para un `settle_at` futuro — espera al vencimiento o pide a
            un org-admin que libere el settlement primero),
            o una devolución que el procesador rechazó (el cuerpo es la devolución
            con `status: failed` y `failure_reason`; el débito se reversó completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refund_exceeds_payin
                message: the requested amount exceeds what is left to refund on this payin
        '401':
          $ref: '#/components/responses/Unauthorized'
