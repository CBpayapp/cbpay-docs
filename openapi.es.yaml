  /v1/wallet-links/challenges:
    post:
      tags:
      - Vínculos de wallets
      operationId: createWalletLinkChallenge
      summary: Crear un desafío nonce para vincular una wallet externa
      description: "Crea un desafío nonce para vincular una wallet EXTERNA\n
        (`custody=client`) a la cuenta. El cliente firma el `envelope` con su wallet\n
        (EIP-191 para ETH/EVM, TIP-191 para TRON) y lo envía a `POST\n
        /v1/wallet-links/verify`. El desafío expira en 10 minutos y es de un solo uso.\n\n
        Errores específicos: `unsupported_chain`, `invalid_address`, `nonce_failed`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain, address]
              properties:
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                  description: Dirección de la wallet externa (formato de la red).
            example:
              chain: eth
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
      responses:
        '201':
          description: Desafío creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: object
                    properties:
                      link_id:
                        type: string
                      chain:
                        type: string
                      address:
                        type: string
                      nonce:
                        type: string
                      envelope:
                        type: string
                        description: Texto exacto que la wallet debe firmar.
                      expires_at:
                        type: string
              example:
                challenge:
                  link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                  nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
                  envelope: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_link\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nAccount: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z"
                  expires_at: '2026-08-21T14:13:11Z'
        '400':
          description: Payload inválido (`invalid_address`, `unsupported_chain`).
        '500':
          description: No se pudo generar el nonce (`nonce_failed`).
  /v1/wallet-links/verify:
    post:
      tags:
      - Vínculos de wallets
      operationId: verifyWalletLink
      summary: Verificar la firma del desafío y vincular la wallet
      description: "Verifica la firma del desafío nonce y vincula la wallet externa a\n
        la cuenta. La wallet queda `custody=client`: el cliente conserva la llave y\n
        puede gastar por fuera; el vínculo solo prueba la titularidad de la dirección.\n\n
        Errores específicos: `invalid_payload`, `invalid_signature`,\n
        `signature_mismatch`, `verification_failed`, `challenge_consumed`,\n
        `challenge_expired`, `proof_not_signable`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature]
              properties:
                nonce:
                  type: string
                  description: Nonce del desafío (de `POST /v1/wallet-links/challenges`).
                signature:
                  type: string
                  description: Firma del envelope (EIP-191 / TIP-191).
            example:
              nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
              signature: '8ba1f109551bd432803012645ac136ddd64dba72a0c9e0b1f5b1a2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00112233445566771b'
