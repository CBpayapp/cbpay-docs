                updated_at: '2026-08-09T15:00:00Z'
                expires_at: '2026-08-16T15:00:00Z'
                idempotency_hit: true
        '400':
          description: 'invalid_payload | purpose_required | invalid_purpose |
            invalid_doc_id | invalid_subject_type | invalid_email | idempotency_key_required'
        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio risk deshabilitado) o verification_required
