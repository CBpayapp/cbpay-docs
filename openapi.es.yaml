  wallet_external_movement:
    post:
      summary: Movimiento externo en una wallet segregada
      description: El sync de actividad detectó un movimiento on-chain de una wallet segregada que no
        pasó por la plataforma (esperable en custodia del cliente, p. ej. tras importar o exportar la
        llave). El registro de actividad de la wallet queda completo igual.
      requestBody:
        content:
          application/json:
            example:
              wallet_id: b7e3a1c2-9f4d-4a8b-8c1e-2d3f4a5b6c7d
              account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              chain: tron
              asset: USDT
