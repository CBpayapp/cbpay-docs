          - GOLD
          description: Saldo desde el que se debitan las operaciones cuando no se envía un override por
            request.
        default_payin_asset:
          type: string
          enum:
          - USDT
          - USDC
          - BTC
          - GOLD
          description: Saldo en que se acreditan por defecto los payins. El crédito entra en USDT y el
            neto se auto-convierte vía el motor de swaps al precio real, sin spread de swap
            adicional. Checkout/POS conservan el asset de su link.
        enabled_assets:
          type: array
          items:
            type: string
          description: Assets que tu organización permite actualmente como origen del settlement.
        volatile_op_limit_usdt:
          type: string
          description: Límite por operación (equivalente en USDT) para los assets volátiles (BTC/GOLD).
        volatile_daily_limit_usdt:
          type: string
          description: Tope de volumen 24h (equivalente en USDT) por cuenta para los assets volátiles
            (BTC/GOLD).
      example:
        default_settlement_asset: USDT
        default_payin_asset: USDT
        enabled_assets:
        - USDT
        - USDC
        - BTC
        - GOLD
        volatile_op_limit_usdt: '10000.000000'
        volatile_daily_limit_usdt: '50000.000000'
