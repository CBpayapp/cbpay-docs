  /v1/banking/customer:
    post:
      tags:
      - Banking
      operationId: createBankingCustomer
      summary: Crear mi perfil bancario
      description: >-
        Abre el perfil bancario de la cuenta (una vez por cuenta). Si omites `type`/`name`/`email`,
        se completan desde tu cuenta CBPay. Se cobra la comisión fija `banking_customer` desde tu settlement
        asset (USDT por defecto); se reembolsa si el corredor rechaza.
        La plataforma deriva un claim de idempotencia determinista en el core para esta cuenta/perfil. Repetir la misma solicitud devuelve el customer original con `idempotency_hit: true`, sin crear otro perfil ni cobrar otro fee. Cambiar el payload para la misma cuenta responde `409 idempotency_conflict`. Si el resultado upstream es ambiguo, responde `503 banking_recovery_pending`; no reintentes con una clave nueva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: Perfil bancario creado (estado draft).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
                banking_fee: '5.000000'
                banking_fee_asset: USDT
        '202':
          description: Solicitud retenida para revisión (la organización tiene la revisión de solicitudes activada).
            El recurso se crea solo cuando compliance aprueba la revisión; la comisión de emisión/apertura se cobra al
            retener y se reembolsa automáticamente si se rechaza. Sigue el resultado con el webhook
            `txn_review_status_changed` o `GET /v1/me/txn-reviews`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: La cuenta ya tiene perfil o el claim determinista de creación entra en conflicto con otro payload.
          content:
            application/json:
              examples:
                customer_exists:
                  summary: El perfil banking ya existe
                  value:
                    error: banking_customer_exists
                    message: this account already has a banking customer
                idempotency_conflict:
                  summary: Misma cuenta con payload distinto
                  value:
                    error: idempotency_conflict
                    message: idempotency key was used with a different payload
        '503':
          description: The platform could not reconcile an ambiguous banking customer creation.
          content:
            application/json:
              example:
                error: banking_recovery_pending
                message: customer creation outcome is ambiguous; operations must reconcile the claim before retrying
        '502':
          description: Error del corredor bancario; la comisión (si hubo) se reembolsó (banking_request_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
    get:
      tags:
      - Banking
      operationId: getBankingCustomer
      summary: Consultar mi perfil bancario
      description: Devuelve el perfil bancario de la cuenta con su estado de verificación en vivo.
      responses:
        '200':
          description: Perfil bancario con estado normalizado (draft, submitted, under_review, approved,
            rejected).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: approved
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Aún no hay perfil bancario (no_banking_customer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_banking_customer
                message: create your banking customer first (POST /v1/banking/customer)
