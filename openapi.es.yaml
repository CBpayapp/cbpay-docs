    FeeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        account_id:
          type: string
          description: Vacío cuando la comisión es un valor por defecto de CBPay (no un override de cuenta).
        service:
          type: string
          enum:
          - payout
          - payin
          - payin_card
          - funding
          - withdrawal
          - compliance_person
          - compliance_company
          - compliance_rescreen
          - compliance_transaction
          - compliance_monitoring
          - banking_deposit
          - banking_transfer_ach
          - banking_transfer_swift
          - banking_transfer_wire
          - banking_transfer_sepa
        country:
          type: string
        currency:
          type: string
          description: >-
            Dimensión opcional de moneda ISO-4217. Solo la soporta payin_card — la misma cuenta puede tener un % distinto por moneda procesada (ej. BOB vs USD). Vacía aplica a cualquier moneda.
        asset:
          type: string
          example: USDT
        percent:
          type: string
          example: '1.5'
        fixed_amount:
          type: string
          example: '0.30'
        settlement_hours:
          type: integer
          description: >-
            Solo payins con tarjeta (`payin_card`) — demora de acreditación del SALDO
            configurable en horas. `0` (default) liquida el saldo apenas se confirma el cobro
            con tarjeta; un valor positivo confirma el payin como `credited` de inmediato
            (webhook y cierre del checkout incluidos) pero deja el SALDO programado con un
            `settle_at` hasta que vence la demora, y luego lo liquida automáticamente. La
            demora cubre todo cobro pagado con tarjeta: payins directos con tarjeta y
            cobros checkout/POS pagados con tarjeta (un checkout pagado por
            QR/crypto/fintoc sigue acreditándose de inmediato). En otro
            servicio o negativo se rechaza con `invalid_settlement_hours`.
          example: 24
        status:
          type: string
          example: active
        updated_at:
          type: string
          format: date-time
    SettlementSettings:
      type: object
      properties:
        default_settlement_asset:
          type: string
          enum:
          - USDT
          - USDC
