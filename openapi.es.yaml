  /v1/cards/{cardID}/transactions:
    get:
      tags:
      - Cards
      operationId: listCardTransactions
      summary: Listar transacciones de la tarjeta
      description: 'Compras y su ciclo de vida: `authorized` (hold en tiempo real), `settled` (confirmada
        en la liquidación), `reversed` (anulada, fondos devueltos al mismo saldo) y `declined` (con la
        razón: insufficient_funds, card_limit_exceeded, card_frozen...). `spend_asset` / `spend_amount`
        indican desde qué saldo se debitó la compra y cuánto en ese asset; `amount_usd` / `amount_usdt`
        siguen siendo el valor USD de referencia. Cuando el operador configura una comisión por compra
        (`card_purchase_virtual` / `card_purchase_physical`), `fee_asset` / `fee_amount` exponen la
        comisión (estimada en `authorized`, definitiva en `settled`) y `fee_refunded_amount` aparece
        cuando una reversa o ajuste a la baja prorratea la devolución; sin comisión configurada los
        campos `fee_*` se omiten.'
      parameters:
      - $ref: '#/components/parameters/cardID'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - authorized
          - settled
          - reversed
          - declined
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Transacciones paginadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
              example:
                page: 1
                page_size: 50
                transactions:
                - transaction_id: 5e4d3c2b-1a09-8f7e-6d5c-4b3a2c1d0e9f
                  card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                  kind: purchase
                  merchant: AMZN Mktp
                  mcc: '5999'
                  amount_usd: '16.17'
                  amount_usdt: '16.170000'
                  spend_asset: USDC
                  spend_amount: '16.170000'
                  fee_asset: USDC
                  fee_amount: '0.214255'
                  status: settled
                  auth_number: '040031'
                  created_at: '2026-07-08T15:00:00Z'
                  updated_at: '2026-07-09T02:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
