  /v1/settlement:
    get:
      tags:
      - Cuenta
      operationId: getSettlement
      summary: Obtener mi configuración de settlement
      description: Devuelve desde qué saldo virtual se debitan por defecto tus operaciones (payouts y
        comisiones de servicios), en qué saldo se acreditan por defecto tus payins (`default_payin_asset`),
        qué assets permite tu organización, y el límite por operación (equivalente en USDT) que aplica
        a los assets volátiles (BTC/GOLD).
      responses:
        '200':
          description: Configuración de settlement vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: USDT
                default_payin_asset: USDT
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
    put:
      tags:
      - Cuenta
      operationId: updateSettlement
      summary: Definir mis saldos predeterminados (payouts y payins)
      description: Cambia tus saldos predeterminados. `default_settlement_asset` es el saldo desde el
        que se debitan tus payouts y comisiones de servicios cuando el request no envía un
        `settlement_asset` explícito. `default_payin_asset` es el saldo en que se acreditan tus payins —
        el crédito sigue entrando en USDT y el neto se auto-convierte vía el motor de swaps al precio
        real, sin spread de swap adicional (el payin ya pagó su comisión y su tasa; los payins de
        checkout y POS conservan el asset de su link). Cualquiera
        de USDT, USDC, BTC o GOLD (si tu organización lo tiene habilitado). Envía uno o ambos campos. El
        cambio aplica solo a operaciones nuevas; nada en tránsito se re-cotiza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Saldo desde el que se debitan por defecto payouts y comisiones. Opcional.
                default_payin_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: Saldo en que se acreditan por defecto los payins. El crédito entra en
                    USDT y el neto se auto-convierte vía el motor de swaps al precio real (sin
                    spread de swap adicional). Opcional.
            example:
              default_settlement_asset: BTC
              default_payin_asset: USDC
      responses:
        '200':
          description: Configuración de settlement actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSettings'
              example:
                default_settlement_asset: BTC
                default_payin_asset: USDC
                enabled_assets:
                - USDT
                - USDC
                - BTC
                - GOLD
                volatile_op_limit_usdt: '10000.000000'
                volatile_daily_limit_usdt: '50000.000000'
        '400':
          description: Asset inválido o deshabilitado (`invalid_settlement_asset`, `settlement_asset_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: settlement_asset_disabled
                message: settlement asset is disabled for this organization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
  /v1/cards/catalog/occupations:
