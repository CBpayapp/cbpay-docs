  /v1/contacts:
    get:
      tags:
      - Contacts
      operationId: listContacts
      summary: Listar contactos
      description: La libreta privada de tu cuenta, ordenada por favoritos y último uso. Los contactos
        se crean automáticamente con cada envío (transferencia, payout, retiro crypto), por CRUD manual
        o importando la agenda del celular.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: q
        in: query
        schema:
          type: string
        description: Busca por nombre, alias, email o teléfono.
      - name: has_cbpay
        in: query
        schema:
          type: boolean
        description: Solo contactos enlazados (o no) a una cuenta CBPay.
      - name: favorite
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Contactos paginados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
              example:
                page: 1
                page_size: 50
                contacts:
                - contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  display_name: Carlos Soto
                  alias: Carlitos
                  phone: '+56987654321'
                  email: carlos@mail.com
                  has_cbpay: true
                  cbpay_account_id: 389d34a3-6c61-4782-b822-95ac173068dc
                  source: import
                  favorite: true
                  created_at: '2026-07-07T12:00:00Z'
                  updated_at: '2026-07-10T15:00:00Z'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Contacts
      operationId: createContact
      summary: Crear un contacto
      description: Agrega un contacto a mano. El teléfono se normaliza a E.164 (los números locales usan
        el país de tu cuenta) y se matchea contra cuentas de tu operador para llenar `has_cbpay`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              properties:
                display_name:
                  type: string
                alias:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                favorite:
                  type: boolean
            example:
              display_name: Carlos Soto
              phone: '+56987654321'
              email: carlos@mail.com
              favorite: true
      responses:
        '201':
          description: Contacto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              example:
                contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                display_name: Carlos Soto
                phone: '+56987654321'
                email: carlos@mail.com
                has_cbpay: true
                cbpay_account_id: 389d34a3-6c61-4782-b822-95ac173068dc
                source: manual
                favorite: true
                created_at: '2026-07-10T15:00:00Z'
                updated_at: '2026-07-10T15:00:00Z'
        '400':
          description: invalid_payload / invalid_phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_phone
                message: phone could not be normalized to E.164 (send +<country><number>)
        '409':
          description: Ya existe un contacto con ese teléfono/email (duplicate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: duplicate
                message: duplicate
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/contacts/import:
    post:
      tags:
      - Contacts
      operationId: importContacts
      summary: Importar la agenda del celular
      description: Sube hasta 1.000 contactos por request (pagina si hay más). Los teléfonos se normalizan
        a E.164; los contactos existentes no se duplican; `has_cbpay` te dice qué contactos ya tienen
        una cuenta activa de tu mismo operador (match por teléfono).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phones:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
            example:
              contacts:
              - name: Carlos Soto
                phones:
                - +56 9 8765 4321
              - name: Ana Perez
                phones:
                - '912345678'
      responses:
        '200':
          description: Resultado por contacto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  matched:
                    type: integer
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      type: object
              example:
                imported: 2
                matched: 1
                total: 2
                contacts:
                - name: Carlos Soto
                  phone: '+56987654321'
                  contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  has_cbpay: true
                - name: Ana Perez
                  phone: '+56912345678'
                  contact_id: 9c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                  has_cbpay: false
        '400':
          description: invalid_payload / batch_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: batch_too_large
                message: send up to 1000 contacts per request (paginate the upload)
        '401':
          $ref: '#/components/responses/Unauthorized'
