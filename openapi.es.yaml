  /v1/qscore/batches:
    get:
      tags: [Qscore]
      summary: Listar lotes de scoring
      operationId: listQscoreBatches
      description: 'Lista los lotes de scoring de tu cuenta (los más recientes
        primero), paginados. `page` parte en 1; `page_size` por defecto 50
        (máximo 200). Los filtros de fecha `from` y `to` (zona horaria de la organización, ambos inclusivos)
        son obligatorios. Los lotes de otras cuentas nunca son visibles
        (aislamiento por cuenta: un batch id de otra cuenta responde 404).'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha de inicio (YYYY-MM-DD, zona horaria de la organización, inclusiva).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha de término (YYYY-MM-DD, zona horaria de la organización, inclusiva).
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - completed_with_errors
          - failed
        description: Filtra por estado del lote.
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: Página de lotes.
          content:
            application/json:
              example:
                items:
                - batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                  account_id: 4a9c2e71-8b3d-4f2a-9c1e-5d7b2a8f3e41
                  status: completed_with_errors
                  purpose: credit_evaluation
                  country: CL
                  lang: es
                  total_items: 4
                  processed_items: 4
                  succeeded_items: 3
                  failed_items: 1
                  estimated_fee_usdt: '14.50'
                  idempotency_key: portfolio-2026-08-09-a
                  created_at: '2026-08-09T14:32:10Z'
                  started_at: '2026-08-09T14:34:02Z'
                  completed_at: '2026-08-09T14:41:37Z'
                meta:
                  page: 1
                  page_size: 50
                  total: 1
        '400':
          description: invalid_range
        '401':
          description: unauthorized
        '403':
          description: forbidden (servicio deshabilitado o cuenta sin verificar)
    post:
      tags: [Qscore]
      summary: Crear un lote de scoring
      operationId: createQscoreBatch
      description: 'Crea un lote de scoring asíncrono (scoring de cartera): los
        sujetos se validan por adelantado, el lote queda en cola y un worker en
        segundo plano emite un informe Qscore completo por cada ítem válido.
        Envía `subjects` (array JSON, de 1 a 5000 entradas) **o** `subjects_csv`
        (un string CSV con encabezado `doc_id[,subject_type]`) — exactamente uno
        de los dos. Las filas con un documento inválido (`invalid_doc_id`) o un
        documento duplicado dentro del lote (`duplicate_in_batch`, reportado con
        su forma normalizada) se rechazan al crear y
        se reportan en `rejected_items`; el lote solo procesa las válidas. Un
        `subject_type` omitido o no reconocido nunca es un error: para `CL` se
        infiere de la serie del RUT (primer dígito 5–9 → `company`, cualquier
        otro → `person`). Si
        todas las filas se rechazan, la solicitud falla con `no_valid_items` y
        no se crea nada. La idempotencia es obligatoria: reintentar con la misma
        `idempotency_key` devuelve el lote original con `idempotency_hit: true`
        y nunca duplica el lote ni los cobros. Cada ítem cobra el fee standalone
        del informe (`risk_report_person` / `risk_report_company`) al procesarse,
        y un ítem con falla terminal se reembolsa automáticamente.
        `estimated_fee_usdt` es la estimación inicial para los ítems válidos.
        Cuando el lote termina recibes un webhook `risk_batch_completed` y un
        email — los informes individuales no emiten su propio webhook ni email.'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              json_subjects:
