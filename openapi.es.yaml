              properties:
                country:
                  type: string
                  default: MX
                currency:
                  type: string
                  default: MXN
                method:
                  type: string
                  default: bank_transfer
            examples:
              mx_clabe:
                summary: México — CLABE dedicada (MXN)
                value:
                  country: MX
                  currency: MXN
              ar_cvu:
                summary: Argentina — CVU dedicada (ARS)
                value:
                  country: AR
                  currency: ARS
      responses:
        '201':
          description: Cuenta de depósito creada y ligada a la cuenta que llama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInstrument'
              example: &id013
                instrument_id: a1d4b7c0-1234-5678-9abc-def012345678
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                country: MX
                currency: MXN
                method: bank_transfer
                instrument: '734180000151000006'
                details:
                  clabe: '734180000151000006'
                  status: active
                status: active
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cuenta no activa (account_blocked).
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: Core no disponible (core_unavailable).
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not create the deposit account
    get:
      tags:
      - Payins
      operationId: listDepositAccounts
      summary: Listar mis cuentas de depósito
