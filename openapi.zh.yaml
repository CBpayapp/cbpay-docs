                  - whatsapp
                  default: email
            example:
              org: cbpay
              email: taylor@example.com
      responses:
        '200':
          description: 通用确认(绝不泄露账户是否存在)。
          content:
            application/json:
              example:
                status: ok
                note: if an account matches, a verification code was sent; complete the reset with POST
                  /v1/auth/password/reset
  /v1/auth/password/reset:
    post:
      tags:
      - 身份认证
      operationId: resetPassword
      summary: 用验证码重置密码
      description: 校验 `forgot` 发送的验证码并设置新密码。所有现有会话被吊销。单一通用错误(`invalid_code`)涵盖未知组织/成员/验证码,不泄露任何账户存在性信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - email
              - code
              - new_password
              properties:
                org:
                  type: string
                email:
                  type: string
                  format: email
                code:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                  default: email
            example:
              org: cbpay
              email: taylor@example.com
              code: '123456'
              new_password: my-new-strong-pass
      responses:
        '200':
          description: 密码已重置;所有会话已吊销。
          content:
            application/json:
              example:
                status: password_reset
                note: all sessions were revoked; log in with the new password
        '401':
          description: 验证码无效、已过期,或无匹配账户(`invalid_code`)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is invalid or expired
                or no account matches: null
  /v1/auth/passkey/login/begin:
    post:
      tags:
      - 通行密钥
      operationId: passkeyLoginBegin
      summary: 开始无密码通行密钥登录
      description: 启动 WebAuthn 可发现凭证登录仪式。将返回的 `options.publicKey` 传给 `navigator.credentials.get()`,并把结果发送到
        `finish`。挑战为一次性,2 分钟后过期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              properties:
                org:
                  type: string
            example:
              org: cbpay
      responses:
        '200':
          description: WebAuthn 断言选项 + 挑战 id。
          content:
            application/json:
              example:
                challenge_id: 5f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                options:
                  publicKey:
                    challenge: base64url…
                    rpId: cbpayapp.com
                expires_at: '2026-07-11T00:02:00Z'
        '503':
          description: 组织未配置通行密钥(`passkeys_unavailable`)。
  /v1/auth/passkey/login/finish:
    post:
      tags:
      - 通行密钥
      operationId: passkeyLoginFinish
      summary: 完成无密码通行密钥登录
      description: 校验验证器断言并签发会话。通行密钥本身已是双因素(设备 + 生物识别),因此此登录不经过登录 OTP。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - org
              - challenge_id
              - credential
              properties:
                org:
                  type: string
                challenge_id:
                  type: string
                credential:
                  type: object
                  description: navigator.credentials.get() 返回的 PublicKeyCredential JSON。
            example:
              org: cbpay
              challenge_id: 5f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
              credential:
                id: AaBb…
                type: public-key
                response: {}
      responses:
        '200':
          description: 已签发会话。
          content:
            application/json:
              example:
                access_token: eyJ…
                expires_at: '2026-07-12T00:00:00Z'
                refresh_token: rt_6a1e6c22-….XXXX…
                refresh_expires_at: '2026-08-10T00:00:00Z'
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                role: owner
        '401':
          description: 无法验证该通行密钥(`invalid_credential`)。
  /v1/me/password:
    post:
      tags:
      - 账户
      operationId: changePassword
      summary: 更改我的密码
      description: 更改调用成员的密码。需要当前密码(通过社交登录创建且无密码的成员在此设置首个密码,`current_password` 留空);当 OTP 策略要求时,还需针对 `password_change`
        操作的 `X-OTP-Token`。其他所有会话都会被吊销,并返回新的会话。
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
        description: 当 password_change 操作要求时的一次性 OTP 令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
            example:
              current_password: old-pass
              new_password: my-new-strong-pass
      responses:
        '200':
          description: 密码已更改;之前的会话已吊销;返回新会话。
          content:
            application/json:
              example:
                status: password_changed
                access_token: eyJ…
                expires_at: '2026-07-12T00:00:00Z'
                refresh_token: rt_6a1e6c22-….XXXX…
                refresh_expires_at: '2026-08-10T00:00:00Z'
                note: all previous sessions were revoked
        '403':
          description: 当前密码错误(`invalid_password`)或需要 OTP(`otp_required`)。
  /v1/me/email/change:
    post:
      tags:
      - 账户
      operationId: changeEmail
      summary: 更改我的登录邮箱
      description: 发起登录邮箱变更。验证码会发送到新邮箱;用 `POST /v1/me/email/confirm` 确认。当 OTP 策略要求时,还需针对 `email_change`
        操作的 `X-OTP-Token`。必须验证新邮箱——防止攻击者把登录指向其无法控制的邮箱。
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              properties:
                new_email:
                  type: string
                  format: email
            example:
              new_email: taylor.new@example.com
      responses:
        '200':
          description: 验证码已发送至新邮箱。
          content:
            application/json:
              example:
                status: code_sent
                email: t***@***.com
                expires_at: '2026-07-11T00:30:00Z'
                note: confirm the change with POST /v1/me/email/confirm using the code sent to the new
                  email
        '409':
          description: 新邮箱已被使用(`email_in_use`)。
  /v1/me/email/verify:
    post:
      tags:
      - 账户
      operationId: verifyEmail
      summary: 验证我的当前邮箱
      description: 向成员当前邮箱发送验证码以标记其已验证(资金操作使用 email OTP 渠道的前提)。用 `POST /v1/me/email/confirm` 确认。
      responses:
        '200':
          description: 验证码已发送(或已验证)。
          content:
            application/json:
              example:
                status: code_sent
                email: t***@***.com
                note: confirm with POST /v1/me/email/confirm using the code sent to your email
  /v1/me/email/confirm:
    post:
      tags:
      - 账户
      operationId: confirmEmail
      summary: 确认邮箱变更或验证
      description: 使用收到的验证码确认待定的邮箱变更(或验证)。变更时会更新登录邮箱——所有者的账户联系邮箱也会更新——并通知旧邮箱。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: 邮箱已确认。
          content:
            application/json:
              example:
                status: email_confirmed
                email: taylor.new@example.com
        '409':
          description: 没有待处理的邮箱变更(`no_pending_email`)。
  /v1/me/alias:
    put:
      tags:
      - 账户
      operationId: setMyAlias
      summary: 设置我的永久别名
      description: 一次性设置账户的公开别名。别名是永久的,无法更改。格式:4-20 个字符(a-z、0-9、点、下划线、连字符),首尾必须为字母或数字;保留词会被拒绝。其他人可以按别名向你付款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - alias
              properties:
                alias:
                  type: string
            example:
              alias: taylor.code
      responses:
        '200':
          description: 别名已设置(永久)。
          content:
            application/json:
              example:
                alias: taylor.code
                note: the alias is permanent and cannot be changed
        '409':
          description: 已设置过(`alias_already_set`)或已被占用(`alias_taken`)。
  /v1/me/qr:
    get:
      tags:
      - 账户
      operationId: getMyQR
      summary: 我的个人资料 QR 码
      description: 返回账户不可变的 QR 令牌、其载荷 URI(`cbpay:pay?to=<token>`)及可直接渲染的 PNG。QR 只允许他人向你付款;永不改变。
      responses:
        '200':
          description: QR 令牌、载荷与 PNG。
          content:
            application/json:
              example:
                qr_token: 9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c
                payload: cbpay:pay?to=9f8c7b6a5d4e3f2a1b0c9d8e7f6a5b4c
                png_base64: iVBORw0KGgo…
                alias: taylor.code
                note: the QR identifies your account to RECEIVE transfers; it never changes
  /v1/me/avatar:
    put:
      tags:
      - 账户
      operationId: putMyAvatar
      summary: 上传我的头像
      description: 上传(或替换)账户头像。请求体为原始图片字节(JPEG、PNG 或 WebP),最大 512 KB。内容类型从文件魔数检测,绝不依赖请求头。当图片发布到公共 CDN
        时,`avatar_url` 为无需认证即可加载的绝对 URL;否则为需认证的 API 路径。
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 头像已更新。
          content:
            application/json:
              example:
                status: avatar_updated
                content_type: image/png
                size_bytes: 20481
                avatar_url: https://cdn.cbpayapp.com/public/avatars/1fa63bd1-0000-4000-8000-000000000001/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '413':
          description: 头像超过 512 KB(`image_too_large`)。
        '415':
          description: 不支持的图片类型(`unsupported_image`)。
    delete:
      tags:
      - 账户
      operationId: deleteMyAvatar
      summary: 删除我的头像
      responses:
        '200':
          description: 头像已删除。
          content:
            application/json:
              example:
                status: avatar_deleted
  /v1/avatars/{accountID}:
    get:
      tags:
      - 账户
      operationId: getAvatar
      summary: 获取账户头像
      description: 提供同组织内某账户的头像图片(用于转账和联系人中的收款人预览)。已发布到公共 CDN 的头像以 `302` 重定向到 CDN URL;旧头像直接提供。
      parameters:
      - name: accountID
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: 重定向到头像的公共 CDN URL。
        '200':
          description: 图片字节(Content-Type 为存储的图片类型)。
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: 该账户无头像(`not_found`)。
  /v1/resolve:
    get:
      tags:
      - 账户
      operationId: resolveRecipient
      summary: 按别名或 QR 解析收款人
      description: 返回同组织内某账户的最简预览(别名、显示名称、类型、头像),用于发送前确认。提供 `alias` 或 `qr`(原始令牌或完整 `cbpay:pay?to=…` 载荷)。返回统一的
        404 并限流以防枚举。
      parameters:
      - name: alias
        in: query
        required: false
        schema:
          type: string
      - name: qr
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 收款人预览。
          content:
            application/json:
              example:
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                display_name: Taylor Code
                type: person
                alias: taylor.code
                avatar_url: https://cdn.cbpayapp.com/public/avatars/1fa63bd1-0000-4000-8000-000000000001/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '404':
          description: 无匹配账户(`not_found`)。
        '429':
          description: 查询次数过多(`too_many_attempts`)。
  /v1/otp/preferences:
    get:
      tags:
      - 安全(OTP)
      operationId: getOTPPreferences
      summary: 我的 2FA 偏好设置
      description: 显示账户的有效 2FA 策略,并按操作标明是否被组织锁定(组织策略是账户不可低于的下限)。
      responses:
        '200':
          description: 有效偏好设置。
          content:
            application/json:
              example:
                enabled: true
                totp_enrolled: true
                actions:
                - action: login
                  required: true
                  channel: totp
                  source: account
                  locked_by_org: false
                - action: payout
                  required: true
                  channel: sms
                  source: org_default
                  locked_by_org: true
    put:
      tags:
      - 安全(OTP)
      operationId: putOTPPreferences
      summary: 更新我的 2FA 偏好设置
      description: 允许账户所有者配置自己的 2FA。你随时可以加固(启用操作、切换到更强渠道:totp > email > sms/whatsapp),但绝不能低于组织下限。弱化(停用已启用的操作或降低渠道)需要针对
        `security_settings` 操作的 `X-OTP-Token`。选择 `channel:totp` 需要已注册验证器应用。通过电话渠道(`sms`/`whatsapp`)为
        `login` 操作启用 2FA 时,账户电话号码必须已验证(完成任意 SMS/WhatsApp OTP 挑战);否则请求会被拒绝并返回
        `409 phone_verification_required` — 防止因号码输入错误而把自己锁在账户外。
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - required
              properties:
                action:
                  type: string
                  enum:
                  - login
                  - payout
                  - crypto_withdrawal
                  - transfer
                  - banking_operation
                  - card_reveal
                  - api_key_create
                  - member_add
                  - phone_change
                  - password_change
                  - email_change
                  - security_settings
                required:
                  type: boolean
                channel:
                  type: string
                  enum:
                  - sms
                  - whatsapp
                  - email
                  - totp
                  default: sms
            example:
              action: payout
              required: true
              channel: totp
      responses:
        '200':
          description: 更新后的有效策略。
          content:
            application/json:
              example:
                enabled: true
                actions:
                - action: payout
                  required: true
                  channel: totp
                  source: account
        '403':
          description: 被组织锁定(`policy_locked_by_org` / `channel_locked_by_org`)或弱化需 OTP(`otp_required`)。
        '409':
          description: '`channel:totp` 未注册验证器应用(`totp_enrollment_required`),或通过电话渠道启用登录 2FA 时电话未验证(`phone_verification_required`)。'
  /v1/me/totp:
    get:
      tags:
      - 通行密钥
      operationId: getMyTOTP
      summary: 我的身份验证器应用状态
      description: 身份验证器应用(TOTP)是否激活及剩余备份码数量。
      responses:
        '200':
          description: TOTP 状态。
          content:
            application/json:
              example:
                enrolled: true
                recovery_codes_remaining: 8
    delete:
      tags:
      - 通行密钥
      operationId: disableMyTOTP
      summary: 移除我的身份验证器应用
      description: 停用 TOTP。需要有效的验证器(或备份)码,并遵守组织下限——若组织强制要求验证器应用,则无法移除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: TOTP 已停用。
          content:
            application/json:
              example:
                enrolled: false
                status: disabled
        '403':
          description: 验证码无效(`otp_invalid`)或被组织强制要求(`policy_locked_by_org`)。
  /v1/me/totp/enroll:
    post:
      tags:
      - 通行密钥
      operationId: enrollMyTOTP
      summary: 开始注册身份验证器应用
      description: 生成 TOTP 密钥并返回 `otpauth://` URI 及可在 Google Authenticator / Authy 中扫描的 QR PNG。需要当前密码(若成员设有密码)。用
        `POST /v1/me/totp/confirm` 确认。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
            example:
              password: my-strong-pass
      responses:
        '200':
          description: 密钥 + otpauth URI + QR PNG。
          content:
            application/json:
              example:
                totp_secret: JBSWY3DPEHPK3PXP
                otpauth_uri: otpauth://totp/CBPay:taylor@example.com?secret=JBSWY3DPEHPK3PXP&issuer=CBPay
                qr_png_base64: iVBORw0KGgo…
                note: scan the QR (or type the secret) in your authenticator app, then confirm with POST
                  /v1/me/totp/confirm
        '409':
          description: 已有激活的身份验证器应用(`totp_already_enrolled`)。
  /v1/me/totp/confirm:
    post:
      tags:
      - 通行密钥
      operationId: confirmMyTOTP
      summary: 确认并激活身份验证器应用
      description: 使用第一个有效验证码激活 TOTP,并返回 10 个一次性备份码(仅显示一次)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: TOTP 已激活;备份码仅返回一次。
          content:
            application/json:
              example:
                enrolled: true
                recovery_codes:
                - ABCD-EFGH
                - JKLM-NPQR
                note: 'store these recovery codes now: they are shown only once and each works a single
                  time'
        '403':
          description: 验证码无效(`otp_invalid`)。
  /v1/me/totp/recovery-codes:
    post:
      tags:
      - 通行密钥
      operationId: regenerateRecoveryCodes
      summary: 重新生成备份码
      description: 签发一组新的备份码并作废之前的。需要有效的验证器码或备份码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
            example:
              code: '123456'
      responses:
        '200':
          description: 新的备份码(旧的作废)。
          content:
            application/json:
              example:
                recovery_codes:
                - WXYZ-2345
                - 6789-ABCD
                note: previous recovery codes are no longer valid
  /v1/me/passkeys:
    get:
      tags:
      - 通行密钥
      operationId: listMyPasskeys
      summary: 列出我的通行密钥
      responses:
        '200':
          description: 账户已注册的通行密钥。
          content:
            application/json:
              example:
                passkeys:
                - passkey_id: 3b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  name: MacBook de Taylor
                  created_at: '2026-07-11T00:00:00Z'
                  last_used_at: '2026-07-11T00:05:00Z'
  /v1/me/passkeys/register/begin:
    post:
      tags:
      - 通行密钥
      operationId: passkeyRegisterBegin
      summary: 开始注册通行密钥
      description: 启动 WebAuthn 注册仪式。需要当前密码(若成员设有密码)——绝不从被盗会话添加新的登录因素。将 `options.publicKey` 传给 `navigator.credentials.create()`。
      requestBody:
