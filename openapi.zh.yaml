              local_amount: '498.75'
              fx_rate: '1.010202'
              usdt_gross: '493.811881'
              fee: '27.159654'
              usdt_net: '466.652227'
              status: credited
              settle_at: '2026-08-12T14:08:33Z'
              idempotency_key: order-10042
