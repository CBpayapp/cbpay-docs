    get:
      tags:
      - 安全(OTP)
      operationId: getOTPChallenge
      summary: 获取 OTP 挑战
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 挑战。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallenge'
              example: *id015
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/otp/challenges/{challengeID}/verify:
    post:
      tags:
      - 安全(OTP)
      operationId: verifyOTPChallenge
      summary: 校验验证码
      description: 校验通过 SMS/WhatsApp 收到的验证码,返回授权受保护操作的一次性 `otp_token`(放在 `X-OTP-Token` 请求头中发送)。每个挑战 5
        次尝试。
      parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 10
            example:
              code: '482913'
      responses:
        '200':
          description: 验证码已通过;已签发一次性令牌。
          content:
            application/json:
              example:
                challenge_id: 6f1c02aa-93a1-4f0e-a7d1-1f2e3c4b5a69
                action: payout
                otp_token: otp_Zk9uY2XIr1EYE0lq8xqlM3VayVZYX4aa11bb22cc33
                expires_at: '2026-07-08T21:10:00Z'
                note: 'single use: send it in the X-OTP-Token header of the protected action'
        '401':
          description: 验证码不正确(`invalid_code`)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_code
                message: the code is incorrect; check it and try again
        '409':
          description: 挑战已过期或已被使用(`challenge_not_pending`)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: challenge_not_pending
                message: the challenge already expired or was used; create a new one
        '404':
          $ref: '#/components/responses/NotFound'
