        description: 本次支付选项的扣款币种，从报价的 `options[]`（或 `cards[]`）目录中选取
          （例如 `BOB` 或 `USD`）。当国家以多种币种提供该方式时必填；只有一种币种时忽略
          （其币种由国家决定）。
      responses:
        '200':
          description: 所选支付方式的指引。
          content:
            application/json:
              examples:
                crypto:
                  summary: 加密货币 — 专属充值地址与可扫描二维码
                  value:
                    method: crypto:btc:btc
                    payload:
                      chain: btc
                      asset: BTC
                      address: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                      due: '0.00046120'
                      received: '0.00000000'
                      qr_payload: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                      qr_png_base64: iVBORw0KGgo…
                      quote_expires_at: '2026-07-16T18:15:00Z'
                      note: send the exact amount to the address; the payment is confirmed on-chain
                        automatically
                bank_transfer:
                  summary: 银行转账 — 申报参考码（报价已冻结）
                  value:
                    method: bank_transfer
                    country: CL
                    currency: CLP
                    local_amount: '47180'
                    payload:
                      reference: CB68JZCT46QE
                      note: include the reference in the transfer description so the payment is
                        detected automatically
                bank_transfer_dedicated_account:
                  summary: 银行转账 — 链接专属 CLABE（墨西哥）
                  value:
                    method: bank_transfer
                    country: MX
                    currency: MXN
                    local_amount: '941.00'
                    payload:
                      destination:
                        type: clabe
                        account: '710969000012345678'
                        beneficiary: Acme Store S.A.
                        dedicated: true
                      note: transfer the exact amount to this dedicated account; no reference
                        is needed — the payment is detected automatically
                card:
                  summary: 银行卡 — 所选币种的托管支付页面
                  value:
                    method: card
                    country: BO
                    currency: USD
                    local_amount: '50.75'
                    payload:
                      charge_id: 8f6a2c1e-4b7d-4a1e-9c3f-2d5e6f7a8b9c
                      payment_url: https://api.qbank.cl/pay/cards/9f3XkT2m…
                      expires_at: '2026-07-17T18:15:00Z'
        '404':
          description: 令牌无效或收款链接不存在。
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: 该链接已通过其他方式支付。
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: 该链接已过期且未支付。
          content:
            application/json:
              example:
                error: checkout_expired
                message: this payment link expired
        '400':
          description: 法币方式缺少必填的国家参数，或银行卡缺少扣款币种。
          content:
            application/json:
              examples:
                country_required:
                  summary: 法币方式缺少国家
                  value:
                    error: country_required
                    message: 'send ?country=XX to choose the payment corridor'
                currency_required:
                  summary: 方式提供多种币种但未选择
                  value:
                    error: currency_required
                    message: 'this country accepts this method in more than one currency; send ?currency=XXX'
        '422':
          description: 该方式对此链接或国家不可用。
          content:
            application/json:
              examples:
                method_unavailable:
                  summary: 未提供的方式
                  value:
                    error: method_unavailable
                    message: this payment method is not available for this link
                country_unavailable:
                  summary: 国家没有可用方式
                  value:
                    error: country_unavailable
                    message: no payment methods are available for that country
        '429':
          description: 来自此 IP 的请求过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many requests; wait a moment and retry
        '503':
          description: 报价暂时不可用。
          content:
            application/json:
              example:
                error: pricing_unavailable
                message: pricing is temporarily unavailable; retry in a moment
  /pay/{token}/collect/otp:
    post:
      security: []
      tags:
      - 收银台(Checkout)
      operationId: checkoutCollectOTP
      summary: 请求拉取式收款的 OTP（公开）
      deprecated: true
      description: >-
        用于通道按需向付款人发送一次性密码的拉取式方式（生成的支付选项中
        `requires_otp_request: true`）。触发向付款人发送 OTP，并返回
        必须随最终 `POST /pay/{token}/collect` 一起提交的 `otp_reference`。必须先生成该拉取式
        支付选项；金额始终是那时冻结的金额。按 IP 严格限流（每次调用都是发给付款人的真实短信/推送）。
        **目前没有任何可用的拉取式收款通道**（委内瑞拉 `c2p` / `debito_inmediato`
        已下线）：调用会返回该通道不受支持。
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 嵌入在 `checkout_url` 中的不透明结账令牌。
      requestBody:
        required: true
        content:
          application/json:
            example:
              country: VE
              currency: VES
              method: debito_inmediato
              payer_document: V12345678
              payer_bank: '0102'
              payer_account: '01020123456789012345'
      responses:
        '200':
          description: OTP 已发送给付款人。
          content:
            application/json:
              example:
                otp_reference: '783412'
                status: sent
        '404':
          description: 令牌无效或收款链接不存在。
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: 该链接已通过其他方式支付。
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: 该链接已过期且未支付。
          content:
            application/json:
              example:
                error: checkout_expired
                message: this payment link expired
        '422':
          description: 拉取式选项尚未生成，或通道拒绝了 OTP 请求。
          content:
            application/json:
              examples:
                not_materialized:
                  summary: 拉取式选项尚未准备
                  value:
                    error: method_unavailable
                    message: prepare this payment option first (POST /methods/{method})
                rail_rejected:
                  summary: 通道拒绝了 OTP 请求
                  value:
                    error: collect_otp_failed
                    message: the destination account does not accept immediate debit
        '429':
          description: 来自此 IP 的请求过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many requests; wait a moment and retry
  /pay/{token}/collect:
    post:
      security: []
      tags:
      - 收银台(Checkout)
      operationId: checkoutCollect
      summary: 用付款人数据执行拉取式收款（公开）
      deprecated: true
      description: >-
        使用付款人在结账页面填写的数据执行已生成的拉取式选项的扣款 — 银行、证件号、电话或账户，以及 OTP（由付款人在其银行
        App 中生成，或通过 `POST /pay/{token}/collect/otp` 请求并回传其 `otp_reference`）。
        金额始终是生成支付选项时冻结的金额 — 付款人从不发送金额。若通道同步确认，链接在同一次调用
        中完成结算（`paid: true`）；被拒绝不会终结链接 — 付款人可以修正数据或改用其他方式。用相同
        数据重试绝不会重复扣款。按 IP 严格限流。**目前没有任何可用的拉取式收款通道**
        （委内瑞拉 `c2p` / `debito_inmediato` 已下线）：报价中不再列出 `collect: true`
        选项，调用会返回该通道不受支持。
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: 嵌入在 `checkout_url` 中的不透明结账令牌。
      requestBody:
        required: true
        content:
          application/json:
            examples:
              pull_collection:
                summary: 历史形态 — 目前没有任何可用的拉取式通道
                value:
                  country: VE
                  currency: VES
                  method: c2p
                  payer_document: V12345678
                  payer_phone: '04141234567'
                  payer_bank: '0102'
                  otp: '123456'
      responses:
        '200':
          description: 收款尝试的结果。
          content:
            application/json:
              examples:
                paid:
                  summary: 通道同步确认 — 链接已结算
                  value:
                    paid: true
                    status: paid
                    status_message: approved
                rejected_soft:
                  summary: 通道在响应体中报告可恢复的拒绝
                  value:
                    paid: false
                    status: failed
                    status_code: '05'
                    status_message: the document does not match the C2P registration
        '404':
          description: 令牌无效或收款链接不存在。
          content:
            application/json:
              example:
                error: not_found
                message: payment link not found
        '409':
          description: 该链接已通过其他方式支付。
          content:
            application/json:
              example:
                error: already_paid
                message: this payment link was already paid
        '410':
          description: 该链接已过期且未支付。
          content:
            application/json:
              example:
                error: checkout_expired
                message: this payment link expired
        '422':
          description: 拉取式选项尚未生成，或通道拒绝了扣款（链接保持待支付，付款人可重试）。
          content:
            application/json:
              examples:
                not_materialized:
                  summary: 拉取式选项尚未准备
                  value:
                    error: method_unavailable
                    message: prepare this payment option first (POST /methods/{method})
                rail_rejected:
                  summary: 通道拒绝了扣款
                  value:
                    error: collect_rejected
                    message: invalid or expired OTP
        '429':
          description: 来自此 IP 的请求过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many requests; wait a moment and retry
  /v1/branding:
    get:
      tags:
      - 账户
      operationId: getBranding
      summary: 获取平台品牌
