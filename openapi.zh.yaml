    post:
      tags: [Qscore]
      summary: 创建授权同意链接
      operationId: createRiskConsent
      description: '为主体创建授权链接（Destacame 式授权同意流程）：您将获得可分享的
        `consent_url`；若传入 `email`，平台会通过品牌化邮件将链接发送给持有人。持有人打开公开页面，
        通过开放金融连接其银行并授权；已授予的授权会在其 Qscore 报告中解锁主体的正向银行数据。
        `country` 和 `doc_id` 用于识别持有人（证件号会校验校验位）；省略 `subject_type`
        时将从证件推断。依据数据保护法 `purpose` 为必填，此处不允许 `self_access`（持有人的
        自助报告在 `POST /v1/qscore/my-report`）。`expires_in_days` 默认为 7（最大 30）。
        幂等为强制要求：使用相同 `idempotency_key` 重试会返回原授权并带 `idempotency_hit:
        true`，绝不重复创建链接或重复发送邮件。'
      requestBody:
        required: true
        content:
          application/json:
            example:
              country: CL
              doc_id: 12.345.678-5
              purpose: credit_evaluation
              email: maria@example.com
              expires_in_days: 7
              idempotency_key: consent-2026-08-09-001
      responses:
        '201':
          description: 授权已创建（状态 `pending`）。
          content:
            application/json:
              example:
                consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                channel: link
                status: pending
