  /v1/banking/third-parties:
    post:
      tags:
      - 银行服务
      operationId: createBankingThirdParty
      summary: 注册第三方 banking 用户(仅企业)
      description: '企业账户可将终端客户注册为独立的 banking 用户,并以其名义开设账户。需要第三方已通过(APPROVED)的 KYC/KYB 验证的 verification_id:类型由验证种类决定(KYC
        = INDIVIDUAL,KYB = COMPANY),身份数据从已验证的档案自动填充(显式字段优先),且已校验的文件会自动重新递交给 banking 提供方(documents_synced)。收取
        banking 档案费用(若核心拒绝则退款)。个人账户返回 403 company_required。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verification_id
              properties:
                verification_id:
                  type: string
                  format: uuid
                  description: 已通过(APPROVED)的第三方 KYC/KYB 验证的 submission_id。
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                  description: 可选:必须与验证类型一致。
                name:
                  type: string
                  description: 可选:从已验证的档案自动填充。
                email:
                  type: string
                  format: email
                  description: 可选:从已验证的档案自动填充。
                country:
                  type: string
            example:
              verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
      responses:
        '201':
          description: 第三方 banking 用户已创建。
          content:
            application/json:
              example:
                third_party_id: 7f2a1b3c-0000-1111-2222-333344445555
                customer_id: cus_abc123
                kind: third_party
                status: pending
                verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                documents_synced: 2
                registered_at: '2026-07-10T15:00:00Z'
                banking_fee: '1.000000'
                banking_fee_asset: USDT
        '202':
          description: 申请已被挂起等待审核（组织已启用申请审核）。只有在合规团队批准审核后才会创建资源；开户/发卡费用在挂起时收取，若审核被拒绝将自动退还。请通过
            `txn_review_status_changed` webhook 或 `GET /v1/me/txn-reviews` 跟踪结果。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '403':
          description: company_required
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch
            / verification_invalid
    get:
      tags:
      - 银行服务
      operationId: listBankingThirdParties
      summary: 列出第三方 banking 用户
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: 调用账户拥有的第三方。
          content:
            application/json:
              example:
                page: 1
                page_size: 50
                third_parties:
                - id: 7f2a1b3c-0000-1111-2222-333344445555
                  customer_id: cus_abc123
                  kind: third_party
                  type: INDIVIDUAL
                  name: Carlos Mendes
                  created_at: '2026-07-10T15:00:00Z'
