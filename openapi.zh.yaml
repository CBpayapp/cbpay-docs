              verify_code: Q3fa85f6457174562b3fc2c963f66afa6a1b2c3d4e5f
      responses:
        '200':
          description: 返回任何 2xx 以确认交付。
  risk_score_changed:
    post:
      summary: Qscore 评分已变更
      description: '新生成的 Qscore 报告产生了与主体之前已知评分不同的分数（例如在监控
        重新拉取或新购买时）。仅在评分实际发生变化时发出；payload 携带新旧评分/等级对，
        便于您决定是否采取行动。订阅此事件可以在不进行轮询的情况下持续监控主体。


        每次交付都包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。响应 2xx；
        最多 5 次尝试，采用递增退避。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id:
                  type: string
                report_id:
                  type: string
                old_score:
                  type: integer
                new_score:
                  type: integer
                old_band:
                  type: string
                new_band:
                  type: string
            example:
              subject_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              report_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              old_score: 742
              new_score: 688
              old_band: B
              new_band: B
      responses:
        '200':
          description: 返回任何 2xx 以确认交付。
  risk_monitoring_alert:
    post:
      summary: Qscore 监控告警
      description: '账户通过 `PUT /v1/qscore/subjects/{docID}/monitoring` 监控的主体自上次检查以来
        发生了变化。`triggers` 列出触发本次告警的原因：`score_drop_below`（评分向下穿越订阅的
        `monitor_since_score` 阈值：先前 >= 阈值，新值 < 阈值）、`new_records`（征信局登记了新事件；
        当 `only_material: true` 时，仅重大负面事件——未结清的逾期、拒付、破产、诉讼——计入）或
        `records_removed`（征信局当前显示的事件少于基线，即某条记录已结清或删除）。活跃订阅每
        ~5 分钟重新评估一次；订阅后的首次扫描仅建立基线，绝不会就已购买报告中展示过的历史
        记录发出告警。当主体暂无可分类评分时，`score` 和 `previous_score` 将被省略；没有新事件
        触发时，`new_records` 也将被省略。


        每次交付都包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。响应 2xx；
        最多 5 次尝试，采用递增退避。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                monitoring_id:
                  type: string
                subject_id:
                  type: string
                doc_id:
                  type: string
                country:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                triggers:
                  type: array
                  items:
                    type: string
                    enum: [score_drop_below, new_records, records_removed]
                score:
                  type: integer
                previous_score:
                  type: integer
                band:
                  type: string
                  enum: [A, B, C, D, E, SC]
                record_count:
                  type: integer
                new_records:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      record_type:
                        type: string
                      reported_at:
                        type: string
                      amount:
                        type: string
                      currency:
                        type: string
                      status:
                        type: string
                detected_at:
                  type: string
            example:
              monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
              subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
              doc_id: 12.345.678-5
              country: CL
              subject_type: person
              triggers: [score_drop_below, new_records]
              score: 487
              previous_score: 512
              band: D
              record_count: 3
              new_records:
              - source: res_chile
                record_type: debt_collection
                reported_at: '2026-08-05T00:00:00Z'
                amount: '450000'
                currency: CLP
                status: open
              detected_at: '2026-08-08T18:41:12Z'
      responses:
        '200':
          description: 返回任何 2xx 以确认交付。
  risk_batch_completed:
    post:
      summary: Qscore 批量评分已完成
      description: '使用 `POST /v1/qscore/batches` 创建的批量评分任务已完成对其所有
        条目的处理。这是批次的唯一完成信号：各个报告**不会**发出自己的
        `risk_report_ready` webhook（也不会按条目发送电子邮件）。`status` 在所有条目
        成功时为 `completed`，在至少一个条目最终失败（其费用已退款）时为
        `completed_with_errors`，在批次本身无法处理时为 `failed`。计数器始终一致：
        `succeeded_items + failed_items = total_items`。使用 `GET
        /v1/qscore/batches/{id}/items` 读取各条目结果，或使用 `GET
        /v1/qscore/batches/{id}/results.csv` 下载结果。


        每次交付都包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、
        `X-Webhook-Delivery-ID`、`X-Webhook-Timestamp` 和 `X-Webhook-Signature =
        hex(HMAC-SHA256(secret, timestamp + "." + body))`。返回 2xx；最多 5 次尝试，
        采用递增退避。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_id:
                  type: string
                status:
                  type: string
                  enum: [completed, completed_with_errors, failed]
                total_items:
                  type: integer
                succeeded_items:
                  type: integer
                failed_items:
                  type: integer
                country:
                  type: string
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
            example:
              batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
              status: completed_with_errors
              total_items: 4
              succeeded_items: 3
              failed_items: 1
              country: CL
              purpose: credit_evaluation
      responses:
        '200':
          description: 返回任何 2xx 以确认交付。
  risk_consent_granted:
    post:
      summary: 持有人已授予 Qscore 授权
      description: '通过 `POST /v1/qscore/consents` 创建的授权链接已被授予：持有人打开了公开页面，
        通过开放金融连接其银行并授权了该请求（其核验证件与主体证件一致）。该授权现在会在新的
        Qscore 报告中解锁主体的正向银行数据。`previous_status` 实际为 `pending`；携带它便于对账重放。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx；最多
        5 次尝试，递增量退避。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_id:
                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [granted]
                previous_status:
                  type: string
                holder_name:
                  type: string
                openfinance_link_id:
                  type: string
                granted_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: granted
              previous_status: pending
              holder_name: Maria Jose Contreras Soto
              openfinance_link_id: lnk_9b2c4d6e8f
              granted_at: '2026-08-10T09:21:44Z'
      responses:
        '200':
          description: 返回任意 2xx 确认投递。
  risk_consent_revoked:
    post:
      summary: Qscore 授权已撤销
      description: '授权链接已被撤销——可能是持有人在公开页面拒绝了请求，也可能是您的账户调用了
        `POST /v1/qscore/consents/{id}/revoke`。已撤销的授权不再为新的 Qscore 报告提供正向银行数据。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx；最多
        5 次尝试，递增量退避。'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_id:
                  type: string
                subject_id:
                  type: string
                country:
                  type: string
                doc_id:
                  type: string
                subject_type:
                  type: string
                  enum: [person, company]
                purpose:
                  type: string
                  enum: [credit_evaluation, tenant_screening, hiring, supplier_onboarding, other]
                status:
                  type: string
                  enum: [revoked]
                previous_status:
                  type: string
                revoked_at:
                  type: string
                  format: date-time
            example:
              consent_id: c1a2b3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              subject_id: 7e8f9a0b-1c2d-4e3f-8a9b-0c1d2e3f4a5b
              country: CL
              doc_id: 12.345.678-5
              subject_type: person
              purpose: credit_evaluation
              status: revoked
              previous_status: pending
              revoked_at: '2026-08-10T10:02:11Z'
      responses:
