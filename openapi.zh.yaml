  /v1/wallet-links/challenges:
    post:
      tags:
      - 钱包链接
      operationId: createWalletLinkChallenge
      summary: 创建用于链接外部钱包的 nonce 挑战
      description: "创建一个 nonce 挑战,用于将外部钱包(`custody=client`)链接到账户。\n
        客户使用其钱包对 `envelope` 进行签名(ETH/EVM 为 EIP-191,TRON 为 TIP-191),\n
        并将其发送到 `POST /v1/wallet-links/verify`。挑战在 10 分钟后过期,且只能使用一次。\n\n
        特定错误:`unsupported_chain`、`invalid_address`、`nonce_failed`。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain, address]
              properties:
                chain:
                  type: string
                  enum: [eth, tron]
                address:
                  type: string
                  description: 外部钱包地址(网络格式)。
            example:
              chain: eth
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
      responses:
        '201':
          description: 挑战已创建。
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: object
                    properties:
                      link_id:
                        type: string
                        format: uuid
                      chain:
                        type: string
                      address:
                        type: string
                      nonce:
                        type: string
                      envelope:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
              example:
                challenge:
                  link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                  nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
                  envelope: "CBPay Signature Proof\nDomain: https://api.qbank.cl/platform\nPurpose: wallet_link\nWallet: 0x71C7656EC7ab88b098defB751B7401B5f6d8976F\nAccount: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d\nNonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7\nIssued: 2026-08-21T14:03:11Z\nExpires: 2026-08-21T14:13:11Z"
                  expires_at: '2026-08-21T14:13:11Z'
        '400':
          description: 无效负载(`invalid_address`、`unsupported_chain`)。
        '500':
          description: 无法生成挑战(`nonce_failed`)。
  /v1/wallet-links/verify:
    post:
      tags:
      - 钱包链接
      operationId: verifyWalletLink
      summary: 验证挑战签名并链接钱包
      description: "验证 nonce 挑战的签名并将外部钱包链接到账户。钱包保持\n
        `custody=client`:客户保留密钥,可在外部消费;链接仅证明地址的所有权。\n\n
        特定错误:`invalid_payload`、`invalid_signature`、\n
        `signature_mismatch`、`verification_failed`、`challenge_consumed`、\n
        `challenge_expired`、`proof_not_signable`。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature]
              properties:
                nonce:
                  type: string
                  description: 挑战的 nonce(来自 `POST /v1/wallet-links/challenges`)。
                signature:
                  type: string
                  description: 封装的签名(EIP-191 / TIP-191)。
            example:
              nonce: 9f2c41d2a887f3e4b219c6d2e8f1a5b7
              signature: '8ba1f109551bd432803012645ac136ddd64dba72a0c9e0b1f5b1a2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00112233445566771b'
      responses:
        '200':
          description: 钱包已链接。
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/WalletLink'
                  proof:
                    $ref: '#/components/schemas/SignatureProof'
              example:
                link:
                  link_id: d52e7b91-4c68-4f89-1b23-5d7e9f0a2c46
                  account_id: ae8c1f02-3b45-4c67-9d12-8f0e5a6b7c8d
                  chain: eth
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
