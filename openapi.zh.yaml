  wallet_signature_created:
    post:
      summary: 钱包签名证明已创建
      description: '已使用隔离钱包创建签名证明(`POST
        /v1/segregated-wallets/{walletID}/signatures`)。该钱包使用链原生标准(ETH/EVM 为 EIP-191,TRON 为 TIP-191)
        在防钓鱼 CBPay Signature Proof 封装内对消息进行了签名。该证明可在 `verify_url` 公开验证(无需身份验证)。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx;最多
        5 次尝试,递增量退避。'
      requestBody:
        content:
