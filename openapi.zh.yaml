openapi: 3.1.0
info:
  title: CBPay API
  version: "2.72"
  description: 'CBPay 是一个多币种支付平台:覆盖拉美的法币付款(payout)与收款(payin)、内部转账、链上充值与提现,以及 KYC 筛查。每个账户持有四个相互独立的虚拟余额——USDT(运营货币)、USDC、BTC
    和 GOLD(纯金克数)——可通过兑换(swap)按需转换。

    payout 和服务费可从四个余额中的任意一个支付(用 `PUT /v1/settlement`

    设置默认值,或在单笔 payout 中用 `settlement_asset` 覆盖);payin

    可自动兑换为你选择的资产(`default_payin_asset`)。


    所有金额均为十进制字符串,遵循各货币的精度(USDT/USDC/GOLD 为 6 位小数,BTC 为 8 位)。错误始终返回

    `{"error": "<code>", "message": "<detail>"}`。

    '
servers:
- url: https://api.qbank.cl/platform
  description: Live（生产环境，真实资金）
- url: https://cryptobank.qbank.cl/platform
  description: Test（沙盒，模拟资金 — pk_test_ 密钥）
security:
- bearerAuth: []
tags:
- name: 凭证
  description: 每笔操作的品牌化 PDF 凭证,附带公开的签名 QR 真伪校验、每个响应/webhook 中的 receipt_url,以及最终状态时的自动邮件发送。
- name: 身份认证
  description: 注册与登录账户成员。会话有效期 24 小时。
- name: 账户
  description: 调用账户的档案、成员与 API key。
- name: 余额
  description: 余额、流水历史与外汇汇率。
- name: 付款(Payouts)
  description: 从你选择的结算余额扣款的法币派发(默认 USDT)。
- name: 收款(Payins)
  description: 法币充值(二维码、转账、专属账户、pull 收款、卡片、checkout 链接)自动入账——默认入账 USDT,也可自动兑换为你选择的结算资产。
- name: 收银台(Checkout)
  description: >-
    通用收银台链接(`POST /v1/payins`,`method: "checkout"`)与公开支付页端点——多国法币、每个链接专属临时钱包的加密货币支付,以及
    CBPay 直接支付,按你选择的资产结算。
- name: 已保存卡片(Stored cards)
  description: >-
    在 3-D Secure 支付中经付款人明确同意保存的卡片(COF)。可列出、吊销并按需扣款(MIT),无需再次索要卡片信息。
- name: 订阅(Subscriptions)
  description: >-
    由平台调度器管理的已保存卡片周期性扣款——按日、周、月或年,支持暂停/恢复/取消与自动催收。
- name: 转账
  description: CBPay 账户之间的免费内部转账(个人或企业,任意组合)。
- name: 联系人
  description: 按账户维护的收款人通讯录(CBPay、银行与加密货币目的地),支持手机号匹配与每次发送时自动保存。
- name: 兑换(Swaps)
  description: 按账户报价即时兑换账户的 USDT、USDC、BTC 与 GOLD 余额。
- name: 加密货币
  description: 链上充值与提现(TRON、Ethereum 和 Bitcoin)。
- name: 隔离钱包
  description: 拥有自身余额的链上钱包(企业不限数量;个人每个网络+资产组合 1 个)——创建、导入、发送、导出私钥与自动转发。余额存在于链上,从不进入账本。
- name: 签名证明
  description: 使用钱包进行加密消息签名(EIP-191 ETH/EVM、TIP-191 TRON)——创建、列出、查询和吊销具有公开验证功能的签名证明。
- name: 钱包链接
  description: 通过签名 nonce 挑战将外部钱包(custody=client)链接到你的账户——创建挑战、验证签名、列出和吊销链接。
- name: QR Crypto POS
  description: "面向拥有实体 POS 终端的处理商（企业账户）的定额加密货币二维码收款：已验证商户、每笔收款专属地址 + 二维码、支付早期检测、按商户对账，以及经加密货币提现通道的退款。"
- name: KYC / KYB
  description: 身份验证:个人 KYC、企业 KYB——你自己的入驻验证,以及企业账户的第三方验证。
- name: AML 筛查
  description: 针对个人与企业的独立 AML 筛查(制裁、PEP 与负面媒体名单),含重新筛查、持续监控与可下载的 PDF 报告。
- name: 钱包筛查
  description: 区块链地址的 AML 风险评估(制裁、非法资金暴露),按次收费;另附提现与充值的免费自动防护。
- name: Qscore
  description: API 优先的信用局。签发完整的信用报告，评分为 1-999（A-E 等级，无数据时为 SC），查询主体的最新评分，并管理
    ARCO 争议。智利先行，设计上与国家无关。每份签发的报告都带有公开验证码。
- name: 分析
- name: Webhooks
  description: 接收签名事件通知的订阅。
- name: 状态
  description: 服务可用性。
- name: 银行服务
  description: 真实银行账户:通过国际银行通道接收、持有与发送资金。
- name: 卡片
  description: 以 Just-In-Time 方式从你选择的余额(USDT、USDC、BTC 或 GOLD)消费的虚拟卡与实体卡,支持按卡设置消费限额。
- name: 安全(OTP)
  description: 通过 SMS/WhatsApp/email 发送的一次性验证码,保护敏感操作;并提供自助 2FA 偏好设置。仅适用于用户会话——API key 豁免。
- name: 通行密钥
  description: 通过 WebAuthn 使用设备生物识别(Face ID、Touch ID、Windows Hello、安全密钥)的无密码登录、带备份码的验证器应用(TOTP),以及会话/设备管理。
- name: 社交登录
  description: 通过令牌交换以 Google、Apple、Microsoft 和 Facebook 实现无密码注册与登录。前端获取提供方凭证;API 验证后签发 CBPay 会话。
- name: 实时事件
  description: >-
    Server-Sent Events 流，实时推送账户内（管理员则为整个组织）发生的所有事件，支持通过 `Last-Event-ID` 重放、可选的初始快照，以及 90 天可查询历史。
paths:
  /v1/payouts/{payoutID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getPayoutReceipt
      summary: 下载 payout 凭证(PDF)
      description: payout 的品牌化 PDF 凭证,包含受益人数据、金额、状态徽章及签名验证 QR。非最终状态带对角水印。仅 payout 的所有者(或组织管理员)可下载。
      parameters:
      - name: payoutID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payins/{payinID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getPayinReceipt
      summary: 下载 payin 凭证(PDF)
      description: 收款的品牌化 PDF 凭证,包含参考号、金额、状态徽章及签名验证 QR。非最终状态带对角水印。
      parameters:
      - name: payinID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{transferID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getTransferReceipt
      summary: 下载转账凭证(PDF)
      description: 内部转账的品牌化 PDF 凭证(双方均可下载;对手方以显示名称展示)。
      parameters:
      - name: transferID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/withdrawals/{withdrawalID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getCryptoWithdrawalReceipt
      summary: 下载加密提现凭证(PDF)
      description: 链上提现的品牌化 PDF 凭证,包含网络、目标地址、交易哈希及签名验证 QR。
      parameters:
      - name: withdrawalID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/crypto/deposits/{depositID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getCryptoDepositReceipt
      summary: 下载加密充值凭证(PDF)
      description: 已入账链上充值的品牌化 PDF 凭证。`depositID` 为 `GET /v1/crypto/transactions` 返回的 `deposit_id` 字段。
      parameters:
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/swaps/{swapID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getSwapReceipt
      summary: 下载 swap 凭证(PDF)
      description: 余额兑换的品牌化 PDF 凭证,包含兑换双边、适用汇率及签名验证 QR。
      parameters:
      - name: swapID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards/{cardID}/transactions/{transactionID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getCardTransactionReceipt
      summary: 下载卡片消费凭证(PDF)
      description: 卡片交易的品牌化 PDF 凭证,包含商户、USD 金额、扣款余额及签名验证 QR。
      parameters:
      - name: cardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/banking/operations/{operationID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getBankingOperationReceipt
      summary: 下载银行操作凭证(PDF)
      description: 银行操作的品牌化 PDF 凭证(金额、货币、交易对手、状态),附带签名验证 QR。适用于可追溯性镜像上线后创建的操作。
      parameters:
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/sends/{sendID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getWalletSendReceipt
      summary: 下载隔离钱包发送凭证(PDF)
      description: 隔离钱包链上发送的品牌化 PDF 凭证,包含网络、目标地址、交易哈希及签名验证 QR。
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sendID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/segregated-wallets/{walletID}/deposits/{depositID}/receipt:
    get:
      tags:
      - 凭证
      operationId: getWalletDepositReceipt
      summary: 下载隔离钱包充值凭证(PDF)
      description: 隔离钱包收到链上充值的品牌化 PDF 凭证,包含网络、来源地址、交易哈希及签名验证 QR。
      parameters:
      - name: walletID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depositID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/receiptLang'
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPDF'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verify/reports/{code}:
    get:
      security: []
      tags:
      - KYC / KYB
      operationId: verifyReport
      summary: 验证报告真伪（公开）
      description: >-
        每份验证报告上印的二维码背后的公开端点（无需凭证）。验证码经加密签名 - 被篡改或伪造的验证码将返回 404 且
        valid=false。响应仅暴露类型（KYC/KYB）、当前的决定状态及其日期 - 绝不暴露主体身份、文件或 AML 结果。浏览器收到品牌化 HTML 页面；API 客户端收到 JSON。按
        IP 限流。
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 报告上印的验证码（也嵌入在二维码 URL 中）。
      responses:
        '200':
          description: 报告为真；验证的当前事实。
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: kyb
                status: ok
                decision: approved
                date: '2026-07-21'
                issued_by: CBPay
        '404':
          description: 验证码无效、被篡改或未知。
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: 来自该 IP 的验证尝试过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreReport
      summary: 验证 Qscore 报告的真实性（公开）
      description: '公开端点（无需凭证），对应每份 Qscore 信用报告上打印的验证码。该代码经过加密签名：
        被篡改或伪造的代码会返回 404 和 `valid: false`。响应仅显示非敏感事实：报告存在、
        其评分等级（绝不返回数字分数）以及签发日期——绝不包含主体身份或信用详情。
        浏览器获得品牌化 HTML 页面；API 客户端获得 JSON。按 IP 限流。'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 报告上打印的验证码（报告资源的 `verify_code` 字段）。
      responses:
        '200':
          description: 报告真实有效；非敏感事实。
          content:
            application/json:
              example:
                valid: true
                type: verification_report
                kind: qscore
                status: ready
                decision: B
                date: '2026-08-08'
                issued_by: CBPay
        '404':
          description: 验证码无效、被篡改或未知。
          content:
            application/json:
              example:
                valid: false
                message: this verification code does not correspond to any verification report issued by this platform
        '429':
          description: 来自此 IP 的验证尝试次数过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSeal
      summary: 查询 Qscore 印章的当前有效性（公开）
      description: '公开端点（无需凭证），对应企业通过 `POST /v1/qscore/my-seal` 激活的 Qscore
        印章。验证码经过加密签名：被篡改或伪造的代码返回 404 且 `valid: false`。每次调用都会实时
        评估资格：仅当印章处于激活状态且主体仍符合条件（等级 A/B 且评估不超过 90 天）时才显示
        等级（A 或 B）。不再符合条件的印章返回 `seal_status: not_current`——反预言机：绝不透露
        降至的等级、数字分数或原因。数字分数绝不出现在任何公开界面上。浏览器获得品牌化 HTML
        页面（`Accept: text/html`）；API 客户端获得 JSON。按 IP 限流。'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 印章的公开验证码（印章资源的 `verify_code` 字段）。
      responses:
        '200':
          description: 印章状态，实时评估。
          content:
            application/json:
              examples:
                active:
                  summary: 有效印章（激活且仍符合条件）
                  value:
                    valid: true
                    type: qscore_seal
                    seal_status: active
                    band: A
                    evaluated_at: '2026-08-07'
                    company_name: Comercial Andes SpA
                    doc_id: 76.543.210-3
                    country: CL
                revoked:
                  summary: 印章被持有人撤销（对该代码永久生效）
                  value:
                    valid: false
                    seal_status: revoked
                    revoked_at: '2026-08-09'
                not_current:
                  summary: 印章不再符合条件（等级下降或分数过期）——绝不透露原因
                  value:
                    valid: false
                    seal_status: not_current
        '404':
          description: 验证码无效、被篡改或未知。
          content:
            application/json:
              example:
                valid: false
                seal_status: not_current
        '429':
          description: 来自此 IP 的验证尝试次数过多。
          content:
            application/json:
              example:
                error: too_many_attempts
                message: too many verification attempts; wait a moment and retry
  /verify/qscore/seal/{code}/badge.svg:
    get:
      security: []
      tags:
      - Qscore
      operationId: verifyQscoreSealBadge
      summary: 可嵌入的 SVG 徽章，显示印章的实时状态（公开）
      description: '公开端点（无需凭证），将可嵌入的 Qscore 印章渲染为 SVG 图像（180x64，
        深色背景）。当印章处于激活状态且主体仍符合条件时，徽章以绿色显示当前等级字母
        （A 或 B）和 "VERIFICADO" 标签；否则，同一 URL 渲染灰色的 "NO VIGENTE" 徽章——
        绝不显示过期的等级，也绝不破坏宿主页面。`Cache-Control: public, max-age=300`
        （访问者可缓存图像最多 5 分钟）。仅对无效或被篡改的代码返回 404（空响应体）。'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 印章的公开验证码（印章资源的 `verify_code` 字段）。
      responses:
        '200':
          description: 带有印章实时状态的 SVG 徽章。
          content:
            image/svg+xml:
              schema:
                type: string
