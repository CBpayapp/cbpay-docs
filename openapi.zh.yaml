            该延迟覆盖所有以银行卡支付的收款:直接银行卡收款以及以卡支付的收银台/POS
            收款(通过 QR/加密货币/fintoc 支付的收银台收款仍立即入账)。
            用于其他服务或为负数将被拒绝并返回 `invalid_settlement_hours`。
          example: 24
