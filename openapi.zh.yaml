  /v1/webhooks/subscriptions:
    post:
      tags:
      - Webhooks
      operationId: createWebhookSubscription
      summary: 创建 webhook 订阅
      description: '订阅一个 HTTPS 回调以接收调用账户的事件。


        投递均带签名:`X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`,时间戳在 `X-Webhook-Timestamp`。最多重试
        5 次,间隔递增。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              - callback_url
              - secret
              properties:
                event_type:
                  type: string
                  enum:
                  - payin_credited
                  - payin_expired
                  - payin_refunded
                  - payin_settlement_scheduled
                  - payout_status_changed
                  - transfer_received
                  - crypto_deposit_credited
                  - crypto_deposit_held
                  - crypto_deposit_alert
                  - crypto_withdrawal_status_changed
                  - banking_customer_status_changed
                  - banking_operation_status_changed
                  - aml_screening_updated
                  - kyc_verification_status_changed
                  - kyb_verification_status_changed
                  - kyc_link_completed
                  - kyb_link_completed
                  - kyc_document_validated
                  - kyb_document_validated
                  - kyc_liveness_completed
                  - wallet_deposit_received
                  - wallet_send_status_changed
                  - wallet_key_exported
                  - '*'
                callback_url:
                  type: string
                  format: uri
                  description: 仅限 HTTPS;localhost 与私有 IP 会被拒绝。
                secret:
                  type: string
                  minLength: 16
            example:
              event_type: payout_status_changed
              callback_url: https://api.myapp.com/webhooks/cbpay
              secret: a-strong-shared-secret-123
      responses:
        '201':
          description: 订阅已创建。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    example: active
                  created_at:
                    type: string
                    format: date-time
                  secret_stored:
                    type: boolean
              example:
                id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                event_type: payout_status_changed
                callback_url: https://api.myapp.com/webhooks/cbpay
                status: active
                created_at: '2026-07-07T12:00:00Z'
                secret_stored: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Webhooks
      operationId: listWebhookSubscriptions
      summary: 列出 webhook 订阅
      description: 列出账户的 webhook 订阅(secret 永不返回)。
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: 订阅。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                page: 1
                page_size: 50
                subscriptions:
                - id: 475b48fc-2858-4ad3-81e2-ec68742d8245
                  event_type: payout_status_changed
                  callback_url: https://api.example.com/webhooks/cbpay
                  status: active
                  created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/subscriptions/{subscriptionID}:
    patch:
      tags:
      - Webhooks
      operationId: updateWebhookSubscriptionStatus
      summary: 停用或重新启用 webhook 订阅
      description: '将账户的某个订阅在 `active` 和 `disabled` 之间切换。`disabled`
        状态的订阅停止接收新事件；已排队的投递仍会发出。幂等：重复当前状态返回
        `200` 且无变化。订阅永远不会被删除——停用即退订。强制执行归属权：其他账户的
        订阅返回 `404`（与不存在的订阅无法区分）。

        '
      parameters:
      - name: subscriptionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - disabled
            examples:
              disable:
                summary: 停用订阅
                value:
                  status: disabled
              reactivate:
                summary: 重新启用订阅
                value:
                  status: active
      responses:
        '200':
          description: 返回订阅及其当前状态。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  event_type:
                    type: string
                  callback_url:
                    type: string
                  status:
                    type: string
                    enum:
                    - active
                    - disabled
                  created_at:
                    type: string
                    format: date-time
              examples:
                disabled:
                  summary: 订阅已停用
                  value:
                    id: 8e7f6a5b-4c3d-2e1f-0a9b-8c7d6e5f4a3b
                    event_type: payout_status_changed
                    callback_url: https://api.myapp.com/webhooks/cbpay
                    status: disabled
                    created_at: '2026-07-07T12:00:00Z'
        '400':
          description: '`invalid_status`：状态必须为 `active` 或 `disabled`。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidStatus:
                  summary: 状态超出目录范围
                  value:
                    error: invalid_status
                    message: status must be active or disabled
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
