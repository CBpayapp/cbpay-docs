  /v1/payouts/banks:
    get:
      tags:
      - 付款(Payouts)
      operationId: getPayoutBanks
      summary: 列出目标银行
      description: 某国 payout 的银行目录。不带 `method` 时返回该国所有 payout 方式的银行并集(按代码去重);传入 `method` 可获取单一渠道的目录。部分方式没有银行目录(例如
