  /v1/qscore/subjects/{docID}/monitoring:
    put:
      tags: [Qscore]
      summary: 订阅某主体的监控
      operationId: putQscoreMonitoring
      description: '为你的账户创建或更新对某主体（个人或企业）的监控订阅。监控免费，但要求你的组织已购买该主体的
        `ready` 报告——订阅的基线数据来自该已购报告。设计上（防预言机），不存在的主体与存在但未购报告的主体返回完全相同的
        `403 report_required` 响应：本端点绝不会泄露某个证件号是否存在于信用局中。

        订阅按（账户、主体）幂等：重复创建会返回已存在的订阅并保留其基线。`only_material`（默认
        false）将 `new_records` 触发器限制为重大负面记录（未结催收、被拒付票据、破产、诉讼）。
        `monitor_since_score`（1..999）配置 `score_drop_below` 触发器：当评分跌破该阈值时发出告警。'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: 证件的国家 ISO 代码（默认 CL）。也可在请求 body 中以 `country` 字段提供。
        example: CL
      requestBody:
        required: false
        content:
          application/json:
            example:
              only_material: true
              monitor_since_score: 500
      responses:
        '200':
          description: 监控订阅（已创建或已更新）。
          content:
            application/json:
              example:
                monitoring_id: 7c9e2f14-5b6a-4c8d-9e1f-3a7b5c2d8e91
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                active: true
                only_material: true
                created_at: '2026-08-08T16:11:40Z'
                doc_id: 12.345.678-5
                country: CL
                subject_type: person
                monitor_since_score: 500
        '400':
          description: invalid_doc_id | invalid_payload
          content:
            application/json:
              example:
                error: invalid_payload
                message: monitor_since_score must be between 1 and 999
        '401':
          description: unauthorized
        '403':
          description: forbidden（服务未启用或账户未验证）| report_required
          content:
            application/json:
              example:
                error: report_required
                message: purchase a report for this subject before enabling monitoring
    get:
      tags: [Qscore]
      summary: 获取某主体的监控订阅
      operationId: getQscoreMonitoring
      description: '返回你的账户对某主体的当前监控订阅，包含最近观察到的评分、记录数量以及上次检查
        （`last_checked_at`）和上次告警（`last_event_at`）的时间戳。若无订阅则返回
