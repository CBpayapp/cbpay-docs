  /v1/contacts/import:
    post:
      tags:
      - 联系人
      operationId: importContacts
      summary: 导入手机通讯录
      description: 每次请求最多上传 1,000 个联系人(超过请分页)。电话规范化为 E.164;已存在的联系人绝不重复;`has_cbpay` 告诉你哪些联系人已拥有你同一运营方的活跃账户(按电话匹配)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phones:
                        type: array
                        items:
                          type: string
                      email:
                        type: string
            example:
              contacts:
              - name: Carlos Soto
                phones:
                - +56 9 8765 4321
              - name: Ana Perez
                phones:
                - '912345678'
      responses:
        '200':
          description: 每个联系人的结果。
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  matched:
                    type: integer
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      type: object
              example:
                imported: 2
                matched: 1
                total: 2
                contacts:
                - name: Carlos Soto
                  phone: '+56987654321'
                  contact_id: 3f8a1b2c-4d5e-6f70-8a9b-0c1d2e3f4a5b
                  has_cbpay: true
                - name: Ana Perez
                  phone: '+56912345678'
                  contact_id: 9c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                  has_cbpay: false
        '400':
          description: invalid_payload / batch_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: batch_too_large
                message: send up to 1000 contacts per request (paginate the upload)
        '401':
          $ref: '#/components/responses/Unauthorized'
