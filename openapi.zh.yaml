        payin 响应中自动嵌入的内容相同。可用于在付款人创建 payin 之前渲染
        "钱应该汇到哪里"页面,或在静态页面上展示当前的存款说明。

        只有配置了有效、由管理员设置的说明的通道才会返回内容;其余通道
        响应 `404 not_found`(没有可预览的内容 —— 该通道不需要说明,或
        尚无人配置)。
      parameters:
