  /v1/me/txn-reviews:
    get:
      tags:
      - Account
      operationId: listMyTxnReviews
      summary: 我的交易审核
      description: |-
        账户被交易防火墙挂起的资金操作（付款、加密货币提现、收款、银行转账）及其审核状态。可按 `status` 和日期范围（`from`/`to`，组织时区，均含边界）过滤。当审核进入 `info_requested` 时，请通过 `POST /v1/me/txn-reviews/{reviewID}/files` 上传所需文件——在合规团队作出决定前，该操作将保持挂起状态。
      parameters:
      - name: status
        in: query
        description: '`in_review`, `info_requested`, `released`, `rejected` or `all` (empty = open: `in_review` + `info_requested`).'
        schema:
          type: string
          enum:
          - in_review
          - info_requested
          - released
          - rejected
          - all
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 我的交易审核.
          content:
            application/json:
              example:
                reviews:
                - id: 7a3f2b1c-0000-4000-8000-000000000001
                  kind: payout
                  resource_id: 8b4c3d2e-1111-4111-8111-111111111111
                  status: info_requested
                  amount_label: '1500.00'
                  asset: USD
                  country: MX
                  method: spei
                  counterparty: Juan Pérez
                  info_request:
                    message: Please upload the invoice that justifies this payment
                    requested_at: '2026-08-06T15:20:00Z'
                  created_at: '2026-08-06T14:32:00Z'
                  updated_at: '2026-08-06T15:20:00Z'
                page: 1
                page_size: 50
                total: 1
        '400':
          description: Invalid filter.
          content:
            application/json:
              examples:
                invalid_status:
                  summary: Unknown status
                  value:
                    error: invalid_status
                    message: status must be one of in_review, info_requested, released, rejected, all
                invalid_range:
                  summary: Bad date range
                  value:
                    error: invalid_range
                    message: invalid date range
  /v1/me/txn-reviews/{reviewID}:
    get:
      tags:
      - Account
      operationId: getMyTxnReview
      summary: 审核详情
      description: '账户某条审核的详情，包括信息请求消息（`info_request`）和已上传的文件。内部挂起原因和合规备注绝不对外暴露（防止通风报信）。被拒绝的审核还会包含 `decision_note`（与拒绝邮件相同的文本）和 `decided_at`。'
      parameters:
      - name: reviewID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The review with its uploaded files.
          content:
            application/json:
              example:
                review:
                  id: 7a3f2b1c-0000-4000-8000-000000000001
                  kind: payout
                  resource_id: 8b4c3d2e-1111-4111-8111-111111111111
                  status: info_requested
                  amount_label: '1500.00'
                  asset: USD
                  country: MX
                  method: spei
                  counterparty: Juan Pérez
                  info_request:
                    message: Please upload the invoice that justifies this payment
                    requested_at: '2026-08-06T15:20:00Z'
                  files:
                  - id: f1e2d3c4-0000-4000-8000-0000000000aa
                    review_id: 7a3f2b1c-0000-4000-8000-000000000001
                    file_name: invoice-221.pdf
                    content_type: application/pdf
                    size_bytes: 482110
                    uploaded_by: account
                    created_at: '2026-08-06T15:40:00Z'
                  created_at: '2026-08-06T14:32:00Z'
                  updated_at: '2026-08-06T15:40:00Z'
        '404':
          description: The review does not belong to the account.
          content:
            application/json:
              example:
                error: not_found
                message: review not found
  /v1/me/txn-reviews/{reviewID}/files:
    post:
      tags:
      - Account
      operationId: uploadMyTxnReviewFile
      summary: 为信息请求上传文件
      description: |-
        为处于 `info_requested` 状态的审核上传证明文件。以原始二进制形式发送请求体，携带对应的 `Content-Type`（PDF、PNG、JPEG、WEBP、TXT、CSV、DOC(X) 或 XLS(X)，最大 50 MB），并在 `name` 查询参数中提供文件名。上传文件后，审核将回到 `in_review` 状态，等待合规团队重新评估。
      parameters:
      - name: reviewID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        description: Original filename (max 200 chars, no path separators).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File uploaded; the review moved back to `in_review`.
          content:
            application/json:
              example:
                file:
                  id: f1e2d3c4-0000-4000-8000-0000000000aa
                  review_id: 7a3f2b1c-0000-4000-8000-000000000001
                  file_name: invoice-221.pdf
                  content_type: application/pdf
                  size_bytes: 482110
                  uploaded_by: account
                  created_at: '2026-08-06T15:40:00Z'
                status: in_review
        '400':
          description: Validation error.
          content:
            application/json:
              examples:
                invalid_name:
                  summary: Missing filename
                  value:
                    error: invalid_name
                    message: name is required (query param, max 200 chars, no path separators)
                empty_file:
                  summary: Empty body
                  value:
                    error: empty_file
                    message: the file body is empty
        '404':
          description: The review does not belong to the account.
          content:
            application/json:
              example:
                error: not_found
                message: review not found
        '409':
          description: The review is not waiting for information.
          content:
            application/json:
              example:
                error: not_awaiting_info
                message: this review is not waiting for additional information
        '413':
          description: The file exceeds 50 MB.
          content:
            application/json:
              example:
                error: file_too_large
                message: max file size is 50 MB
        '415':
          description: Unsupported content type.
          content:
            application/json:
              example:
                error: unsupported_file_type
                message: 'allowed types: pdf, png, jpeg, webp, txt, csv, doc(x), xls(x) — send the file''s Content-Type header'
        '422':
          description: The review already has 20 files.
          content:
            application/json:
              example:
                error: file_limit_reached
                message: a review accepts at most 20 files
  /v1/me/txn-reviews/{reviewID}/files/{fileID}/download:
    get:
      tags:
      - Account
      operationId: downloadMyTxnReviewFile
      summary: 下载您上传的文件
      description: '下载账户此前为该审核上传的文件。以原始 `Content-Type` 返回原始二进制内容。属于其他账户或其他审核的文件将返回 `404 not_found`（绝不返回 `403`，以避免泄露存在性）。'
      parameters:
      - name: reviewID
        in: path
        required: true
        schema:
          type: string
      - name: fileID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The raw file bytes with the original `Content-Type`.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: The review or file does not belong to the account.
          content:
            application/json:
              example:
                error: not_found
                message: review not found

  /v1/qscore/reports:
    get:
      tags: [Qscore]
      summary: 列出信用报告
      operationId: listQscoreReports
      description: '返回您账户的信用报告，按最新优先排序。`from` 和 `to` 日期过滤条件（组织时区，
        两端均含）为必填。其他账户拥有的报告永不可见（所有权隔离：属于其他账户的报告 id
        返回 `404 not_found`）。'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: 开始日期 YYYY-MM-DD（组织时区，含当日）。日期无效返回 400 invalid_range。
        example: '2026-08-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: 结束日期 YYYY-MM-DD（组织时区，含当日）。
        example: '2026-08-08'
      - name: subject_id
        in: query
        required: false
        schema:
          type: string
        description: 按主体 id 过滤（来自 GET /v1/qscore/subjects/{docId}）。
        example: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, ready, failed]
        description: 按报告状态过滤。
        example: ready
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: 页码（>= 1）。
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: 每页结果数（最多 200）。
        example: 50
      responses:
        '200':
          description: 报告分页。每个条目是已存储的报告对象；此列表中评分模型版本字段为
            `score_model_version`（单报告端点以 `model_version` 返回相同的值）。
          content:
            application/json:
              examples:
                ready:
                  summary: 包含一份已就绪报告的分页
                  value:
                    items:
                    - report_id: 3f5c9f2d-7d21-4b8c-9a2d-2d5f6a1b8c01
                      account_id: 5f9d2c10-3e8b-4a1d-9c7a-1d2f3a4b5c6d
                      subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                      purpose: credit_evaluation
                      status: ready
                      lang: es
                      score: 742
                      band: B
                      score_model_version: v1
                      reason_codes:
                      - code: CREDIT_HISTORY_DEPTH
                        direction: positive
                        weight: medium
                      - code: ACTIVE_TRADELINES
                        direction: positive
                        weight: low
                      verify_code: Q3f5c9f2d7d214b8c9a2d2d5f6a1b8c01a1b2c3d4e5f60718293a
                      created_at: '2026-08-08T15:04:22Z'
                      completed_at: '2026-08-08T15:04:24Z'
                    meta:
                      page: 1
                      page_size: 50
                      total: 1
        '400':
          description: invalid_range
          content:
            application/json:
              example:
                error: invalid_range
                message: from/to must be valid YYYY-MM-DD dates
        '401':
          description: unauthorized
        '403':
          description: forbidden（服务已禁用、账户未验证或 scope 不足）
