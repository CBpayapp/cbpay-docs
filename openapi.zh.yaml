                bank_reference: ''
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
  /v1/stored-cards:
    get:
      tags:
      - 已保存卡片(Stored cards)
      operationId: listStoredCards
      summary: '列出已保存的卡片'
      description: '付款人在托管收银台保存的卡片（COF 规范）：仅展示数据（卡组织、末四位、有效期）— 卡号从不存在于本平台。按 `payer_reference` 过滤可向回头客展示其卡片。需要 `from`/`to`。'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: payer_reference
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - revoked
      responses:
        '200':
          description: '分页的已存卡片。'
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  stored_cards:
                    type: array
                    items:
                      type: object
              example:
                page: 1
                page_size: 50
                stored_cards:
                - stored_card_id: 5f0f2c9e-6a4b-4c7e-9a1d-2b3c4d5e6f70
                  payer_reference: customer-1042
                  country: BO
                  currency: BOB
                  brand: visa
                  last4: '2701'
                  expiry_month: '12'
                  expiry_year: '2028'
                  status: active
                  created_at: '2026-07-20T18:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
