                  label: Project X
                  idempotency_key: wallet-project-x
              btc_btc:
                summary: Bitcoin BTC
                value:
                  chain: btc
                  asset: btc
                  label: BTC custody
                  idempotency_key: wallet-btc-001
      responses:
