  /v1/aml/screenings:
    post:
      tags:
      - AML 筛查
      operationId: submitAmlScreening
      summary: 提交 AML 筛查
      description: 通过合规服务对个人或企业（由 payload 判定）进行制裁、PEP 与负面媒体名单筛查。仅名单筛查——带证件与活体核验的身份验证见 /v1/kyc 与 /v1/kyb。身份字段均为可选并完整转发；信息越完整结果越精确。若配置合规费用，调用前扣款，失败则退款。结果本地保存供审计（`GET
        /v1/aml/screenings`）。必须提供 `idempotency_key`——相同键重放返回原记录且 `idempotency_hit` true，不会重复扣费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                idempotency_key:
                  type: string
                  description: 必填（筛查收费）。也可使用 Idempotency-Key 请求头。
                customer:
                  type: object
                  description: 'Identity data. Provide `person` or `company`; when omitted

                    it is filled from the account profile. Additional fields are accepted

                    and forwarded to the screening engine.

                    '
                  properties:
                    person:
                      type: object
                      description: Person identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        full_name:
                          type: string
                        first_name:
                          type: string
                        middle_name:
                          type: string
                        last_name:
                          type: string
                        date_of_birth:
                          type: object
                          description: 'Date of birth as an object: {year, month, day} (integers). A plain "YYYY-MM-DD" string is rejected by the screening engine.'
                          properties:
                            year:
                              type: integer
                            month:
                              type: integer
                            day:
                              type: integer
                        nationality:
                          type: array
                          items:
                            type: string
                          description: Nationalities as an ARRAY of ISO-3166 codes (a plain string is rejected by the screening engine).
                        country_of_birth:
                          type: string
                        residential_information:
                          type: array
                          items:
                            type: object
                            properties:
                              country_of_residence:
                                type: string
                        personal_identification:
                          type: array
                          description: 'Strong identity documents (national ID, passport, ...) as {number, issuing_country}. Do not send a `type` field: the screening engine rejects it.'
                          items:
                            type: object
                            properties:
                              issuing_country:
                                type: string
                              number:
                                type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Other known names.
                    company:
                      type: object
                      description: Company identity. Every field is optional; more identity data yields
                        a more precise screening.
                      properties:
                        legal_name:
                          type: string
                        alias:
                          type: array
                          items:
                            type: string
                          description: Trade / brand names.
                        registration_authority_identification:
                          type: string
                          description: 商业登记机关标识（如税号/登记号）。
                        place_of_registration:
                          type: string
                          description: 注册/成立国家（ISO-3166）。
                        incorporation_date:
                          type: object
                          description: 成立日期，对象格式：{year, month, day}（整数）。
                          properties:
                            year:
                              type: integer
                            month:
                              type: integer
                            day:
                              type: integer
                        address:
                          type: array
                          items:
                            type: object
                            properties:
                              country:
                                type: string
                    email:
                      type: string
                    country:
                      type: string
                monitor:
                  type: boolean
                  default: false
                  description: Enable continuous monitoring from the start.
            examples:
              person:
                summary: Person (KYC)
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth:
                        year: 1990
                        month: 4
                        day: 12
                      personal_identification:
                      - issuing_country: CL
                        number: 12.345.678-5
                    email: ana@example.com
                    country: CL
                  monitor: false
              personFull:
                summary: Person (KYC) — full identity for the most precise screening
                value:
                  customer:
                    person:
                      full_name: Ana Perez Rojas
                      date_of_birth:
                        year: 1990
                        month: 4
                        day: 12
                      nationality:
                      - CL
                      country_of_birth: CL
                      residential_information:
                      - country_of_residence: CL
                      personal_identification:
                      - issuing_country: CL
                        number: 12.345.678-5
                      - issuing_country: CL
                        number: P0123456
                    email: ana@example.com
                    country: CL
                  monitor: false
              company:
                summary: Company (KYB)
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      registration_authority_identification: 76.543.210-3
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              companyFull:
                summary: Company (KYB) — full identity for the most precise screening
                value:
                  customer:
                    company:
                      legal_name: Comercial Andina SpA
                      alias:
                      - Andina Market
                      registration_authority_identification: 76.543.210-3
                      place_of_registration: CL
                      incorporation_date:
                        year: 2015
                        month: 8
                        day: 1
                      address:
                      - country: CL
                    email: legal@andina.cl
                    country: CL
                  monitor: true
              minimal:
                summary: Minimal — autofilled from the account
                value:
                  customer: {}
                  monitor: false
      responses:
        '201':
          description: 筛查已提交并本地保存。
          content:
            application/json:
              schema:
                type: object
                description: 筛查本地镜像及计费字段，完整结果在 `result` 中。
                properties:
                  screening_id:
                    type: string
                  kind:
                    type: string
                    enum:
                    - screening
                  service:
                    type: string
                    enum:
                    - compliance_person
                    - compliance_company
                  subject_type:
                    type: string
                    enum:
                    - person
                    - company
                  subject_name:
                    type: string
                  risk:
                    type: string
                  monitor:
                    type: boolean
                  screening_fee:
                    type: string
                  fee_asset:
                    type: string
                  idempotency_key:
                    type: string
                  idempotency_hit:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  result:
                    type: object
                    description: 合规服务返回的中立筛查结果。
              example:
                screening_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                kind: screening
                service: compliance_person
                subject_type: person
                subject_name: Ana Perez Rojas
                risk: low
                monitor: false
                screening_fee: '2.000000'
                fee_asset: USDT
                idempotency_key: aml-screen-ana-1
                created_at: '2026-07-12T18:00:00Z'
                result:
                  customer_id: e1d2c3b4-a596-8778-695a-4b3c2d1e0f9a
                  status: completed
                  risk_level: low
                  screening_result: no_hits
                  monitored: false
        '400':
          description: 缺少 idempotency_key（`idempotency_key_required`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: Screening temporarily unavailable (`compliance_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: compliance_unavailable
                message: screening temporarily unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
