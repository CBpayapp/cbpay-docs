            核心明确返回 `bureau_unavailable` 时，仍可能结合平台内部信号生成
            ready 报告。传输、认证、存储、契约无效或非空 `sources_failed` 都会
            通过现有 recovery/退款路径 fail-closed。
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: The report is not ready or has no PDF.
          content:
            application/json:
              examples:
                not_found:
                  value: {"error":"not_found","message":"report pdf not found"}
  /v1/qscore/index:
    get:
      tags: [Qscore]
      summary: 读取公开的匿名季度 Qscore Index。
      operationId: getQscoreIndex
      security: []
      parameters:
        - {name: period, in: query, required: false, schema: {type: string, example: "2026-Q2"}}
        - {name: country, in: query, required: false, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: industry_code, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Anonymous quarterly snapshot.
          content:
            application/json:
              examples:
                snapshot:
                  value: {"period":"2026-Q2","country":"CL","industry_code":"6499","items":[{"period":"2026-Q2","country":"CL","industry_code":"6499","band":"B","subject_count":12,"avg_score":742,"created_at":"2026-07-01T00:00:00Z"}],"methodology":"quarterly anonymous buckets; each bucket requires at least five subjects"}
        '400':
          description: period 必须使用 YYYY-Q1、YYYY-Q2、YYYY-Q3 或 YYYY-Q4
          content:
            application/json:
              examples:
                invalid_period:
                  value: {"error":"invalid_period","message":"period must use YYYY-Q1, YYYY-Q2, YYYY-Q3 or YYYY-Q4"}
  /v1/qscore/index/account:
    get:
      tags: [Qscore]
      summary: 使用认证账户或读取范围读取 Qscore Index。
      operationId: getQscoreIndexAccount
      security:
        - bearerAuth: []
      parameters:
        - {name: period, in: query, required: false, schema: {type: string, example: "2026-Q2"}}
        - {name: country, in: query, required: false, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: industry_code, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Anonymous quarterly snapshot.
          content:
            application/json:
              examples:
                snapshot:
                  value: {"period":"2026-Q2","country":"CL","industry_code":"6499","items":[{"period":"2026-Q2","country":"CL","industry_code":"6499","band":"B","subject_count":12,"avg_score":742,"created_at":"2026-07-01T00:00:00Z"}],"methodology":"quarterly anonymous buckets; each bucket requires at least five subjects"}
        '400':
          description: period 必须使用 YYYY-Q1、YYYY-Q2、YYYY-Q3 或 YYYY-Q4
          content:
            application/json:
              examples:
                invalid_period:
                  value: {"error":"invalid_period","message":"period must use YYYY-Q1, YYYY-Q2, YYYY-Q3 or YYYY-Q4"}
        '403':
          description: The account does not have the risk service enabled.
          content:
            application/json:
              examples:
                forbidden:
                  value: {"error":"service_disabled","message":"the fraud and identity service is not enabled for your account"}
  /verify/qscore-fraud/{code}:
    get:
      tags: [Qscore]
      summary: 无需认证验证欺诈报告代码。不返回 PII 或评分。
      operationId: verifyQscoreFraudReport
      security: []
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Valid report code.
          content:
            application/json:
              examples:
                valid:
                  value: {"valid":true,"type":"qscore_fraud","status":"ready","date":"2026-09-06","issued_by":"CBPay"}
        '404':
          description: Invalid or tampered report code.
          content:
            application/json:
              examples:
                invalid:
                  value: {"valid":false,"message":"this fraud report code is not valid"}
        '429':
          description: Per-IP verification throttle.
          content:
            application/json:
              examples:
                throttled:
                  value: {"error":"too_many_attempts","message":"too many verification attempts; wait a moment and retry"}

  /v1/corridor-variants:
    get:
      tags:
      - 收款(Payins)
      operationId: listCorridorVariants
      summary: 列出组织走廊版本
      description: 返回组织未来操作的 routing 选择。
      responses:
        '200':
          description: 已保存的 routing 选择。
          content:
            application/json:
              example:
                variants:
                - org_id: 30981c34-5baa-4339-af89-4503c55136a3
                  direction: payout
                  country: BO
                  currency: BOB
                  method: bank_transfer
                  variant: v2
                  source_account: '7014227171'
                  updated_by: admin:…
                  updated_at: '2026-09-09T20:00:00Z'
        '403':
          description: 需要组织管理员权限。
        '503':
          description: rail_variants_unavailable
    put:
      tags:
      - 收款(Payins)
      operationId: updateCorridorVariant
      summary: 设置组织走廊版本
      description: 为未来操作选择实现；已有操作保留其已保存的 routing。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, country, currency, method, variant, reason]
              properties:
                direction: {type: string, enum: [payin, payout]}
                country: {type: string, enum: [BO]}
                currency: {type: string, enum: [BOB]}
                method: {type: string, enum: [bank_transfer, qr]}
                variant: {type: string, enum: [legacy, v2]}
                source_account: {type: string}
                reason: {type: string}
            example:
              direction: payout
              country: BO
              currency: BOB
              method: bank_transfer
              variant: v2
              source_account: '7014227171'
              reason: Move the BOB payout source to the configured account
      responses:
        '200':
          description: 版本已保存并写入审计。
          content:
            application/json:
              example:
                org_id: 30981c34-5baa-4339-af89-4503c55136a3
                direction: payout
                country: BO
                currency: BOB
                method: bank_transfer
                variant: v2
                source_account: '7014227171'
                updated_by: admin:…
                updated_at: '2026-09-09T20:00:00Z'
        '400':
          description: invalid_rail_variant
        '403':
          description: 需要组织管理员权限。
        '503':
          description: rail_variants_unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '会话 JWT(来自注册/登录)或 API key(`pk_...`)。

        也接受 `X-API-Key: <token>` 作为替代请求头。

        '
  parameters:
    receiptLang:
      name: lang
      in: query
      schema:
        type: string
        enum:
        - en
        - es
        - zh
        default: en
      description: PDF 凭证的语言。默认为英语。
    cardID:
      name: cardID
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: '`idempotency_key` 请求体字段的替代方式。'
      schema:
        type: string
  responses:
    ReceiptPDF:
      description: 带签名验证 QR 的品牌化 PDF 凭证。
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          example: '%PDF-1.7 (binary receipt content)'
    BadRequest:
      description: 请求无效(具体校验见 `error` 代码)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
            message: 'request body is not valid JSON: unknown field'
    InsufficientFunds:
      description: 账户余额不足以完成此操作(`insufficient_funds`)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_funds
            message: account balance is not enough for this operation
    InvalidRange:
      description: 无效的 `from`/`to` 日期过滤(`invalid_range`)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_range
            message: invalid from date (YYYY-MM-DD)
    AccountRequired:
      description: 此端点需要账户凭证(`account_required`)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: account_required
            message: this endpoint requires an account credential
    Forbidden:
      description: 此端点不允许该凭证级别(`forbidden`)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: credentials required
    NotFound:
      description: 资源未找到(`not_found`)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: resource not found
    Unauthorized:
      description: 凭证缺失或无效(`unauthorized`)。
      content:
        application/json:
          schema: *id016
          example:
            error: unauthorized
            message: invalid or missing credentials
  schemas:
    DepositInstructions:
      type: object
      description: |
        你的组织为 `bank_transfer` 通道发布的银行账户文本。由管理员维护,
        只追加新版本(新的修订版本永远不会覆盖 payin 已经快照的文本)。
      properties:
        id:
          type: string
          format: uuid
        country:
          type: string
        currency:
          type: string
        method:
          type: string
        purpose:
          type: string
          enum:
          - payin
          - otc
        revision:
          type: integer
        active:
          type: boolean
        reference_required:
          type: boolean
        bank_name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        holder_name:
          type: string
        holder_tax_id:
          type: string
        holder_email:
          type: string
        routing_number:
          type: string
          description: >-
            收款银行的 ABA 路由号码（US/USD 通道——境内 ACH 与电汇）。
            不使用它的通道中此字段缺省。
        swift:
          type: string
          description: >-
            收款银行的 SWIFT/BIC（US/USD 通道——国际电汇）。
            不使用它的通道中此字段缺省。
        bank_address:
          type: string
          description: >-
            收款银行的注册地址。当通道银行在汇款单上要求填写时提供
            （US/USD）。
        intermediary_bank_name:
          type: string
          description: >-
            中间（代理）银行名称——仅当通道账户经由代理行接收国际电汇时。
        intermediary_bank_swift:
          type: string
          description: 中间银行的 SWIFT/BIC（如适用）。
        holder_address:
          type: string
          description: >-
            账户持有人的邮政地址。当汇款单要求填写时提供（US/USD 通道）。
        notes:
          type: string
          description: >-
            面向付款人的自由格式操作说明（例如："Select Puerto Rico as the
            final beneficiary bank country"）。当通道需要汇款人提供额外
            指示时提供。
        created_at:
          type: string
          format: date-time
        qr_payload:
          type: string
          description: |
            多行纯文本,包含银行账户信息(以及该通道要求时的金额和参考号)。
            供人工阅读,不是供银行 App 扫描的。
        qr_png_base64:
          type: string
          description: |
            将 `qr_payload` 渲染为 QR 码的 base64 PNG,顶部居中带有你组织
            的品牌符号。
