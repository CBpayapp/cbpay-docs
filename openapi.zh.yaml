  /v1/payins/collect:
    post:
      tags:
      - 收款(Payins)
      operationId: payinCollect
      summary: 主动收款(pull)
      deprecated: true
      description: 在支持 pull 收款的通道直接向付款人扣款。**目前没有任何可用的拉取式收款通道**(委内瑞拉 `c2p` / `debito_inmediato` 已下线):调用会返回该通道不受支持。同步执行:若扣款获批,存款按你当前的 `payin_rate`
        转换并在同一调用中入账,已扣除 payin 费用。若付款人拒绝,`paid` 为 false,payin 标记为 failed 且不产生任何扣款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - amount
              - idempotency_key
              properties:
                country:
                  type: string
                currency:
                  type: string
                method:
                  type: string
                  description: 拉取式通道的收款方式(目前没有任何可用通道)。
                amount:
                  type: string
                  description: 本地金额,正数十进制字符串。
                description:
                  type: string
                our_reference:
                  type: string
                payer_document:
                  type: string
                payer_phone:
                  type: string
                payer_bank:
                  type: string
                payer_account:
                  type: string
                payer_name:
                  type: string
                payer_account_type:
                  type: string
                otp:
                  type: string
                otp_reference:
                  type: string
                idempotency_key:
                  type: string
                  description: 必填——collect 执行真实扣款;使用相同键的重试绝不重复扣款。
            example:
              method: c2p
              amount: '1200.00'
              description: 订单 5512
              payer_document: V12345678
              payer_phone: '04141234567'
              payer_bank: '0102'
              otp: '12345678'
              idempotency_key: collect-2026-07-07-a
      responses:
        '200':
          description: '收款结果。`paid: true` 表示存款已入账。'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  kind:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  method:
                    type: string
                  local_amount:
                    type: string
                  status:
                    type: string
                  fx_rate:
                    type: string
                  usdt_gross:
                    type: string
                  fee:
                    type: string
                  usdt_credited:
                    type: string
                  paid:
                    type: boolean
                  provider_reference:
                    type: string
                  status_code:
                    type: string
                  status_message:
                    type: string
                  failure:
                    type: object
                    description: '仅当主动收款的 payin 为 `failed` 时出现：拒绝来源（`provider` = 付款人的银行，`core` = 扣款前校验）以及具体的代码和消息。'
                    properties:
                      source:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
              example:
                payin_id: 7b3c9e2f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: collect
                country: VE
                currency: VES
                method: c2p
                local_amount: '1200.00'
                status: credited
                reference: REF-102030
                fx_rate: '36.50'
                usdt_gross: '32.876712'
                fee: '0.300000'
                usdt_credited: '32.576712'
                paid: true
                provider_reference: PRV-889911
                status_code: '00'
                status_message: approved
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:02Z'
        '400':
          description: invalid_request / invalid_amount
          content:
            application/json:
              schema: &id012
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
                message: method is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 账户未激活(account_blocked)。
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '502':
          description: 核心不可用(core_unavailable)。
          content:
            application/json:
              schema: *id012
              example:
                error: core_unavailable
                message: could not execute the collection
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
