                      qr_payload: |
                        Bank: Bank of Example
                        Account type: checking
                        Account number: 0001112223
                        Holder: Example Org SpA
                      qr_png_base64: iVBORw0KGgoAAAANSU...
                us_bank_transfer:
                  summary: 美国(USD —— 双通道:境内电汇 + 国际 SWIFT)
                  value:
