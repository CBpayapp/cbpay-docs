  /v1/qscore/subjects/{docID}:
    get:
      tags: [Qscore]
      summary: 查询主体
      operationId: getQscoreSubject
      description: '返回指定身份证件的主体记录（不会签发新报告，也不计费）。主体在首次为该证件
        请求报告时自动创建。路径参数 `docId` 是签发的原始证件号（例如智利 RUT
        `12.345.678-5`）；它会按国家/地区验证并规范化。如果主体已有评分，最新的评分会汇总在
        `last_score` / `last_band` / `last_score_at` 中（SC 等级时没有 `last_score`）。
        主体不存在时返回 `404 not_found`。'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        description: 在该国家/地区签发的原始证件号（例如智利的 `12.345.678-5`）。
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: 证件的 ISO 国家/地区代码（默认 CL）。
        example: CL
      responses:
        '200':
          description: 主体记录及其最新评分摘要。
          content:
            application/json:
              example:
                subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                country: CL
                doc_id: 12.345.678-5
                subject_type: person
                display_name: Example Name
                last_score: 742
                last_band: B
                last_score_at: '2026-08-08T15:04:24Z'
        '400':
          description: invalid_doc_id
          content:
            application/json:
              example:
                error: invalid_doc_id
                message: doc_id is not valid for the given country
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found（主体不存在）
          content:
            application/json:
              example:
                error: not_found
                message: subject not found
