  /v1/qscore/batches:
    get:
      tags: [Qscore]
      summary: 列出批量评分任务
      operationId: listQscoreBatches
      description: '列出您账户的批量评分任务（最新优先），分页返回。`page` 从 1
        开始；`page_size` 默认为 50（最大 200）。`from` 和 `to` 日期筛选（组织时区，
        均为包含）为必填。其他账户拥有的批次永不可见（按账户隔离：来自其他账户的
        batch id 返回 404）。'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 起始日期（YYYY-MM-DD，组织时区，包含）。
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 结束日期（YYYY-MM-DD，组织时区，包含）。
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - completed_with_errors
          - failed
        description: 按批次状态筛选。
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      responses:
        '200':
          description: 分页的批次列表。
          content:
            application/json:
              example:
                items:
                - batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                  account_id: 4a9c2e71-8b3d-4f2a-9c1e-5d7b2a8f3e41
                  status: completed_with_errors
                  purpose: credit_evaluation
                  country: CL
                  lang: es
                  total_items: 4
                  processed_items: 4
                  succeeded_items: 3
                  failed_items: 1
                  estimated_fee_usdt: '14.50'
                  idempotency_key: portfolio-2026-08-09-a
                  created_at: '2026-08-09T14:32:10Z'
                  started_at: '2026-08-09T14:34:02Z'
                  completed_at: '2026-08-09T14:41:37Z'
                meta:
                  page: 1
                  page_size: 50
                  total: 1
        '400':
          description: invalid_range
        '401':
          description: unauthorized
        '403':
          description: forbidden（服务未启用或账户未验证）
    post:
      tags: [Qscore]
      summary: 创建批量评分任务
      operationId: createQscoreBatch
      description: '创建异步批量评分任务（组合评分）：主体会预先校验，批次进入队列，
        后台 worker 为每个有效条目生成一份完整的 Qscore 报告。发送 `subjects`（JSON
        数组，1 至 5000 条）**或** `subjects_csv`（带有表头 `doc_id[,subject_type]`
        的 CSV 字符串）——两者必须且只能提供其一。文档号无效（`invalid_doc_id`）
        或批次内文档重复
        （`duplicate_in_batch`，以其规范化形式报告）的行会在创建时被拒绝，并在
        `rejected_items` 中报告；
        批次只处理有效行。省略或未识别的 `subject_type` 绝不是错误：对于
        `CL`，系统会从 RUT 序列推断（首位数字 5–9 → `company`，其他 →
        `person`）。如果所有行都被拒绝，请求将以 `no_valid_items` 失败，且不会
        创建任何内容。幂等性为强制：使用相同的 `idempotency_key` 重试会返回原始批次并
        带有 `idempotency_hit: true`，绝不会重复批次或重复扣费。每个条目在处理时收取
        独立报告费用（`risk_report_person` / `risk_report_company`），最终失败的条目会
        自动退款。`estimated_fee_usdt` 是针对有效条目的预先估算。批次完成后，您会收到
        一个 `risk_batch_completed` webhook 和一封电子邮件——各个报告不会发出自己的
        webhook 或电子邮件。'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              json_subjects:
                summary: JSON 主体（两行被预先拒绝）
                value:
                  country: CL
                  purpose: credit_evaluation
                  lang: es
                  subjects:
                  - doc_id: 12.345.678-5
                  - doc_id: 15.678.234-3
                  - doc_id: 11.222.333-9
                  - doc_id: 76.543.210-3
                    subject_type: company
                  - doc_id: 12.345.678-9
                  - doc_id: 12345678-5
                  idempotency_key: portfolio-2026-08-09-a
              csv_subjects:
                summary: CSV 负载
                value:
                  country: CL
                  purpose: credit_evaluation
                  subjects_csv: "doc_id,subject_type\n12.345.678-5,person\n76.543.210-3,company\n96.543.210-8,company"
                  idempotency_key: portfolio-2026-08-09-b
      responses:
        '202':
          description: '批次已接受进行异步处理。`rejected_items` 列出预先被拒绝的
            行（仅在至少一行被拒绝时存在）。'
          content:
            application/json:
              example:
                batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                status: pending
                purpose: credit_evaluation
                country: CL
                lang: es
                total_items: 4
                processed_items: 0
                succeeded_items: 0
                failed_items: 0
                estimated_fee_usdt: '14.50'
                created_at: '2026-08-09T14:32:10Z'
                rejected_count: 2
                rejected_items:
                - line: 5
                  doc_id: 12.345.678-9
                  error_code: invalid_doc_id
                  error: doc_id is not valid for CL
                - line: 6
                  doc_id: 12345678-5
                  error_code: duplicate_in_batch
                  error: doc_id appears more than once in the batch
        '200':
          description: '幂等重放——原始批次，带有 `idempotency_hit: true`。'
          content:
            application/json:
              example:
                batch_id: b7f2c1a4-3e5d-4f8a-9c2b-1d0e6a8f4c5d
                status: processing
                purpose: credit_evaluation
                country: CL
                lang: es
                total_items: 4
                processed_items: 2
                succeeded_items: 2
                failed_items: 0
                estimated_fee_usdt: '14.50'
                created_at: '2026-08-09T14:32:10Z'
                idempotency_hit: true
        '400':
          description: 'invalid_payload | purpose_required | invalid_purpose |
            idempotency_key_required | no_valid_items | too_many_items'
        '401':
          description: unauthorized
        '403':
          description: forbidden（服务未启用或账户未验证）
