      summary: 创建卡片
      description: 发行一张卡片(虚拟或实体),以 Just-In-Time 方式从账户中央余额按卡片的消费资产扣款(`spending_asset`:USDT/USDC 与 USD 1:1,或
        BTC/GOLD 按每笔事件当时价格转换;默认 USDT)——无需预充值:每笔消费都实时对照可用余额和卡片自身限额授权。个人账户可持有 **1 张虚拟卡 + 1 张实体卡**;企业账户可创建**不限数量**的卡片,为企业本身或指定人员(例如员工,传入其身份文件)。若配置了
        `card_creation_virtual` / `card_creation_physical` 费用则在发卡时计费(0 = 免费);发卡失败自动退款。实体卡初始状态为 `pending_activation`,直到持卡人确认收到。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                physical:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
                  description: 必填(也接受 Idempotency-Key 请求头)。使用相同键重试会返回原始卡片,绝不重复收取开卡费。
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: 卡片消费扣款的余额。USDT/USDC 与 USD 等价(精确 1:1,无转换费)。BTC/GOLD 按每笔事件当时的有效价格转换,并在授权时预留缓冲(fail-closed
                    定价,单笔及 24 小时波动限额与 payouts 共享)。
                limits:
                  type: object
                  description: 可选的 USD 消费限额(授权时执行;0 或省略 = 无限制)。
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
                cardholder:
                  type: object
                  description: 持卡人数据。账户首次开卡时会在发卡方创建持卡人:身份数据与文件会从账户已通过的身份验证自动填充(显式字段优先);你只需补充发卡方特有的字段(occupation
                    目录代码、salary_usd)。后续开卡时可省略:直接复用已验证的持卡人。企业账户还可以设置 kind "person" 加上该人已通过 KYC 的 verification_id,为指定人员开卡(其身份与文件来自该验证)。
                  properties:
                    verification_id:
                      type: string
                      format: uuid
                      description: 指定人员必填(企业账户 kind "person"):该人已通过的第三方 KYC 验证的 submission_id。
            examples:
              person_first_card:
                summary: 个人 — 首张卡(身份从验证自动填充)
                value:
                  physical: false
                  idempotency_key: card-v-1
                  cardholder:
                    occupation: '52201'
                    salary_usd: 1800
              subsequent_card:
                summary: 后续卡片 — 持卡人已验证(无需数据)
                value:
                  physical: true
                  idempotency_key: card-f-ops-1
                  spending_asset: USDC
                  limits:
                    per_transaction: '500.00'
                    monthly: '5000.00'
              company_for_employee:
                summary: 企业 — 为指定人员开卡(需已通过的 KYC)
                value:
                  physical: false
                  idempotency_key: card-emp-77
                  limits:
                    monthly: '1500.00'
                  cardholder:
                    kind: person
                    verification_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                    occupation: '52201'
                    salary_usd: 1800
      responses:
        '201':
          description: 卡片已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                cardholder_name: Client X SpA
                status: active
                spending_asset: USDT
                limits:
                  monthly: '5000.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T12:00:00Z'
                creation_fee: '3.000000'
        '202':
          description: 申请已被挂起等待审核（组织已启用申请审核）。只有在合规团队批准审核后才会创建资源；开户/发卡费用在挂起时收取，若审核被拒绝将自动退还。请通过
            `txn_review_status_changed` webhook 或 `GET /v1/me/txn-reviews` 跟踪结果。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: card_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '400':
          description: idempotency_key_required / invalid_amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '402':
          description: 余额不足以支付开卡费用(insufficient_funds)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: account balance is not enough for this operation
        '409':
          description: card_limit_reached(个人账户)/ cardholder_kyc_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_limit_reached
                message: person accounts can hold at most 1 virtual card (cancel the existing one first)
        '422':
          description: verification_required / verification_not_approved / verification_kind_mismatch(指定人员需要已通过的第三方
            KYC verification_id)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: verification_required
                message: 'an approved identity verification of the third party is required: pass verification_id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
