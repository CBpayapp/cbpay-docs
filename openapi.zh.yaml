      summary: 预签名 KYC 文件上传
      description: 文件流程第 1 步:返回临时上传 URL。然后用相同 Content-Type 向 upload_url PUT 二进制内容(第 2 步)并确认(第 3 步)。类别:identity、proofOfResidence。类型:application/pdf、image/png、image/jpeg;最大
