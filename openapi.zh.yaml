  /v1/qscore/subjects/{docID}/disputes:
    get:
      tags: [Qscore]
      summary: 列出主体的争议（ARCO）
      operationId: listQscoreSubjectDisputes
      description: '列出为主体发起的 ARCO 争议（数据主体权利：信用数据的更正和删除）。
        可按 `status` 过滤（`open`、`under_review`、`resolved_corrected`、
        `resolved_rejected`）。争议生命周期由组织管理员面板操作，或由您的组织通过
        `PATCH /v1/org/qscore/disputes/{id}` 管理；每次变更都会通过电子邮件通知请求人。
        已解决的争议绝不会删除被争议的记录：更正是一条取代原记录的新记录。'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: 证件的 ISO 国家/地区代码（默认 CL）。
        example: CL
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [open, under_review, resolved_corrected, resolved_rejected]
        description: 按争议状态过滤。
        example: open
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        example: 50
      responses:
        '200':
          description: 争议分页。
          content:
            application/json:
              example:
                items:
                - dispute_id: 6a1c4e92-3b7d-4f51-9e82-1c7f3a5d8b64
                  subject_id: 8f5fb0d2-1d45-4a0e-9d5c-2d39f2b7a112
                  report_id: 3f5c9f2d-7d21-4b8c-9a2d-2d5f6a1b8c01
                  record_source: res_chile
                  record_ref: BOL-2026-04512
                  reason: The reported default was paid in full on 2026-07-30.
                  status: open
                  created_by: 5f9d2c10-3e8b-4a1d-9c7a-1d2f3a4b5c6d
                  created_at: '2026-08-08T16:11:40Z'
                meta:
                  page: 1
                  page_size: 50
                  total: 1
        '400':
          description: invalid_doc_id
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not_found（主体不存在）
    post:
      tags: [Qscore]
      summary: 发起争议（ARCO）
      operationId: createQscoreDispute
      description: '针对主体的特定记录发起 ARCO 争议（例如不属于他们的债务或已偿还的债务），
        以符合数据主体的更正权。主体必须已存在（由首份报告创建）。`record_source`
        标识被争议记录所属的数据源系列，`record_ref` 标识该来源内的记录
        （两者在报告中显示为每个 tradeline 或不良事件的 `source` / `ref`）。
        争议以 `open` 状态开始，其生命周期由您的组织管理。'
      parameters:
      - name: docID
        in: path
        required: true
        schema:
          type: string
        example: 12.345.678-5
      - name: country
        in: query
        required: false
        schema:
          type: string
          default: CL
        description: 证件的 ISO 国家/地区代码（默认 CL）。
        example: CL
      requestBody:
        required: true
        content:
          application/json:
            example:
