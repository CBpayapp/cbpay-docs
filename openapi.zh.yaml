                password:
                  type: string
            example:
              password: my-strong-pass
      responses:
        '200':
          description: WebAuthn 创建选项 + 挑战 id。
          content:
            application/json:
              example:
                challenge_id: 7b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                options:
                  publicKey:
                    challenge: base64url…
                    rp:
                      id: cbpayapp.com
                expires_at: '2026-07-11T00:02:00Z'
        '503':
          description: 组织未配置通行密钥(`passkeys_unavailable`)。
  /v1/me/passkeys/register/finish:
    post:
