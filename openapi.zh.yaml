      summary: 发送银行付款
      description: 执行 TRANSFER(你自己的银行账户之间)或 WITHDRAW(至已登记的受益人)。必须提供幂等键;使用相同键重试会返回原始操作而不重复扣费。按固定 `banking_operation`
        费用计费;若通道拒绝则退款。最终状态通过 banking_operation_status_changed webhook 送达。
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - type
              - sourceRequisit
              - destinationRequisit
              - amount
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - TRANSFER
                  - WITHDRAW
                paymentType:
                  type: string
                  description: TRANSFER 时为空;WITHDRAW 时为通道代码(例如 SEPA_CT)。
                sourceRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                destinationRequisit:
                  type: object
                  properties:
                    account:
                      type: string
                      description: 目标账户(TRANSFER)。
                    beneficiar:
                      type: string
                      description: 受益人账户(WITHDRAW)。
                amount:
                  type: object
                  properties:
                    currencyCode:
                      type: string
                    units:
                      type: string
                    nanos:
                      type: integer
                comment:
                  type: string
                idempotency_key:
                  type: string
            examples:
              withdraw:
                summary: WITHDRAW 至受益人(SEPA)
                value:
                  currency: USD
                  type: WITHDRAW
                  paymentType: SEPA_CT
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
                    beneficiar: BNK-CPACC-11
                  amount:
                    currencyCode: USD
                    units: '250'
                    nanos: 0
                  comment: Invoice 8841
                  idempotency_key: acme-payment-0071
              transfer:
                summary: 自有账户间 TRANSFER
                value:
                  currency: USD
                  type: TRANSFER
                  paymentType: EMPTY
                  sourceRequisit:
                    account: c4d1e2f3-a4b5-c6d7-e8f9-a0b1c2d3e4f5
                  destinationRequisit:
