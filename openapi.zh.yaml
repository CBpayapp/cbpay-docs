                value:
                  from_asset: USDT
                  to_asset: BTC
                  amount: '1000'
                  idempotency_key: swap-2026-07-10-a
              cross:
                summary: BTC 直接兑换 GOLD
                value:
                  from_asset: BTC
                  to_asset: GOLD
                  amount: '0.01'
                  idempotency_key: swap-2026-07-10-b
              stables:
                summary: USDT 兑换 USDC
                value:
                  from_asset: USDT
                  to_asset: USDC
                  amount: '500'
                  idempotency_key: swap-2026-07-10-c
      responses:
        '201':
          description: swap 已执行(同步)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
        '200':
          description: 幂等重放(原始 swap,绝不重复执行)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
              example:
                swap_id: 8a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                from_asset: USDT
                to_asset: BTC
                from_amount: '1000.000000'
                to_amount: '0.01568419'
                rate: '0.00001568'
                status: completed
                idempotency_key: swap-2026-07-10-a
                created_at: '2026-07-10T15:00:00Z'
                idempotency_hit: true
        '400':
