  /v1/payouts/bank-directory/lookup:
    get:
      tags:
      - 付款(Payouts)
      operationId: lookupBankDirectory
      summary: 按 routing number 或 SWIFT/BIC 查询银行
      description: '从嵌入式公开银行目录自动补全收款银行——`routing_number`(9 位数字,仅限美国)与
        `swift`(8 或 11 个字符;`XXX` 后缀会归一化为总行)二者必传其一。用于在付款人在 payout
        或交易对手表单中输入 routing number 或 SWIFT/BIC 时自动识别银行:返回 404 表示"不在目录中",
        表单保持手动填写即可。静态数据以 `Cache-Control: public, max-age=86400` 提供,可安全缓存一天。'
      parameters:
      - name: routing_number
        in: query
        description: ABA routing number,9 位数字且校验位有效(仅限美国银行)。与 `swift` 互斥。
        schema:
          type: string
          pattern: '^[0-9]{9}$'
        example: '021000021'
      - name: swift
        in: query
        description: SWIFT/BIC 代码,8 或 11 个字符(`XXX` 后缀会归一化为总行)。与 `routing_number` 互斥。
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$'
        example: CHASUS33
      - name: country
        in: query
        description: 可选的 ISO 3166-1 alpha-2 过滤条件,用于 routing 查询;仅支持 `US`(其他值返回
          400 `invalid_country`)。
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: 在目录中找到银行。`bank_phone` 和 `directory_vintage` 仅在 routing 查询时出现;`bank_state`/`bank_branch`
            仅在数据集包含时出现。
          content:
            application/json:
              schema:
                type: object
              examples:
                routing:
                  summary: 按 ABA routing number
                  value:
                    routing_number: '021000021'
                    bank_name: JPMORGAN CHASE
                    bank_city: TAMPA
                    bank_state: FL
                    bank_postal_code: '33610'
                    bank_country: US
                    bank_phone: 813-432-3700
                    source: directory
                    directory_vintage: fed_ach_2019
                swift:
                  summary: 按 SWIFT/BIC
                  value:
                    swift: CHASUS33
                    bank_name: JPMORGAN CHASE BANK, N.A.
                    bank_city: NEW YORK, NY
                    bank_country: US
                    source: directory
        '400':
          description: 参数缺失/冲突、格式无效,或 `country` 不是 `US`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_payload:
                  summary: 参数缺失或冲突
                  value:
                    error: invalid_payload
                    message: provide exactly one of routing_number or swift
                invalid_country:
                  summary: 以非美国国家进行 routing 查询
                  value:
                    error: invalid_country
                    message: routing number lookup is only available for US
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: 目录中没有该 routing number 或 SWIFT/BIC——表单保持手动填写。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: bank_not_found
                message: no bank found for the given routing number
  /v1/payins:
    post:
      tags:
      - 收款(Payins)
      operationId: createPayin
      summary: 创建 payin(充值收款)
      description: '创建一笔法币充值。使用 `method: "qr"`(默认)会通过处理方生成主动 QR 收款——在玻利维亚为本地互通 QR,在巴西为动态 PIX QR,其 `charge`
        携带 QR 图片和 "copia e cola" 载荷。使用 `method: "bank_transfer"` 会预告存款,响应携带付款人必须附上的参考号,以便到账转账被自动匹配入账——一个
        12 位字母数字短码,适配任何银行附言字段(部分通道上限 20 个字符且不允许特殊字符)。使用 `method: "fintoc"`(智利)响应携带托管 `payment_url`:付款人打开后可从任意智利银行或钱包转账;存款会被自动检测、校验并入账。使用
        `method: "card"` 响应携带一个托管 3-D Secure 银行卡收银台的 `payment_url`,页面带有您组织的品牌 —— 支持玻利维亚(BOB)与以美元结算的国际银行卡(`country: "US"`;任意国家发行的 Visa、Mastercard、American Express、Discover 与 Diners);银行卡数据绝不经过您的集成。使用
        `method: "checkout"` 响应携带一个公开的 `checkout_url` —— 以您选择的虚拟余额计价的通用收款链接(`settlement_asset`:USDT、USDC、BTC
        或 GOLD)。付款人可选择任何有可用 payin 走廊的国家(本地金额实时报价)、四个加密货币选项之一(带可扫描二维码的专属充值地址),或通过商户的
        CBPay 二维码/别名从 CBPay 应用即时付款;每笔付款自动兑换为结算资产(以相同资产付款则不兑换)。最先完成支付的方式生效。创建收款免费;存款入账时收取
        payin 费用。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - currency
              - amount
              properties:
                country:
                  type: string
                  example: BO
                  description: 走廊国家。除 `checkout` 外所有方式必填;对 `checkout` 为可选,仅用于在页面上预选付款人的国家。
                currency:
                  type: string
                  example: BOB
                  description: 走廊货币。除 `checkout` 外所有方式必填;`checkout` 会以 400 拒绝该字段 —— 收款以 `settlement_asset` 计价。
                amount:
                  type: string
                  description: 正数十进制字符串。走廊方式为本地货币金额;`checkout` 以 `settlement_asset` 计价("50" USDT、"0.001" BTC、"2" 克黄金)。
                description:
                  type: string
                channel:
                  type: string
                  description: 传递给核心的可选渠道提示。
                expires_in:
                  type: integer
                  description: 收款过期时间(秒)。对 `checkout` 取值 600 到 604800(10 分钟到 7 天;默认 24 小时)。
                method:
                  type: string
                  enum:
                  - qr
                  - bank_transfer
                  - fintoc
                  - card
                  - checkout
                  default: qr
                  description: 收款模式。`qr` 通过处理方创建主动 QR 收款;`bank_transfer` 预告一笔入账存款并返回需附在转账附言中的参考号;`fintoc`(仅智利)返回托管
                    `payment_url`,付款人可从任意智利银行或钱包转账,存款自动检测;`card` 返回托管 3-D Secure 银行卡收银台的 `payment_url`
                    (玻利维亚用 BOB,或当 `country` 为 `US` 时收取以美元结算的国际银行卡);`checkout`
                    返回一个公开的 `checkout_url`,付款人在页面上自行选择支付方式(QR、银行卡、银行转账或加密货币)。pull
                    收款请使用 /v1/payins/collect。
                idempotency_key:
                  type: string
                  description: >-
                    可选幂等键(`bank_transfer`、`fintoc`、`card` 与 `checkout` 方式;也接受 `Idempotency-Key` 请求头)。使用相同键重试会返回原始 payin,HTTP 200 且带 `idempotency_hit: true` —— 托管方式返回同一个 `payment_url`/`checkout_url`,预告银行转账返回同一个 `reference` —— 而不会开启第二笔收款。对预告转账而言,这直接决定资金能否入账:两笔金额相同、且没有付款人身份的存活预告无法区分,到账存款会停留在 `unassigned`。若省略该键,我们仍会把完全相同的重试(同一账户、货币、金额与付款人证件号)合并到原始预告;当您确实需要针对同一金额与同一付款人创建两笔独立收款时,请发送不同的键。
                customer:
                  type: object
                  description: 银行卡收银台的可选账单预填(`card` 方式)—— `email`、`first_name`、`last_name`、`address`、`city`、`country`(纯文本,每个字段最多
                    120 个字符)。付款人可在页面上补充或更正。
                success_url:
                  type: string
                  description: 可选的公共 https URL(`card` 与 `checkout` 方式),支付获批后将付款人重定向至此。
                failure_url:
                  type: string
                  description: 可选的公共 https URL(`card` 与 `checkout` 方式),支付失败或过期时将付款人重定向至此。
                expires_at:
                  type: string
                  format: date-time
                  description: 银行卡支付会话的可选 RFC3339 过期时间(`card` 方式,至少提前 15 分钟;默认 24 小时)。
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  default: USDT
                  description: 仅 checkout —— 收款计价与结算的虚拟余额。每笔付款入账时自动兑换为该资产(以相同资产付款则不兑换)。须为您的组织启用(否则返回
                    `422 settlement_asset_disabled`)。
                save_card:
                  type: boolean
                  default: false
                  description: 仅 card 方式 — 在托管页面向付款人提供"保存此卡"复选框。仅当付款人勾选（明确同意）且
                    3-D Secure 支付获批后才存储凭证；随后 payin_received/payin_credited 流程会携带
                    `stored_credential` 块，该卡出现在 GET /v1/stored-cards 中。
                payer_reference:
                  type: string
                  maxLength: 120
                  description: 仅 card 方式 — 你自己的付款人标识（例如你的客户 ID）。已保存的卡片以此引用为范围，
                    便于列出并扣款正确客户的卡片。纯文本，最多 120 个字符。
                stored_card_id:
                  type: string
                  format: uuid
                  description: 仅 card 方式 — 使用之前保存的卡支付（见 GET /v1/stored-cards）。托管页面跳过卡片
                    录入并显示已保存的卡；3-D Secure 照常运行。与 `save_card` 互斥。未知或已撤销的卡返回 404。随凭证保存的账单信息会在托管页面自动应用（脱敏摘要 + 编辑链接 — 付款人无需重新输入）。
                payer_name:
                  type: string
                  maxLength: 140
                  description: >-
                    仅预告转账 — 当付款人不是账户持有人时，发起转账的个人或公司名称。可选。
                payer_document:
                  type: string
                  maxLength: 40
                  description: >-
                    仅预告转账 — 付款人的税号或身份证件号（至少 5 个字符，其中至少一位为数字）。
                    可选：省略时使用账户持有人已验证的税号，因此即使付款人忘记填写参考号，
                    本人存款也能被识别。第三方付款时请填写。
                payer_account:
                  type: string
                  maxLength: 40
                  description: >-
                    仅预告转账 — 付款人的银行账号（至少 5 个字符）。可选；当通道上报付款账户时，
                    这是额外的匹配信号。
            examples:
              bo_qr:
                summary: 玻利维亚 — QR 收款(BOB)
                value:
                  country: BO
                  currency: BOB
                  method: qr
                  amount: '700.00'
                  description: 应用充值
                  expires_in: 3600
              br_pix_qr:
                summary: 巴西 — 动态 PIX QR(BRL)
                value:
                  country: BR
                  currency: BRL
                  method: qr
                  amount: '120.00'
                  description: 订单 7719
                  expires_in: 1800
              cl_announced_transfer:
                summary: 智利 — 预告银行转账(CLP)
                value:
                  country: CL
                  currency: CLP
                  method: bank_transfer
                  amount: '500000'
                  payer_document: '17438319-7'
                  idempotency_key: topup-9912
              py_announced_transfer:
                summary: 巴拉圭 — 预告银行转账(PYG,整数金额)
                value:
                  country: PY
                  currency: PYG
                  method: bank_transfer
                  amount: '596000'
              us_announced_transfer:
                summary: 美国 — 预告银行转账(USD,ACH / wire)
                value:
                  country: US
                  currency: USD
                  method: bank_transfer
                  amount: '1250.00'
                  payer_name: Acme Holdings LLC
                  idempotency_key: invoice-1042
              cl_fintoc:
                summary: 智利 — 托管支付页,任意银行(CLP)
                value:
                  country: CL
                  currency: CLP
                  method: fintoc
                  amount: '150000'
                  description: 充值订单 8841
                  idempotency_key: topup-8841
              bo_card:
                summary: 玻利维亚 — 3-D Secure 银行卡收银台(BOB)
                value:
                  country: BO
                  currency: BOB
                  method: card
                  amount: '700.00'
                  description: App top-up
                  customer:
                    email: payer@example.com
                    first_name: Ana
                    last_name: Rojas
                  success_url: https://your-app.com/payment/ok
                  failure_url: https://your-app.com/payment/error
                  idempotency_key: topup-7719
              us_card:
                summary: 国际银行卡 — 3-D Secure 收银台(US/USD)
                value:
                  country: US
                  currency: USD
                  method: card
                  amount: '49.90'
                  description: Pro plan
                  customer:
                    email: payer@example.com
                    first_name: Ana
                    last_name: Rojas
                  success_url: https://your-app.com/payment/ok
                  failure_url: https://your-app.com/payment/error
                  save_card: true
                  payer_reference: customer-7719
                  idempotency_key: pro-plan-7719
              checkout_usdt:
                summary: 通用收款链接 — 50 USDT(多国,预选智利)
                value:
                  method: checkout
                  amount: '50'
                  settlement_asset: USDT
                  country: CL
                  description: Order 8841
                  success_url: https://your-app.com/payment/ok
