      - 钱包筛查
      operationId: createAddressScreening
      summary: 筛查区块链地址
      description: '依托全球链上情报评估区块链地址的 AML 风险(受制裁实体、非法资金暴露),返回归一化的风险等级(Low/Medium/High/Severe)及完整证据。与网络无关:地址会一次性在所有受支持的链上评估;`chain`
        仅用于标注你的记录。按固定 `address_screening` 费用计费(筛查失败自动退款),因此必须提供 `idempotency_key`——使用相同键重放会返回原始筛查并带 `idempotency_hit:
        true`,绝不重复扣费。需要启用 `screenings` 服务且账户验证已通过。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              - idempotency_key
              properties:
                address:
                  type: string
                  description: 要筛查的区块链地址(最多 128 个字符)。
                chain:
                  type: string
                  description: 可选标签(tron、eth……)仅用于你的记录;不限制评估范围。
                idempotency_key:
                  type: string
                  description: 必填(扫描收取费用)。也接受 Idempotency-Key 请求头。
            example:
              address: TN2BBWc9EF8MMB6i1c4HZHXAssTEXstMDo
              chain: tron
              idempotency_key: scan-customer-742-1
