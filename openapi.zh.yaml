  /v1/kyc/submissions:
    post:
      tags:
      - KYC / KYB
      operationId: createKycSubmission
      summary: 通过 API 数据创建 KYC submission
      description: '仅限企业账户:直接提交数据验证你的终端客户(无向导)。国家用 ISO alpha-3,日期用 YYYY-MM-DD,id_type 为 passport | id_card
        | drivers_license。创建时文件可选(通过 presign 流程上传);创建时无需活体检测——submission 会带 liveness_pending: true,用活体链接完成它。在
        submission 开放期间用相同 external_customer_id 重新提交会更新它而不再次扣费。按固定 `kyc_verification` 费用计费;必须提供 `idempotency_key`。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - external_customer_id
              - idempotency_key
              properties:
                external_customer_id:
                  type: string
                  description: 你为已验证客户设置的参考号。
                idempotency_key:
                  type: string
                person:
                  type: object
                  description: 个人字段(first_name、last_name、email、phone、nationality、date_of_birth、tax_id、id_type、id_number、address、primary_purpose、most_recent_occupation、source_of_funds)。
                metadata:
                  type: object
            example:
              external_customer_id: cust_789
              idempotency_key: kyc-sub-cust-789-1
              person:
                first_name: Ana
                last_name: Perez
                email: ana@example.com
                phone: '+56912345678'
                nationality: CHL
                date_of_birth: '1990-04-12'
                tax_id: 12.345.678-5
                id_type: id_card
                id_number: '12345678'
                address:
                  line1: Av. Siempre Viva 123
                  city: Santiago
                  state: RM
                  postal_code: '8320000'
                  country: CHL
                primary_purpose: personal_or_living_expenses
                most_recent_occupation: Engineer
                source_of_funds: salary
      responses:
        '201':
          description: submission 已创建(进入合规审核队列)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSubmission'
              example:
                submission_id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
                kind: kyc
                external_customer_id: cust_789
                status: pending_review
                liveness_pending: true
                verification_fee: '1.500000'
                idempotency_key: kyc-sub-cust-789-1
                created_at: '2026-07-10T12:05:00Z'
                updated_at: '2026-07-10T12:05:00Z'
        '400':
          description: idempotency_key_required / invalid_payload / missing_person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_payload
                message: external_customer_id is required (your reference for the customer being verified)
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: verification_required / company_account_required / service_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: company_account_required
                message: third-party KYC/KYB verification is available to company accounts only
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
