  /v1/payins/deposit-accounts:
    post:
      tags:
      - 收款(Payins)
      operationId: createDepositAccount
      summary: 创建专属充值账户
      description: >-
        在支持的通道（例如墨西哥 CLABE 或阿根廷 CVU）为账户开通固定充值目的地。
        创建免费，到账会自动入账并扣除正常 payin 费用。企业账户可以创建多个
        `MX`/`MXN`/`bank_transfer` CLABE；个人账户以及未支持或 legacy 通道仍然每个通道
        只有一个目的地。

        对于企业的 MX/MXN/bank_transfer 创建，请在 `Idempotency-Key` header 或
        `idempotency_key` body 字段中发送幂等键。新 key 返回 `201`；相同的已完成 key
        重试返回 `200`、原始账户和 `idempotency_hit: true`。并发的处理中重试可能返回
        `409 idempotency_conflict`。
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 创建企业 CLABE 时 `idempotency_key` body 字段的替代方式。
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  type: string
                  default: MX
                currency:
                  type: string
                  default: MXN
                method:
                  type: string
                  default: bank_transfer
                idempotency_key:
                  type: string
                  minLength: 1
                  description: 企业 MX/MXN/bank_transfer 创建必填；也可使用 header。
            examples:
              mx_company_clabe:
                summary: 企业 — 墨西哥 CLABE
                value:
                  country: MX
                  currency: MXN
                  method: bank_transfer
                  idempotency_key: company-clabe-001
              ar_person_cvu:
                summary: 个人或 legacy 通道 — 阿根廷 CVU
                value:
                  country: AR
                  currency: ARS
                  method: bank_transfer
      responses:
        '200':
          description: 已完成企业 CLABE 创建的幂等重放。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInstrument'
              example:
                instrument_id: a1d4b7c0-1234-5678-9abc-def012345678
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                country: MX
                currency: MXN
                method: bank_transfer
                instrument: '734180000151000006'
                details:
                  clabe: '734180000151000006'
                status: active
                created_at: '2026-09-09T12:00:00Z'
                idempotency_hit: true
        '201':
          description: 已创建并绑定到调用账户的充值账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositInstrument'
              example:
                instrument_id: a1d4b7c0-1234-5678-9abc-def012345678
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                country: MX
                currency: MXN
                method: bank_transfer
                instrument: '734180000151000006'
                details:
                  clabe: '734180000151000006'
                status: active
                created_at: '2026-09-09T12:00:00Z'
        '400':
          description: 企业 MX/MXN/bank_transfer 创建缺少幂等键。
          content:
            application/json:
              schema: *id012
              example:
                error: idempotency_key_required
                message: provide idempotency_key (body or Idempotency-Key header)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 账户未激活(account_blocked)。
          content:
            application/json:
              schema: *id012
              example:
                error: account_blocked
                message: account is not active
        '409':
          description: 幂等冲突或目的地已分配给其他组织。
          content:
            application/json:
              schema: *id012
              examples:
                in_flight:
                  value:
                    error: idempotency_conflict
                    message: a deposit account with this idempotency key is being provisioned; retry shortly
                provider_conflict:
                  value:
                    error: deposit_account_conflict
                    message: the provider returned a deposit account already assigned to another organization
        '422':
          description: 个人账户或 legacy/不支持的通道已经有唯一目的地。
          content:
            application/json:
              schema: *id012
              example:
                error: deposit_account_limit_reached
                message: accounts hold one deposit account per corridor (created automatically with the account); it cannot be changed or deleted
        '502':
          description: core 不可用或返回了意外响应。
          content:
            application/json:
              schema: *id012
              examples:
                core_unavailable:
                  value:
                    error: core_unavailable
                    message: could not create the deposit account
                core_invalid_response:
                  value:
                    error: core_invalid_response
                    message: core did not return a deposit account identifier
    get:
      tags:
