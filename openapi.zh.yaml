  /v1/aml/catalogs/cities:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogCities
      summary: 按国家/地区获取城市目录
      description: '返回指定 ISO 3166-1 alpha-2 国家/地区的城市，按行政区划分组：
        `states` 的键与 `GET /v1/aml/catalogs` 中 `country_subdivisions` 的
        ISO 3166-2 代码相同，`country_cities` 列出无法映射到行政区划的城市
        （也应一并提供）。这两个字段永远不会是 `null`。没有覆盖的国家/地区返回
        200 和空列表 —— 此时回退到自由文本的城市字段。静态数据，响应带
        `Cache-Control: public, max-age=86400`，可以缓存一天。每个国家只需调用一次，
        然后在客户端按州/省筛选。'
      parameters:
      - name: country
        in: query
        required: true
        description: ISO 3166-1 alpha-2 国家/地区代码（例如 `US`）。
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      responses:
        '200':
          description: 按行政区划分组的城市列表（国家/地区无覆盖时为空列表）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: 原样返回的 ISO 3166-1 alpha-2 国家/地区代码。
                  states:
                    type: object
                    description: 按 ISO 3166-2 行政区划代码（`<CC>-<code>`）分组的城市。
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  country_cities:
                    type: array
                    description: 无法映射到行政区划的城市。
                    items:
                      type: string
                  meta:
                    type: object
                    description: 覆盖统计（`state_count`、`city_count`）。
              example:
                country: US
                states:
                  US-FL:
                  - Miami
                  - Orlando
                country_cities: []
                meta:
                  state_count: 51
                  city_count: 3200
        '400':
          description: 国家/地区代码格式错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_country
                message: country is required (ISO 3166-1 alpha-2)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: 未知的国家/地区代码。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: country_not_found
                message: unknown country code
  /v1/aml/catalogs/postal-code:
    get:
      tags:
      - AML screening
      operationId: getAmlCatalogPostalCode
      summary: 按邮政编码查询城市和州/省
      description: '从嵌入式公开数据集将邮政编码解析为其城市和州/省——目前仅覆盖美国 ZIP 编码。用于在地址表单中用户输入
        ZIP 时自动填充城市/州字段:返回 404 表示"未知 ZIP"(或该国没有数据集),地址字段保持手动填写即可。静态数据以
        `Cache-Control: public, max-age=86400` 提供,可安全缓存一天。'
      parameters:
      - name: country
        in: query
        required: true
        description: ISO 3166-1 alpha-2 国家/地区代码。目前仅 `US` 有数据集。
        schema:
          type: string
          pattern: '^[A-Z]{2}$'
        example: US
      - name: code
        in: query
        required: true
        description: 要解析的邮政编码(5 位美国 ZIP)。
        schema:
          type: string
          pattern: '^[0-9]{5}$'
        example: '33130'
      responses:
        '200':
          description: 该邮政编码对应的城市和州/省。
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    description: 原样返回的 ISO 3166-1 alpha-2 国家/地区代码。
                  postal_code:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                    description: ISO 3166-2 行政区划代码后缀(如 `FL`)。
              example:
                country: US
                postal_code: '33130'
                city: Miami
                state: FL
        '400':
          description: 参数缺失或邮政编码格式无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_payload
                message: code must be a 5-digit US ZIP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '404':
          description: 未知邮政编码,或该国没有数据集——地址字段保持手动填写。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: postal_code_not_found
                message: no place found for the given postal code
  /v1/me/verification/link:
    post:
      tags:
      - KYC / KYB
      operationId: createMyVerificationLink
      summary: 请求我的入驻验证链接
      description: 返回账户自己的身份验证链接(个人账户获得 KYC 链接,企业账户获得 KYB 链接——由账户类型决定)。托管向导涵盖完整流程:表单、文件上传与视频活体检测。免费。若已存在开放链接则返回
        200;已通过验证的账户返回 409 already_verified。在账户验证通过之前,所有资金流出操作返回 403 verification_required(充值与读取保持可用)。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: 可选的链接有效期(1-30 天)。省略则链接永不过期。
            example:
              expires_in_days: 14
      responses:
        '201':
          description: 入驻链接已创建(复用开放链接时返回 200)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationLink'
              example:
                link_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                kind: kyc
                url: https://verify.example.com/on/usd/individual/new?invite=abc123
                status: pending
                label: Ana Perez
                created_at: '2026-07-10T12:00:00Z'
                updated_at: '2026-07-10T12:00:00Z'
        '409':
          description: 该账户已完成验证(already_verified)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: already_verified
                message: this account already completed its identity verification
        '403':
          $ref: '#/components/responses/AccountRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
