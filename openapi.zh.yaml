                      exposures: []
                      triggers: []
        '200':
          description: 幂等重放——返回原始筛查,不再次扣费。
          content:
            application/json:
              example:
                screening_id: 5f0b1c9a-2f3e-4a7b-9c1d-8e6f5a4b3c2d
