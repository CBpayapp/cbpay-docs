    patch:
      tags:
      - 卡片
      operationId: updateCard
      summary: 更新限额、消费资产或冻结/解冻
      description: 更新卡片的消费限额(传 "0" 移除限额)、更改其扣款余额(`spending_asset`,仅影响之后的消费)以及冻结或解冻。冻结的卡片会即时拒绝所有授权。
      parameters:
      - $ref: '#/components/parameters/cardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frozen:
                  type: boolean
                spending_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: 新的消费余额。仅影响之后的消费;在途授权保持(并退款到)原扣款资产。
                limits:
                  type: object
                  properties:
                    per_transaction:
                      type: string
                    daily:
                      type: string
                    monthly:
                      type: string
            examples:
              freeze:
                summary: 冻结卡片
                value:
                  frozen: true
              set_spending_asset:
                summary: 从 USDC 余额消费
                value:
                  spending_asset: USDC
              set_limits:
                summary: 更新限额
                value:
                  limits:
                    per_transaction: '200.00'
                    daily: '0'
      responses:
        '200':
          description: 更新后的卡片。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject'
              example:
                card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                physical: false
                cardholder_kind: account
                status: frozen
                spending_asset: USDC
                limits:
                  per_transaction: '200.000000'
                created_at: '2026-07-08T12:00:00Z'
                updated_at: '2026-07-08T13:00:00Z'
        '400':
          description: invalid_amount / spending_asset_unavailable / settlement_asset_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_amount:
                  value:
                    error: invalid_amount
                    message: limits must be positive decimal strings (or "0" to remove)
                spending_asset_unavailable:
                  value:
                    error: spending_asset_unavailable
                    message: this asset is not available for card purchases
        '409':
          description: card_cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: card_cancelled
                message: a cancelled card cannot be updated
        '404':
          $ref: '#/components/responses/NotFound'
