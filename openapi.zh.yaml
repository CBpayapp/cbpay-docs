  /v1/banking/customer:
    post:
      tags:
      - 银行服务
      operationId: createBankingCustomer
      summary: 创建我的银行档案
      description: >-
        开通账户的银行档案(每个账户一次)。省略的 `type`/`name`/`email` 从 CBPay 账户自动填充。按固定 `banking_customer` 费用从
        你的结算资产(默认 USDT)计费;若通道拒绝则退款。
        平台会为该账户/档案在核心生成确定性的幂等 claim。重复相同请求会返回原 customer，并带有 `idempotency_hit: true`，不会创建第二个档案或再次收取档案费用。相同账户修改 payload 会返回 `409 idempotency_conflict`。如果上游结果不明确，返回 `503 banking_recovery_pending`；不要使用新密钥重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: USD
                type:
                  type: string
                  enum:
                  - INDIVIDUAL
                  - COMPANY
                name:
                  type: string
                email:
                  type: string
                address:
                  type: object
                  additionalProperties: true
            example:
              currency: USD
              address:
                countryIso: CL
                city: Santiago
      responses:
        '201':
          description: 银行档案已创建(状态 draft)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: draft
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
                banking_fee: '5.000000'
                banking_fee_asset: USDT
        '202':
          description: 申请已被挂起等待审核（组织已启用申请审核）。只有在合规团队批准审核后才会创建资源；开户/发卡费用在挂起时收取，若审核被拒绝将自动退还。请通过
            `txn_review_status_changed` webhook 或 `GET /v1/me/txn-reviews` 跟踪结果。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: in_review
                kind: banking_application
                review_id: 7a1c2e94-3b5f-4c8a-9d2e-6f0a1b2c3d4e
                message: application received; it is pending review by our compliance team
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '409':
          description: 账户已有档案，或确定性的创建 claim 与不同 payload 冲突。
          content:
            application/json:
              examples:
                customer_exists:
                  summary: 银行档案已存在
                  value:
                    error: banking_customer_exists
                    message: this account already has a banking customer
                idempotency_conflict:
                  summary: 相同账户使用不同 payload
                  value:
                    error: idempotency_conflict
                    message: idempotency key was used with a different payload
        '503':
          description: The platform could not reconcile an ambiguous banking customer creation.
          content:
            application/json:
              example:
                error: banking_recovery_pending
                message: customer creation outcome is ambiguous; operations must reconcile the claim before retrying
        '502':
          description: 银行通道错误;所有费用已退款(banking_request_failed)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: banking_request_failed
                  message: request rejected
    get:
      tags:
      - 银行服务
      operationId: getBankingCustomer
      summary: 获取我的银行档案
      description: 返回账户的银行档案及其实时验证状态。
      responses:
        '200':
          description: 带归一化状态的银行档案(draft、submitted、under_review、approved、rejected)。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                customer_id: 9f2b1c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                provider_id: BNK-88f13a
                status: approved
                data:
                  item:
                    type: INDIVIDUAL
                    name: Ana Perez Rojas
                created_at: '2026-07-07T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 尚无银行档案(no_banking_customer)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no_banking_customer
                message: create your banking customer first (POST /v1/banking/customer)
