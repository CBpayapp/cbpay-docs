  /v1/payins/{payinID}/refunds:
    parameters:
    - name: payinID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Payins
      operationId: createPayinRefund
      summary: 退款一笔卡片收款
      description: >-
        将资金退还给持卡人，并冲销你余额中的入账。仅支持状态为 `credited` 的卡片收款
        （其他通道返回 `refund_not_supported`）—— 且仅当其余额实际可用时：结算仍待处理的
        已确认收款（`settlement_pending: true`，余额在 `settle_at` 到账）将以
        `422 settlement_pending` 被拒。按毛额扣款：原收款的手续费与汇率点差
        不可退还。`idempotency_key` 为必填；重放会返回同一笔退款并带 `idempotency_hit`，
        绝不会向处理方发送第二次退款。调用方为会话时需要 OTP（API key 豁免）。
      parameters:
      - name: X-OTP-Token
        in: header
        required: false
        schema:
          type: string
        description: 一次性 OTP 令牌（见 OTP 指南）。仅适用于会话调用方。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idempotency_key
              properties:
                amount:
                  type: string
                  description: 以原始本地货币计价的金额。省略则退还剩余可退金额的全部。
                kind:
                  type: string
                  enum:
                  - refund
                  - void
                  description: '`refund`（默认）退还已清算的交易；`void` 撤销尚未清算的交易。'
                reason:
                  type: string
                idempotency_key:
                  type: string
            example:
              amount: '150.00'
              kind: refund
              reason: customer request
              idempotency_key: refund-order-8842
      responses:
        '200':
          description: 相同幂等键的重放 —— 返回同一笔退款，并带 `idempotency_hit`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: customer request
                idempotency_hit: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '201':
          description: 退款已创建并获处理方批准，余额已扣款。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: completed
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reason: customer request
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:03Z'
        '202':
          description: >-
            结果不确定的下发：处理方可能已经退款。退款保持 `pending`，你的余额继续被冻结，
            由对账流程解决。我们绝不自行重试 —— 使用相同的 `idempotency_key` 重试，
            会拿回同一笔退款。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinRefund'
              example:
                refund_id: 6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                payin_id: d0135ed5-8e9c-4f8b-a522-8ec100470426
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                kind: refund
                status: pending
                currency: USD
                local_amount: '150.00'
                usdt_debited: '150.000000'
                requested_by: account
                idempotency_key: refund-order-8842
                reconciliation_required: true
                receipt_url: https://api.qbank.cl/platform/v1/payin-refunds/6f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c/receipt
                created_at: '2026-07-25T13:10:00Z'
                updated_at: '2026-07-25T13:10:00Z'
        '400':
          description: '`idempotency_key_required` 或 `invalid_amount` / `invalid_payload`。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_key_required
                message: idempotency_key is required
        '402':
          description: '`insufficient_funds` —— 请先充值余额，再用相同的 `idempotency_key` 重试。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient_funds
                message: the account balance is not enough to fund this refund; top up and retry with the same idempotency_key
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`idempotency_conflict` —— 另一笔使用该键的退款正在进行中。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: idempotency_conflict
                message: another refund with this key is in flight
        '422':
          description: >-
            `payin_not_refundable`、`refund_not_supported`、`refund_exceeds_payin`、
            `settlement_pending`（收款已确认，但其余额仍排期在未来的 `settle_at`
            —— 请等待到期，或先请机构管理员释放结算），
            或处理方拒绝的退款（响应体即该退款，`status: failed` 并带 `failure_reason`；
            扣款已全额冲回）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refund_exceeds_payin
                message: the requested amount exceeds what is left to refund on this payin
        '401':
          $ref: '#/components/responses/Unauthorized'
