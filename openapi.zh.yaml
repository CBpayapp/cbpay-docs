  /v1/cards/{cardID}/transactions:
    get:
      tags:
      - 卡片
      operationId: listCardTransactions
      summary: 列出卡片交易
      description: 消费及其生命周期:`authorized`(实时冻结)、`settled`(清算确认)、`reversed`(已撤销,资金退回同一余额)和 `declined`(附原因:insufficient_funds、card_limit_exceeded、card_frozen……)。`spend_asset`
        / `spend_amount` 显示该消费扣了哪个余额及该资产的金额;`amount_usd` / `amount_usdt` 保持 USD 参考值。当运营商配置了按笔消费手续费(`card_purchase_virtual`
        / `card_purchase_physical`)时,`fee_asset` / `fee_amount` 展示手续费金额(`authorized` 时为预估值,`settled` 后为最终值),`fee_refunded_amount`
        在撤销或下调调整按比例退款后出现;未配置手续费时不返回 `fee_*` 字段。
      parameters:
      - $ref: '#/components/parameters/cardID'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - authorized
          - settled
          - reversed
          - declined
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 卡片交易分页。
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  page_size:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
              example:
                page: 1
                page_size: 50
                transactions:
                - transaction_id: 5e4d3c2b-1a09-8f7e-6d5c-4b3a2c1d0e9f
                  card_id: 3c2b1a09-8d7e-6f5a-4b3c-2d1e0f9a8b7c
                  kind: purchase
                  merchant: AMZN Mktp
                  mcc: '5999'
                  amount_usd: '16.17'
                  amount_usdt: '16.170000'
                  spend_asset: USDC
                  spend_amount: '16.170000'
                  fee_asset: USDC
                  fee_amount: '0.214255'
                  status: settled
                  auth_number: '040031'
                  created_at: '2026-07-08T15:00:00Z'
                  updated_at: '2026-07-09T02:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
