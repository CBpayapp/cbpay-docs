      summary: 扫描 payout QR(玻利维亚、巴西)
      description: 'QR payout 第 1 步——玻利维亚(本地互通 QR)与巴西(PIX QR,含 "copia e cola" 代码):读取收款 QR 并返回收款人数据及确认所需的
        `provider_reference`。**免费**——确认步骤之前不会有任何扣款。默认玻利维亚;巴西请传 `country: "BR"` 和 `currency:
        "BRL"`。巴西支持**静态** PIX 二维码(内嵌收款密钥);动态二维码(载荷为 PSP URL)返回 `400`——请向收款人索取其 PIX 密钥并改用 `pix` 方式。扫码响应中
        `amount` 为空表示该二维码为开放金额。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qr_payload
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                qr_payload:
                  type: string
                  description: 扫描 QR 的原始内容(在巴西同时是 PIX "copia e cola" 代码)。
            example:
              qr_payload: <QR content>
              currency: BOB
      responses:
        '200':
          description: 供用户确认的收款人数据。
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                  provider_reference:
                    type: string
                  beneficiary_name:
                    type: string
                  destination_account:
                    type: string
                  amount:
                    type: string
                  currency:
                    type: string
                  glosa:
                    type: string
                  status:
                    type: string
              example:
                scan_id: 5c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                provider_reference: QR-REF-889923
                beneficiary_name: Juan Quispe
                destination_account: '****4521'
                amount: '700.00'
                currency: BOB
                glosa: ''
                status: scanned
        '400':
          description: 缺少 qr_payload(invalid_request),或二维码不可读/不受支持(invalid_qr_payload——BR Code 损坏、校验和无效或动态
            PIX 二维码;message 说明具体原因)。
          content:
            application/json:
              schema: &id010
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_qr_payload
                message: 'dynamic pix qr codes are not supported yet: pay with method pix using the beneficiary
                  pix key'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountRequired'
        '502':
          description: 核心不可用(core_unavailable)。
          content:
            application/json:
              schema: *id010
              example:
                error: core_unavailable
                message: could not scan the QR
  /v1/payouts/qr/confirm:
    post:
      tags:
      - 付款(Payouts)
      operationId: payoutQrConfirm
      summary: 确认 QR payout(玻利维亚、巴西)
      description: 'QR payout 第 2 步(玻利维亚与巴西/PIX),计费方式与常规 payout 完全相同:本地金额按**你账户的汇率**转换,扣除 `usdt_amount
        + 固定费用`。结果为**同步**——响应携带最终状态(`completed`,或 `failed` 并自动退款)。与所有资金操作一样需要幂等键。在玻利维亚,扫码引用为一次性(一个
        QR = 一笔支付);在巴西,**静态 PIX 二维码天生可复用**——用不同的幂等键即可再次支付,失败的尝试绝不会作废该二维码。`amount`
        始终必填;在巴西,若 PIX 二维码带固定金额,则必须与之完全一致——不一致时返回 `422`,出金处于 `status: failed` 且退款已自动完成(开放金额的二维码按您发送的金额支付)。'
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_reference
              - amount
              properties:
                country:
                  type: string
                  enum:
                  - BO
                  - BR
                  default: BO
                currency:
                  type: string
                  enum:
                  - BOB
                  - USD
                  - BRL
                  default: BOB
                provider_reference:
                  type: string
                  description: 来自扫码步骤。
                amount:
                  type: string
                  description: 本地金额,正数十进制字符串。
                description:
                  type: string
                settlement_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                  description: 此操作要扣款的虚拟余额。省略则使用账户的默认结算资产。
                idempotency_key:
                  type: string
            example:
              provider_reference: QR-REF-889923
              amount: '700.00'
              currency: BOB
              description: QR 午餐付款
              idempotency_key: qr-2026-07-07-a
      responses:
        '202':
          description: 最终结果(同步)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                settlement_asset: USDT
                settlement_amount: '101.602460'
                settlement_rate: '1'
                beneficiary: &id011
                  qr_reference: QR-REF-889923
                description: QR 午餐付款
                status: completed
                status_code: ''
                status_message: ''
                bank_reference: '00761123456'
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
        '200':
          description: 既有 QR payout 的幂等重放。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
                method: qr
                local_amount: '700.00'
                fx_rate: '6.91'
                usdt_amount: '101.302460'
                fee: '0.300000'
                total_debit: '101.602460'
                settlement_asset: USDT
                settlement_amount: '101.602460'
                settlement_rate: '1'
                beneficiary: *id011
                description: QR 午餐付款
                status: completed
                status_code: ''
                status_message: ''
                bank_reference: '00761123456'
                created_at: '2026-07-07T12:00:00Z'
                updated_at: '2026-07-07T12:00:01Z'
                idempotency_hit: true
        '400':
          description: invalid_request / idempotency_key_required / invalid_amount
          content:
            application/json:
              schema: *id010
              example:
                error: invalid_request
                message: provider_reference (from the scan) is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          description: 账户未激活(account_blocked)。
          content:
            application/json:
              schema: *id010
              example:
                error: account_blocked
                message: account is not active
        '422':
          description: 被处理方拒绝;扣款已退回(payout 状态为 failed)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
              example:
                payout_id: 8e2a1b0c-9d8e-7f60-5a4b-3c2d1e0f9a8b
                account_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                idempotency_key: qr-2026-07-07-a
                country: BO
                currency: BOB
