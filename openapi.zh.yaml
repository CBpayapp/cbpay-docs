  /v1/qscore/my-report:
    post:
      tags: [Qscore]
      summary: 生成您自己的信用报告（自助）
      operationId: createQscoreSelfReport
      description: '生成（或复用）已认证账户持有人的 Qscore 信用报告——即 ARCO/数据保护法
        规定的查阅本人信用信息的权利。与 `POST /v1/qscore/reports` 不同，此端点免费
        （不收取任何费用），且主体身份来自已验证的账户：KYC/KYB 过程中验证过的
        `tax_id`。请求不接受 `doc_id`——从设计上就无法通过此端点请求第三方的报告
        （防预言机）。

        频率限制：每 30 天生成一份新的自助报告。如果该时间窗口内已存在 `ready`
        状态的自助报告，端点返回 `200` 及现有报告，并带 `idempotency_hit: true`
        （复用）；否则生成新报告并返回 `201`。同一天重复提交会返回已创建的报告
        （按账户 + 主体 + 日期的确定性幂等）。自助报告不计入主体的查询次数，
        因此查看自己的报告绝不会影响您的评分。报告是同步计算的：响应即为完成的
        报告（状态 `ready`）或失败的报告（状态 `failed`，带 `error_code`/
        `error_message`）。'
      requestBody:
        required: false
        content:
          application/json:
            examples:
              default:
                summary: 默认语言（es）
                value: {}
              lang:
                summary: 选择报告语言
                value:
                  lang: en
      responses:
        '200':
          description: '30 天窗口内已存在 `ready` 状态的自助报告；返回该报告并带
            `idempotency_hit: true`（不生成新报告）。'
