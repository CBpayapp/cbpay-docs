  /v1/crypto/wallets:
    post:
      tags:
      - 加密货币
      operationId: createCryptoWallet
      summary: 补齐缺失的充值钱包
      description: '每个账户——个人和企业——每个受支持组合都恰好持有**一个充值钱包**(`tron`/`usdt`、`eth`/`usdt`、`eth`/`usdc`、`btc`/`btc`),注册时自动免费开通。充值钱包只用于**接收**加密货币并计入账户的虚拟余额:不能发送,也不能导出或导入(那是隔离钱包的功能)。本端点仅用于补齐缺失的组合(例外情况):组合已存在时对所有账户类型都返回
        `422 wallet_limit_reached`。


        手动补齐在 CBPay 配置了 `wallet_creation` 费用时计费(每个钱包固定;0 = 免费,即默认值);出生钱包始终免费。创建失败时自动退款。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chain
              properties:
                chain:
                  type: string
                  enum:
                  - tron
                  - eth
                  - btc
                asset:
                  type: string
                  enum:
                  - usdt
                  - usdc
                  - btc
                  default: usdt
                  description: 钱包资产(usdc 仅支持 `eth`;在 `btc` 上资产默认为 `btc`)。
                label:
                  type: string
                  description: 可选的描述性标签。
            examples:
              tron_usdt:
                summary: 补齐 TRON USDT 组合
                value:
                  chain: tron
              usdc_wallet:
                summary: 补齐 USDC 组合(仅 Ethereum)
                value:
                  chain: eth
                  asset: usdc
              btc_wallet:
                summary: 补齐 Bitcoin 组合
                value:
                  chain: btc
      responses:
        '201':
          description: 钱包已创建。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CryptoWallet'
                - type: object
                  properties:
                    creation_fee:
                      type: string
              example:
                wallet_id: b7e3a940-6f1d-4c2b-9a8e-5d4c3b2a1f0e
                chain: tron
                asset: USDT
                address: TQmZ1kfWzcmRDYkqLnybXnbWzPMYNvbYqT
                label: Main treasury
                type: deposit
                receive_only: true
                created_at: '2026-07-07T12:00:00Z'
                creation_fee: '1.000000'
        '400':
          description: invalid_chain / invalid_asset
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_chain
                message: unsupported chain "doge" (tron, eth, btc)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '422':
          description: 该账户在此组合下已持有充值钱包(适用于所有账户类型)。
          content:
            application/json:
              schema: *id008
              example:
                error: wallet_limit_reached
                message: accounts hold one deposit wallet per network/asset pair (created automatically
                  with the account); use segregated wallets for additional wallets
    get:
      tags:
      - 加密货币
      operationId: listCryptoWallets
      summary: 列出我的钱包
      description: 返回调用账户的所有钱包,最早在前。
