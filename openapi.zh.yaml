        `first`、`last` 及二者之间带符号的 `change_pct`,可直接用于 "+3.4% / -3.0%" 徽章。`asset_prices` 携带 BTC 与 GOLD 的
        USD 参考序列。无数据的桶沿用前值;历史开始之前的日期会被省略(绝不虚构)。

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 开始日期(YYYY-MM-DD,组织时区,含当日)。
      - name: to
        in: query
        required: true
        schema:
