      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_asset
              - to_asset
              - amount
              properties:
                from_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
                to_asset:
                  type: string
                  enum:
                  - USDT
                  - USDC
                  - BTC
                  - GOLD
