  /v1/rates:
    get:
      tags:
      - 余额
      operationId: getRates
      summary: 获取我的外汇汇率与费用
      description: 返回适用于调用账户的各国汇率——与操作执行时使用的相同(`local_amount / rate = USDT`)——以及账户的**有效**费用配置(组织默认值已与账户覆盖项解析合并),便于客户端在创建操作前计算确切成本。`rate`
        为 payout(派发)侧,`payin_rate` 为 payin(充值)侧。`asset_prices` 携带各虚拟余额资产的 USD 参考价(BTC 按单位、GOLD 按克;稳定币约定为
        1)用于展示/估值。`settlement` 块按启用的资产显示你的账户此刻从该余额支付操作可获得的**有效结算价格**(`settlement_rate`,已含点差)及该资产当前是否 `available`——可在
        payout 传 `settlement_asset` 之前用它来估算。
      responses:
        '200':
          description: 汇率、参考资产价格与费用。
          content:
            application/json:
              schema:
                type: object
                properties:
                  base:
                    type: string
                    example: USD
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: CLP
                        rate:
                          type: string
                          description: 适用于 payout(派发)的汇率。
                          example: '950.123456'
                        payin_rate:
                          type: string
                          description: 适用于 payin(法币充值/收款)的汇率。
                          example: '955.10'
                  asset_prices:
                    type: object
                    description: 各虚拟余额资产的 USD 参考价(展示/估值)。
                    additionalProperties:
                      type: object
                      properties:
                        currency:
                          type: string
                          example: USD
                        unit:
                          type: string
                          description: 价格所指的单位(`btc`、`gram`、`usdt`、`usdc`)。
                          example: gram
                        price:
                          type: string
                          example: '107.5341'
                        updated_at:
                          type: string
                          description: 此价格最后更新时间。
                        settlement_grade:
                          type: boolean
                          description: 当价格足够新鲜、可执行结算(从该余额支付的操作)时为 true。
                  settlement:
                    type: object
                    description: 调用账户的有效结算定价。
                    properties:
                      default_asset:
                        type: string
                        description: 未传 `settlement_asset` 覆盖时,操作扣款的余额。
                        example: USDT
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            asset:
                              type: string
                              example: BTC
                            available:
                              type: boolean
                              description: 当该资产当前无法使用(已停用或执行价格不可用)时为 false。
                            settlement_rate:
                              type: string
                              description: 你的余额将按此有效 USD 单价估值(已含点差);不可用时为空。
                              example: '109029.34'
                  updated_at:
                    type: string
                  fees:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeConfig'
              example:
                base: USD
                rates:
                  chile:
                    currency: CLP
                    rate: '950.25'
                    payin_rate: '955.10'
                  mexico:
                    currency: MXN
                    rate: '17.50'
                    payin_rate: '17.62'
                  peru:
                    currency: PEN
                    rate: '3.72'
                    payin_rate: '3.75'
                asset_prices:
                  USDT:
                    currency: USD
                    unit: usdt
                    price: '1'
                  USDC:
                    currency: USD
                    unit: usdc
                    price: '1'
                  BTC:
                    currency: USD
                    unit: btc
                    price: '109853.24'
                    updated_at: '2026-07-07T11:59:41Z'
                    settlement_grade: true
                  GOLD:
                    currency: USD
                    unit: gram
                    price: '107.5341'
                    updated_at: '2026-07-07T09:12:05Z'
                    settlement_grade: true
                settlement:
                  default_asset: USDT
                  assets:
                  - asset: USDT
                    available: true
                    settlement_rate: '1'
                  - asset: USDC
                    available: true
                    settlement_rate: '0.99900000'
                  - asset: BTC
                    available: true
                    settlement_rate: '109029.34070000'
                  - asset: GOLD
                    available: true
                    settlement_rate: '106.99642950'
                updated_at: '2026-07-07T12:00:00Z'
                fees:
