        '403':
          description: API key 凭证(`session_required`)，或最近绑定且未验证的手机号且无替代因素(`phone_binding_cooldown`)。手机号处于冷却期时，质询会自动改用身份验证器应用（若已注册）或已验证的登录邮箱；实际使用的渠道会在质询响应中返回。
          content:
            application/json:
