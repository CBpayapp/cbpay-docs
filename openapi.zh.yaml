                  event: password_changed
                  created_at: '2026-07-11T00:00:00Z'
                  ip: 200.1.2.3
        '400':
          $ref: '#/components/responses/InvalidRange'
  /v1/events:
    get:
      tags:
      - 实时事件
      operationId: streamEvents
      summary: 实时事件流（SSE）
      description: |-
        打开 `text/event-stream` 连接，实时推送账户的全部事件——与 webhook 推送的是同一批事件，但你无需对外暴露任何公开端点。

        每条事件包含 `id:`（单调游标）、`event:`（事件类型）和 `data:`（JSON，其 `event_id` 与 webhook 完全一致，便于两个通道相互对照）。

        使用 `Last-Event-ID` 请求头（或 `?last_event_id=`）重连，服务端会先重放你错过的事件，再继续实时推送。浏览器原生 `EventSource` 无法发送 `Authorization` 请求头：请使用 `fetch` 配合 `ReadableStream`。

        可见范围由凭证决定：账户凭证只接收自己的事件；具备 `ops:read` 的组织管理员凭证接收全组织通道，并可用 `?account_id=` 缩小范围。

        连接每 20 秒发送 `: ping`，每 60 秒重新校验会话（会话被吊销时以 `unauthorized` 控制事件关闭流），并在 30 分钟后以 `reconnect` 控制事件关闭。
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: '重连游标。面向 `fetch` 客户端，是 `Last-Event-ID` 请求头的替代方案。'
        schema:
          type: string
        example: '4821'
      - name: last_event_id
        in: query
        required: false
        description: '重连游标。面向 `fetch` 客户端，是 `Last-Event-ID` 请求头的替代方案。'
        schema:
          type: string
      - name: types
        in: query
        required: false
        description: '以逗号分隔的事件类型过滤条件。未知类型返回 `400 invalid_event_type`。'
        schema:
          type: string
        example: payin_credited,payout_status_changed
      - name: snapshot
        in: query
        required: false
        description: '设为 `true` 时，第一条事件为 `snapshot`，包含当前的绝对状态（余额；组织管理员还包含运营健康度），随后才是实时增量事件。'
        schema:
          type: boolean
      - name: account_id
        in: query
        required: false
        description: '仅组织管理员可用：将全组织通道缩小到单个账户。'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: '事件流已打开。响应体保持打开状态并持续增量写入。'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : cbpay event stream

                retry: 3000

                id: 4822
                event: payin_credited
                data: {"event_id":"7c1f0b2a-5c3d-4e6f-9a1b-2c3d4e5f6a7b","type":"payin_credited","account_id":"c57f05b6-8f2e-4d51-9a0c-5b7e2d3f4a10","created_at":"2026-07-25T18:04:11Z","cursor":"4822","data":{"payin_id":"9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d","usdt_credited":"99.700000"}}

                : ping
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: '并发事件流过多（`too_many_streams`），或该 IP 开流过于频繁（`rate_limited`，每小时 600 次——该配额统计尝试次数，而非活动连接）。'
          content:
            application/json:
              examples:
                too_many_streams:
                  summary: 已达到并发事件流上限
                  value:
                    error: too_many_streams
                    message: too many concurrent event streams for this account; close one before opening another
                rate_limited:
                  summary: 该 IP 开流过于频繁
                  value:
                    error: rate_limited
                    message: too many requests
  /v1/events/history:
    get:
      tags:
