  /v1/stored-cards/{storedCardID}/charges:
    post:
      tags:
      - 已保存卡片(Stored cards)
      operationId: chargeStoredCard
      summary: '对已保存的卡片扣款（商户发起）'
      description: '在付款人不在场的情况下对已存卡扣款（卡组织 MIT 规范，引用原始经同意的 3-D Secure 种子交易）。`recurring: true` 用于固定周期的订阅扣款；false（默认）用于非定期扣款。需要 `idempotency_key` — 相同键的重试返回原 payin，绝不重复扣款。批准的扣款自动入账（`payin_credited` webhook）；被拒绝的扣款返回 422 且 payin 标记为 failed。'
      parameters:
      - name: storedCardID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - idempotency_key
              properties:
                amount:
                  type: string
                currency:
                  type: string
                description:
                  type: string
                recurring:
                  type: boolean
                  default: false
                idempotency_key:
                  type: string
            example:
              amount: '45.00'
              description: Monthly subscription
              recurring: true
              idempotency_key: sub-2026-07-cust1042
      responses:
        '201':
          description: '扣款已受理：批准的扣款自动入账；查询 payin 状态。'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  reference:
                    type: string
                  transaction_id:
                    type: string
                  note:
                    type: string
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: pending
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                transaction_id: '7846012604816236704806'
                note: charge approved; the balance is credited automatically (payin_credited webhook)
        '200':
          description: '幂等重放 — 原始 payin。'
          content:
            application/json:
              schema:
                type: object
                properties:
                  payin_id:
                    type: string
                  status:
                    type: string
                  idempotency_hit:
                    type: boolean
              example:
                payin_id: 3c5b002c-af76-4235-8145-9f07fef073fd
                status: credited
                reference: 3c5b002c-af76-4235-8145-9f07fef073fd
                idempotency_hit: true
        '422':
          description: '发卡行拒绝、已存卡已被撤销，或扣款在捕获前被拒绝（例如已存卡存档的账单地址不完整）。'
          content:
            application/json:
              schema:
                type: object
              examples:
                declined:
                  value:
                    payin_id: cb781262-a53f-4ec8-a833-013edcf907d3
                    status: failed
                    reference: cb781262-a53f-4ec8-a833-013edcf907d3
                    failure_reason: DECLINED
                revoked:
                  value:
                    error: stored_card_revoked
                    message: the stored card is revoked
                core_rejected:
                  value:
                    error: core_rejected
                    message: 'bill_to is incomplete and the stored credential has no billing address on file: send bill_to (first_name, last_name, email, address1, locality, postal_code, country) or re-register the card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/subscriptions:
