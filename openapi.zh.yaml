        /v1/wallet-links/verify`)将外部钱包(`custody=client`)链接到账户。钱包仍由客户保管;
        链接仅证明地址的所有权。


        每次投递均包含 `X-Webhook-Event`、`X-Webhook-Event-ID`、`X-Webhook-Delivery-ID`、`X-Webhook-Timestamp`
        和 `X-Webhook-Signature = hex(HMAC-SHA256(secret, timestamp + "." + body))`。请返回 2xx;最多
