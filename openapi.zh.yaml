                  address: '0x8f3Bc55D9F4a2E71c06b9a3D2e1F0A9B8C7D6E5F'
                  label: ''
                  type: deposit
                  receive_only: true
                  created_at: '2026-07-07T12:00:00Z'
                - wallet_id: fb88c2d1-7a4e-4b0c-8d3f-1e2a3b4c5d6e
