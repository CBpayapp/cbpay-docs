    post:
      tags:
      - 兑换(Swaps)
      operationId: createSwap
      summary: 创建 swap
      description: 在你的两种货币之间同步、原子地兑换余额——余额即时变动,资金从不离开你的账户(无需 OTP)。波动性交易对(BTC/GOLD)与 payouts 和卡片消费共享单笔及
