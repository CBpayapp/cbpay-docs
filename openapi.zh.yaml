  /v1/kyc/submissions/{submissionID}/liveness_link:
    post:
      tags:
      - KYC / KYB
      operationId: createKycLivenessLink
      summary: 创建活体检测链接
      description: 托管页面,你的客户在此仅完成视频活体检测(摄像头手势 + 服务端与已上传身份文件的人脸比对)。免费——服务已在创建 submission 时计费。若存在开放链接则返回同一个;若检测已通过,返回
        400 liveness_already_completed。
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: 1-30,默认 7。
            example:
              expires_in_days: 7
      responses:
        '200':
          description: 活体检测链接。
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  expires_at:
                    type: integer
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: pending
                expires_at: 1751234567
        '400':
          description: liveness_already_completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: liveness_already_completed
                message: the liveness check already passed for this submission
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - KYC / KYB
      operationId: getKycLivenessLink
      summary: 获取活体检测链接与检查状态
      parameters:
      - name: submissionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 最新链接及当前活体检测状态。
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
                  liveness:
                    type: object
                    properties:
                      status:
                        type: string
                      outcome:
                        type: string
                      passed:
                        type: boolean
              example:
                url: https://verify.example.com/on/liveness/tok_abc123
                status: completed
                liveness:
                  status: completed
                  outcome: PASS
                  passed: true
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
